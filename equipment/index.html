<!DOCTYPE html>

<title>Equipment · Bailey-Harris</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<style>
/* Layout: fixed dark-purple rail on the left, top utility bar, lavender page band, then working tables — modeled on the team's current rental system. */
:root{
  --side:#0b0c09; --side-fg:#d6dac4; --side-hover:#20241a; --side-mark:#a7b55e;
  --accent:#4b5320; --accent-hover:#3a4118; --accent-soft:#eceee0; --accent-fg:#ffffff;
  --band:#f1f2e8; --bg:#ffffff; --surface:#ffffff; --surface-2:#f8f8f3;
  --fg:#15170f; --muted:#62665a; --line:#e2e4d8; --line-strong:#cdd0be;
  --head:#eceee0; --link:#2b5f9e;
  --ok:#2f6b1f; --ok-bg:#e5f1dc; --info:#1d5f8f; --info-bg:#e1eff8;
  --warn:#8a5a00; --warn-bg:#fbf0d6; --bad:#b42318; --bad-bg:#fde7e5;
  --neutral-bg:#eeefe8; --logo-bg:transparent; --scrim:rgba(8,10,5,.55);
  --shadow:0 10px 30px rgba(11,12,9,.2);
  --f-body:"Open Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-display:"Montserrat","Open Sans",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --side:#15170f; --side-fg:#c3c7b3; --side-hover:#23261c; --side-mark:#a9b67a;
  --accent:#a3b072; --accent-hover:#b3bf84; --accent-soft:#2c3122; --accent-fg:#14160f;
  --band:#22251d; --bg:#1c1e18; --surface:#23261f; --surface-2:#282b23;
  --fg:#dcdfd2; --muted:#a4a897; --line:#353a2d; --line-strong:#464c3b;
  --head:#2b2f25; --link:#9dbbe0;
  --ok:#a3cc8f; --ok-bg:#26341f; --info:#95c2e2; --info-bg:#22313d; --warn:#e2c07f; --warn-bg:#3a3122; --bad:#eba197; --bad-bg:#40271f;
  --neutral-bg:#2d3027; --logo-bg:#ecede4; --scrim:rgba(0,0,0,.55); --shadow:0 10px 30px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --side:#15170f; --side-fg:#c3c7b3; --side-hover:#23261c; --side-mark:#a9b67a;
  --accent:#a3b072; --accent-hover:#b3bf84; --accent-soft:#2c3122; --accent-fg:#14160f;
  --band:#22251d; --bg:#1c1e18; --surface:#23261f; --surface-2:#282b23;
  --fg:#dcdfd2; --muted:#a4a897; --line:#353a2d; --line-strong:#464c3b;
  --head:#2b2f25; --link:#9dbbe0;
  --ok:#a3cc8f; --ok-bg:#26341f; --info:#95c2e2; --info-bg:#22313d; --warn:#e2c07f; --warn-bg:#3a3122; --bad:#eba197; --bad-bg:#40271f;
  --neutral-bg:#2d3027; --logo-bg:#ecede4; --scrim:rgba(0,0,0,.55); --shadow:0 10px 30px rgba(0,0,0,.35); color-scheme:dark}

[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 var(--f-body)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--link)}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{display:grid;grid-template-columns:72px minmax(0,1fr);min-height:100%}
.rail{background:var(--side);color:var(--side-fg);display:flex;flex-direction:column;align-items:stretch;padding:12px 0 16px;padding-left:env(safe-area-inset-left,0px);position:sticky;top:env(safe-area-inset-top,0px);height:calc(100vh - env(safe-area-inset-top,0px));overflow-y:auto;z-index:20}
.avatar{width:32px;height:32px;border-radius:50%;background:#4b5320;color:#fff;font-weight:700;font-size:12px;display:grid;place-items:center;flex:none;border:2px solid #a7b55e}
.avatar.big{width:44px;height:44px;font-size:15px}
.avatar.sm{width:28px;height:28px;font-size:11px;border-width:1px}
.avatar.xl{width:72px;height:72px;font-size:22px}
.avatar-btn{border:0;background:none;padding:0;margin:0 auto 18px;cursor:pointer;border-radius:50%}
.avatar-btn:hover .avatar{border-color:#d6dac4}
.pmenu{position:fixed;z-index:45;background:var(--surface);border:1px solid var(--line-strong);border-radius:6px;box-shadow:var(--shadow);width:260px;padding:6px;display:flex;flex-direction:column}
.pm-head{display:flex;gap:12px;align-items:center;padding:10px 10px 12px;border-bottom:1px solid var(--line);margin-bottom:4px}
.pm-head .chip{margin-top:4px}
.pmenu button{border:0;background:none;text-align:left;padding:9px 10px;border-radius:4px;cursor:pointer;font-size:13px}
.pmenu button:hover{background:var(--accent-soft)}
.pmenu .pm-out{color:var(--bad);border-top:1px solid var(--line);border-radius:0 0 4px 4px;margin-top:4px}
.auth{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding-block:40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:linear-gradient(180deg,var(--side) 0 38%,var(--bg) 38% 100%)}
.auth-card{background:var(--surface);border:1px solid var(--line);border-top:4px solid #4b5320;border-radius:6px;box-shadow:var(--shadow);width:100%;max-width:400px;padding:28px;display:flex;flex-direction:column;gap:14px}
.auth-card h1{margin:0;font-family:var(--f-display);font-size:20px}
.auth-card p{margin:0}
.auth-logo{font-size:26px;margin-bottom:4px}
.auth-logo small{font-size:8.5px}
.auth-btn{height:38px;justify-content:center;width:100%}
.auth-err{background:var(--bad-bg);color:var(--bad);border-radius:4px;padding:9px 12px;font-size:12.5px}
.auth-foot{color:var(--muted);font-size:12px;margin:0}
.yes{color:var(--ok);font-weight:700}
.rail a{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;color:var(--side-fg);text-decoration:none;font-size:10.5px;font-weight:600;letter-spacing:.01em}
.rail a svg{width:18px;height:18px}
.rail a span{text-align:center}
.rail a:hover{background:var(--side-hover)}
.rail a[aria-current="page"]{background:var(--side-hover);box-shadow:inset 3px 0 0 var(--side-mark)}
.rail .spacer{flex:1}

.main{min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:14px;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:var(--surface);position:sticky;top:env(safe-area-inset-top,0px);z-index:15}
.logo{font-family:var(--f-display);font-weight:800;font-size:19px;letter-spacing:-.02em;line-height:1;display:flex;flex-direction:column}
.logo small{font-size:6.5px;letter-spacing:.12em;font-weight:700}
.gsearch{position:relative;flex:0 1 340px;min-width:0}
.gsearch input{width:100%;height:30px;border:1px solid var(--line-strong);border-radius:4px;padding:0 10px 0 30px;background:var(--surface)}
.gsearch svg{position:absolute;left:9px;top:8px;width:14px;height:14px;color:var(--muted)}
.gresults{position:absolute;top:34px;left:0;right:0;background:var(--surface);border:1px solid var(--line-strong);border-radius:6px;box-shadow:var(--shadow);max-height:360px;overflow:auto;z-index:30}
.gresults button{display:flex;gap:10px;width:100%;text-align:left;padding:8px 12px;border:0;background:none;cursor:pointer}
.gresults button:hover{background:var(--accent-soft)}
.gresults .k{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);width:62px;flex:none;padding-top:2px}
.top-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.pill-btn{border:1px solid var(--accent);color:var(--accent);background:none;border-radius:999px;height:30px;padding:0 14px;font-size:12px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.pill-btn:hover{background:var(--accent-soft)}
.icon-btn{position:relative;width:30px;height:30px;border-radius:50%;border:0;background:var(--neutral-bg);display:grid;place-items:center;cursor:pointer;color:var(--fg)}
.icon-btn svg{width:16px;height:16px}
.badge{position:absolute;top:-4px;right:-5px;background:var(--bad);color:#fff;font-size:9.5px;font-weight:700;border-radius:8px;padding:0 4px;min-width:16px;line-height:15px;text-align:center}

.crumb{font-size:11px;color:var(--muted);padding-block:6px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.band{background:var(--band);border-block:1px solid var(--line);padding-block:18px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.band h1{font-family:var(--f-display);font-size:21px;font-weight:700;margin:0;letter-spacing:-.01em;text-wrap:balance}
.band .sub{color:var(--muted);font-size:12.5px;width:100%;margin-top:-10px}
.band .actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow-x:auto}
.tabs button{border:0;background:none;padding:11px 16px;font-size:12.5px;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent);font-weight:600}
.tabs .count{display:inline-block;margin-left:6px;background:var(--neutral-bg);border-radius:8px;font-size:10.5px;padding:0 6px}
.content{padding-block:20px 40px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px;min-width:0}

.btn{height:32px;border-radius:4px;border:1px solid var(--line-strong);background:var(--surface);padding:0 14px;font-size:12px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;letter-spacing:.02em}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);text-transform:uppercase;font-size:11.5px}
.btn.primary:hover{background:var(--accent-hover);color:var(--accent-fg)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.danger:hover{background:var(--bad-bg)}
.btn.sm{height:26px;padding:0 9px;font-size:11px}
.btn svg{width:14px;height:14px}
.btn:disabled{opacity:.45;cursor:not-allowed}

.sec-title{font-size:15px;font-weight:700;margin:0}
.opps{display:flex;gap:14px;flex-wrap:wrap}
.opp{border:1px solid var(--line);border-radius:4px;padding:14px 16px;min-width:200px;flex:0 1 240px;background:var(--surface);cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:4px}
.opp:hover{border-color:var(--accent)}
.opp .lbl{font-size:12px;color:var(--muted)}
.opp .val{font-size:22px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
.opp .val svg{width:16px;height:16px;color:var(--accent)}
.opp.bad .val{color:var(--bad)} .opp.ok .val{color:var(--ok)} .opp.warn .val{color:var(--warn)}

.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.toolbar .search{position:relative;flex:0 1 280px;min-width:180px}
.toolbar .search input{width:100%;height:32px;border:1px solid var(--line-strong);border-radius:4px;padding:0 10px 0 30px;background:var(--surface)}
.toolbar .search svg{position:absolute;left:9px;top:9px;width:14px;height:14px;color:var(--muted)}
.toolbar select{height:32px;border:1px solid var(--line-strong);border-radius:4px;background:var(--surface);padding:0 8px;font-size:12px}
.toolbar .end{margin-left:auto;display:flex;gap:8px}
.dd{position:relative}
.dd-menu{position:absolute;top:36px;left:0;min-width:200px;background:var(--surface);border:1px solid var(--line-strong);border-radius:6px;box-shadow:var(--shadow);z-index:25;padding:4px}
.dd-menu button{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:4px;cursor:pointer;font-size:12.5px}
.dd-menu button:hover{background:var(--accent-soft)}
.dd-menu button:disabled{opacity:.4;cursor:default;background:none}

.tablewrap{border:1px solid var(--line);border-radius:4px;overflow-x:auto;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:900px}
th{background:var(--head);text-align:left;font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;padding:14px 12px;border-bottom:1px solid var(--line);white-space:nowrap;color:var(--fg)}
th.sortable{cursor:pointer;user-select:none}
th.sortable:hover{color:var(--accent)}
td{padding:11px 12px;border-bottom:1px solid var(--line);font-size:12.5px;vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--surface-2)}
td .cust{display:flex;flex-direction:column;gap:2px;max-width:200px}
td .trunc{display:block;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.linkbtn{border:0;background:none;padding:0;color:var(--link);cursor:pointer;text-align:left;font-size:inherit}
.linkbtn:hover{text-decoration:underline}
.muted{color:var(--muted)}
.small{font-size:11.5px}
td input[type=checkbox],th input[type=checkbox]{width:15px;height:15px;accent-color:var(--accent)}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}
.empty strong{display:block;color:var(--fg);font-size:14px;margin-bottom:4px}

.chip{display:inline-block;padding:4px 8px;border-radius:3px;font-size:11px;font-weight:600;white-space:nowrap}
.chip.rented{background:var(--info-bg);color:var(--info)}
.chip.available{background:var(--ok-bg);color:var(--ok)}
.chip.reserved{background:var(--accent-soft);color:var(--accent)}
.chip.overdue{background:var(--bad-bg);color:var(--bad)}
.chip.maint{background:var(--warn-bg);color:var(--warn)}
.tgl{display:flex!important;gap:12px;align-items:flex-start;cursor:pointer;text-transform:none!important;letter-spacing:0!important;font-size:13px!important;color:var(--fg)!important;font-weight:400!important}
.tgl input{position:absolute;opacity:0;width:1px;height:1px}
.tgl-ui{flex:0 0 38px;height:22px;border-radius:11px;background:var(--line-strong);position:relative;transition:background .15s;margin-top:1px}
.tgl-ui::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--surface);transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.tgl input:checked + .tgl-ui{background:var(--accent)}
.tgl input:checked + .tgl-ui::after{transform:translateX(16px)}
.tgl input:focus-visible + .tgl-ui{outline:2px solid var(--accent);outline-offset:2px}
.chip.sev-high{background:var(--bad-bg);color:var(--bad)}.chip.sev-medium{background:var(--warn-bg);color:var(--warn)}.chip.sev-low{background:var(--ok-bg);color:var(--ok)}
.chip.returned,.chip.retired,.chip.cancelled,.chip.neutral{background:var(--neutral-bg);color:var(--muted)}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{border:1px solid var(--line);border-radius:4px;padding:14px 16px;background:var(--surface);display:flex;flex-direction:column;gap:2px}
.kpi .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.kpi .val{font-size:24px;font-weight:700;font-family:var(--f-display)}
.kpi .note{font-size:11.5px;color:var(--muted)}
.kpi.bad .val{color:var(--bad)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:20px}
.panel{border:1px solid var(--line);border-radius:4px;background:var(--surface);min-width:0}
.panel h3{margin:0;font-size:13px;font-weight:700;padding:12px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:8px}
.panel .body{padding:14px 16px}
.bars{display:flex;flex-direction:column;gap:9px}
.bar-row{display:grid;grid-template-columns:minmax(110px,170px) 1fr 70px;gap:10px;align-items:center;font-size:12px}
.bar-row .track{height:10px;background:var(--neutral-bg);border-radius:2px;overflow:hidden}
.bar-row .fill{height:100%;background:var(--accent);border-radius:2px}
.bar-row .v{text-align:right;font-variant-numeric:tabular-nums}
.list{display:flex;flex-direction:column}
.list-row{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:12.5px;align-items:center}
.list-row:last-child{border-bottom:0}

.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:10px;font-family:var(--f-body)}

/* modals */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:max(24px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 24px max(12px,env(safe-area-inset-left,0px));overflow-y:auto}
.modal{background:var(--surface);border-radius:6px;box-shadow:var(--shadow);width:100%;max-width:820px;display:flex;flex-direction:column}
.modal.narrow{max-width:520px}
.modal header{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line);background:var(--band);border-radius:6px 6px 0 0}
.modal header h2{margin:0;font-size:16px;font-family:var(--f-display);font-weight:700}
.modal header .x{margin-left:auto;border:0;background:none;font-size:22px;line-height:1;cursor:pointer;color:var(--muted)}
.modal .mbody{padding:18px 20px;display:flex;flex-direction:column;gap:16px}
.modal footer{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;align-items:center}
.modal footer .total{margin-right:auto;font-size:15px;font-weight:700}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px 14px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field.full{grid-column:1/-1}
.field label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.field input,.field select,.field textarea{height:34px;border:1px solid var(--line-strong);border-radius:4px;padding:0 10px;background:var(--surface);min-width:0;width:100%}
.field textarea{height:64px;padding:8px 10px;resize:vertical}
.field .hint{font-size:11px;color:var(--muted)}
.subhead{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:4px 0 -6px;display:flex;justify-content:space-between;align-items:center}
.picker{border:1px solid var(--line);border-radius:4px;max-height:230px;overflow:auto}
.pick{display:grid;grid-template-columns:24px 64px minmax(0,1fr) auto;gap:8px;align-items:center;padding:7px 10px;border-bottom:1px solid var(--line);font-size:12.5px;cursor:pointer}
.pick:last-child{border-bottom:0}
.pick:hover{background:var(--surface-2)}
.pick.busy{opacity:.5;cursor:not-allowed}
.pick input{accent-color:var(--accent)}
.lines{border:1px solid var(--line);border-radius:4px}
.line{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:9px 12px;border-bottom:1px solid var(--line);font-size:12.5px}
.line:last-child{border-bottom:0}
.line .calc{color:var(--muted);font-size:11.5px}
.charge-row{display:grid;grid-template-columns:minmax(0,1fr) 80px 100px 90px 28px;gap:8px;align-items:center}
.charge-row input,.charge-row select{height:30px;border:1px solid var(--line-strong);border-radius:4px;padding:0 8px;background:var(--surface);min-width:0;width:100%}
.del{border:0;background:none;color:var(--muted);cursor:pointer;font-size:18px}
.del:hover{color:var(--bad)}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kv div{display:flex;flex-direction:column;gap:2px}
.kv span{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600}
.warnbox{background:var(--warn-bg);color:var(--warn);border-radius:4px;padding:10px 12px;font-size:12.5px}
