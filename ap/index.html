<title>AP Desk</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:'Montserrat',Arial,Helvetica,sans-serif; background:#f5f7fa; color:#211E1E; }
  .wrap { max-width:1500px; margin:0 auto; padding:20px; }
  .bh-banner{background:#fff;border-bottom:1px solid #E8E6E7;width:100%}
  .bh-banner-inner{max-width:1500px;margin:0 auto;padding:12px 20px 14px;display:flex;align-items:center;gap:18px}
  .bh-logo{height:54px;width:auto;flex:none}
  .bh-titles{line-height:1.2}
  .bh-title{color:#211E1E;font-size:22px;font-weight:800;letter-spacing:.02em;text-transform:uppercase}
  .bh-sub{color:#5b6472;font-size:12.5px;margin-top:3px}
  .bh-badge{margin-left:auto;border:1px solid #1a7f37;color:#1a7f37;background:#fff;padding:4px 12px;border-radius:6px;font-size:11px;font-weight:bold;letter-spacing:.05em;white-space:nowrap}
  .banner{background:#fff7e6;border:1px solid #f0d089;color:#7a5a12;padding:9px 13px;border-radius:8px;font-size:13px;margin-bottom:14px}
  .err{background:#FFC7CE;border-color:#e6a3a3;color:#9C0006}
  .notice{background:#eef3fb;border:1px solid #c3d4ee;color:#1F3864;padding:10px 14px;border-radius:9px;font-size:13px;margin-bottom:16px;line-height:1.5}
  .notice p{margin:5px 0 0}
  .notice p:first-child{margin-top:0}
  .notice b{color:#1a4fb0}
  .controls{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
  .controls label{font-size:13px;color:#40485a;font-weight:bold}
  select,input[type=text]{padding:8px 12px;border:1px solid #c7cfdb;border-radius:8px;font-size:14px;background:#fff;font-family:inherit}
  /* Nine equal tiles gave "0 no CE code" the same weight as $15.3M billed, and
     spent two of them on zeros. Three money tiles carry the position; the
     exceptions are a strip beneath and only appear when the count is non-zero. */
  .cards{margin-bottom:18px}
  .cardcap{font-size:12px;color:#6b7482;margin:0 0 8px}
  .cardrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
  .card{background:#fff;border:1px solid #e3e8f0;border-radius:10px;padding:13px 15px}
  .card .n{font-size:25px;font-weight:bold;font-variant-numeric:tabular-nums}
  .card .l{font-size:11.5px;color:#5b6472;margin-top:2px;text-transform:uppercase;letter-spacing:.03em}
  .card .s{font-size:11.5px;color:#8a94a3;margin-top:3px;font-variant-numeric:tabular-nums}
  .exrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  .exchip{display:inline-flex;align-items:baseline;gap:6px;background:#fff;border:1px solid #e3e8f0;
          border-radius:7px;padding:7px 11px;font-size:12px;color:#54607a}
  .exchip b{font-size:15px;font-variant-numeric:tabular-nums}
  .exchip.r{border-color:#f0bcbc;background:#fdf4f4}.exchip.r b{color:#b3261e}
  .exchip.y{border-color:#f0cf8e;background:#fffaf1}.exchip.y b{color:#9a6a00}
  .exchip.b{border-color:#c9d8ef;background:#f6f9fd}.exchip.b b{color:#1a4fb0}
  .exclear{font-size:12px;color:#1a7f37;padding:7px 0}
  .pacell{white-space:nowrap;margin-top:3px}
  .pabtn{font:inherit;font-size:10.5px;padding:2px 7px;border:1px solid #cfd8e4;background:#fff;color:#2b4a7e;border-radius:3px;cursor:pointer;line-height:1.5}
  .pabtn:hover{background:#eef3fa;border-color:#9fb4d0}
  .pabtn[aria-expanded="true"]{background:#1F3864;border-color:#1F3864;color:#fff}
  tr.parow>td{background:#f7f9fc;border-top:0;padding:0}
  /* Pinned left and width-capped: the panel lives in a colspan cell inside a
     horizontally scrolling table and would otherwise stretch off screen. */
  .pawrap{position:sticky;left:0;box-sizing:border-box;width:min(680px,calc(100vw - 80px));
          padding:14px 16px 16px;text-align:left;overflow-wrap:anywhere}
  .pawrap td,.pawrap div,.pawrap th{text-align:left}
  .pamax{display:flex;align-items:baseline;gap:10px;margin:0 0 12px}
  .pamax .l{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:#7a869a}
  .pamax .n{font-size:22px;font-weight:700;color:#1F3864;font-variant-numeric:tabular-nums}
  .patab{width:100%;border-collapse:collapse;font-size:12.5px}
  /* The page styles thead th as a dark bar; inside the panel that reads as a
     second table header, so it is overridden here rather than globally. */
  .pawrap .patab thead th{background:none;background-color:transparent;color:#9aa4b2;
    font-size:10px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;
    padding:0 0 6px;border-bottom:1px solid #e3eaf3;white-space:nowrap}
  .pawrap .patab td{border-bottom:1px solid #eef2f8;padding:6px 0;vertical-align:middle}
  .patab tr:last-child td{border-bottom:0}
  .patab th.n,.patab td.n{text-align:right;padding-left:10px;white-space:nowrap;font-variant-numeric:tabular-nums}
  .paq{color:#243040}
  .pawrap .patab td.paloose{color:#7a869a;font-size:11.5px}
  /* The queue sat flush against the section title with no container while the
     stub beneath it had a card, so it read as unfinished. */
  .qwrap{background:#fff;border:1px solid #e3e8f0;border-radius:10px;padding:16px 18px 18px;margin-bottom:16px}
  .qbar{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin:0 0 4px}
  .qbar select{font:inherit;font-size:12px;padding:3px 6px;border:1px solid #cfd8e4;border-radius:4px;background:#fff}
  .qbar label{font-size:11.5px;color:#6b7482}
  .qempty{font-size:12.5px;color:#6b7482;padding:6px 0}
  .qhead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:0 0 8px}
  .qhead .n{font-size:19px;font-weight:700;color:#1F3864;font-variant-numeric:tabular-nums}
  .qhead .l{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:#7a869a}
  .qday{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:#7a869a;
        margin:12px 0 4px;padding-top:9px;border-top:1px solid #e3eaf3}
  .qtab{width:100%;border-collapse:collapse;font-size:12.5px}
  .qtab td{border-bottom:1px solid #eef2f8;padding:5px 0;text-align:left;vertical-align:baseline}
  .qtab td.n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;padding-left:12px}
  .qsub{font-size:10.5px;color:#9aa4b2}
  .qblock{color:#b3261e;font-weight:600}
  .paref{font-size:10.5px;color:#9aa4b2;margin-top:1px}
  .pain{width:104px;font:inherit;font-size:12px;padding:3px 6px;border:1px solid #cfd8e4;border-radius:3px;text-align:right;background:#fff}
  .pain:focus{outline:2px solid #bcd0ea;outline-offset:-1px;border-color:#9fb4d0}
  .padelta{font-size:11px;white-space:nowrap;text-align:right;padding-left:8px;font-variant-numeric:tabular-nums}
  .paok{color:#1a7f37}.pabad{color:#b3261e;font-weight:600}
  .pawarn{margin-top:11px;font-size:11.5px;line-height:1.55;color:#54607a}
  .pawarn div{padding:2px 0 2px 15px;text-indent:-15px}
  .total .n{color:#7F1B29}.ok .n{color:#1a7f37}.soon .n{color:#9a6a00}.bad .n{color:#b3261e}.gap .n{color:#1a4fb0}
  .section-title{font-size:15px;font-weight:bold;color:#7F1B29;margin:22px 0 10px}
  .tablescroll{overflow-x:auto;border-radius:10px}
  table{width:100%;border-collapse:collapse;background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.04);font-size:12px}
  th,td{padding:7px 9px;text-align:center;border-bottom:1px solid #eef1f6;white-space:nowrap}
  th{background:#484B4D;color:#fff;font-size:11px;position:sticky;top:0;cursor:pointer;user-select:none}
  th:hover{background:#5a5e61}
  td.l,th.l{text-align:left}
  /* A second line inside a cell keeps the figure and its qualifier together
     without spending a column on it. */
  .sub{font-size:10.5px;color:#7a828f;line-height:1.5;margin-top:1px;font-weight:normal}
  .sub.co{color:#1a4fb0}
  .warn{color:#9a6a00;font-weight:bold}
  td.wrap{white-space:normal;max-width:210px}
  /* NOT .r - that is the red pill class. A numeric column called .r painted
     every Contract/Paid/% cell red. */
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
  tbody tr:hover{background:#f7f9fc}
  tbody tr.noncompliant td:first-child{box-shadow:inset 4px 0 0 #b3261e}
  tbody tr.noncompliant{background:#fff8f8}
  tbody tr.nobilly td:first-child{box-shadow:inset 4px 0 0 #c7cfdb}
  .pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:bold}
  .g{background:#C6EFCE;color:#006100}.y{background:#FFEB9C;color:#9C6500}.r{background:#FFC7CE;color:#9C0006}
  .b{background:#DDEBF7;color:#1F3864}.muted{color:#9aa2b1}
  .code{font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;font-size:11px;color:#40485a}
  .empty{color:#5b6472;font-style:italic;padding:14px 0}
  .loading{padding:40px;text-align:center;color:#5b6472}
  a{color:#1a4fb0;text-decoration:none}a:hover{text-decoration:underline}
  footer{margin-top:26px;padding-top:14px;border-top:1px solid #e3e8f0;color:#7a828f;font-size:11.5px;line-height:1.7}
  .stub{background:#fff;border:1px dashed #c7cfdb;border-radius:10px;padding:18px 20px;color:#5b6472;font-size:13px;line-height:1.6}
  .stub h3{margin:0 0 6px;font-size:14px;color:#211E1E}
</style>
</head>

<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@3/lib/msal-browser.min.js"></script>
<script>
/* ==== Sign-in and data source ====
   Same app registration, scopes and site as the Precon and Prequal desks, so a
   PM signs in once for all of them. Sites.Selected is granted per site, and the
   grant that matters here is on /sites/Dashboard - NOT the compliance
   dashboard's app, which reads sites/Resources with Files.Read.All.
   The redirect URI must be registered on this app as .../ap/ (with the trailing
   slash) exactly as /precon/ and /prequal/ are. */
const CLIENT_ID = '1825a1c0-1ce3-4078-aeb7-a4714562c422';
const TENANT_ID = '848aa890-7982-4028-befa-3323d82583ce';
const SCOPES    = ['User.Read','GroupMember.Read.All','Sites.Selected'];
const SP_HOST   = 'baileyharris.sharepoint.com';
const SP_PATH   = '/sites/Dashboard';
const LIBRARY   = 'APData';
const DATA_FILE = 'ap_commitments.json';
/* Billed-to-date comes from ComputerEase, published by ap_payapp_expected.js.
   The page must still work if that file has never been written, so its absence
   is tolerated and every billing cell falls back to "no data" rather than 0. */
const EXPECTED_FILE = 'ap_payapp_expected.json';
const CONTACT   = 'itadmin@baileyharris.com';

const msalApp = new msal.PublicClientApplication({
  auth: { clientId: CLIENT_ID, authority: 'https://login.microsoftonline.com/' + TENANT_ID,
          redirectUri: location.origin + '/ap/' },
  cache: { cacheLocation: 'sessionStorage' }
});

async function token(){
  await msalApp.initialize();
  const redir = await msalApp.handleRedirectPromise();
  let account = (redir && redir.account) || msalApp.getAllAccounts()[0];
  if (!account) { await msalApp.loginRedirect({ scopes: SCOPES }); return null; }
  msalApp.setActiveAccount(account);
  try { const t = await msalApp.acquireTokenSilent({ scopes: SCOPES, account }); return t.accessToken; }
  catch (e) { await msalApp.acquireTokenRedirect({ scopes: SCOPES }); return null; }
}

const GRAPH = 'https://graph.microsoft.com/v1.0';
async function g(tok, path){
  const r = await fetch(GRAPH + path, { headers: { Authorization: 'Bearer ' + tok } });
  let body = null; try { body = await r.json(); } catch(_) {}
  return { ok: r.ok, status: r.status, body };
}

/* Resolve site -> library -> file, the same way the Precon desk does. A 403 here
   is an access problem, not a missing file, and says so. */
async function loadData(tok){
  const site = await g(tok, '/sites/' + SP_HOST + ':' + SP_PATH);
  if (!site.ok || !site.body || !site.body.id)
    throw new Error('Could not reach ' + SP_PATH + ' (HTTP ' + site.status + ').');
  const dr = await g(tok, '/sites/' + site.body.id + '/drives?$select=id,name');
  const drive = ((dr.body && dr.body.value) || []).find(d => d.name === LIBRARY);
  if (!drive) throw new Error('No document library called ' + LIBRARY + ' on ' + SP_PATH + '.');
  const r = await fetch(GRAPH + '/drives/' + drive.id + '/root:/' + encodeURI(DATA_FILE) + ':/content',
                        { headers: { Authorization: 'Bearer ' + tok } });
  if (r.status === 403)
    throw new Error('Your account is not permitted to read ' + LIBRARY + '. Ask ' + CONTACT + ' for access.');
  if (r.status === 404)
    throw new Error(DATA_FILE + ' is not in ' + LIBRARY + ' yet - has the AP commitments pull run?');
  if (!r.ok) throw new Error(DATA_FILE + ': HTTP ' + r.status);
  const commitments = await r.json();

  /* Second file, optional. A 404 here is not an error - it means the CE billing
     pull has not run yet, and the page says so instead of showing zeros. */
  let expected = null;
  try {
    const e = await fetch(GRAPH + '/drives/' + drive.id + '/root:/' + encodeURI(EXPECTED_FILE) + ':/content',
                          { headers: { Authorization: 'Bearer ' + tok } });
    if (e.ok) expected = await e.json();
  } catch (_) { /* leave expected null */ }
  return { commitments, expected };
}

/* ==== helpers ==== */
// Same normalisation compliance_pull.js uses, so the join keys agree.
const normName = n => String(n||'').toUpperCase().replace(/&/g,' AND ').replace(/[.,'"]/g,' ')
  .replace(/\b(LLC|L L C|INC|INCORPORATED|CO|COMPANY|CORP|CORPORATION|LP|LLP|PC|PLLC)\b/g,' ')
  .replace(/[^A-Z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
const money = v => (v === null || v === undefined || v === '') ? '' :
  '$' + Math.round(Number(v)).toLocaleString();
const pct = v => (v === null || v === undefined || v === '') ? '' : Number(v).toFixed(0) + '%';
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* Retainage is two fields. The percent alone cannot say whether it stops at 50%
   completion - which is exactly how the GL Pack shortage happened. Show both,
   and flag the commitments where the term is missing rather than assuming. */
function retainageCell(r){
  const p = r.retainage_percent, d = (r.retainage_duration||'').trim();
  if (p === null && !d) return '<span class="muted">—</span>';
  if (p === 0) return '<span class="pill b" title="This contract withholds no retainage">0% &middot; no retainage</span>';
  const dur = d && d.toLowerCase() !== 'n/a' ? d : '<span class="pill y" title="A percentage is withheld but the commitment does not record when it stops, so it is unknown whether retainage runs throughout or ends at 50% completion.">term not set</span>';
  return '<b>' + pct(p) + '</b> ' + dur;
}

let STATE = { commitments: [], sort: { col: 'project', dir: 1 }, billing: {}, billingMeta: null };

/* Joined on commitment number, which the probe work established equals the CE
   subcontract code exactly (40325AU002 in both systems). Vendor name is NOT a
   safe key - 25AU002 carries Turner Fence on two separate commitments. */
const billingFor = r => STATE.billing[String(r.number || '').trim()] || null;

const FLAG_TEXT = {
  over_billed:            ['r','over-billed','Billed more than the commitment. Either a change order went into billings but not onto the subcontract, or the sub over-billed.'],
  contract_mismatch:      ['y','contract differs','Procore and ComputerEase disagree on the contract value. Procore higher: an approved change order never reached CE - a CO title over the character limit fails to sync silently. CE higher: the change order was entered straight into CE and Procore is understating the contract.'],
  sov_gap:                ['y','SOV gap','ComputerEase does not agree with itself on this subcontract - billed plus remaining should equal its schedule of values and does not. Usually billings posted to a cost code the subcontract does not carry, or an item on the subcontract that posts nowhere. The gap is normally one line.'],
  shared_cost_code:       ['y','shared cost code','Another subcontract posts to the same phase/category/cost type, so some dollars cannot be attributed to this one.'],
  no_job_totals:          ['b','no CE data','This job does not publish to the ComputerEase API, so no billing figure is available.'],
  no_ce_subcontract:      ['b','no CE match','No ComputerEase subcontract carries this commitment number.'],
  retainage_stop_reached: ['b','past 50%','Billings have passed half the revised contract - on a "thru 50%" term, withholding should have stopped.'],
  pending_rfc:            ['y','pending CO','A change order sits on this ComputerEase subcontract at pending approval. It is not contract value yet, so it is excluded from the schedule of values here - which is right, but it also means the sub may bill against it before anyone approves it.'],
  no_committed_cells:     ['b','nothing in job cost','The subcontract exists in ComputerEase but none of its cost codes carries a committed cell in job cost, so nothing has been posted against it yet. Expected on a subcontract entered recently. Worth asking about on an old one.'],
};

/* Billed to date, with what is left and any exception beneath it. Keeping the
   qualifier in the same cell avoids spending two more columns on a table that
   is already wide. */
/* A pending RFC is worth seeing whether or not there is a billed figure, so it
   renders on both paths rather than only in the pills row below. */
function pendingPill(b){
  if (!b || !b.ce_pending_sov) return '';
  const [cls,label,tip] = FLAG_TEXT.pending_rfc;
  return ' <span class="pill ' + cls + '" title="' + esc(tip
    + ' RFC ' + (b.ce_pending_rfcs||'?') + ', ' + money(b.ce_pending_sov) + '.') + '">' + label + '</span>';
}

/* Procore's revised contract and CE's schedule of values are two different
   figures from two different systems, and the desk used to show only Procore's.
   The "contract differs" flag said they disagreed but not which way, and the
   direction IS the diagnosis: Procore higher means an approved change order
   never reached CE (a CO title over the character limit fails to sync silently);
   CE higher means it was entered straight into CE and Procore understates the
   contract. Both figures now sit side by side with the gap signed from CE. */
function ceContractCell(r){
  const b = billingFor(r);
  if (!b) return '<span class="muted" title="No row in ' + EXPECTED_FILE + ' for this commitment">&mdash;</span>';
  if (b.ce_sov === null || b.ce_sov === undefined) {
    const f = (b.flags||[]).find(x => ['no_ce_subcontract','no_job_totals','no_committed_cells'].includes(x));
    const label = f ? FLAG_TEXT[f][1] : 'not matched';
    const tip = ((f ? FLAG_TEXT[f][2] : '') + ' ' + (b.billed_source||'')).trim();
    return '<span class="pill b" title="' + esc(tip) + '">' + label + '</span>';
  }
  const gap = b.pc_vs_ce_contract_gap;          // Procore revised - CE SOV
  const sub = !gap ? ''
    : gap > 0
      ? '<div class="sub co" title="Procore is higher by this much. An approved change order has not reached CE.">'
          + money(gap) + ' under Procore</div>'
      : '<div class="sub co" title="CE is higher by this much. The change order was entered straight into CE and Procore is understating the contract.">'
          + money(Math.abs(gap)) + ' over Procore</div>';
  return money(b.ce_sov) + sub
    + (b.ce_pending_sov
        ? '<div class="sub" title="A change order on this CE subcontract is still pending approval, so it is not in the figure above.">'
            + money(b.ce_pending_sov) + ' pending</div>'
        : '');
}

function billedCell(r){
  const b = billingFor(r);
  if (!b) return '<span class="muted" title="No row in ' + EXPECTED_FILE + ' for this commitment">—</span>';
  if (b.ce_billed === null || b.ce_billed === undefined) {
    /* Three different reasons there is no figure, and they are not the same
       thing. "not matched" was being shown for all of them. */
    const f = (b.flags||[]).find(x => ['no_committed_cells','no_job_totals','no_ce_subcontract'].includes(x));
    const label = f ? FLAG_TEXT[f][1] : 'not matched';
    const tip = ((f ? FLAG_TEXT[f][2] : '') + ' ' + (b.billed_source||'')).trim();
    return '<span class="pill b" title="' + esc(tip) + '">' + label + '</span>' + pendingPill(b);
  }
  const flags = (b.flags||[]).filter(f => FLAG_TEXT[f]);
  const pills = flags.map(f => {
    const [cls,label,tip] = FLAG_TEXT[f];
    return '<span class="pill ' + cls + '" title="' + esc(tip) + '">' + label + '</span>';
  }).join(' ');
  return money(b.ce_billed)
    + '<div class="sub">' + (b.pct_billed != null ? Number(b.pct_billed).toFixed(0) + '%' : '')
    + (b.ce_balance ? ' &middot; ' + (b.ce_balance < 0
         ? money(Math.abs(b.ce_balance)) + ' over'    // a negative balance is an over-bill, not "-$5,100 left"
         : money(b.ce_balance) + ' left') : '') + '</div>'
    + (pills ? '<div class="sub">' + pills + '</div>' : '');
}

/* ---- Expected pay app -------------------------------------------------------
   Every quantity on a sub's cover sheet is derivable from the commitment and
   CE's billed-to-date, whatever form the sub uses. The reviewer types the four
   figures off their cover sheet and the deltas fall out. This exists because
   two reviews in one morning each took an hour and each turned on a single
   number: a $6,776 change order missing from one app, $2,160 missing from
   another. Both were visible from the contract alone.

   committed_billed is GROSS of retainage. Confirmed 1 Oct 2026 against H.C.
   Blake's G702 on 2506-00400: the desk read $310,186 and the application showed
   $310,186.31 billed with $300,646.75 paid. Previously inferred, now measured. */
function payappExpected(r){
  const b = billingFor(r);
  const contract = num0(r.revised_contract) || num0(r.contract_value);
  const pctR = (r.retainage_percent === null || r.retainage_percent === undefined)
    ? null : Number(r.retainage_percent);
  const dur  = String(r.retainage_duration || '');
  /* "thru 50%" caps total retainage at half the contract's worth of withholding.
     Anything else (throughout, or unset) withholds on every dollar. A missing
     term is NOT assumed to be thru-50 - that assumption is what let the GL Pack
     shortage through. */
  const thru50 = /50/.test(dur) && /thru|through/i.test(dur);
  const billed = b && b.ce_billed != null ? Number(b.ce_billed) : null;
  const rate = pctR == null ? null : pctR/100;
  const retAt = v => {            // retainage held once v has been billed
    if (rate == null || v == null) return null;
    if (!thru50) return v * rate;
    return Math.min(v, contract/2) * rate;
  };
  const retNow  = retAt(billed);
  const retFull = retAt(contract);
  const prevPaid = (billed != null && retNow != null) ? billed - retNow : null;
  const maxDue = (retFull != null && prevPaid != null) ? (contract - retFull) - prevPaid : null;
  return { contract, original:num0(r.contract_value), cos:num0(r.approved_change_orders),
           pctR, dur, thru50, billed, retNow, retFull, prevPaid, maxDue, retAt,
           minBilled:billed, maxBilled:contract,
           past50: b ? !!b.past_50_pct : null,
           ceSov: b && b.ce_sov != null ? Number(b.ce_sov) : null,
           gap: b && b.pc_vs_ce_contract_gap != null ? Number(b.pc_vs_ce_contract_gap) : null,
           flags: (b && b.flags) || [], hasBilling: !!b && b.ce_billed != null };
}
const num0 = v => (v === null || v === undefined || v === '') ? 0 : Number(v);
const money2 = v => (v === null || v === undefined || isNaN(v)) ? '—'
  : '$' + Number(v).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});

/* Line names on both forms BH actually receives. The quantities are identical;
   only the labels move, so one panel serves an AIA G702/G703 and BH's own
   Attachment G without the reviewer translating. */
/* Not every line has a single expected value, and pretending otherwise produced
   false mismatches. Billed-to-date from CE is the position as at the LAST posted
   application; a new pay app is expected to exceed it. Retainage likewise moves
   with whatever they have completed this period. So three kinds of row:

     fixed   - one right answer (adjusted contract, previous payments)
     range   - a floor and a ceiling (completed to date)
     derived - computed from what they entered above (retainage held)

   Only the ceiling on the payment is knowable in advance, which is why the
   headline is "most they can ask for" and not an expected amount. */
const PA_LINES = [
  ['contract','fixed','Adjusted contract','Amount of Original Contract + Approved Change Order(s) — AIA G702 line 3'],
  ['billed','range','Completed to date','Total Completed Work & Stored Materials to Date — AIA G702 line 4, G703 column G'],
  ['retNow','derived','Retainage held','Less Retainage — AIA G702 line 5'],
  ['prevPaid','fixed','Less previous payments','Less Previous Payments — AIA G702 line 7'],
];

function payappPanel(r){
  const e = payappExpected(r);
  if (!e.hasBilling) {
    return '<div class="pawrap"><div class="pamax"><span class="l">Adjusted contract</span>'
      + '<span class="n">' + money2(e.contract) + '</span></div>'
      + '<div class="pawarn"><div>&#9888;&nbsp; No billed-to-date figure for this commitment, '
      + 'so the rest of the application cannot be built.</div></div></div>';
  }
  const ours = {
    contract: money2(e.contract),
    billed: money2(e.minBilled) + ' &ndash; ' + money2(e.maxBilled),
    retNow: (e.pctR == null ? '&mdash;'
             : (e.thru50 ? e.pctR + '% capped at ' + money2(e.retFull) : e.pctR + '% of completed')),
    prevPaid: money2(e.prevPaid),
  };
  const sub = {
    contract: money2(e.original) + ' + ' + money2(e.cos) + ' CO',
    billed: 'billed so far &rarr; contract',
    retNow: 'from their completed figure',
    prevPaid: 'billed less retainage held',
  };
  const rows = PA_LINES.map(([k,kind,what,tip]) =>
    '<tr><td><div class="paq" title="' + esc(tip) + '">' + what + '</div>'
    + '<div class="paref">' + sub[k] + '</div></td>'
    + '<td class="n' + (kind==='fixed'?'':' paloose') + '">' + ours[k] + '</td>'
    + '<td class="n"><input class="pain" type="text" inputmode="decimal" data-k="' + k + '" placeholder="&mdash;"></td>'
    + '<td class="padelta" data-d="' + k + '"></td></tr>').join('');

  const warn = [];
  if (e.gap) warn.push(e.gap > 0
    ? 'Procore is <b>' + money2(e.gap) + '</b> higher than CE &mdash; an approved change order has not reached CE.'
    : 'CE is <b>' + money2(-e.gap) + '</b> higher than Procore &mdash; the change order was entered straight into CE.');
  if (e.thru50 && e.past50) warn.push('Past 50% &mdash; no further retainage should be withheld. '
    + 'Their retainage &divide; ' + (e.pctR/2) + '% recovers the contract they are billing against.');
  if (e.flags.includes('sov_gap')) warn.push('Billed plus remaining does not reconcile to the schedule of values.');
  if (e.pctR && !e.dur) warn.push('No retainage term on the commitment &mdash; assuming it is withheld on every dollar.');

  return '<div class="pawrap">'
   /* A negative ceiling is not "they may ask for minus two thousand" - it means
      the commitment is already billed past its contract. Seven live rows are in
      that state, so it is a real case, not a theoretical one. */
   + (e.maxDue != null && e.maxDue < -0.005
      ? '<div class="pamax"><span class="l" style="color:#b3261e">Already over-billed by</span>'
        + '<span class="n" style="color:#b3261e">' + money2(-e.maxDue) + '</span>'
        + '<span class="paref" style="margin-left:2px">nothing further is due</span></div>'
      : '<div class="pamax"><span class="l">Most they can ask for</span><span class="n">' + money2(e.maxDue) + '</span>'
        + '<span class="paref" style="margin-left:2px">if they bill to 100%</span></div>')
   + '<table class="patab" data-pa="x"><thead><tr><th></th><th class="n">Ours</th>'
   +   '<th class="n">Theirs</th><th class="n"></th></tr></thead><tbody>' + rows + '</tbody></table>'
   + (warn.length ? '<div class="pawarn">' + warn.map(w=>'<div>&#9888;&nbsp; '+w+'</div>').join('') + '</div>' : '')
   + '</div>';
}

/* Deltas recompute as the reviewer types; nothing is stored or sent anywhere. */
function payappBind(tr, r){
  const e = payappExpected(r);
  const tab = tr.querySelector('table[data-pa]'); if (!tab) return;
  const val = k => { const i = tab.querySelector('input[data-k="'+k+'"]'); if(!i) return null;
    const raw = i.value.replace(/[$,\s]/g,''); if(!raw) return null;
    const v = Number(raw); return isNaN(v) ? null : v; };
  const put = (k,cls,txt) => { const c = tab.querySelector('[data-d="'+k+'"]');
    c.className = 'padelta ' + cls; c.innerHTML = txt; };
  const near = (a,b) => Math.abs(a-b) < 0.005;

  const upd = () => {
    PA_LINES.forEach(([k,kind]) => {
      const v = val(k);
      if (v === null) { put(k,'',''); return; }

      if (kind === 'fixed') {
        if (e[k] == null) { put(k,'',''); return; }
        const d = v - e[k];
        put(k, near(d,0)?'paok':'pabad', near(d,0) ? 'matches' : (d>0?'+':'') + money2(d));

      } else if (kind === 'range') {
        /* A new application SHOULD exceed what CE has posted - that is the work
           done this period. Only below the floor or above the contract is wrong. */
        if (v < e.minBilled - 0.005) put(k,'pabad','below billed ' + money2(e.minBilled));
        else if (v > e.maxBilled + 0.005) put(k,'pabad','over contract by ' + money2(v - e.maxBilled));
        else put(k,'paok','in range');

      } else { // derived: retainage follows whatever they say is completed
        const base = val('billed');
        if (base === null || !e.retAt) { put(k,'','needs completed'); return; }
        const want = e.retAt(base);
        if (want == null) { put(k,'',''); return; }
        const d = v - want;
        put(k, near(d,0)?'paok':'pabad',
            near(d,0) ? 'matches' : (d>0?'+':'') + money2(d) + ' vs ' + money2(want));
      }
    });
  };
  tab.querySelectorAll('input[data-k]').forEach(i => i.addEventListener('input', upd));
}

/* Compliance is folded into each row by the pull, so there is no join here and
   no second SharePoint site to reach. */
const complianceFor = r => r.compliance || null;

function compCell(r){
  const c = complianceFor(r);
  if (!c) return '<span class="pill" style="background:#eef1f6;color:#7a828f" title="This subcontractor holds a commitment but has no compliance record in Billy at all - not that they failed a check, that there is nothing to check.">not in Billy</span>';
  if (c.billy_is_compliant === 'Yes') return '<span class="pill g">compliant</span>';
  const t = c.notes ? ' title="' + esc(c.notes).replace(/"/g,'&quot;') + '"' : '';
  return '<span class="pill r"' + t + '>non-compliant</span>';
}

/* The desk opens on one project, not all of them. A sub pay app is reviewed
   against one job, and 150-odd commitments across every job is a wall to scroll
   past before the work starts. "All projects" is still in the list for anyone
   who wants the portfolio view. */
/* Expected to bill this cycle. Deliberately NOT "who has billed" - neither
   ap_commitments.json nor ap_payapp_expected.json carries a billing date, so that
   half has to wait for the payables@ join. What this can say is who still has
   contract left, how much they can claim, and who cannot be paid when it arrives. */
/* Which slice of the cycle to look at. "Submitted to payables / not submitted"
   is the one people ask for first and the one that cannot be built yet - it
   needs the payables@ join, because nothing we hold records that a draw arrived. */
let QVIEW = 'open';
const QVIEWS = [
  ['open',     'Still to bill'],
  ['blocked',  'Cannot be paid'],
  ['over',     'Over-billed'],
  ['done',     'Billed out'],
  ['nodata',   'No ComputerEase figure'],
  ['all',      'Everything'],
];

function renderQueue(rows){
  const el = document.getElementById('queue'); if (!el) return;
  if (!rows || !rows.length) { el.innerHTML = ''; return; }

  const all = rows.map(r => {
    const e = payappExpected(r);
    const c = complianceFor(r);
    return { r, e, blocked: !!(c && c.billy_is_compliant !== 'Yes'), noBilly: !c };
  });
  const open   = all.filter(x => x.e.hasBilling && x.e.maxDue != null && x.e.maxDue > 0.5);
  const over   = all.filter(x => x.e.hasBilling && x.e.maxDue != null && x.e.maxDue < -0.5);
  const done   = all.filter(x => x.e.hasBilling && x.e.maxDue != null && Math.abs(x.e.maxDue) <= 0.5);
  const nodata = all.filter(x => !x.e.hasBilling);
  const pick = { open, blocked: open.filter(x => x.blocked), over, done, nodata, all };
  const live = pick[QVIEW] || open;

  const counts = { open: open.length, blocked: open.filter(x=>x.blocked).length,
                   over: over.length, done: done.length, nodata: nodata.length, all: all.length };
  const sel = '<label>Show</label><select id="q-view">'
    + QVIEWS.map(([k,label]) => `<option value="${k}"${k===QVIEW?' selected':''}>`
        + `${label} (${counts[k]})</option>`).join('') + '</select>';

  if (!live.length) {
    el.innerHTML = '<div class="qwrap"><div class="qbar">' + sel + '</div>'
      + '<div class="qempty">Nothing in this view.</div></div>';
    bindQView();
    return;
  }

  const total = live.reduce((t,x) => t + (x.e.maxDue || 0), 0);
  const blocked = live.filter(x => x.blocked);

  /* Grouped by the day they bill, because that is how the cycle actually runs and
     it is the one scheduling fact the commitment carries. */
  const byDay = {};
  live.forEach(x => { const d = String(x.r.billing_day||'').trim() || 'no billing day set';
    (byDay[d] = byDay[d] || []).push(x); });
  const dayNum = d => { const m = String(d).match(/\d+/); return m ? Number(m[0]) : 999; };
  const days = Object.keys(byDay).sort((a,b) => dayNum(a) - dayNum(b));

  const body = days.map(d => {
    const g = byDay[d].sort((a,b) => b.e.maxDue - a.e.maxDue);
    const sum = g.reduce((t,x) => t + x.e.maxDue, 0);
    const label = /^no billing day/.test(d) ? 'No billing day set' : 'Bills ' + esc(d);
    return '<div class="qday">' + label + ' &middot; ' + g.length + ' subcontractor'
      + (g.length===1?'':'s') + ' &middot; ' + money(sum) + '</div>'
      + '<table class="qtab"><tbody>' + g.map(x =>
        '<tr><td>' + esc(x.r.vendor)
          + '<div class="qsub">' + esc(x.r.number||'') + (x.r.project ? ' &middot; ' + esc(x.r.project) : '') + '</div></td>'
        + '<td class="n">' + money(QVIEW === 'over' ? -(x.e.maxDue||0) : (x.e.maxDue||0))
          + '<div class="qsub">of ' + money(x.e.contract) + '</div></td>'
        + '<td class="n">' + (x.blocked
            ? '<span class="qblock">cannot be paid</span><div class="qsub">non-compliant in Billy</div>'
            : (x.noBilly ? '<span class="pill" style="background:#eef1f6;color:#7a828f" title="This subcontractor holds a commitment but has no compliance record in Billy at all - not that they failed a check, that there is nothing to check.">not in Billy</span>' : ''))
          + '</td></tr>').join('') + '</tbody></table>';
  }).join('');

  const headLabel = QVIEW === 'over' ? 'Over-billed by'
                  : QVIEW === 'done' ? 'Billed out'
                  : QVIEW === 'nodata' ? 'No ComputerEase figure'
                  : 'Still to bill';
  const headNum = (QVIEW === 'done' || QVIEW === 'nodata') ? '' :
    '<span class="n">' + money(QVIEW === 'over' ? -total : total) + '</span>';

  el.innerHTML = '<div class="qwrap">'
    + '<div class="qbar">' + sel + '</div>'
    + '<div class="qhead"><span class="l">' + headLabel + '</span>' + headNum
    +   '<span class="qsub">across ' + live.length + ' commitment' + (live.length===1?'':'s')
    +   (blocked.length && QVIEW !== 'blocked' ? ' &middot; <span class="qblock">' + blocked.length + ' cannot be paid until compliance clears</span>' : '')
    +   '</span></div>' + body + '</div>';
  bindQView();
}

function bindQView(){
  const s = document.getElementById('q-view');
  if (s) s.onchange = () => { QVIEW = s.value; render(); };
}

function render(){
  const proj = document.getElementById('f-proj').value;
  const pm   = document.getElementById('f-pm').value;
  /* Either entry point opens the desk: one project, or one PM across every job
     they run. Only the two together being unset is the blank state. */
  if (!proj && pm === 'all') {
    document.getElementById('cards').innerHTML = '';
    { const q = document.getElementById('queue'); if (q) q.innerHTML = ''; }
    document.getElementById('table').innerHTML =
      '<div class="empty" style="padding:38px 20px;line-height:1.7">'
      + '<b>Select a project</b> to see its AP status and pay app comparison'
      + '<div class="sub" style="margin-top:6px">&mdash; or pick a <b>PM</b> to see every job they run. '
      + 'Either gives you commitments, compliance, billed to date and the expected pay app '
      + 'for each subcontractor.</div></div>';
    return;
  }
  const comp = document.getElementById('f-comp').value;
  const q    = document.getElementById('f-q').value.trim().toUpperCase();

  let rows = STATE.commitments.filter(r => {
    if (proj && proj !== 'all' && r.project !== proj) return false;
    if (pm   !== 'all' && (r.project_manager||'') !== pm) return false;
    if (q && !(String(r.vendor).toUpperCase().includes(q) || String(r.number).toUpperCase().includes(q))) return false;
    if (comp !== 'all') {
      const c = complianceFor(r);
      const state = !c ? 'missing' : (c.billy_is_compliant === 'Yes' ? 'ok' : 'nc');
      if (comp !== state) return false;
    }
    return true;
  });

  const { col, dir } = STATE.sort;
  rows.sort((a,b) => {
    let x, y;
    if (col === 'ce_billed') { const ba=billingFor(a), bb=billingFor(b); x=(ba&&ba.ce_billed)||0; y=(bb&&bb.ce_billed)||0; }
    else if (col === 'ce_sov') { const ba=billingFor(a), bb=billingFor(b); x=(ba&&ba.ce_sov)||0; y=(bb&&bb.ce_sov)||0; }
    else { x = a[col]; y = b[col]; }
    if (typeof x === 'number' || typeof y === 'number') return ((x||0)-(y||0))*dir;
    return String(x||'').localeCompare(String(y||''))*dir;
  });

  const value = rows.reduce((s,r)=>s+(r.contract_value||0),0);
  const billed= rows.reduce((s,r)=>{ const b=billingFor(r); return s + ((b && b.ce_billed) || 0); },0);
  const left  = rows.reduce((s,r)=>{ const b=billingFor(r); return s + ((b && b.ce_balance) || 0); },0);
  const exc   = rows.filter(r=>{ const b=billingFor(r);
                  return b && (b.flags||[]).some(f=>['over_billed','contract_mismatch','sov_gap'].includes(f)); }).length;
  const cos   = rows.reduce((s,r)=>s+(r.approved_change_orders||0),0);
  const nc    = rows.filter(r => { const c = complianceFor(r); return c && c.billy_is_compliant !== 'Yes'; }).length;
  const noTerm= rows.filter(r => r.retainage_percent > 0 && !(r.retainage_duration||'').trim().match(/throughout|thru/i)).length;
  const noCe  = rows.filter(r => !r.ce_code).length;

  /* Contract, billed and left deliberately do NOT sum: billed and balance come
     from CE's SOV, contract value from Procore's revised, and the two disagree on
     20 commitments. Showing them as a progression would imply arithmetic that is
     not true, so they stay three separate figures. */
  const pctBilled = value ? Math.round(100 * billed / value) : null;
  const chip = (n, label, cls) => n
    ? `<span class="exchip ${cls}"><b>${n}</b> ${label}</span>` : '';
  const chips = chip(exc, 'billing exceptions', 'r') + chip(nc, 'non-compliant', 'r')
              + chip(noTerm, 'retainage term not set', 'y') + chip(noCe, 'no CE code', 'b');

  document.getElementById('cards').innerHTML = `
    <div class="cardcap">${rows.length} commitment${rows.length===1?'':'s'}</div>
    <div class="cardrow">
      <div class="card"><div class="n">${money(value)}</div><div class="l">Contract value</div>
        ${cos ? `<div class="s">includes ${money(cos)} in change orders</div>` : ''}</div>
      <div class="card ok"><div class="n">${money(billed)}</div><div class="l">Billed to date (CE)</div>
        ${pctBilled != null ? `<div class="s">${pctBilled}% of contract value</div>` : ''}</div>
      <div class="card gap"><div class="n">${money(left)}</div><div class="l">Left to bill</div>
        <div class="s">per ComputerEase schedules of values</div></div>
    </div>
    <div class="exrow">${chips || '<span class="exclear">&#10003; No exceptions on these commitments</span>'}</div>`;

  const cols = [
    ['project','Project','l'], ['number','Commitment','l'], ['vendor','Subcontractor','l'],
    ['compliance','Compliance',''],
    ['revised_contract','Contract &middot; Procore','num'], ['ce_sov','Contract &middot; CE','num'],
    ['ce_billed','Billed to date','num'],
    ['retainage_percent','Retainage',''], ['project_manager','PM','l'], ['status','Status','']
  ];
  const head = cols.map(([k,label,cls]) =>
    `<th class="${cls}" data-col="${k}">${label}${STATE.sort.col===k ? (STATE.sort.dir>0?' ▲':' ▼') : ''}</th>`).join('');

  const body = rows.length ? rows.map(r => `<tr class="${(() => {
      const c = complianceFor(r);
      return !c ? 'nobilly' : (c.billy_is_compliant === 'Yes' ? '' : 'noncompliant');
    })()}">
      <td class="l wrap">${esc(r.project)}${r.project_number ? `<div class="sub">${esc(r.project_number)}</div>` : ''}</td>
      <td class="l"><a href="${esc(r.procore_url)}" target="_blank" rel="noopener">${esc(r.number||'—')}</a>
        ${r.billing_day ? `<div class="sub">bills ${esc(r.billing_day)}</div>` : ''}
        <div class="sub pacell"><button type="button" class="pabtn" aria-expanded="false" data-pa-for="${esc(r.number||'')}"
          title="Expected pay app: what their cover sheet should say, and the most they can ask for">pay app check</button></div></td>
      <td class="l wrap">${esc(r.vendor)}
        <div class="sub code">${r.ce_code ? esc(r.ce_code)
          : '<span class="warn" title="No Abbreviated Name in Procore - Accounting has nothing to key the entry on">no CE code</span>'}</div></td>
      <td>${compCell(r)}</td>
      <td class="num">${money(r.revised_contract || r.contract_value)}
        ${r.approved_change_orders ? `<div class="sub co" title="Approved change orders included above">+${money(r.approved_change_orders)} CO</div>` : ''}</td>
      <td class="num">${ceContractCell(r)}</td>
      <td class="num">${billedCell(r)}</td>
      <td>${retainageCell(r)}</td>
      <td class="l">${esc(r.project_manager)||'<span class="muted">—</span>'}</td>
      <td>${esc(r.status)}${r.executed==='Yes'?'':(r.executed==='No'?' <span class="pill y" title="Not executed in Procore - the commitment has not been signed by both parties, so the contract value shown is not yet binding.">unexecuted</span>':'')}</td>
    </tr>`).join('') : `<tr><td colspan="10" class="empty">No commitments match these filters.</td></tr>`;

  document.getElementById('table').innerHTML =
    `<div class="tablescroll"><table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>`;

  renderQueue(rows);

  /* One expandable panel per commitment rather than more columns - the table is
     already nine wide and the check is something you open for one sub at a time. */
  document.querySelectorAll('button[data-pa-for]').forEach(btn => btn.onclick = () => {
    const tr = btn.closest('tr');
    if (tr.nextElementSibling && tr.nextElementSibling.classList.contains('parow')) {
      tr.nextElementSibling.remove(); btn.setAttribute('aria-expanded','false'); return;
    }
    const num = btn.dataset.paFor;
    const r = STATE.commitments.find(x => String(x.number||'').trim() === num);
    if (!r) return;
    const det = document.createElement('tr');
    det.className = 'parow';
    det.innerHTML = '<td colspan="10">' + payappPanel(r) + '</td>';
    tr.insertAdjacentElement('afterend', det);
    btn.setAttribute('aria-expanded','true');
    payappBind(det, r);
  });

  document.querySelectorAll('th[data-col]').forEach(th => th.onclick = () => {
    const c = th.dataset.col;
    STATE.sort = { col: c, dir: STATE.sort.col === c ? -STATE.sort.dir : 1 };
    render();
  });
}

(async () => {

        <p><b>What this page shows today:</b> every active subcontract commitment in Procore, with its

        ComputerEase vendor code. Bailey-Harris self-perform commitments are excluded.
        <br><b>What it does not show yet:</b> the pay application queue. Matching incoming draws
        from payables@ to these commitments is the next build — nothing on this page is an approval.</p>
      </div>
      <div class="controls">
        <label>Project:</label>
        <select id="f-proj"><option value="">Select a project&hellip;</option>
          ${projects.map(p=>`<option value="${esc(p.name)}">${esc(p.label)}</option>`).join('')}
          <option value="all">All projects (${projects.length})</option></select>
        <label>PM:</label>
        <select id="f-pm"><option value="all">All PMs</option>
          ${pms.map(p=>`<option>${esc(p)}</option>`).join('')}</select>
        <label>Compliance:</label>
        <select id="f-comp">
          <option value="all">Any</option><option value="ok">Compliant</option>
          <option value="nc">Non-compliant</option><option value="missing">Not in Billy</option></select>
        <label>Search:</label>
        <input id="f-q" type="text" placeholder="subcontractor or commitment #" style="min-width:230px">
      </div>
      <div class="cards" id="cards"></div>
      <div class="section-title">Commitments</div>
      <div id="table"></div>
      <div class="section-title">Pay application queue</div>
      <div id="queue"></div>
      <div class="stub">
        <h3>What is still missing</h3>
        The queue is the <b>expected</b> side only &mdash; who can still bill, and how much.
        It cannot say who has <b>already</b> billed this cycle, because nothing we hold carries a
        billing date: ComputerEase gives a billed-to-date amount with no date attached, and
        Procore's own payment fields read zero on every commitment because the billing happens
        in ComputerEase.<br><br>
        The missing piece is the incoming pay app itself. The mail probe reads payables@ and
        identifies roughly <b>20 subcontractor draws a week</b>; matching each one to its
        commitment is what would let a PM compare the claimed amount against the contract
        position here, code it and approve it. Nothing on this page is an approval.
      </div>`;

    document.getElementById('foot').innerHTML =
      `Commitments: Procore work-order contracts, ${STATE.commitments.length} rows across
       ${ap.projects_in_scope} projects (${ap.self_perform_skipped} self-perform excluded).
       Compliance: Billy, joined by the pull (${ap.compliance_matched} matched,
       ${ap.compliance_unmatched} with no Billy row).
       Retainage shown as percent plus duration — both are needed; the percent alone cannot
       distinguish "5% throughout" from "5% thru 50%".` +
      (STATE.billingMeta
        ? ` Billings: ComputerEase committed_billed, ${Object.keys(STATE.billing).length} commitments matched` +
          ((STATE.billingMeta.jobs_without_job_totals || []).length
            ? `; no CE billing data for ${STATE.billingMeta.jobs_without_job_totals.length} job(s) (${esc(STATE.billingMeta.jobs_without_job_totals.join(', '))}) — those rows show "no CE data", not zero.`
            : '.')
        : ` Billings not loaded — ${EXPECTED_FILE} is not in ${LIBRARY} yet, so the Billed column is empty.`);

    ['f-proj','f-pm','f-comp'].forEach(id => document.getElementById(id).onchange = render);
    document.getElementById('f-q').oninput = render;
    render();

  } catch (e) {
    document.getElementById('content').innerHTML = '';
    const b = document.getElementById('banner');
    b.className = 'banner err'; b.style.display = '';
    b.textContent = 'Could not load: ' + e.message;
    console.error(e);
  }
})();
</script>
</body>
</html>
