<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AP Desk</title>
<link rel="stylesheet" href="/bh-shell.css">
<style>
/* ---------- AP desk: list + pane (mockup) ---------- */
.ap-bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:14px 40px;border-bottom:1px solid var(--bh-hairline);background:#fff;position:sticky;top:0;z-index:20}
.ap-bar .bh-input{min-height:38px;width:260px;font-size:13px}
.ap-tog{display:inline-flex;align-items:center;gap:6px;min-height:38px;padding:0 12px;border:1px solid var(--bh-slate);background:#fff;font:600 12px/1 var(--bh-font);letter-spacing:.04em;text-transform:uppercase;cursor:pointer;color:var(--bh-ink)}
.ap-tog[aria-pressed="true"]{background:var(--bh-black);color:#fff;border-color:var(--bh-black)}
.ap-tog .n{font-weight:700}
.ap-sp{flex:1 1 10px}
.ap-pull{font-size:12px;color:var(--bh-ink-muted);display:flex;align-items:center;gap:8px}
.ap-pull b{color:var(--bh-ink);font-weight:600}
.ap-as{display:flex;align-items:center;gap:8px}
.ap-as select{min-height:38px;font-size:13px}

.ap-work{display:flex;align-items:stretch;min-height:calc(100vh - 170px)}
.ap-list{flex:1 1 auto;min-width:0;padding:8px 40px 60px}
/* 22 Oct: the detail opens as a wide drawer OVER the list (it used to sit beside it at 580px) */
.ap-pane{position:fixed;top:0;right:0;bottom:0;width:min(960px,94vw);z-index:60;background:#fff;border-left:1px solid var(--bh-slate);box-shadow:-12px 0 32px rgba(33,30,30,.18);overflow:auto;animation:pnIn .16s ease-out}
@keyframes pnIn{from{transform:translateX(24px);opacity:.6}to{transform:none;opacity:1}}
body:not(.no-pane) .ap-scrim{display:block;position:fixed;inset:0;background:rgba(33,30,30,.35);z-index:55;border:0;cursor:pointer}
body:not(.no-pane){overflow:hidden}
body.no-pane .ap-pane{display:none}

/* sections */
.ap-sec{margin-top:22px}
.ap-sec-h{display:flex;align-items:center;gap:12px;width:100%;padding:10px 0;border:0;border-bottom:2px solid var(--bh-black);background:none;cursor:pointer;font-family:inherit;text-align:left;color:var(--bh-ink)}
.ap-sec-h .car{width:0;height:0;border-left:5px solid var(--bh-ink);border-top:5px solid transparent;border-bottom:5px solid transparent;transition:transform .15s}
.ap-sec-h[aria-expanded="true"] .car{transform:rotate(90deg)}
.ap-sec-h .t{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.ap-sec-h .c{font-size:13px;font-weight:700}
.ap-sec-h .o{font-size:12px;color:var(--bh-ink-muted)}
.ap-sec-h .sum{margin-left:auto;font-size:13px;font-weight:600}
.ap-empty{padding:14px 0;font-size:13px;color:var(--bh-ink-muted);border-bottom:1px solid var(--bh-hairline)}

/* rows */
.ap-row{display:grid;grid-template-columns:36px minmax(170px,1.5fr) minmax(130px,1.1fr) 110px 56px minmax(150px,1.2fr) 34px;align-items:center;gap:14px;padding:11px 8px;border-bottom:1px solid var(--bh-hairline);cursor:pointer;font-size:13px}
.ap-row:hover{background:#faf8f4}
.ap-row.is-sel{background:var(--bh-cream)}
.ap-row:focus-visible{outline-offset:-2px}
.ap-dot{width:8px;height:8px;border-radius:50%;background:var(--bh-black)}
.selc{display:flex;align-items:center;gap:8px}
.bsel{width:16px;height:16px;margin:0;accent-color:var(--bh-black);cursor:pointer}
.bulk{position:sticky;bottom:12px;z-index:15;display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-top:16px;padding:12px 16px;background:var(--bh-black);color:#fff;font-size:13px}
.bulk select{min-height:38px;font-size:13px;min-width:220px}
.bulk .bh-btn{background:#fff;color:var(--bh-black)!important;min-height:38px}
.bulk .bh-btn:hover{background:var(--bh-cream)}
.bulk .bh-btn-outline{background:transparent;color:#fff!important;border-color:#fff;min-height:38px}
.bulk .held{flex-basis:100%;font-size:12px;color:var(--bh-light-gray)}
.ap-v{min-width:0}
.ap-v b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ap-v span,.ap-j span{display:block;font-size:12px;color:var(--bh-ink-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ap-j{min-width:0}
.ap-j b{font-weight:600}
.ap-amt{text-align:right;font-weight:600}
.ap-age{text-align:right;color:var(--bh-ink-muted)}
.ap-age.old{color:var(--bh-warn-ink);font-weight:600}
.ap-nx{min-width:0;font-size:12px;color:var(--bh-ink-muted)}
.ap-nx .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:3px}
.ap-nx .upd{color:var(--bh-ink);font-weight:600}
.ap-av{width:30px;height:30px;background:var(--bh-slate);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700}
.ap-av.none{background:#fff;border:1px dashed var(--bh-slate);color:var(--bh-ink-muted)}
.bh-chip.sm{font-size:10px;padding:2px 6px}
.ap-nx .bh-chip{white-space:normal}

/* pane */
.pn-h{padding:18px 24px 14px;border-bottom:1px solid var(--bh-hairline)}
.pn-top{display:flex;align-items:flex-start;gap:12px}
.pn-top h2{font-size:18px;font-weight:700;margin:0;line-height:1.25}
.pn-top .x{margin-left:auto;width:34px;height:34px;border:1px solid var(--bh-hairline);background:#fff;cursor:pointer;font-size:16px;line-height:1;color:var(--bh-ink)}
.pn-sub{font-size:13px;color:var(--bh-ink-muted);margin-top:3px}
.pn-amt{display:flex;align-items:baseline;gap:12px;margin-top:12px}
.pn-amt b{font-size:26px;font-weight:700}
.pn-act{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;position:relative}
.pn-act .bh-btn,.pn-act .bh-btn-outline{min-height:38px}
.pn-menu{position:absolute;top:42px;left:0;z-index:5;background:#fff;border:1px solid var(--bh-slate);min-width:240px}
.pn-menu button{display:block;width:100%;text-align:left;padding:11px 14px;border:0;border-bottom:1px solid var(--bh-hairline);background:#fff;font:500 13px var(--bh-font);cursor:pointer;color:var(--bh-ink)}
.pn-menu button:hover{background:var(--bh-cream)}
.pn-tabs{display:flex;border-bottom:1px solid var(--bh-hairline);padding:0 24px}
.pn-tabs button{border:0;background:none;padding:12px 0;margin-right:22px;font:600 12px var(--bh-font);letter-spacing:.06em;text-transform:uppercase;color:var(--bh-ink-muted);cursor:pointer;border-bottom:3px solid transparent}
.pn-tabs button[aria-selected="true"]{color:var(--bh-ink);border-bottom-color:var(--bh-black)}
.pn-b{padding:18px 24px 40px}
.pn-b h3{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin:22px 0 8px}
.pn-b h3:first-child{margin-top:0}
.mt{width:100%;border-collapse:collapse;font-size:13px}
.mt th{font-size:10.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--bh-ink-muted);text-align:right;padding:6px 8px;border-bottom:1px solid var(--bh-slate)}
.mt th:first-child,.mt td:first-child{text-align:left;padding-left:0}
.mt td{padding:8px;text-align:right;border-bottom:1px solid var(--bh-hairline)}
.mt tr.flag td{background:#fff7f8}
.mt td{font-size:12px}
.mt td:not(:first-child),.mt th{white-space:nowrap}
.mt td:first-child{min-width:120px}
.ckd{margin:18px 0 0;border:1px solid var(--bh-hairline)}
.ckd summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;padding:10px 12px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.ckd summary::-webkit-details-marker{display:none}
.ckd summary::after{content:'▾';margin-left:8px;color:var(--bh-ink-muted)}
.ckd[open] summary::after{content:'▴'}
.ckd summary .bh-chip{margin-left:auto;text-transform:none;letter-spacing:0}
.ckd>.ckr,.ckd>.note{margin-left:12px;margin-right:12px}
.ckd>.note{margin-bottom:10px}
.ckro{justify-content:space-between;align-items:center}
.ckr{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--bh-hairline);font-size:13px}
.ck{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--bh-hairline);font-size:13px}
.ck input{width:16px;height:16px;margin-top:1px;accent-color:var(--bh-black)}
.flags{border-left:3px solid var(--bh-bad-ink);background:#fff7f8;padding:10px 14px;font-size:13px;margin-bottom:6px}
.flags b{display:block;margin-bottom:4px}
.tl{list-style:none;margin:0;padding:0}
.tl li{display:grid;grid-template-columns:12px 1fr;gap:12px;padding:10px 0;border-bottom:1px solid var(--bh-hairline);font-size:13px}
.tl li::before{content:"";width:8px;height:8px;margin-top:5px;background:var(--bh-slate)}
.tl li.ext::before{background:#fff;border:2px solid var(--bh-black);box-sizing:border-box}
.tl .w{font-size:12px;color:var(--bh-ink-muted);margin-bottom:2px}
.tl .q{background:var(--bh-surface-muted);padding:8px 10px;margin-top:6px;white-space:pre-wrap}
.tl a{font-size:12px;font-weight:600}
.cmp{display:flex;gap:8px;margin-top:14px}
.cmp textarea,.cf textarea{flex:1;min-height:64px;border:1px solid var(--bh-slate);padding:10px;font:13px var(--bh-font);resize:vertical;border-radius:0;box-sizing:border-box;width:100%}
.dl{display:grid;grid-template-columns:140px 1fr;font-size:13px}
.dl div{padding:9px 0;border-bottom:1px solid var(--bh-hairline)}
.dl div:nth-child(odd){color:var(--bh-ink-muted)}
.cf{border:1px solid var(--bh-slate);padding:16px;margin:14px 0}
.cf .em{font-size:12px;background:var(--bh-surface-muted);padding:10px 12px;margin:10px 0;line-height:1.5}
.cf .em b{font-weight:600}
.note{font-size:12px;color:var(--bh-ink-muted);margin-top:8px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--bh-black);color:#fff;padding:12px 18px;font-size:13px;z-index:50}
.kbd{font-size:11px;color:var(--bh-ink-muted)}
.kbd kbd{border:1px solid var(--bh-hairline);padding:1px 5px;font:600 11px var(--bh-font);background:#fff}

/* expected billings view */
.ap-view{display:inline-flex}
.ap-view .ap-tog+.ap-tog{border-left:0}
.xp-top{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-top:20px}
.xp-top select{min-height:38px;font-size:13px}
.xp-k{margin-top:14px}
.xp-f{display:flex;flex-wrap:wrap;gap:0;margin-top:16px}
.xp-f .ap-tog+.ap-tog{border-left:0}
.xp-row{display:grid;grid-template-columns:minmax(180px,1.6fr) 120px 150px 120px minmax(170px,1.2fr) minmax(150px,1fr);align-items:center;gap:14px;padding:10px 8px;border-bottom:1px solid var(--bh-hairline);font-size:13px}
.xp-row.hd{font-size:10.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--bh-ink-muted);border-bottom:1px solid var(--bh-slate);padding-top:16px}
.xp-row .r{text-align:right}
.xp-row .s{display:block;font-size:12px;color:var(--bh-ink-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xp-row .v b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xp-row.done{color:var(--bh-ink-muted)}
.xp-link{border:0;background:none;padding:0;font:600 13px var(--bh-font);color:var(--bh-ink);text-decoration:underline;cursor:pointer}
.xp-ed{display:flex;gap:6px;align-items:center}
.xp-ed input{width:120px;min-height:32px;border:1px solid var(--bh-slate);padding:0 8px;font:13px var(--bh-font);text-align:right;border-radius:0}
.xp-ed .bh-btn,.xp-ed .bh-btn-outline{min-height:32px;padding:0 10px;font-size:11px}
.xp-mini{border:0;background:none;padding:0;margin-left:6px;font:600 11px var(--bh-font);color:var(--bh-ink-muted);text-decoration:underline;cursor:pointer}
body.v-exp #tMine,body.v-exp #tChg{display:none}
.mt.ac .ky{display:block;font-size:10px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--bh-ink-muted)}
.fg{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px 14px;margin-top:8px}
.fg label{display:flex;flex-direction:column;gap:4px}
.fg .bh-input{min-height:36px;font-size:13px;width:100%;box-sizing:border-box}
.ac-per{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 10px;font-size:14px}
.ac-per input{min-height:30px;border:1px solid var(--bh-slate);padding:0 6px;font:13px var(--bh-font)}
.mt.ac td:first-child{min-width:230px;white-space:normal}
.mt.ac .ag{display:inline-block;min-width:16px;font-weight:700;color:var(--bh-ink-muted)}
.mt.ac .ce,.mt.ac .nt{display:block;font-size:11px;color:var(--bh-ink-muted);margin-left:16px}
.mt.ac .nt{color:var(--bh-ink)}
.mt.ac .ck2{display:block;margin-top:3px}
.mt.ac .ck2:empty{display:none}
.ac-links{margin-left:auto;display:flex;gap:12px;font-size:12px;font-weight:600}
.ac-notes{font-size:12px;line-height:1.55;background:var(--bh-surface-muted);padding:8px 10px;margin-top:8px}
.sm-box{border:1px solid var(--bh-hairline);border-left:4px solid var(--bh-black);padding:12px 14px;margin:0 0 14px;background:#fff}
.sm-box.ok{border-left-color:var(--bh-ok-ink,#1e6b34)}.sm-box.warn{border-left-color:var(--bh-warn-ink)}.sm-box.bad{border-left-color:var(--bh-bad-ink)}
.sm-h{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:14px}
.sm-box ul{margin:8px 0 0;padding-left:18px;font-size:13px;line-height:1.5}
.sm-box li{margin:3px 0}
.pc-more,.led{margin-top:6px}
.pc-more>summary,.led>summary{cursor:pointer;font-size:12px;font-weight:600;color:var(--bh-ink-muted);padding:6px 0}
.ik{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:16px 0 4px}
.ik .bh-label{margin-right:4px}
.xp-jobs{position:relative}
.xp-jobs>summary{list-style:none;display:inline-flex;align-items:center;gap:8px;min-height:38px;padding:0 12px;border:1px solid var(--bh-slate);background:#fff;font:600 12px/1 var(--bh-font);letter-spacing:.04em;text-transform:uppercase;cursor:pointer}
.xp-jobs>summary::-webkit-details-marker{display:none}
.xp-jobs>summary::after{content:'▾';color:var(--bh-ink-muted)}
.xp-jp{position:absolute;z-index:30;top:42px;left:0;width:min(420px,calc(100vw - 40px));max-height:420px;overflow:auto;background:#fff;border:1px solid var(--bh-slate);padding:10px 12px}
.xp-jp .bh-input{width:100%;min-height:34px;font-size:13px;box-sizing:border-box}
.xp-jp label{display:flex;gap:8px;align-items:flex-start;padding:7px 0;border-bottom:1px solid var(--bh-hairline);font-size:13px;cursor:pointer}
.xp-jp label input{margin-top:2px;accent-color:var(--bh-black)}
.xp-jp label span{color:var(--bh-ink-muted);font-size:12px;margin-left:auto;white-space:nowrap}
.xp-jp .act{display:flex;gap:12px;margin:8px 0 4px}
.xp-row:not(.hd){cursor:pointer}
.xp-row.op{background:var(--bh-cream)}
.xp-g{padding:10px 8px 16px 28px;border-bottom:1px solid var(--bh-hairline);background:#fbfaf7;overflow-x:auto}
@media (max-width:960px){.xp-g{padding-left:8px}.xp-g .mt td:first-child{min-width:150px}}
.xp-g .mt{max-width:760px}
.xp-g .mt td:first-child{min-width:230px}
.xp-g .xp-ed input{width:130px}
@media (max-width:960px){
  .xp-row{grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-areas:"v st" "b c" "l x";row-gap:6px}
  .xp-row>*{min-width:0}.xp-row .bh-chip{white-space:normal}
  .xp-ed input{width:100%;min-width:0}.xp-ed{flex-wrap:wrap}
  .xp-k{flex-wrap:wrap}
  .xp-row.hd{display:none}
  .xp-row>:nth-child(1){grid-area:v}.xp-row>:nth-child(2){display:none}.xp-row>:nth-child(3){grid-area:b;text-align:left}
  .xp-row>:nth-child(4){grid-area:l;text-align:left}.xp-row>:nth-child(5){grid-area:c}.xp-row>:nth-child(6){grid-area:st;text-align:right}
}

@media (max-width:1200px){
}
.ap-scrim{display:none}
@media (max-width:700px){.ap-pane{width:100vw}}
@media (max-width:960px){
  .ap-bar,.ap-list{padding-left:20px;padding-right:20px}
  .ap-bar .bh-input{width:100%}
  .ap-row{grid-template-columns:10px 1fr 90px;grid-template-areas:"d v a" "d j n";row-gap:4px}
  .ap-row .ap-dot,.ap-row .dsp{grid-area:d}
  .ap-row .ap-v{grid-area:v}.ap-row .ap-amt{grid-area:a}.ap-row .ap-j{grid-area:j}.ap-row .ap-nx{grid-area:n;text-align:right}
  .ap-row .ap-age,.ap-row .ap-av{display:none}
  .ap-nx .chips{justify-content:flex-end}
  .ap-nx .bh-chip{white-space:normal;text-align:left}
  .ap-row{grid-template-columns:18px minmax(0,1fr) minmax(90px,45%)}
  .ap-row .selc{grid-area:d}
  .ap-as,.ap-as select{max-width:100%}
}
</style>
<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@3/lib/msal-browser.min.js"></script>
</head>
<body class="bh-page no-pane">

<header class="bh-header">

<script>
/* =============================================================================
   AP Desk v2 (Oct 2026) - triage layout on the live AP Pay Applications list.
   Data layer ported from Invoice Desk demo/live-build/connector.js: same app
   registration, same list, same column names, same write-back (re-read, If-Match).
   Nothing here writes to ComputerEase and nothing sends mail.
============================================================================= */
const CLIENT_ID = '1825a1c0-1ce3-4078-aeb7-a4714562c422';
const TENANT_ID = '848aa890-7982-4028-befa-3323d82583ce';
const SCOPES    = ['User.Read','GroupMember.Read.All','Sites.Selected'];
const SP_HOST   = 'baileyharris.sharepoint.com';
const SP_DATA   = '/sites/Dashboard', DATA_LIB = 'APData';
const SP_QUEUE  = '/sites/APDesk',   QUEUE_LIST = 'AP Pay Applications';
const QUEUE_DOCS = 'https://' + SP_HOST + SP_QUEUE + '/Shared Documents/';
const GRAPH = 'https://graph.microsoft.com/v1.0';
const ACCOUNTING_DEPARTMENTS = ['Accounting - Executives','Accounting - Personnel','Executive','Directors'];
const ACCOUNTING_PEOPLE = ['tiffany.blackmon@baileyharris.com','hdatb@baileyharris.com'];
/* Department heads who approve overhead invoices. Only IT is known so far. */
const DEPTS = [['tiffany.blackmon@baileyharris.com', 'IT', 'Tiffany Blackmon']];
const ACCT = 'acct';
/* Drafts in payables@ (Oct 2026). The desk creates the email as a reply in the shared
   mailbox's Drafts, acting as the signed-in person (delegated Mail.ReadWrite.Shared: it
   reaches only mailboxes that person can already open). Drew sends it from Outlook; the
   desk finds it in Sent Items by its [AP-####] tag and marks it sent. Without the
   permission it falls back to copying the text. */
const PAYABLES = 'payables@baileyharris.com';
const MAIL_SCOPES = ['Mail.ReadWrite.Shared'], SEND_SCOPES = ['Mail.Send.Shared'];
const MAIL = { ok: null, why: '' };

/* ---- sections: list Status values -> where the item sits ------------------- */
const SECTIONS = [
  {k:'triage', t:'Triage',          o:'Accounting · verify and route',              st:['received','AP verified','not a pay app']},
  {k:'pm',     t:'With approver',   o:'PM or department head · review and approve', st:['with PM']},
  {k:'corr',   t:'Corrections',     o:'Waiting on the trade partner or a fix',      st:['revise and resubmit','PM returned']},
  {k:'ready',  t:'Ready for entry', o:'Accounting · enter in CE',                   st:['ready for entry','PM approved','approved as noted']},
  {k:'done',   t:'Entered',         o:'Last 30 days',                               st:['approved and entered'], closed:true},
];
const HIDDEN = ['duplicate archived','email only','handled outside desk'];

/* ---- state ------------------------------------------------------------------ */
const LIVE = { byKey:{}, me:null, commitments:[], cMeta:null, expected:null, ceInv:null, queue:null, byNum:{}, billing:{}, pmName:{}, jobs:{} };
let INV = [], PEOPLE = {}, JOBS = {};
let LASTB=null, WHO=ACCT, MINE=false, CHG=false, Q='', SEL=null, TAB='review', OPEN={done:false}, MENU=false, CF=false, RF=false, ED=false, BUSY=false;
const BULK = new Set();
/* Expected billings (21 Oct 2026). Every Approved + executed Procore commitment, one row
   each, for the pay-app period chosen. Pay apps are due on the commitment's billing day
   (Procore "billing_day"; the 20th on almost every contract, and the default). The period
   due on day D of month M collects pay apps whose period-ending date (or, when none was
   read, the date received) falls after D of the month before and on or before D of M. */
let VIEW = 'queue', XF = 'all', XPER = '', XED = '', ALLH = [];
/* Expected billings: which jobs (null = all; remembered in this browser) and which rows
   are expanded to their Attachment G lines. */
let XJOBS = (() => { try { const v = JSON.parse(localStorage.getItem('apxjobs') || 'null'); return Array.isArray(v) ? new Set(v) : null; } catch(_) { return null; } })();
let XJOPEN = false, XJQ = '';
const XOPEN = new Set();
const DEF_DAY = 20, FULL_TOL = 10;
const $ = s => document.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money = n => n==null||isNaN(n) ? '—' : '$'+Number(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const money0 = n => '$'+Math.round(n).toLocaleString('en-US');
const lc = v => String(v||'').trim().toLowerCase();
const num = v => (v===null||v===undefined||v==='') ? null : Number(v);
const parseJ = (s, d) => { try { const v = JSON.parse(s||''); return v==null ? d : v; } catch(_) { return d; } };
const fmtTime = iso => iso ? new Date(iso).toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}) : '';
const initials = n => String(n||'?').replace(/@.*/,'').split(/[\s.]+/).filter(Boolean).slice(0,2).map(w=>w[0].toUpperCase()).join('') || '?';
const dif = (a,b) => a!=null && b!=null && Math.abs(a-b) > 0.5;
const store = { get(k){ try { return localStorage.getItem(k); } catch(_) { return null; } }, set(k,v){ try { localStorage.setItem(k,v); } catch(_) {} } };

/* ---- sign-in and Graph ------------------------------------------------------ */
const msalApp = new msal.PublicClientApplication({
  auth: { clientId: CLIENT_ID, authority: 'https://login.microsoftonline.com/' + TENANT_ID, redirectUri: location.origin + '/ap/' },
  cache: { cacheLocation: 'sessionStorage' } });
async function token(){
  await msalApp.initialize();
  const redir = await msalApp.handleRedirectPromise();
  const account = (redir && redir.account) || msalApp.getAllAccounts()[0];
  if (!account) { await msalApp.loginRedirect({ scopes: SCOPES }); return null; }
  msalApp.setActiveAccount(account);
  try { return (await msalApp.acquireTokenSilent({ scopes: SCOPES, account })).accessToken; }
  catch (e) { await msalApp.acquireTokenRedirect({ scopes: SCOPES }); return null; }
}
async function g(tok, path, opts){
  const r = await fetch(path.startsWith('http') ? path : GRAPH + path, Object.assign({ headers: { Authorization: 'Bearer ' + tok } }, opts || {}));
  let body = null; try { body = await r.json(); } catch(_) {}
  return { ok: r.ok, status: r.status, body };
}

/* ---- load ------------------------------------------------------------------- */
async function loadLive(){
  const tok = await token(); if (!tok) return false;
  const me = (await g(tok, '/me?$select=displayName,mail,userPrincipalName,department')).body || {};
  const email = lc(me.mail || me.userPrincipalName);
  LIVE.me = { name: me.displayName || email, email, dept: me.department || '',
    isAccounting: ACCOUNTING_PEOPLE.includes(email) || ACCOUNTING_DEPARTMENTS.map(lc).includes(lc(me.department)) };
  const site = await g(tok, '/sites/' + SP_HOST + ':' + SP_DATA);
  if (!site.ok) throw new Error('Could not reach ' + SP_DATA + ' (HTTP ' + site.status + ').');
  const drives = await g(tok, '/sites/' + site.body.id + '/drives?$select=id,name');
  const drive = ((drives.body && drives.body.value) || []).find(d => d.name === DATA_LIB);
  if (!drive) throw new Error('No ' + DATA_LIB + ' library on ' + SP_DATA + '.');
  const file = async name => { const r = await g(tok, '/drives/' + drive.id + '/root:/' + encodeURI(name) + ':/content'); return r.ok ? r.body : null; };
  const cm = await file('ap_commitments.json');
  if (!cm) throw new Error('ap_commitments.json could not be read from ' + DATA_LIB + '.');
  LIVE.cMeta = cm; LIVE.commitments = cm.commitments || [];
  LIVE.expected = await file('ap_payapp_expected.json');
  LIVE.ceInv = await file('ap_ce_invoices.json');
  LIVE.byNum = {}; LIVE.byKey = {}; LIVE.pmName = {}; LIVE.jobs = {};
  for (const c of LIVE.commitments) {
    LIVE.byNum[String(c.number||'').trim().toUpperCase()] = c;
    LIVE.byKey[subKey(c.number)] = c;
    (c.pm_team||[]).forEach((e,k) => { if ((c.pm_team_names||[])[k]) LIVE.pmName[lc(e)] = c.pm_team_names[k]; });
    const pn = String(c.project_number||'').trim();
    if (pn && !LIVE.jobs[pn]) LIVE.jobs[pn] = { n: c.project || pn, team: (c.pm_team||[]).map(lc) };
  }
  LIVE.billing = {};
  for (const b of ((LIVE.expected && LIVE.expected.rows) || [])) LIVE.billing[String(b.commitment||'').trim().toUpperCase()] = b;
  LIVE.queue = await loadQueue(tok);
  return true;
}
async function loadQueue(tok){
  const site = await g(tok, '/sites/' + SP_HOST + ':' + SP_QUEUE);
  if (!site.ok) return { items: [], err: 'Could not reach ' + SP_QUEUE + ' (HTTP ' + site.status + ')' };
  const lr = await g(tok, '/sites/' + site.body.id + '/lists/' + encodeURIComponent(QUEUE_LIST) + '?$select=id');
  if (!lr.ok) return { items: [], err: 'No "' + QUEUE_LIST + '" list (HTTP ' + lr.status + ')' };
  const items = [];
  let url = '/sites/' + site.body.id + '/lists/' + lr.body.id + '/items?$expand=fields&$top=200';
  for (let p = 0; url && p < 40; p++) {
    const r = await g(tok, url);
    if (!r.ok) return { items, err: 'List items HTTP ' + r.status };
    for (const it of r.body.value || []) items.push({ id: it.id, f: it.fields || {} });
    url = r.body['@odata.nextLink'] || null;
  }
  return { items, siteId: site.body.id, listId: lr.body.id, err: null };
}

/* ---- the CE ledger: previous CERTIFIED (Invoiced -> Payable), full history only */
const ledgerFull = () => !!(LIVE.ceInv && LIVE.ceInv.subcontracts && LIVE.ceInv.has_payment_data !== false && !(LIVE.ceInv.filters && LIVE.ceInv.filters.since));
const digits = v => String(v==null?'':v).replace(/[^0-9]/g,'');
/* " · CE ledger as of Oct 21" - so a stale ledger is visible on the line that uses it */
function ledgerAsOf(){
  const d = LIVE.ceInv && (LIVE.ceInv.as_of || String(LIVE.ceInv.generated_at || '').slice(0, 10));
  if (!d) return '';
  const days = Math.floor((Date.now() - Date.parse(d + 'T12:00:00Z')) / 864e5);
  return ' · CE ledger as of ' + new Date(d + 'T12:00:00Z').toLocaleDateString('en-US', { month:'short', day:'numeric', timeZone:'UTC' }) + (days > 2 ? ' (' + days + ' days old)' : '');
}
function ledgerFor(sub, payReq){
  if (!ledgerFull()) return { available:false };
  const led = LIVE.ceInv.subcontracts[String(sub||'').trim().toUpperCase()];
  const inv = (led && led.invoices) || [];
  const want = digits(payReq);
  const thisApp = want ? inv.filter(x => digits(x.number) === want) : [];
  const prior = inv.filter(x => !thisApp.includes(x));
  const n = v => Number(v||0);
  /* A credit line (negative payable, e.g. 40925AU010 PR10 -4,534.40) is never "paid", so the
     retention-release top-up must not apply to it - it read the credit as +4,534.40. */
  const cert = x => n(x.payable) < 0 ? n(x.payable) : n(x.payable) + Math.max(0, n(x.paid) - n(x.payable));
  return { available:true, exists:!!led, led, prior: Math.round(prior.reduce((t,x)=>t+cert(x),0)*100)/100,
           rows: prior.map(x => ({ inv: x.raw_reference || x.number, per: x.date ? new Date(x.date+'T12:00:00Z').toLocaleDateString('en-US',{month:'short',year:'numeric',timeZone:'UTC'}) : '', pay: cert(x) })),
           thisApp };
}

/* ---- list row -> desk item ---------------------------------------------------- */
/* Contract as of a date (21 Oct 2026). A pay app for September should be checked against the
   contract as it stood at the end of September: a CO approved in October belongs on the October
   app, not the September one, or every older unpaid app reads "off" by that CO. Needs
   ap_commitments_pull.js to have recorded approved_date on each change order (key that answered
   in approved_basis). Undated approved COs are counted in, and said so. Returns null when the
   change orders were not pulled. */
function coAsOf(c, asOf){
  if (!c || !Array.isArray(c.change_orders) || !asOf) return null;
  const rev = num(c.revised_contract), orig = num(c.contract_value);

  } else {
    d = await g(tok, '/users/' + PAYABLES + '/messages', { method:'POST', headers:{ Authorization:'Bearer ' + tok, 'Content-Type':'application/json' }, body: JSON.stringify({ subject: m.subject, body: { contentType:'HTML', content: mailHtml(m.body) } }) });

  const u = await g(tok, '/users/' + PAYABLES + '/messages/' + d.body.id, { method:'PATCH', headers:{ Authorization:'Bearer ' + tok, 'Content-Type':'application/json' }, body: JSON.stringify(patch) });

}

/* Send from the desk (delegated Mail.Send.Shared: the signed-in person must have Send As
   on payables@). The email is made as a draft first, then sent, so it threads as a reply. */
async function sendDraft(id){
  const account = msalApp.getActiveAccount() || msalApp.getAllAccounts()[0]; if (!account) return false;
  let tok; try { tok = (await msalApp.acquireTokenSilent({ scopes: SEND_SCOPES, account })).accessToken; MAIL.send = true; } catch (e) { MAIL.send = false; return false; }
  const r = await fetch(GRAPH + '/users/' + PAYABLES + '/messages/' + encodeURIComponent(id) + '/send', { method:'POST', headers:{ Authorization:'Bearer ' + tok } });
  if (!r.ok) { toast('Not sent (HTTP ' + r.status + ')' + (r.status === 403 ? ' — you need Send As on payables@.' : '.')); return false; }
  return true;
}
/* One way out for every email: 'send' sends it now from payables@; 'outlook' leaves it
   in payables@ Drafts and opens it, for when an attachment is needed. `win` is a tab
   opened on the click itself, so the browser does not block it. */
async function deliver(i, m, replyTo, mode, note, win){
  const d = await makeDraft(i, m, replyTo);
  if (!d) {
    if (win) win.close();
    await saveRow(i, {}, Object.assign({ mail:'pending', note: note + ' — not created; send it from payables@ by hand.' }, mailFields(m)));
    toast(MAIL.ok === false ? 'The mail permission is missing — copy the email text (More) and send it from payables@' : 'The email could not be created in payables@');
    return false;
  }
  if (mode === 'send') {
    if (await sendDraft(d.id)) {
      await saveRow(i, {}, Object.assign({ mail:'sent', note: note + ' — sent from payables@ by ' + LIVE.me.name + '.' }, mailFields(m)));
      toast('Sent from payables@'); return true;
    }
    if (MAIL.send === false) toast('Sending needs the Mail.Send.Shared permission — the email is in Outlook instead');
    mode = 'outlook';
  }
  await saveRow(i, {}, Object.assign({ mail:'draft', draftId: d.id, draftLink: d.link, note: note + ' — in payables@ Drafts to finish in Outlook.' }, mailFields(m)));
  if (d.link) { if (win && !win.closed) win.location.href = d.link; else window.open(d.link, '_blank'); } else if (win) win.close();
  if (mode === 'outlook') toast('Opened in Outlook — add attachments and send; the desk marks it sent');
  return true;
}

/* ---- write-back: re-read, merge the log, PATCH with If-Match ------------------ */
async function saveRow(i, fields, logEntry, comment){
  const q = LIVE.queue;
  if (!q || !q.siteId) { toast('The queue list is not loaded.'); return false; }
  const tok = await token(); if (!tok) return false;
  const base = '/sites/' + q.siteId + '/lists/' + q.listId + '/items/' + encodeURIComponent(i.itemId);
  const cur = await g(tok, base + '?$expand=fields');
  if (!cur.ok) { toast('Could not re-read this row (HTTP ' + cur.status + ').'); return false; }
  const f = cur.body.fields || {};
  if (fields.Status && f.Status !== i.raw) { toast('Someone else moved this item. Refreshing.'); await reloadLive(); return false; }
  const now = new Date().toISOString(), who = LIVE.me.name;
  const body = Object.assign({}, fields);
  if (logEntry) {
    const log = parseJ(f.StatusLog, []);
    if (!log.length && f.ReceivedAt) log.push({ s: f.Status || 'received', at: f.ReceivedAt });
    log.push(Object.assign({ at: now, by: who }, logEntry));
    body.StatusLog = JSON.stringify(log.slice(-60));
    if (fields.Status) body.StatusChangedAt = now;
  }
  if (comment) {
    const cm = parseJ(f.Comments, []);
    cm.push(Object.assign({ id: now + '-' + Math.random().toString(36).slice(2,7), who, email: LIVE.me.email, at: now }, comment));
    body.Comments = JSON.stringify(cm);
  }
  const r = await fetch(GRAPH + base + '/fields', { method: 'PATCH',
    headers: { Authorization: 'Bearer ' + tok, 'Content-Type': 'application/json', 'If-Match': cur.body['@odata.etag'] || '*' }, body: JSON.stringify(body) });
  if (r.status === 412) { toast('Someone else changed this row. Refreshing.'); await reloadLive(); return false; }
  if (!r.ok) { let why = 'HTTP ' + r.status; try { why += ' ' + ((await r.json()).error.message || ''); } catch(_) {}
    if (r.status === 403) why += ' (you need Contribute on the AP Desk site)'; toast('Not saved: ' + why); return false; }
  const got = await r.json();
  const dropped = Object.keys(body).filter(k => k !== 'StatusLog' && k !== 'Comments' && String(got[k] ?? '').slice(0,10) !== String(body[k] ?? '').slice(0,10));
  if (dropped.length) toast('SharePoint stored nothing for ' + dropped.join(', ') + ' — run Sync-PayAppListSchema-6.ps1.');
  const row = q.items.find(x => x.id === i.itemId); if (row) row.f = got;
  store.set('apseen:' + i.id, got.StatusChangedAt || '');
  return !dropped.length;
}

function header(){
  const me = LIVE.me;
  $('#me').textContent = initials(me.name); $('#me').title = me.name + (me.isAccounting ? ' · Accounting' : '');
  $('#asof').textContent = LIVE.cMeta && LIVE.cMeta.generated_at ? fmtTime(LIVE.cMeta.generated_at) : '—';
  const rows = (LIVE.queue && LIVE.queue.items) || [];
  const newest = rows.map(r => r.f.ReceivedAt).filter(Boolean).sort().pop();
  const today = new Date().toISOString().slice(0,10), nNew = rows.filter(r => String(r.f.ReceivedAt||'').slice(0,10) === today).length;
  $('#pull').innerHTML = 'Newest from payables@ <b>' + esc(newest ? fmtTime(newest) : '—') + '</b>' + (nNew ? ' · ' + nNew + ' today' : '');
  const opts = me.isAccounting
    ? '<option value="' + ACCT + '">' + esc(me.name) + ' — Accounting</option>' + Object.keys(PEOPLE).filter(k => k !== ACCT && k !== me.email).sort((a,b) => P(a).n.localeCompare(P(b).n)).map(k => '<option value="' + esc(k) + '">' + esc(P(k).n) + (P(k).dept ? ' — ' + esc(P(k).dept) + ' department head' : ' — view only') + '</option>').join('')
      + '<option value="' + esc(me.email) + '">' + esc(me.name) + ' — as approver</option>'
    : '<option value="' + esc(me.email) + '">' + esc(me.name) + '</option>';
  $('#who').innerHTML = opts; $('#who').value = WHO;
}

/* ---- events --------------------------------------------------------------------------- */
document.addEventListener('click', e => {
  const s = e.target.closest('[data-sec]'); if (s) { const k = s.dataset.sec; OPEN[k] = s.getAttribute('aria-expanded') !== 'true'; draw(); return; }
  const cb = e.target.closest('.bsel'); if (cb) { const id = cb.dataset.bid;
    if (e.shiftKey && LASTB) { const ids = [...document.querySelectorAll('.bsel')].map(x => x.dataset.bid), a = ids.indexOf(LASTB), b = ids.indexOf(id); ids.slice(Math.min(a,b), Math.max(a,b) + 1).forEach(x => BULK.add(x)); }
    else if (cb.checked) BULK.add(id); else BULK.delete(id);
    LASTB = id; draw(); return; }
  const xf = e.target.closest('[data-xf]'); if (xf) { XF = xf.dataset.xf; draw(); return; }
  const xo = e.target.closest('[data-open]'); if (xo) { openPane(xo.dataset.open); return; }
  const xe = e.target.closest('[data-ctde]'); if (xe) { XED = xe.dataset.ctde; draw(); if (SEL) pane(); const f = document.getElementById('ctd-' + XED); if (f) f.focus(); return; }
  if (e.target.closest('[data-ctdx]')) { XED = ''; draw(); if (SEL) pane(); return; }
  const xs = e.target.closest('[data-ctd]'); if (xs) { saveCtd(xs.dataset.ctd); return; }
  const xj = e.target.closest('[data-xj]'); if (xj) { XJOBS = xj.dataset.xj === 'all' ? null : new Set(); saveXJ(); draw(); return; }
  if (e.target.closest('#xJobsS')) { e.preventDefault(); XJOPEN = !XJOPEN; draw(); if (XJOPEN) { const q = $('#xJq'); if (q) q.focus(); } return; }
  if (XJOPEN && !e.target.closest('.xp-jobs')) { XJOPEN = false; draw(); }
  const wi = e.target.closest('[data-wi]'); if (wi) { whatIf(wi.dataset.wi); return; }
  const wx = e.target.closest('[data-wix]'); if (wx) { store.set('apwhatif:' + (XPER || curPeriod()) + ':' + wx.dataset.wix, ''); draw(); return; }
  const xr = e.target.closest('.xp-row:not(.hd)'); if (xr && !e.target.closest('input,button,a,label')) { const k = xr.dataset.xk; if (XOPEN.has(k)) XOPEN.delete(k); else XOPEN.add(k); draw(); return; }
  const r = e.target.closest('.ap-row'); if (r) { openPane(r.dataset.id); return; }
  const t = e.target.closest('[data-tab]'); if (t) { TAB = t.dataset.tab; pane(); return; }
  const d = e.target.closest('[data-do]'); if (d) { e.preventDefault(); act(d.dataset.do); return; }
  if (MENU && !e.target.closest('.pn-menu')) { MENU = false; pane(); }
});
document.addEventListener('input', e => {
  if (e.target.id === 'eSub') { const c = rosterFor(e.target.value); const h = $('#eSubHint'); if (h) h.textContent = c ? c.vendor + ' · ' + c.project_number + ' ' + c.project : (e.target.value ? 'Not on the Procore roster' : ''); if (c) { const j = $('#eJob'); if (j) j.value = c.project_number; } }
});
document.addEventListener('input', e => { if (e.target.id === 'rejNote') { const i = INV.find(x => x.id === SEL); if (i) { i.rn = e.target.value; const pv = $('#rejPrev'); if (pv) pv.innerHTML = mailHTML(rejMail(i)); } } });
document.addEventListener('change', e => {
  const i = INV.find(x => x.id === SEL);
  if (e.target.dataset && e.target.dataset.rr !== undefined && i) { i.rr = [...document.querySelectorAll('[data-rr]:checked')].map(x => x.dataset.rr); const pv = $('#rejPrev'); if (pv) pv.innerHTML = mailHTML(rejMail(i)); }
  if (e.target.id === 'tAssign' && i) i.pick = e.target.value;
  const c = e.target.closest('[data-ck]'); if (c && i) i.checks[c.dataset.ck] = c.checked;
});
$('#q').addEventListener('input', e => { Q = e.target.value.trim().toLowerCase(); draw(); });
function setView(v){ VIEW = v; store.set('apview', v); $('#vQ').setAttribute('aria-pressed', v === 'queue'); $('#vE').setAttribute('aria-pressed', v === 'exp');
  $('#q').placeholder = v === 'exp' ? 'Search vendor, job, commitment #' : 'Search vendor, job, invoice #'; draw(); }
$('#vQ').addEventListener('click', () => setView('queue'));
$('#vE').addEventListener('click', () => setView('exp'));
document.addEventListener('change', e => { if (e.target.id === 'xPer') { XPER = e.target.value === curPeriod() ? '' : e.target.value; draw(); } });
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id && e.target.id.startsWith('wi-')) { const b = e.target.parentNode.querySelector('[data-wi]'); if (b) b.click(); return; }
  if (e.key === 'Enter' && e.target.id && e.target.id.startsWith('ctd-')) { const b = e.target.parentNode.querySelector('[data-ctd]'); if (b) b.click(); } });
function saveXJ(){ try { localStorage.setItem('apxjobs', XJOBS ? JSON.stringify([...XJOBS]) : 'null'); } catch(_) {} }
function whatIf(k){
  const inp = document.getElementById('wi-' + k), raw = String((inp && inp.value) || '').replace(/[$,\s]/g, '');
  if (raw === '') { store.set('apwhatif:' + (XPER || curPeriod()) + ':' + k, ''); draw(); return; }
  if (!/^\d+(\.\d{1,2})?$/.test(raw)) { toast('Enter the dollar amount, e.g. 125000.00'); return; }
  store.set('apwhatif:' + (XPER || curPeriod()) + ':' + k, raw); draw();
}
document.addEventListener('change', e => { const j = e.target.dataset && e.target.dataset.xjob; if (j === undefined) return;
  if (!XJOBS) XJOBS = new Set(); if (e.target.checked) XJOBS.add(j); else XJOBS.delete(j); if (!XJOBS.size) XJOBS = null; saveXJ(); XJOPEN = true; draw(); });
document.addEventListener('input', e => { if (e.target.id === 'xJq') { XJQ = e.target.value; const pos = e.target.selectionStart; draw(); const q = $('#xJq'); if (q) { q.focus(); q.setSelectionRange(pos, pos); } } });
function saveCtd(id){
  const i = ALLH.find(x => x.id === id); if (!i || !canKey(i.c)) return;
  const inp = document.getElementById('ctd-' + i.itemId), raw = String((inp && inp.value) || '').replace(/[$,\s]/g, '');
  if (!/^\d+(\.\d{1,2})?$/.test(raw)) { toast('Enter the dollar amount, e.g. 125000.00'); return; }
  const v = Number(raw), old = num(i.f.CompletedToDate), rev = i.c ? num(i.c.revised_contract) : null;
  if (rev && v > rev * 1.1 && !confirm('That is more than the revised contract (' + money(rev) + '). Save anyway?')) return;
  run(async () => { if (await saveRow(i, { CompletedToDate: v }, { ctd: true, note: 'Completed & stored to date ' + (old == null ? 'keyed' : 'changed from ' + money(old)) + ': ' + money(v) })) { XED = ''; toast('Completed & stored saved'); } });
}
$('#tMine').addEventListener('click', () => { MINE = !MINE; $('#tMine').setAttribute('aria-pressed', MINE); draw(); });
$('#tChg').addEventListener('click', () => { CHG = !CHG; $('#tChg').setAttribute('aria-pressed', CHG); draw(); });
$('#refresh').addEventListener('click', () => run(async () => { await loadLive(); rebuild(); header(); toast('Refreshed'); }));
$('#who').addEventListener('change', e => { WHO = e.target.value; MINE = false; BULK.clear(); $('#tMine').setAttribute('aria-pressed', false); MENU = false; CF = false; draw(); if (SEL) { if (INV.some(x => x.id === SEL && inScope(x))) pane(); else closePane(); } });
document.addEventListener('keydown', e => {
  if (['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)) { if (e.key === 'Escape') document.activeElement.blur(); return; }
  const rows = [...document.querySelectorAll('.ap-row')]; const ix = rows.findIndex(r => r.dataset.id === SEL);
  if (e.key === 'j' || e.key === 'ArrowDown') { const n = rows[Math.min(rows.length - 1, ix + 1)]; if (n) { openPane(n.dataset.id); const el = document.querySelector('.ap-row[data-id="' + n.dataset.id + '"]'); if (el) el.focus(); } e.preventDefault(); }
  else if (e.key === 'k' || e.key === 'ArrowUp') { const n = rows[Math.max(0, ix - 1)]; if (n) { openPane(n.dataset.id); const el = document.querySelector('.ap-row[data-id="' + n.dataset.id + '"]'); if (el) el.focus(); } e.preventDefault(); }
  else if (e.key === 'Enter') { const f = document.activeElement.closest && document.activeElement.closest('.ap-row'); if (f) openPane(f.dataset.id); }
  else if (e.key === 'Escape') closePane();
  else if (e.key === '/') { $('#q').focus(); e.preventDefault(); }
});

/* ---- boot ------------------------------------------------------------------------------- */
(async function boot(){
  $('#list').innerHTML = '<div class="ap-empty" style="margin-top:22px">Signing in and loading the AP Pay Applications list…</div>';
  try {
    if (!(await loadLive())) return;
    WHO = LIVE.me.isAccounting ? ACCT : LIVE.me.email;
    VIEW = store.get('apview') === 'exp' ? 'exp' : 'queue';
    rebuild(); header(); setView(VIEW);
    if (LIVE.me.isAccounting) { await mailToken(); draw(); checkSent().catch(() => {}); }
  } catch (e) {
    $('#list').innerHTML = '<div class="flags" style="margin-top:22px"><b>The AP Desk could not load</b>' + esc(e.message) + '</div>';
  }
})();

</script>
</body>
</html>
