<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="script-src 'self' 'unsafe-inline'; connect-src 'self' https://bh-compliance-sync.soft-math-3331.workers.dev https://graph.microsoft.com https://login.microsoftonline.com https://outlook.office.com https://*.sharepoint.com; default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self' https://login.microsoftonline.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; frame-src https://login.microsoftonline.com blob:;">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AP Desk</title>
<link rel="stylesheet" href="/bh-shell.css">
<style>
/* ---------- AP desk: list + pane (mockup) ---------- */
.ap-bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:14px 40px;border-bottom:1px solid var(--bh-hairline);background:#fff;position:sticky;top:0;z-index:20}
.ap-bar .bh-input{min-height:38px;width:260px;font-size:13px}
.ap-filt{position:relative;display:inline-flex}
.bh-chip.is-info{background:#e3ecf7;color:#1d4f91}
.ap-fo{display:flex;justify-content:space-between;gap:16px}
.ap-fo .c{color:var(--bh-ink-muted);font-weight:500;font-variant-numeric:tabular-nums}
.ap-kinds{display:flex;flex-wrap:wrap;gap:6px;padding:8px 8px 4px}
.ap-kind{border:1px solid var(--bh-slate);background:#fff;padding:5px 10px;font:600 11.5px var(--bh-font);letter-spacing:.03em;cursor:pointer;color:var(--bh-ink)}
.ap-kind[aria-pressed="true"]{background:var(--bh-black);color:#fff;border-color:var(--bh-black)}
.ap-kind .c{font-weight:500;margin-left:5px;opacity:.75}
.ap-fm{position:absolute;left:0;top:calc(100% + 4px);z-index:50;min-width:160px;display:flex;flex-direction:column;background:#fff;border:1px solid var(--bh-slate);box-shadow:0 6px 18px rgba(0,0,0,.14);padding:8px 0}
.ap-fm[hidden]{display:none}
.ap-fm .bh-label{padding:2px 14px 6px}
.ap-fo{border:0;background:none;text-align:left;padding:8px 14px 8px 32px;font:500 13px var(--bh-font);color:var(--bh-ink);cursor:pointer;position:relative}
.ap-fo:hover{background:var(--bh-hairline,#f2f2f2)}
.ap-fo[aria-checked="true"]{font-weight:700}
.ap-fo[aria-checked="true"]::before{content:'✓';position:absolute;left:12px}
#tTypeBtn.on{background:var(--bh-black);color:#fff}
.ap-xm{min-width:290px}.ap-xj{display:flex;align-items:center;gap:8px;padding:8px 14px 2px 32px;font:600 12px var(--bh-font)}.ap-xj input{flex:1;height:30px;font-size:13px;min-width:0}.ap-xn{padding:2px 14px 6px 32px;font-size:11px;color:var(--bh-ink-muted)}
.ap-tog{display:inline-flex;align-items:center;gap:6px;min-height:38px;padding:0 12px;border:1px solid var(--bh-slate);background:#fff;font:600 12px/1 var(--bh-font);letter-spacing:.04em;text-transform:uppercase;cursor:pointer;color:var(--bh-ink)}
.ap-tog[aria-pressed="true"]{background:var(--bh-black);color:#fff;border-color:var(--bh-black)}
.ap-tog .n{font-weight:700}
.ap-sp{flex:1 1 10px}
.ap-pull{font-size:12px;color:var(--bh-ink-muted);display:flex;align-items:center;gap:8px}
.ap-pull b{color:var(--bh-ink);font-weight:600}
.ap-as{display:flex;align-items:center;gap:8px}
.ap-as select{min-height:38px;font-size:13px}

.ap-work{display:flex;align-items:stretch;min-height:calc(100vh - 170px)}
.ap-list{flex:1 1 auto;min-width:0;padding:8px 40px 60px}
/* 22 Oct: the detail opens as a wide drawer OVER the list (it used to sit beside it at 580px) */
.ap-pane.wide{width:min(1680px,98vw)}
.sp{display:grid;grid-template-columns:minmax(0,1fr) minmax(620px,760px);gap:20px;align-items:start}
.sp-l{position:sticky;top:12px}
.sp-l .iv-pdf{height:calc(100vh - 60px);min-height:480px}
.ap-pane{position:fixed;top:0;right:0;bottom:0;width:min(960px,94vw);z-index:60;background:#fff;border-left:1px solid var(--bh-slate);box-shadow:-12px 0 32px rgba(33,30,30,.18);overflow:auto;animation:pnIn .16s ease-out}
@keyframes pnIn{from{transform:translateX(24px);opacity:.6}to{transform:none;opacity:1}}
body:not(.no-pane) .ap-scrim{display:block;position:fixed;inset:0;background:rgba(33,30,30,.35);z-index:55;border:0;cursor:pointer}
body:not(.no-pane){overflow:hidden}
body.no-pane .ap-pane{display:none}

/* sections */
.ap-sec{margin-top:22px}
.ap-sec-h{display:grid;grid-template-columns:36px minmax(170px,1.5fr) minmax(130px,1.1fr) 110px 56px minmax(150px,1.2fr) 34px;align-items:center;gap:14px;width:100%;padding:10px 8px;border:0;border-bottom:2px solid var(--bh-black);background:none;cursor:pointer;font-family:inherit;text-align:left;color:var(--bh-ink)}
.ap-sec-h .tt{grid-column:2/4;display:flex;align-items:baseline;gap:12px;min-width:0}
.ap-sec-h .car{justify-self:center;width:0;height:0;border-left:5px solid var(--bh-ink);border-top:5px solid transparent;border-bottom:5px solid transparent;transition:transform .15s}
.ap-sec-h[aria-expanded="true"] .car{transform:rotate(90deg)}
.ap-sec-h .t{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.ap-sec-h .c{font-size:13px;font-weight:700}
.ap-sec-h .o{font-size:12px;color:var(--bh-ink-muted)}
.ap-sec-h .sum{grid-column:4;text-align:right;font-size:13px;font-weight:700}
.ap-empty{padding:14px 0;font-size:13px;color:var(--bh-ink-muted);border-bottom:1px solid var(--bh-hairline)}

/* rows */
.iv{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(250px,1fr);gap:18px;margin-bottom:14px}
.iv-pdf{width:100%;height:72vh;min-height:420px;border:1px solid var(--bh-hairline);background:var(--bh-surface-muted)}
.iv-none{height:240px;display:flex;align-items:center;justify-content:center;gap:6px;border:1px dashed var(--bh-slate);font-size:13px;color:var(--bh-ink-muted);text-align:center;padding:12px}
.iv-h{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.iv-dl{display:grid;grid-template-columns:96px minmax(0,1fr);margin:0;font-size:13px}
.iv-dl dt{font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--bh-ink-muted);padding:9px 0;border-bottom:1px solid var(--bh-hairline)}
.iv-dl dd{margin:0;padding:8px 0;border-bottom:1px solid var(--bh-hairline);min-width:0;overflow-wrap:anywhere}
.iv-dl dd span{display:block;font-size:12px;color:var(--bh-ink-muted)}
.iv-dl dd span.bh-chip{display:inline-block;color:inherit}
.iv-dl dd span.miss{display:inline;color:var(--bh-warn-ink,#8a6d00)}
.iv-dl .bh-input,.iv-dl .bh-select{width:100%;min-height:30px;box-sizing:border-box;font-size:13px}
@media (max-width:760px){.iv{grid-template-columns:1fr}.iv-pdf{height:60vh;min-height:320px}}
.rv-act{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-top:10px;font-size:12px;font-weight:600}
.rv-act .bh-btn{min-height:30px;font-size:11px;padding:0 16px}
.iv-r .cf{margin:0 0 18px;padding:16px 18px;border:0;background:var(--bh-surface-muted)}
.iv-r .cf .bh-section-title{font-size:12px;margin-bottom:2px}
.iv-r .cf textarea{min-height:44px !important;background:#fff}
.iv-r .cf .bh-input{background:#fff}
.iv-r .cf .ck{border:0}
.ap-pane.wide .iv{grid-template-columns:minmax(0,1fr) minmax(620px,760px);gap:20px}   /* same split as a pay app beside its PDF */
.ap-pane.wide .iv-pdf{height:calc(100vh - 210px);min-height:520px}
.ap-pane.wide .iv-r{position:sticky;top:12px;align-self:start}
.hold-ban{border-left:4px solid var(--bh-bad-ink,#9c0006);background:#fdecee;padding:12px 16px;margin:0 0 16px;font-size:13px;line-height:1.5}
.hold-ban .h{font-weight:700;font-size:14px;color:var(--bh-bad-ink,#9c0006)}
.hold-ban .sub{color:var(--bh-ink-muted);font-size:12px;margin-top:4px}
.comp-warn{border-left:4px solid var(--bh-bad-ink,#9c0006);background:#fdecee;padding:8px 12px;margin:0 0 10px;font-size:13px}
.ok-ban{border-left:4px solid #1b7f3b;background:#eef8f0;padding:12px 16px;margin:0 0 16px;font-size:13px;line-height:1.5}
.ok-ban .h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-weight:700;font-size:14px;color:#14532d}
.ok-ban .h .ic{display:inline-flex;width:20px;height:20px;border-radius:50%;background:#1b7f3b;color:#fff;align-items:center;justify-content:center;font-size:12px}
.ok-ban dl{display:grid;grid-template-columns:110px minmax(0,1fr);gap:2px 10px;margin:8px 0 0}
.ok-ban dt{font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:#3f6b4c;padding-top:2px}
.ok-ban dd{margin:0}
.ok-ban.done{border-left-color:#211E1E;background:var(--bh-surface-muted)}
.ok-ban.done .h{color:var(--bh-ink)} .ok-ban.done .h .ic{background:#211E1E}
.rt-ban{border-left:4px solid #1d4ed8;background:#eef3ff;padding:12px 16px;margin:0 0 16px;font-size:13px;line-height:1.5}
.rt-ban .h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-weight:700;font-size:14px;color:#1e3a8a}
.rt-ban .h .ic{display:inline-flex;width:20px;height:20px;border-radius:50%;background:#1d4ed8;color:#fff;align-items:center;justify-content:center;font-size:11px}
.rt-ban .nt{margin-top:6px;padding:8px 10px;background:#fff;border:1px solid #c7d6fb}
.rt-ban .sub{color:#334;margin-top:2px}
.cf.rv-g{border:0;background:var(--bh-surface-muted);padding:16px 18px;margin:0 0 16px}
.rv-g .bh-section-title{font-size:12px;margin-bottom:2px}
.rv-g textarea,.rv-g .bh-input{background:#fff}
.rv-g .ck{border:0;padding:6px 0}
.rv-g .cr{margin-top:12px;padding-top:12px;border-top:1px solid var(--bh-hairline)}
.ap-row.is-appr{box-shadow:inset 3px 0 0 #1b7f3b}
.sp-row{display:flex;gap:6px;align-items:center;margin-top:6px}
.chg-ban{border-left:4px solid var(--bh-warn-ink,#b07d00);background:var(--bh-warn-bg,#fdf6e3);padding:10px 14px;margin:0 0 12px;font-size:13px;line-height:1.45}
.chg-ban.is-bad{border-left-color:var(--bh-bad-ink,#9c0006);background:var(--bh-bad-bg,#fbebeb)}
.chg-ban .h{font-weight:700;margin-bottom:4px}
.chg-ban ul{margin:4px 0 4px 18px;padding:0}
.chg-ban .sn{margin-top:6px;border-top:1px solid rgba(0,0,0,.08);padding-top:6px}
.chg-ban .sub{font-size:12px;color:var(--bh-ink-muted);margin-top:6px}
.pw-new{color:var(--bh-bad-ink,#9c0006)}
.bh-asof .fresh{display:block;font-size:11px;color:var(--bh-ink-muted);margin-top:2px}
.bh-asof .fresh b{font-weight:600;color:var(--bh-ink)}.bh-asof .fresh b.old{color:var(--bh-bad-ink,#9c0006)}
.comp-ban{border-left:4px solid var(--bh-ok-ink,#1e7b34);background:var(--bh-ok-bg,#eef7ef);padding:8px 14px;margin:0 0 12px;font-size:13px;line-height:1.45}
.comp-ban.is-bad{border-left-color:var(--bh-bad-ink,#9c0006);background:var(--bh-bad-bg,#fbebeb)}
.comp-ban.is-warn{border-left-color:var(--bh-warn-ink,#b07d00);background:var(--bh-warn-bg,#fdf6e3)}
.comp-ban .src{font-size:12px;color:var(--bh-ink-muted)}
.comp-ban a{margin-left:8px;font-size:12px}
.sp-row .bh-input{flex:1 1 auto;width:auto;min-width:0;min-height:34px;box-sizing:border-box}
.sp-row .bh-input.sp-amt{flex:0 0 130px;width:130px}
.sp-row .cl-sel{flex:1 1 200px;min-width:0;max-width:100%;min-height:34px;font-size:13px}
.ok-ban .cl-box{background:#fff;border:1px solid var(--bh-hairline,#ddd);padding:4px 10px 10px;margin-top:8px}
.ap-colh{display:grid;grid-template-columns:36px minmax(170px,1.5fr) minmax(130px,1.1fr) 110px 56px minmax(150px,1.2fr) 34px;gap:14px;padding:7px 8px 6px;border-bottom:1px solid var(--bh-hairline);font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--bh-ink-muted)}
.ap-colh .r{text-align:right}
.ap-ce{min-width:0;font-size:12px}
.ap-ce .l{display:flex;justify-content:space-between;gap:10px}
.ap-ce .l b{font-weight:700;color:var(--bh-ink);white-space:nowrap}
.ap-ce .l .a{font-weight:600;color:var(--bh-ink);white-space:nowrap}
.ap-ce .po{color:var(--bh-ink-muted)}
.ap-ce .miss{color:var(--bh-warn-ink);font-weight:600}
.ap-row.ce .ap-amt{position:relative;cursor:help}
.ap-row.ce .ap-amt>span.m{border-bottom:1px dotted currentColor}
.amt-pop{display:none;position:absolute;right:0;top:calc(100% + 6px);z-index:40;width:330px;background:#fff;border:1px solid var(--bh-slate);box-shadow:0 6px 18px rgba(0,0,0,.14);padding:10px 12px;text-align:left;font-size:12px;font-weight:400;color:var(--bh-ink);cursor:default}
.ap-row.ce .ap-amt:hover .amt-pop,.ap-row.ce .ap-amt:focus-within .amt-pop{display:block}
.amt-pop .ah{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--bh-ink-muted);margin-bottom:6px}
.amt-pop dl{display:grid;grid-template-columns:92px minmax(0,1fr);gap:4px 10px;margin:0}
.amt-pop dt{color:var(--bh-ink-muted)}
.amt-pop dd{margin:0;min-width:0}
.amt-pop .cl{display:flex;justify-content:space-between;gap:8px}
.amt-pop .cl b{font-weight:700}
.amt-pop .cn{color:var(--bh-ink-muted);margin-bottom:3px}
.bulk .bh-input{width:200px;background:#fff}
@media (max-width:960px){.ap-colh{display:none}.ap-sec-h{display:flex;gap:12px}.ap-sec-h .sum{margin-left:auto}}
.ap-row{display:grid;grid-template-columns:36px minmax(170px,1.5fr) minmax(130px,1.1fr) 110px 56px minmax(150px,1.2fr) 34px;align-items:center;gap:14px;padding:11px 8px;border-bottom:1px solid var(--bh-hairline);cursor:pointer;font-size:13px}
.ap-row:hover{background:#faf8f4}
.ap-row.is-sel{background:var(--bh-cream)}
.ap-row:focus-visible{outline-offset:-2px}
.ap-dot{width:8px;height:8px;border-radius:50%;background:var(--bh-black)}
.selc{display:flex;align-items:center;gap:8px}
.bsel{width:16px;height:16px;margin:0;accent-color:var(--bh-black);cursor:pointer}
.bulk{position:sticky;bottom:12px;z-index:15;display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-top:16px;padding:12px 16px;background:var(--bh-black);color:#fff;font-size:13px}
.bulk select{min-height:38px;font-size:13px;min-width:220px}
.bulk .bh-btn{background:#fff;color:var(--bh-black)!important;min-height:38px}
.bulk .bh-btn:hover{background:var(--bh-cream)}
.bulk .bh-btn-outline{background:transparent;color:#fff!important;border-color:#fff;min-height:38px}
.bulk .held{flex-basis:100%;font-size:12px;color:var(--bh-light-gray)}
.ap-v{min-width:0}
.ap-v b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ap-v span,.ap-j span{display:block;font-size:12px;color:var(--bh-ink-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ap-j{min-width:0}
.ap-j b{font-weight:600}
.ap-amt{text-align:right;font-weight:600}
.ap-age{text-align:right;color:var(--bh-ink-muted)}
.ap-age.old{color:var(--bh-warn-ink);font-weight:600}
.ap-age{position:relative}
.age-btn{border:0;background:none;padding:0;font:inherit;color:inherit;cursor:pointer;border-bottom:1px dotted currentColor}
.age-btn:hover{color:var(--bh-ink)}
.age-pop{position:absolute;right:0;top:calc(100% + 6px);z-index:40;width:290px;background:#fff;border:1px solid var(--bh-slate);box-shadow:0 6px 18px rgba(0,0,0,.14);padding:10px 12px;text-align:left;font-size:12px;font-weight:400;color:var(--bh-ink);cursor:default}
.age-pop .ah{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--bh-ink-muted);margin-bottom:6px}
.age-pop .ar{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:5px 0;border-top:1px solid var(--bh-silver,#e8e6e7)}
.age-pop .ar:first-of-type{border-top:0}
.age-pop .ar b{font-weight:600}
.age-pop .ar .d{text-align:right;font-weight:700}
.age-pop .ar .w{grid-column:1/-1;color:var(--bh-ink-muted)}
.age-pop .ar.now b::after{content:' · now';font-weight:400;color:var(--bh-ink-muted)}
.age-pop .tot{display:flex;justify-content:space-between;margin-top:6px;padding-top:6px;border-top:2px solid var(--bh-black);font-weight:700}
.ap-nx{min-width:0;font-size:12px;color:var(--bh-ink-muted)}
.ap-nx .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:3px}
.ap-nx .upd{color:var(--bh-ink);font-weight:600}
.ap-nx .nt{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;color:var(--bh-ink)}
.ap-nx .nt b{font-weight:600}
.ap-av{width:30px;height:30px;background:var(--bh-slate);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700}
.ap-av.none{background:#fff;border:1px dashed var(--bh-slate);color:var(--bh-ink-muted)}
.bh-chip.sm{font-size:10px;padding:2px 6px}
.ap-nx .bh-chip{white-space:normal}

/* pane */
.pn-h{padding:18px 24px 14px;border-bottom:1px solid var(--bh-hairline)}
.pn-top{display:flex;align-items:flex-start;gap:12px}
.pn-top h2{font-size:18px;font-weight:700;margin:0;line-height:1.25}
.pn-top .x{margin-left:auto;width:34px;height:34px;border:1px solid var(--bh-hairline);background:#fff;cursor:pointer;font-size:16px;line-height:1;color:var(--bh-ink)}
.pn-sub{font-size:13px;color:var(--bh-ink-muted);margin-top:3px}
.pn-amt{display:flex;align-items:baseline;gap:12px;margin-top:12px}
.pn-amt b{font-size:26px;font-weight:700}
.pn-act{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;position:relative}
.pn-act .bh-btn,.pn-act .bh-btn-outline{min-height:38px}
.pn-menu{position:absolute;top:42px;left:0;z-index:5;background:#fff;border:1px solid var(--bh-slate);min-width:240px}
.pn-menu button{display:block;width:100%;text-align:left;padding:11px 14px;border:0;border-bottom:1px solid var(--bh-hairline);background:#fff;font:500 13px var(--bh-font);cursor:pointer;color:var(--bh-ink)}
.pn-menu button:hover{background:var(--bh-cream)}
.pn-tabs{display:flex;border-bottom:1px solid var(--bh-hairline);padding:0 24px}
.pn-tabs button{border:0;background:none;padding:12px 0;margin-right:22px;font:600 12px var(--bh-font);letter-spacing:.06em;text-transform:uppercase;color:var(--bh-ink-muted);cursor:pointer;border-bottom:3px solid transparent}
.pn-tabs button[aria-selected="true"]{color:var(--bh-ink);border-bottom-color:var(--bh-black)}
.pn-b{padding:18px 24px 40px}
.pn-b h3{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin:22px 0 8px}
.pn-b h3:first-child{margin-top:0}
.mt{width:100%;border-collapse:collapse;font-size:13px}
.mt th{font-size:10.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--bh-ink-muted);text-align:right;padding:6px 8px;border-bottom:1px solid var(--bh-slate)}
.mt th:first-child,.mt td:first-child{text-align:left;padding-left:0}
.mt td{padding:8px;text-align:right;border-bottom:1px solid var(--bh-hairline)}
.mt tr.flag td{background:#fff7f8}
.mt td{font-size:12px}
.mt td:not(:first-child),.mt th{white-space:nowrap}
.mt td:first-child{min-width:120px}
.ckd{margin:18px 0 0;border:1px solid var(--bh-hairline)}
.ckd summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;padding:10px 12px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.ckd summary::-webkit-details-marker{display:none}
.ckd summary::after{content:'▾';margin-left:8px;color:var(--bh-ink-muted)}
.ckd[open] summary::after{content:'▴'}
.ckd summary .bh-chip{margin-left:auto;text-transform:none;letter-spacing:0}
.ckd>.ckr,.ckd>.note{margin-left:12px;margin-right:12px}
.ckd>.note{margin-bottom:10px}
.ckro{justify-content:space-between;align-items:center}

<script>
/* =============================================================================
   AP Desk v2 (Oct 2026) - triage layout on the live AP Pay Applications list.

============================================================================= */
const CLIENT_ID = '1825a1c0-1ce3-4078-aeb7-a4714562c422';
const TENANT_ID = '848aa890-7982-4028-befa-3323d82583ce';

/* Department heads who approve overhead invoices. Only IT is known so far. */

/* Drafts in payables@ (Oct 2026). The desk creates the email as a reply in the shared

const PAYABLES = 'payables@baileyharris.com';
const MAIL_SCOPES = ['Mail.ReadWrite.Shared'], SEND_SCOPES = ['Mail.Send.Shared'];

/* ---- sections: list Status values -> where the item sits ------------------- */
const SECTIONS = [
  {k:'triage', t:'Triage',          o:'Accounting · verify and route',              st:['received','AP verified','not a pay app']},
  {k:'pm',     t:'With approver',   o:'PM or department head · review and approve', st:['with PM']},

/* ---- state ------------------------------------------------------------------ */
const LIVE = { byKey:{}, me:null, commitments:[], cMeta:null, expected:null, ceInv:null, queue:null, byNum:{}, billing:{}, pmName:{}, jobs:{} };
let INV = [], PEOPLE = {}, JOBS = {};
let LASTB=null, WHO=ACCT, MINE=false, CHG=false, Q='', SEL=null, TAB='review', OPEN={done:false}, MENU=false, CF=false, RF=false, ED=false, BUSY=false;
const BULK = new Set(), ENT = new Set();
/* Expected billings (21 Oct 2026). Every Approved + executed Procore commitment, one row

   (Procore "billing_day"; the 20th on almost every contract, and the default). The period
   due on day D of month M collects pay apps whose period-ending date (or, when none was

let VIEW = 'queue', XF = 'all', XPER = '', XED = '', ALLH = [];

let XJOBS = (() => { try { const v = JSON.parse(localStorage.getItem('apxjobs') || 'null'); return Array.isArray(v) ? new Set(v) : null; } catch(_) { return null; } })();
let XJOPEN = false, XJQ = '';
const XOPEN = new Set();
const DEF_DAY = 20, FULL_TOL = 10;
const $ = s => document.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money = n => n==null||isNaN(n) ? '—' : '$'+Number(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const money0 = n => '$'+Math.round(n).toLocaleString('en-US');
const lc = v => String(v||'').trim().toLowerCase();
const num = v => (v===null||v===undefined||v==='') ? null : Number(v);
const parseJ = (s, d) => { try { const v = JSON.parse(s||''); return v==null ? d : v; } catch(_) { return d; } };
const fmtTime = iso => iso ? new Date(iso).toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}) : '';
const initials = n => String(n||'?').replace(/@.*/,'').split(/[\s.]+/).filter(Boolean).slice(0,2).map(w=>w[0].toUpperCase()).join('') || '?';
const dif = (a,b) => a!=null && b!=null && Math.abs(a-b) > 0.5;
const store = { get(k){ try { return localStorage.getItem(k); } catch(_) { return null; } }, set(k,v){ try { localStorage.setItem(k,v); } catch(_) {} } };

/* ---- sign-in and Graph ------------------------------------------------------ */
const msalApp = new msal.PublicClientApplication({
  auth: { clientId: CLIENT_ID, authority: 'https://login.microsoftonline.com/' + TENANT_ID, redirectUri: location.origin + '/ap/' },
  cache: { cacheLocation: 'localStorage' } });
async function token(){
  await msalApp.initialize();
  const redir = await msalApp.handleRedirectPromise();
  const account = (redir && redir.account) || msalApp.getAllAccounts()[0];
  if (!account) { await msalApp.loginRedirect({ scopes: SCOPES }); return null; }
  msalApp.setActiveAccount(account);
  try { return (await msalApp.acquireTokenSilent({ scopes: SCOPES, account })).accessToken; }
  catch (e) { await msalApp.acquireTokenRedirect({ scopes: SCOPES }); return null; }
}
async function g(tok, path, opts){
  const r = await fetch(path.startsWith('http') ? path : GRAPH + path, Object.assign({ headers: { Authorization: 'Bearer ' + tok } }, opts || {}));
  let body = null; try { body = await r.json(); } catch(_) {}
  return { ok: r.ok, status: r.status, body };
}

/* ---- load ------------------------------------------------------------------- */
async function loadLive(){
  const tok = await token(); if (!tok) return false;
  const me = (await g(tok, '/me?$select=displayName,mail,userPrincipalName,department,jobTitle')).body || {};
  const email = lc(me.mail || me.userPrincipalName);
  LIVE.me = { name: me.displayName || email, email, dept: me.department || '', title: me.jobTitle || '',
    isAccounting: ACCOUNTING_PEOPLE.includes(email) || ACCOUNTING_DEPARTMENTS.map(lc).includes(lc(me.department)) };
  const site = await g(tok, '/sites/' + SP_HOST + ':' + SP_DATA);
  if (!site.ok) throw new Error('Could not reach ' + SP_DATA + ' (HTTP ' + site.status + ').');
  const drives = await g(tok, '/sites/' + site.body.id + '/drives?$select=id,name');
  const drive = ((drives.body && drives.body.value) || []).find(d => d.name === DATA_LIB);
  if (!drive) throw new Error('No ' + DATA_LIB + ' library on ' + SP_DATA + '.');
  const file = async name => { const r = await g(tok, '/drives/' + drive.id + '/root:/' + encodeURI(name) + ':/content'); return r.ok ? r.body : null; };
  const cm = await file('ap_commitments.json');
  if (!cm) throw new Error('ap_commitments.json could not be read from ' + DATA_LIB + '.');
  LIVE.cMeta = cm; LIVE.commitments = cm.commitments || [];
  LIVE.expected = await file('ap_payapp_expected.json');
  LIVE.ceInv = await file('ap_ce_invoices.json');
  LIVE.gl = await glAccounts(tok, drive.id);
  LIVE.cc = await file('ap_cost_codes.json');
  LIVE.ccn = await file('ap_cost_code_names.json');   // names from the CE Job Cost Detail (ce_ledger_pull)
  LIVE.byNum = {}; LIVE.byKey = {}; LIVE.pmName = {}; LIVE.jobs = {};
  for (const c of LIVE.commitments) {
    LIVE.byNum[String(c.number||'').trim().toUpperCase()] = c;
    LIVE.byKey[subKey(c.number)] = c;
    (c.pm_team||[]).forEach((e,k) => { if ((c.pm_team_names||[])[k]) LIVE.pmName[lc(e)] = c.pm_team_names[k]; });
    const pn = String(c.project_number||'').trim();
    if (pn && !LIVE.jobs[pn]) LIVE.jobs[pn] = { n: c.project || pn, team: (c.pm_team||[]).map(lc) };
  }
  LIVE.billing = {};
  for (const b of ((LIVE.expected && LIVE.expected.rows) || [])) LIVE.billing[String(b.commitment||'').trim().toUpperCase()] = b;
  LIVE.queue = await loadQueue(tok);
  return true;
}
async function loadQueue(tok){
  const site = await g(tok, '/sites/' + SP_HOST + ':' + SP_QUEUE);
  if (!site.ok) return { items: [], err: 'Could not reach ' + SP_QUEUE + ' (HTTP ' + site.status + ')' };
  const lr = await g(tok, '/sites/' + site.body.id + '/lists/' + encodeURIComponent(QUEUE_LIST) + '?$select=id');
  if (!lr.ok) return { items: [], err: 'No "' + QUEUE_LIST + '" list (HTTP ' + lr.status + ')' };
  const items = [];
  let url = '/sites/' + site.body.id + '/lists/' + lr.body.id + '/items?$expand=fields&$top=200';
  for (let p = 0; url && p < 40; p++) {
    const r = await g(tok, url);
    if (!r.ok) return { items, err: 'List items HTTP ' + r.status };
    for (const it of r.body.value || []) items.push({ id: it.id, f: it.fields || {} });
    url = r.body['@odata.nextLink'] || null;
  }
  return { items, siteId: site.body.id, listId: lr.body.id, err: null };
}

/* ---- the CE ledger: previous CERTIFIED (Invoiced -> Payable), full history only */
const ledgerFull = () => !!(LIVE.ceInv && LIVE.ceInv.subcontracts && LIVE.ceInv.has_payment_data !== false && !(LIVE.ceInv.filters && LIVE.ceInv.filters.since));
const digits = v => String(v==null?'':v).replace(/[^0-9]/g,'');
/* " · CE ledger as of Oct 21" - so a stale ledger is visible on the line that uses it */
function ledgerAsOf(){
  const d = LIVE.ceInv && (LIVE.ceInv.as_of || String(LIVE.ceInv.generated_at || '').slice(0, 10));
  if (!d) return '';
  const days = Math.floor((Date.now() - Date.parse(d + 'T12:00:00Z')) / 864e5);
  return ' · CE ledger as of ' + new Date(d + 'T12:00:00Z').toLocaleDateString('en-US', { month:'short', day:'numeric', timeZone:'UTC' }) + (days > 2 ? ' (' + days + ' days old)' : '');
}
function ledgerFor(sub, payReq){
  if (!ledgerFull()) return { available:false };
  const led = LIVE.ceInv.subcontracts[String(sub||'').trim().toUpperCase()];
  const inv = (led && led.invoices) || [];
  const want = digits(payReq);
  const thisApp = want ? inv.filter(x => digits(x.number) === want) : [];
  const prior = inv.filter(x => !thisApp.includes(x));
  const n = v => Number(v||0);
  /* A credit line (negative payable, e.g. 40925AU010 PR10 -4,534.40) is never "paid", so the
     retention-release top-up must not apply to it - it read the credit as +4,534.40. */
  const cert = x => n(x.payable) < 0 ? n(x.payable) : n(x.payable) + Math.max(0, n(x.paid) - n(x.payable));
  return { available:true, exists:!!led, led, prior: Math.round(prior.reduce((t,x)=>t+cert(x),0)*100)/100,
           rows: prior.map(x => ({ inv: x.raw_reference || x.number, per: x.date ? new Date(x.date+'T12:00:00Z').toLocaleDateString('en-US',{month:'short',year:'numeric',timeZone:'UTC'}) : '', pay: cert(x) })),
           thisApp };
}

/* ---- list row -> desk item ---------------------------------------------------- */
/* Contract as of a date (21 Oct 2026). A pay app for September should be checked against the
   contract as it stood at the end of September: a CO approved in October belongs on the October
   app, not the September one, or every older unpaid app reads "off" by that CO. Needs
   ap_commitments_pull.js to have recorded approved_date on each change order (key that answered
   in approved_basis). Undated approved COs are counted in, and said so. Returns null when the
   change orders were not pulled. */
function coAsOf(c, asOf){
  if (!c || !Array.isArray(c.change_orders) || !asOf) return null;
  const rev = num(c.revised_contract), orig = num(c.contract_value);
  if (rev == null) return null;
  const ap = c.change_orders.filter(x => x.state === 'approved');
  const after = ap.filter(x => x.approved_date && x.approved_date > asOf).sort((a, b) => String(a.approved_date).localeCompare(String(b.approved_date)));
  const undated = ap.filter(x => !x.approved_date);
  const later = Math.round(after.reduce((t, x) => t + (Number(x.amount) || 0), 0) * 100) / 100;
  const revAt = Math.round((rev - later) * 100) / 100;
  return { asOf, rev: revAt, cos: orig != null ? Math.round((revAt - orig) * 100) / 100 : null, after, later, undated, fullRev: rev,
           dated: ap.length - undated.length, proceeding: c.change_orders.filter(x => x.state === 'pending_proceeding') };
}
const usDate = iso => iso ? new Date(String(iso).slice(0, 10) + 'T12:00:00Z').toLocaleDateString('en-US', { month:'numeric', day:'numeric', year:'numeric', timeZone:'UTC' }) : '';
const payAsOf = f => String(f.PeriodEnding || f.ReceivedAt || '').slice(0, 10);
function retRule(c){
  if (!c || c.retainage_percent == null) return null;
  const p = Number(c.retainage_percent), thru50 = /50/.test(c.retainage_duration||'') && /thru|through/i.test(c.retainage_duration||'');
  return { p, thru50, text: p + '% ' + (thru50 ? 'thru 50%' : 'throughout') };
}
function toItem(row){
  const f = row.f, raw = String(f.Status||'received');
  const sub = String(f.Subcontract||'').trim().toUpperCase();
  const c = rosterFor(sub), b = (c && LIVE.billing[String(c.number).toUpperCase()]) || LIVE.billing[sub] || null;
  const isMsg = f.DocType === 'message', pay = f.DocType !== 'invoice' && !isMsg;
  const jobNo = f.JobNumber === 'GL' ? 'OH' : ((c && c.project_number) || f.JobNumber || '');
  const log = parseJ(f.StatusLog, []), comments = parseJ(f.Comments, []);
  const note = String(f.ParseNote||'');
  const figs = [f.AdjustedContract, f.CompletedToDate, f.RetainageHeld, f.PreviousPayments].some(v => v != null && v !== '');
  const L = pay && sub ? ledgerFor(c ? c.number : sub, f.PayRequest) : { available:false };
  const sec = SECTIONS.find(s => s.st.includes(raw));
  const lastIntake = [...log].reverse().find(e => e.k);
  const i = {
    id: 'AP-' + row.id, itemId: row.id, f, c, raw, rev: Number(f.Revision || 1) || 1, group: String(f.OriginalTitle || f.Title || row.id), sec: sec ? sec.k : null, hidden: HIDDEN.includes(raw) || !sec,
    v: f.Vendor || (c && c.vendor) || 'Unknown vendor',
    no: isMsg ? (f.Description || 'Email') : f.PayRequest ? (pay ? 'Pay App ' + f.PayRequest : 'Inv ' + f.PayRequest) : (f.Description || (pay ? 'Pay application' : 'Invoice')),
    isMsg, msgText: f.MessageText || '',
    desc: f.Description || '',
    job: jobNo, type: isMsg ? 'Message' : pay ? 'Pay app' : 'Invoice', po: sub,
    amt: Number(f.BalanceDue || 0), amtKnown: f.BalanceDue != null && f.BalanceDue !== '',
    receivedAt: f.ReceivedAt || null, changedAt: f.StatusChangedAt || f.ReceivedAt || null,
    log, comments, flags: [], missing: [], checks: {},
    intakeRej: !!(lastIntake && lastIntake.k === 'intake' && raw === 'revise and resubmit'),
    corrBy: lastIntake && lastIntake.k, asNoted: log.some(e => e.asNoted) && raw !== 'approved and entered' ? true : false,
    mailPending: (() => { const m = [...log].reverse().find(e => e.mail); return !!(m && (m.mail === 'pending' || m.mail === 'draft')); })(),
    mailEntry: [...log].reverse().find(e => e.mail && e.mail !== 'sent') || null,
    draft: (() => { const m = [...log].reverse().find(e => e.mail); return m && m.mail === 'draft' ? m : null; })(),
    pdf: f.PdfPath ? QUEUE_DOCS + f.PdfPath : '', mail: f.MessageLink || '',
    /* other PDFs from the same email, attached by the pull (22 Oct 2026) */
    files: log.flatMap(e => Array.isArray(e.files) ? e.files : []).filter(x => x && x.path).map(x => ({ name: String(x.name || x.path.split('/').pop()), url: QUEUE_DOCS + x.path })),
    vendorEmail: (c && c.compliance && c.compliance.vendor_email) || '',
    ledger: L,
  };
  { const kl = [...log].reverse().find(e => e.ctd); i.ctdBy = kl ? kl.by : ''; }
  i.hold = holdOf(i);
  i.age = Math.max(0, Math.floor((Date.now() - (Date.parse(i.changedAt||'') || Date.now())) / 86400000));
  i.bd = bizDays(i.changedAt);
  if (!isMsg && /no text in the pdf|read by ocr/i.test(note)) i.note = note;
  if (pay && !figs && !i.note && /not on attachment g/i.test(note)) i.note = note;
  /* missing details */
  if (!jobNo && !isMsg) i.missing.push('project');
  if (pay && !sub) i.missing.push('subcontract #');
  if (pay && /not on attachment g/i.test(note)) i.missing.push('Attachment G');
  if (pay && !f.PeriodEnding) i.missing.push('period ending');
  /* the pay application check */
  if (pay && figs) {
    const A = coAsOf(c, payAsOf(f));
    const procRev = A ? A.rev : (c ? num(c.revised_contract) : null), procOrig = c ? num(c.contract_value) : null;
    const ceSov = b && b.ce_sov != null ? Number(b.ce_sov) : (L.led && L.led.amount != null ? Number(L.led.amount) + (L.led.change_orders||[]).reduce((t,x)=>t+Number(x.amount||0),0) : null);
    const R = retRule(c);
    const complete = num(f.CompletedToDate);
    const retCalc = R && complete != null ? (R.thru50 ? Math.min(complete, (procRev ?? num(f.AdjustedContract) ?? 0) / 2) : complete) * R.p / 100 : null;
    i.math = { adj: [num(f.AdjustedContract), procRev, ceSov], orig: [num(f.OriginalContract), procOrig, null],
               cos: [num(f.ChangeOrders), procRev != null && procOrig != null ? procRev - procOrig : null],
               complete, ret: num(f.RetainageHeld), retCalc, rule: R ? R.text : null,
               prev: [num(f.PreviousPayments), L.available && L.exists ? L.prior : null], due: num(f.BalanceDue), A };
    const m = i.math;
    if (dif(m.adj[0], m.adj[1])) i.flags.push('Adjusted contract amount: pay app ' + money(m.adj[0]) + ' vs Procore ' + money(m.adj[1]) + (A && A.after.length ? ' as of ' + usDate(A.asOf) : '')
      + (A && A.after.length && !dif(m.adj[0], A.fullRev) ? ' — the pay app includes change orders approved after its period (' + A.after.map(x => 'CO #' + x.number).join(', ') + ')' : ''));
    if (dif(m.orig[0], m.orig[1])) i.flags.push('Amount of original contract: pay app ' + money(m.orig[0]) + ' vs Procore ' + money(m.orig[1]));
    if (dif(m.prev[0], m.prev[1])) i.flags.push('Less previous payments: pay app ' + money(m.prev[0]) + ' vs CE ' + money(m.prev[1]) + ledgerAsOf());
  }
  /* who holds it now */
  const appr = lc(f.AssignedApprover);
  i.approver = appr || ((c && c.pm_team && lc(c.pm_team[0])) || '');
  if (i.sec === 'pm') i.assign = appr || ACCT;
  else if (i.sec === 'corr') i.assign = (raw === 'PM returned' || i.intakeRej || i.corrBy === 'system' || !appr) ? ACCT : appr;
  else i.assign = ACCT;
  /* activity, newest last */
  const act = [];
  if (!log.length || !log.some(e => e.s === 'received' && !e.by)) act.push({ w:'payables@', t:'Received' + (f.Description ? ' · ' + f.Description : ''), when: fmtTime(f.ReceivedAt), at: f.ReceivedAt, ext:1, email: !!i.mail });
  for (const e of log) act.push({ w: e.by || 'payables@ pull', t: e.s ? statusWords(e.s, e) : (e.mail === 'sent' ? 'Email sent from payables@' : 'Note'), q: e.note || '', when: fmtTime(e.at), at: e.at, ext: !e.by });
  for (const m of comments) {
    if (!m.kind || m.kind === 'comment') act.push({ w: m.who, t: 'Commented', q: m.text, when: fmtTime(m.at), at: m.at });
    else if (m.kind === 'email') act.push({ w: m.who || m.email, t: 'Email · ' + (m.subject || ''), q: m.text, when: fmtTime(m.at), at: m.at, ext: 1, link: m.link });
  }
  /* a trade partner's email newer than anything a person has done on the item */
  const emails = comments.filter(m => m.kind === 'email'), lastEmail = emails.map(m => m.at).sort().pop();
  const lastHuman = [...log].filter(e => e.by && !e.reply).map(e => e.at).sort().pop();
  i.replied = !!lastEmail && (!lastHuman || Date.parse(lastEmail) > Date.parse(lastHuman));
  i.lastEmail = emails.sort((a, b) => Date.parse(a.at) - Date.parse(b.at)).pop() || null;
  { const ask = [...(i.log || [])].reverse().find(e => e && e.askedVendor);
    i.waitVendor = !!ask && i.sec === 'pm' && !(lastEmail && Date.parse(lastEmail) > Date.parse(ask.at || '')); }
  i.replyNew = i.replied && store.get('apreply:' + 'AP-' + row.id) !== lastEmail;   // not opened yet in this browser
  act.sort((a,b) => (Date.parse(a.at||'')||0) - (Date.parse(b.at||'')||0));
  i.act = act;
  const last = [...log].reverse().find(e => e.by);
  i.changed = !!(last && LIVE.me && last.by !== LIVE.me.name && store.get('apseen:' + i.id) !== (f.StatusChangedAt || ''));
  i.upd = i.changed ? statusWords(last.s || '', last) + ' · ' + last.by : '';
  return i;
}
function statusWords(s, e){
  return ({ 'received': e && e.by ? 'Back to Triage' : 'Received', 'with PM': 'Routed to approver', 'ready for entry': e && e.asNoted ? 'Approved as noted' : 'Approved',
    'PM approved':'Approved', 'PM returned':'Returned to Accounting', 'revise and resubmit': e && e.k === 'intake' ? 'Rejected at intake — resubmission requested' : 'Correction requested',
    'approved and entered':'Entered in ComputerEase', 'duplicate archived':'Archived as duplicate', 'email only':'Not an invoice · email only',
    'handled outside desk':'Handled outside the desk' })[s] || s || 'Note';
}
function rebuild(){
  const rows = (LIVE.queue && LIVE.queue.items) || [];

async function mailToken(){
  const account = msalApp.getActiveAccount() || msalApp.getAllAccounts()[0]; if (!account) return null;
  try { const t = (await msalApp.acquireTokenSilent({ scopes: MAIL_SCOPES, account })).accessToken; MAIL.ok = true; return t; }

async function makeDraft(i, m, replyTo){
  const tok = await mailToken(); if (!tok) return null;
  const mid = replyTo === false ? null : (replyTo || i.f.MessageId);
  let orig = null;
  if (mid) {
    const r = await g(tok, '/users/' + PAYABLES + "/messages?$filter=internetMessageId eq '" + encodeURIComponent(String(mid).replace(/'/g, "''")) + "'&$select=id,from&$top=1");
    orig = r.ok && r.body && r.body.value && r.body.value[0];
  }
  let d;
  if (orig) {
    d = await g(tok, '/users/' + PAYABLES + '/messages/' + orig.id + '/createReply', { method:'POST', headers:{ Authorization:'Bearer ' + tok, 'Content-Type':'application/json' }, body: JSON.stringify({ comment: mailHtml(m.body) }) });
  } else {
    d = await g(tok, '/users/' + PAYABLES + '/messages', { method:'POST', headers:{ Authorization:'Bearer ' + tok, 'Content-Type':'application/json' }, body: JSON.stringify({ subject: m.subject, body: { contentType:'HTML', content: mailHtml(m.body) } }) });
  }
  if (!d.ok) { toast('The draft could not be made in payables@ (HTTP ' + d.status + ')' + (d.status === 403 || d.status === 404 ? ' — you need access to the payables@ mailbox.' : '.')); return null; }
  const patch = { subject: m.subject };
  const to = (d.body.toRecipients || []).map(x => lc(x.emailAddress && x.emailAddress.address));
  if (m.toSet && m.to) patch.toRecipients = [{ emailAddress: { address: m.to } }];
  else if (m.to && !to.includes(lc(m.to))) patch.toRecipients = (d.body.toRecipients || []).concat([{ emailAddress: { address: m.to } }]);
  if (!to.length && !m.to) toast('No address on this email — add one in the draft.');
  if (m.cc) patch.ccRecipients = [{ emailAddress: { address: m.cc } }];
  const u = await g(tok, '/users/' + PAYABLES + '/messages/' + d.body.id, { method:'PATCH', headers:{ Authorization:'Bearer ' + tok, 'Content-Type':'application/json' }, body: JSON.stringify(patch) });
  return { id: d.body.id, link: (u.ok && u.body && u.body.webLink) || d.body.webLink || '' };
}

  const f = cur.body.fields || {};

  const now = new Date().toISOString(), who = LIVE.me.name;

  const got = await r.json();
  const dropped = Object.keys(body).filter(k => k !== 'StatusLog' && k !== 'Comments' && String(got[k] ?? '').slice(0,10) !== String(body[k] ?? '').slice(0,10));

}

/* This period's figures for a desk item. Once CE holds the pay app (entered), CE's own
   Invoiced Total / Retention / Discount / Payable are used. Before that: Payable = balance due;
   retention this period = retainage held to date (pay app) less retention CE has on the earlier
   invoices, when both are known; Invoice Amount = Payable + that retention. */
function deskFig(i){
  const f = i.f, pay = i.type === 'Pay app';
  const L = pay && i.po ? ledgerFor(i.po, f.PayRequest) : { available:false };
  const inCE = !!(L.available && L.thisApp && L.thisApp.length);
  const sum = k => r2(L.thisApp.reduce((t, x) => t + Number(x[k] || 0), 0));
  if (inCE) return { L, inCE, paid: L.thisApp.every(x => Number(x.paid || 0) > 0), gross: sum('total'), ret: sum('retention'), disc: sum('discount'), payable: sum('payable') };
  let ret = null; const payable = i.amtKnown ? r2(i.amt) : null;
  if (pay && num(f.RetainageHeld) != null && L.available && L.exists) {
    const prior = (L.led.invoices || []).reduce((t, x) => t + Number(x.retention || 0), 0), r = r2(num(f.RetainageHeld) - prior);
    if (r >= 0 && payable != null && r <= Math.abs(payable) * 0.18) ret = r;   /* retainage over ~15% of the gross means the CE ledger is short or stale */
  }
  const dc = (i.sec === 'ready' || i.sec === 'done') ? discCalc(i) : null;

        add(ST, 'amount', l.amount); add(ST, 'bc', l.back_charge); add(ST, 'bal', l.balance);
        const lineCells = [first ? num0 : '', l.rfc || '', String(l.status || s.status || '').charAt(0), s.job || '', l.phase || '', l.cat || '', l.description || '',
          l.amount == null ? null : r2(l.amount), l.back_charge == null ? null : r2(l.back_charge), l.balance == null ? null : r2(l.balance)];
        first = false;
        if (!mine.length) { const r = ws.addRow(lineCells); xFmt(r, NUMC, DATEC); continue; }
        mine.forEach((inv, n) => {
          const pays = inv.payments && inv.payments.length ? inv.payments : [null];
          pays.forEach((p, pn) => {
            const invCells = pn ? ['', null, null, null, null, null] : [inv.raw_reference || inv.number, xDate(inv.date), r2(inv.total), r2(inv.retention), r2(inv.discount), r2(inv.payable)];
            const payCells = p ? [p.check || '', xDate(p.date), r2(p.amount), r2(p.retention), p.discount == null ? null : r2(p.discount)]
                               : (inv.check ? [inv.check, xDate(inv.check_date), r2(inv.paid), null, null] : ['', null, null, null, null]);
            const r = ws.addRow((n === 0 && pn === 0 ? lineCells : ['', '', '', '', '', '', '', null, null, null]).concat(invCells, payCells));
            xFmt(r, NUMC, DATEC);
            if (!pn) { add(ST, 'total', inv.total); add(ST, 'ret', inv.retention); add(ST, 'disc', inv.discount); add(ST, 'payable', inv.payable); }
            if (p) { add(ST, 'pAmt', p.amount); add(ST, 'pRet', p.retention); add(ST, 'pDisc', p.discount); } else if (inv.check) add(ST, 'pAmt', inv.paid);
          });
        });
      }
      for (const i of (desk[num0] || []).sort((a, b) => Number(a.f.PayRequest || 0) - Number(b.f.PayRequest || 0))) {
        const F = deskFig(i); nDesk++;
        const r = ws.addRow([first ? num0 : '', '', '', i.job || '', '', '', 'On AP desk, not in CE yet · ' + stageText(i) + ' · ' + i.id, null, null, null,
          ceInvNo(i), xDate(i.f.PeriodEnding || i.f.InvoiceDate || i.f.ReceivedAt), F.gross, F.ret, F.disc, F.payable, '', null, null, null, null]);
        first = false; xFmt(r, NUMC, DATEC, { italic:true, color:{ argb:'FF7A5C00' } });
      }
      if (!s._deskOnly) totRow('Subcontract ' + num0 + ' totals', ST);
      Object.keys(VT).forEach(x => VT[x] += ST[x]);
    }
    totRow('Vendor ' + (code || name) + ' totals', VT, true);
  }
  ws.addRow([]);
  const n = ws.addRow(['From the CE ledger pull (QTool Subcontract Detail by Vendor, emailed daily by CE Report Book). Italic rows are pay apps on the AP desk that CE does not hold yet; they are not in the totals. Invoiced Discount is CE\'s figure on the invoice; Payment Discount is what the check took.']);
  n.font = { italic:true, size:8, color:{ argb:'FF666666' } }; ws.mergeCells(n.number, 1, n.number, W.length); n.alignment = { wrapText:true }; n.height = 24;
  await xSave(wb, 'Subcontractor Detail ' + jobs.join(' ').slice(0, 60) + ' ' + new Date().toISOString().slice(0, 10) + '.xlsx');
  toast('Exported ' + subs.length + ' subcontract' + (subs.length === 1 ? '' : 's') + (nDesk ? ' + ' + nDesk + ' desk pay app' + (nDesk === 1 ? '' : 's') : ''));
}
const xMenu = open => { const m = $('#xMenu'); m.hidden = !open; $('#xBtn').setAttribute('aria-expanded', open);
  /* keep it on screen: the button can sit at the right end of the bar on a wide screen */
  if (open) { m.style.left = '0'; m.style.right = 'auto'; const r = m.getBoundingClientRect();
    if (r.right > document.documentElement.clientWidth - 8) { m.style.left = 'auto'; m.style.right = '0'; } } };
$('#xBtn').addEventListener('click', e => { e.stopPropagation(); typeMenu(false); xMenu($('#xMenu').hidden); if (!$('#xMenu').hidden) $('#xJobs').placeholder = subJobs().slice(0, 4).join(', ') || 'e.g. 25AU010'; });
$('#xMenu').addEventListener('click', e => { e.stopPropagation(); const b = e.target.closest('[data-x]'); if (!b) return; xMenu(false);
  toast('Building the Excel file…'); (b.dataset.x === 'open' ? exportOpen : exportSub)().catch(err => { console.error(err); toast('Export failed: ' + err.message); }); });
$('#xJobs').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); $('#xMenu [data-x="sub"]').click(); } });
document.addEventListener('click', () => { const m = $('#xMenu'); if (m && !m.hidden) xMenu(false); });

const typeMenu = open => { $('#tType').hidden = !open; $('#tTypeBtn').setAttribute('aria-expanded', open); };
$('#tTypeBtn').addEventListener('click', e => { e.stopPropagation(); typeMenu($('#tType').hidden); });
$('#tType').addEventListener('click', e => { e.stopPropagation(); const b = e.target.closest('[data-ty]'); if (!b) return; TYPE = b.dataset.ty; store.set('aptype', TYPE); typeMenu(false); draw(); });
document.addEventListener('click', () => { const m = $('#tType'); if (m && !m.hidden) typeMenu(false); });
$('#tMine').addEventListener('click', () => { MINE = !MINE; $('#tMine').setAttribute('aria-pressed', MINE); draw(); });
$('#tChg').addEventListener('click', () => { CHG = !CHG; $('#tChg').setAttribute('aria-pressed', CHG); draw(); });
$('#refresh').addEventListener('click', () => run(async () => { await loadLive(); rebuild(); header(); toast('Refreshed'); payablesWatch(false); }));
$('#who').addEventListener('change', e => { WHO = e.target.value; MINE = false; BULK.clear(); $('#tMine').setAttribute('aria-pressed', false); MENU = false; CF = false; draw(); if (SEL) { if (INV.some(x => x.id === SEL && inScope(x))) pane(); else closePane(); } });
document.addEventListener('keydown', e => {
  if (['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)) { if (e.key === 'Escape') document.activeElement.blur(); return; }
  const rows = [...document.querySelectorAll('.ap-row')]; const ix = rows.findIndex(r => r.dataset.id === SEL);
  if (e.key === 'j' || e.key === 'ArrowDown') { const n = rows[Math.min(rows.length - 1, ix + 1)]; if (n) { openPane(n.dataset.id); const el = document.querySelector('.ap-row[data-id="' + n.dataset.id + '"]'); if (el) el.focus(); } e.preventDefault(); }
  else if (e.key === 'k' || e.key === 'ArrowUp') { const n = rows[Math.max(0, ix - 1)]; if (n) { openPane(n.dataset.id); const el = document.querySelector('.ap-row[data-id="' + n.dataset.id + '"]'); if (el) el.focus(); } e.preventDefault(); }
  else if (e.key === 'Enter' && document.activeElement.closest && document.activeElement.closest('[data-age]')) return;
  else if (e.key === 'Escape' && AGE) { AGE = null; draw(); }
  else if (e.key === 'Enter') { const f = document.activeElement.closest && document.activeElement.closest('.ap-row'); if (f) openPane(f.dataset.id); }
  else if (e.key === 'Escape') closePane();
  else if (e.key === '/') { $('#q').focus(); e.preventDefault(); }
});

/* ---- boot ------------------------------------------------------------------------------- */
(async function boot(){
  $('#list').innerHTML = '<div class="ap-empty" style="margin-top:22px">Signing in and loading the AP Pay Applications list…</div>';
  try {
    if (!(await loadLive())) return;
    WHO = LIVE.me.isAccounting ? ACCT : LIVE.me.email;
    VIEW = store.get('apview') === 'exp' ? 'exp' : 'queue';
    rebuild(); header(); setView(VIEW);
    if (LIVE.me.isAccounting) { await mailToken(); draw(); checkSent().catch(() => {}); }
  } catch (e) {
    $('#list').innerHTML = '<div class="flags" style="margin-top:22px"><b>The AP Desk could not load</b>' + esc(e.message) + '</div>';
  }
})();

</script>
