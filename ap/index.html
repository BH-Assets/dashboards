function legacyDraw(){const rows=currentRows();const scoped=summaryRows();const count=s=>scoped.filter(i=>i.status===s).length;document.getElementById('app').innerHTML=`<div class="layout"><aside class="sidebar"><div class="brand">AP<span>Desk</span></div><div class="eyebrow">Workspace</div><nav class="navs" aria-label="Invoice queues">${['All invoices','Accounting intake','PM review','Corrections','Ready for entry','Entered'].map(v=>`<button class="nav ${v===view?'active':''}" onclick="setView('${v}')">${v}<b>${v==='All invoices'?scoped.filter(i=>i.status!=='Duplicate archived').length:count({'Accounting intake':'Intake','Corrections':'Correction needed'}[v]||v)}</b></button>`).join('')}</nav><div class="sidefoot"><strong>A clear handoff.</strong><br>Accounting owns intake.<br>PMs own approval.<br>Accounting owns entry.</div></aside><div class="workspace"><header class="topbar"><strong>Operations & accounting</strong><div class="role"><label for="role">View as</label><select id="role" onchange="setRole(this.value)">${roleOptions().map(r=>`<option ${r===role?'selected':''}>${r}</option>`).join('')}</select></div></header><main><div class="heading"><div><div class="eyebrow">Invoice workflow</div><h1>${esc(view)}</h1><p class="muted">${role==='Accounting'?'Review, route, and track every invoice through approval.':'Your assigned invoices and pay applications.'}</p></div>${role==='Accounting'?'<button class="primary" onclick="reloadLive()">Refresh</button>':''}</div><div class="demo">${liveBanner()}</div><section class="stats" aria-label="Queue summary">${[['Awaiting intake','Intake','Accounting intake'],['With PMs','PM review','PM review'],['Needs correction','Correction needed','Corrections'],['Ready for entry','Ready for entry','Ready for entry']].map(([label,status,v],j)=>{const n=count(status);const total=scoped.filter(i=>i.status===status).reduce((a,i)=>a+i.amount,0);return `<button class="stat" onclick="setView('${v}')"><div class="label">${label}</div><div class function setRole(value){if(!roleOptions().includes(value))return;const was=selected;role=value;query='';jobFilter='';columnFilters={};view='All invoices';closeDetail();draw();if(was&&invoices.some(i=>i.id===was&&(value==='Accounting'||i.pm===value)))openDetail(was);toast(value==='Accounting'?'Viewing accounting queues':'Viewing '+value+'’s jobs')}
function setView(v){view=v;draw()}
function closeDetail(){selected=null;document.getElementById('detail').innerHTML='';document.body.style.overflow=''}
function openDetail(id){selected=id;tab='review';renderDetail();document.body.style.overflow='hidden'}
function item(){return invoices.find(x=>x.id===selected)}
const checkLabels={previous:'Previous paid verified against ComputerEase',valid:'Invoice is valid and not a duplicate',contract:'Contract, approved changes, and coding verified',progress:'Work complete / materials received verified',retain:'Retainage and invoice math verified'};
function toggleCheck(k,v){item().checks[k]=v;renderDetail()}

function archiveDuplicate(){const i=item();if(!isAcctSeat()||i.status!=='Intake'||!duplicate(i))return;modal('<h2>Archive duplicate?</h2><p>This sample will leave the other invoice active and retain this document’s activity record.</p><div class="actions"><button class="danger" onclick="confirmArchive()">Archive this duplicate</button><button onclick="closeModal()">Cancel</button></div>')}
function confirmArchive(){item().status='Duplicate archived';audit('Archived duplicate; no accounting entry created.');closeModal();closeDetail();draw();toast('Duplicate archived')}
function addComment(){const text=document.getElementById('comment').value.trim();if(!text)return;item().notes.push({who:role,text});audit('Added a discussion comment.');renderDetail();toast('Comment saved')}
function exportCSV(){const rows=currentRows().filter(i=>i.status==='Ready for entry');if(!rows.length){toast('No approved invoices to export.');return}const q=v=>'"'+String(v).replace(/"/g,'""')+'"';const csv=[['Vendor','Invoice','Type','Job','PM','Approved amount','Status'],...rows.map(i=>[i.vendor,i.number,i.type,i.job,i.pm,i.amount,i.status])].map(r=>r.map(q).join(',')).join('\r\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));const a=document.createElement('a');a.href=url;a.download='approved-invoices-sample.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Approved review list exported')}
function newInvoice(){modal(`<h2>Sample invoice intake</h2><p class="muted">Simulate accounting receiving an invoice by email. No message or attachment is imported.</p><div class="field"><label for="vendor">Vendor</label><input id="vendor" required placeholder="Vendor name"></div><div class="grid2"><div class="field"><label for="number">Invoice number</label><input id="number" placeholder="INV-1001"></div><div class="field"><label for="amount">Amount ($)</label><input id="amount" type="number" min="0.01" step="0.01"></div></div><div class="field"><label for="job">Job</label><select id="job">${jobs.map(j=>'<option>'+j+'</option>').join('')}</select></div><div class="field"><label for="pm">PM</label><select id="pm">${pms.map(j=>'<option>'+j+'</option>').join('')}</select></div><div class="field"><label for="desc">Description</label><input id="desc" placeholder="Materials or services billed"></div><div class="actions"><button class="primary" onclick="saveNew()">Add to intake</button><button onclick="closeModal()">Cancel</button></div>`)}
function saveNew(){const val=id=>document.getElementById(id).value.trim();const amount=Number(val('amount'));if(!val('vendor')||!val('number')||!Number.isFinite(amount)||amount<=0){toast('Enter a vendor, invoice number, and positive amount.');return}const id=Math.max(...invoices.map(i=>i.id))+1;invoices.push({id,vendor:val('vendor'),number:val('number'),type:'Invoice',job:val('job'),pm:val('pm'),amount,received:'Today',age:0,status:'Intake',description:val('desc')||'Sample invoice',checks:{},notes:[],audit:[]});closeModal();view='Accounting intake';query='';jobFilter='';draw();openDetail(id);toast('Sample invoice added')}
function resetDemo(){modal('<h2>Reset the sample?</h2><p>This clears your demo changes and restores the original sample invoices.</p><div class="actions"><button class="primary" onclick="closeModal();closeDetail();seed();toast(\'Demo reset\')">Reset demo</button><button onclick="closeModal()">Cancel</button></div>')}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(document.getElementById('modal').innerHTML)closeModal();else closeDetail();}if(e.key==='Tab'){const container=document.querySelector('#modal .modal')||document.querySelector('.drawer');if(!container)return;const nodes=[...container.querySelectorAll('button:not(:disabled),input:not(:disabled),textarea:not(:disabled),select:not(:disabled)')];const first=nodes[0],last=nodes.at(-1);if(e.shiftKey&&document.activeElement===first){last.focus();e.preventDefault()}else if(!e.shiftKey&&document.activeElement===last){first.focus();e.preventDefault()}}});

let activeScenario='',docZoom=100;
const round=v=>Math.round(v*100)/100;
const revised=i=>i.contract+i.changes;
const due=i=>round(i.earned*(1-i.retain/100)-i.previous);
function enrich(i){i.commitment=i.commitment||('SC-'+(2600+i.id));i.costCode=i.costCode||'03-300 · Concrete / trade scope';i.markups=i.markups||[];i.versions=i.versions||[];i.revision=i.revision||1;fillGridFields(i);if(i.type==='Pay application'){i.procoreOriginal=i.contract;i.procoreChanges=i.changes;i.ceOriginal=i.contract;i.ceChanges=i.changes;i.procoreAmount=i.procoreAmount??revised(i);i.ceAmount=i.ceAmount??revised(i);buildSOV(i)}return i}
function buildSOV(i){if(i.type!=='Pay application')return;const names=['Mobilization','Foundations / primary scope','Material procurement','Area A installation','Area B installation','Area C installation','Testing / commissioning','Closeout'];let sched=0,earned=0; i.sov=names.map((name,j)=>{const total=j===7?round(revised(i)-sched):round(revised(i)/8);const completed=j===7?round(i.earned-earned):round(i.earned/8);sched+=total;earned+=completed;return{line:j+1,name,scheduled:total,earned:completed,percent:total?completed/total*100:0}})}
function seed(){columnFilters={};query='';jobFilter='';legacySeed();activeScenario='';for(const i of invoices)enrich(i);invoices.push(enrich({id:9,vendor:'Atlas Civil',number:'APP-002',type:'Pay application',job:jobs[0],pm:pms[0],amount:45000,received:'Oct 9',age:0,status:'Intake',contract:200000,changes:0,earned:100000,retain:10,previous:45000,ledgerPrevious:45000,description:'Sitework and underground utilities',checks:{},notes:[],audit:[]}));invoices.push(enrich({id:10,vendor:'Crestview Structural',number:'APP-005',type:'Pay application',job:jobs[0],pm:pms[0],amount:58500,received:'Oct 9',age:0,status:'Intake',contract:500000,changes:25000,earned:315000,retain:10,previous:225000,ledgerPrevious:225000,ceAmount:500000,description:'Structural work; approved change order not reflected in CE',checks:{},notes:[],audit:[]}));invoices.find(i=>i.id===10).ceChanges=0;for(const i of invoices)if(i.status==='Ready for entry')i.entrySnapshot=snapshot(i);draw();}
const scenarioList=[['clean','1 · Clean pay app',9],['contract','2 · Contract mismatch',10],['sov','3 · Overstated SOV',4],['previous','4 · Previous-paid mismatch',1],['invoice','5 · Regular invoice',6],['stale','6 · Changed before entry',5]];
function draw(){legacyDraw();const el=document.querySelector('main .demo');if(el)el.insertAdjacentHTML('afterend',`<section class="scenarios"><h2>Test a scenario <span class="muted">· Work through both seats</span></h2><div class="scenario-buttons">${scenarioList.map(([key,label,id])=>`<button class="${activeScenario===key?'picked':''}" onclick="startScenario('${key}')">${label}</button>`).join('')}</div></section>`)}
function startScenario(key){const scenario=scenarioList.find(x=>x[0]===key);if(!scenario)return;closeModal();closeDetail();seed();activeScenario=key;query='';jobFilter='';columnFilters={};const i=invoices.find(i=>i.id===scenario[2]);if(key==='sov'){i.status='PM review';i.checks={previous:true};i.notes=[];i.audit=[{who:'Accounting',action:'Intake checks complete. Submitted 60% progress requires PM field verification.',time:'Sample scenario'}];role=i.pm;view='PM review'}else if(key==='stale'){role='Accounting';view='Ready for entry';i.entrySnapshot=snapshot(i);i.ledgerPrevious+=5000}else{role='Accounting';view='Accounting intake'}draw();openDetail(i.id)}
function reconIssues(i){const issues=[];if(duplicate(i))issues.push('Possible duplicate vendor and invoice number.');if(i.type==='Pay application'){if(Math.abs(i.procoreAmount-revised(i))>.01||Math.abs(i.ceAmount-revised(i))>.01)issues.push('Revised contract amounts do not match across the pay app, Procore, and ComputerEase.');if(Math.abs(i.previous-i.ledgerPrevious)>.01)issues.push('Previous-paid amount does not match ComputerEase.');if(Math.abs(due(i)-i.amount)>.01)issues.push('Submitted current due does not match the pay application calculation.');if(i.earned>revised(i))issues.push('Completed and stored amount exceeds the revised contract.');}return issues}
function intakeBlockingIssues(i){return reconIssues(i).filter(issue=>!issue.startsWith('Revised contract amounts')&&!issue.startsWith('Previous-paid amount'))}
function recon(i){if(i.type!=='Pay application')return '<p class="muted">Regular invoice: three-way pay application reconciliation does not apply.</p>';return `<div class="recon-row"><span>Pay app · revised contract</span><strong>${money(revised(i))}</strong></div><div class="recon-row"><span>Procore · subcontract / PO</span><strong class="${Math.abs(i.procoreAmount-revised(i))<.01?'match':'mismatch'}">${money(i.procoreAmount)}</strong></div><div class="recon-row"><span>ComputerEase · subcontract / PO</span><strong class="${Math.abs(i.ceAmount-revised(i))<.01?'match':'mismatch'}">${money(i.ceAmount)}</strong></div><p class="muted">Including approved changes. Reference amounts are simulated.</p><div class="recon-row"><span>Pay app · previous payments</span><strong>${money(i.previous)}</strong></div><div class="recon-row"><span>ComputerEase · previous paid</span><strong class="${Math.abs(i.previous-i.ledgerPrevious)<.01?'match':'mismatch'}">${money(i.ledgerPrevious)}</strong></div>${Math.abs(i.previous-i.ledgerPrevious)>.01?'<p class="mismatch">Accounting verifies CE is correct for the selected commitment and payment basis. If the application is wrong, the PM marks it up and obtains a correction. If CE is wrong, accounting corrects its record.</p>':''}`}
function guide(i){if(i.status==='Intake')return '<strong>Accounting seat · Intake only</strong>Assign the job and commitment. Review automatic checks, verify the CE previous-paid reference and flag application discrepancies for the PM; involve the process manager for contract mismatches. Nothing is entered in CE yet.';if(i.status==='PM review')return '<strong>PM seat · Verify what has been earned</strong>Review every page and SOV line. Click a line to highlight it and attach a correction note, or complete the checklist and approve. Expand the calculation to see how the payment is derived.';if(i.status==='Correction needed')return '<strong>Correction pending · '+esc(i.correctionOwner||'PM')+' owns the next step</strong>'+esc(i.correctionOwner==='Accounting'?'Resolve accounting-system or coding discrepancies, then return through intake.':'Obtain a corrected application from the subcontractor, then accounting rechecks it.');if(i.status==='Ready for entry')return '<strong>Accounting seat · Approved, not entered</strong>Recheck current system references before recording the CE entry. A changed reference blocks entry and returns the document for review.';return '<strong>Accounting entry recorded</strong>Approval and accounting entry are separate from payment.'}
function renderDetail(){const i=item();if(!i)return;enrichMissing(i);const pay=i.type==='Pay application';document.getElementById('detail').innerHTML=`<div class="overlay" onclick="if(event.target===this)closeDetail()"><section class="drawer" role="dialog" aria-modal="true" aria-label="Invoice review"><header class="drawerheader"><div><div class="eyebrow">${i.number?esc(i.number)+' · ':''}${i.type} · Revision ${i.revision}</div><h2>${esc(i.vendor)}</h2><span class="muted">${esc(i.job)} · ${esc(i.pm)}</span></div><div class="closegroup"><select class="role-at-review" aria-label="View invoice as" onchange="setRole(this.value)">${roleOptions().map(r=>`<option ${r===role?'selected':''}>${r}</option>`).join('')}</select>${badge(i.status)}<button aria-label="Close review" onclick="closeDetail()">✕</button></div></header><div class="drawerbody"><div class="sourcecol"><div class="viewer-toolbar"><strong>Source document</strong><div class="paper-tabs">${[1,2].map(n=>`<button onclick="document.getElementById('paper-${n}').scrollIntoView({behavior:'smooth',block:'nearest'})">${n}</button>`).join('')}</div><select aria-label="Document zoom" onchange="setDocZoom(Number(this.value))">${[85,100,125].map(z=>`<option value="${z}" ${z===docZoom?'selected':''}>${z}%</option>`).join('')}</select><button onclick="window.print()">Print / save</button></div><p class="source-warning">Cover sheet as parsed or keyed at intake; the submitted PDF follows and is never altered.</p>${pay&&isPmSeat(i)&&i.status==='PM review'?'<p class="annotate-help">Click a cover-sheet amount or SOV row to highlight it and attach a note.</p>':''}<div class="pages-scroll" id="documentPages" style="font-size:${docZoom}%">${documentPages(i)}</div></div><div><div class="guide">${guide(i)}</div><div class="tabs">${[['review','Review'],['notes','Discussion'],['history','Activity']].map(([v,t])=>`<button class="${tab===v?'active':''}" onclick="tab='${v}';renderDetail()">${t}${v==='notes'?' ('+i.notes.length+')':''}</button>`).join('')}</div>${tab==='review'?reviewPanel(i):tab==='notes'?discussion(i):historyPanel(i)}</div></div></section></div>`;document.querySelector('.drawerheader button')?.focus();}
function enrichMissing(i){if(!i.markups)enrich(i)}
function setDocZoom(z){docZoom=z;const el=document.getElementById('documentPages');el.style.fontSize=z+'%';el.querySelectorAll('.paper table').forEach(t=>t.style.fontSize=(12*z/100)+'px');el.querySelectorAll('.paper').forEach(p=>p.style.fontSize=(14*z/100)+'px')}
function marked(i,page,target){return i.markups.filter(m=>m.page===page&&m.target===target)}
function annotationHTML(i,page,target){return marked(i,page,target).map(m=>`<div class="markup-label"><strong>${esc(m.who)}:</strong> ${esc(m.text)}</div>`).join('')}
function paperRow(i,key,label,value){const marks=marked(i,1,key);return `<div class="kv ${marks.length?'marked-line':''}" ${isPmSeat(i)&&i.status==='PM review'?`onclick="addMarkup(1,'${key}')" role="button" tabindex="0" onkeydown="if(event.key==='Enter')addMarkup(1,'${key}')"`:''}><span>${label}</span><strong>${money(value)}</strong></div>${annotationHTML(i,1,key)}`}
function documentPages(i){const pay=i.type==='Pay application';let html=`<article class="paper" id="paper-1" style="font-size:${14*docZoom/100}px"><div class="dochead"><div><h3>${esc(i.vendor)}</h3><small>SAMPLE · ${esc(i.number)} · Revision ${i.revision}</small></div></div><h3>${pay?'Application for payment':'Invoice'}</h3><p>${esc(i.job)}<br>Commitment: ${esc(i.commitment)}<br>Billing period: September 2026</p><p>${esc(i.description)}</p>${pay?paperRow(i,'contract','Original contract',i.contract)+paperRow(i,'changes','Approved changes',i.changes)+paperRow(i,'revised','Revised contract',revised(i))+paperRow(i,'earned','Completed & stored to date',i.earned)+paperRow(i,'retain','Retainage ('+i.retain+'%)',i.earned*i.retain/100)+paperRow(i,'previous','Previous payments',i.previous):paperRow(i,'invoice','Services / materials',i.amount)}${paperRow(i,'due','Current payment due',i.amount)}<div class="page-num">Page 1 of ${pay?3:1} · Cover sheet · Original sample values retained until a corrected submission is received.</div></article>`;if(pay)for(let page=2;page<=3;page++){const lines=i.sov.slice((page-2)*4,(page-1)*4);html+=`<article class="paper" id="paper-${page}" style="font-size:${14*docZoom/100}px"><h3>Schedule of values · ${page===2?'1–4':'5–8'}</h3><p>${esc(i.vendor)} · ${esc(i.number)}<br>${esc(i.job)} · Revision ${i.revision}</p><table style="font-size:${12*docZoom/100}px"><thead><tr><th style="width:7%">#</th><th style="width:25%">Description</th><th>Scheduled value</th><th>Complete & stored</th><th style="width:11%">%</th><th>Balance</th></tr></thead><tbody>${lines.map(l=>`<tr class="sov-row ${marked(i,page,'line-'+l.line).length?'marked-line':''}" ${isPmSeat(i)&&i.status==='PM review'?`onclick="addMarkup(${page},'line-${l.line}')" tabindex="0" onkeydown="if(event.key==='Enter')addMarkup(${page},'line-${l.line}')"`:''}><td>${l.line}</td><td>${l.name}</td><td>${money(l.scheduled)}</td><td>${money(l.earned)}</td><td>${l.percent.toFixed(1)}%</td><td>${money(l.scheduled-l.earned)}</td></tr>`).join('')}</tbody></table>${page===3?`<div class="kv"><span>Total scheduled</span><strong>${money(revised(i))}</strong></div><div class="kv"><span>Total complete & stored</span><strong>${money(i.earned)}</strong></div>`:''}${lines.map(l=>annotationHTML(i,page,'line-'+l.line)).join('')}<div class="page-num">Page ${page} of 3 · SOV continuation · Completed and stored are combined in this sample.</div></article>`}return html}
function calc(i){if(i.type!=='Pay application')return '';return `<div class="card calc"><details><summary>Show payment calculation</summary><div class="formula"><div class="kv"><span>Completed & stored</span><strong>${money(i.earned)}</strong></div><div class="kv"><span>Less retainage (${i.retain}%)</span><strong>− ${money(i.earned*i.retain/100)}</strong></div><div class="kv"><span>Less previous payments</span><strong>− ${money(i.previous)}</strong></div><div class="kv total"><span>Calculated current due</span><strong>${money(due(i))}</strong></div><p class="muted">Submitted due: ${money(i.amount)}. Correct arithmetic does not verify that the work or stored materials have been earned.</p></div></details></div>`}
function reviewPanel(i){const pay=i.type==='Pay application',issues=reconIssues(i);let html=issues.length?'<div class="alert">'+issues.map(x=>'<div>'+esc(x)+'</div>').join('')+'</div>':'';if(pay)html+=`<div class="card"><h3>Contract & payment reconciliation ${issues.length?'<span class="tag red">Check differences</span>':'<span class="tag teal">Matches</span>'}</h3>${recon(i)}${reconIssues(i).some(x=>x.startsWith('Revised contract'))?'<p class="mismatch"><strong>Correction owner: PM / process manager.</strong> Accounting can route this flagged application; PM approval is blocked until the references match.</p>':''}</div>`;html+='<div class="card">';
if(i.status==='Intake'){html+=`<h3>Accounting intake</h3><div class="grid2"><div class="field"><label for="assignJob">Job</label><select id="assignJob" ${!isAcctSeat()?'disabled':''} onchange="assignIntake('job',this.value)">${jobs.map(j=>`<option ${i.job===j?'selected':''}>${j}</option>`).join('')}</select></div><div class="field"><label for="assignPM">PM reviewer</label><select id="assignPM" ${!isAcctSeat()?'disabled':''} onchange="assignIntake('pm',this.value)">${pmChoices(i)}</select></div></div><div class="field"><label for="commitment">Subcontract / purchase order</label><input id="commitment" list="commitList" value="${esc(i.commitment)}" ${!isAcctSeat()?'disabled':''} onchange="setCommitment(this.value)">${commitDatalist(i)}</div><p class="muted">Amount checks above compare the submitted figures with live Procore and ComputerEase references. Confirm the references are current and the correct commitment is selected. Contract and previous-paid application discrepancies can route to the PM after accounting verifies the correct commitment and CE reference. Approval stays blocked until resolved.</p><label class="check"><input type="checkbox" ${i.checks.previous?'checked':''} ${!isAcctSeat()?'disabled':''} onchange="toggleCheck('previous',this.checked)"><span>Vendor, job, and commitment confirmed; CE previous-paid reference verified on the same payment basis; duplicate / math checks reviewed; application discrepancies flagged</span></label><div class="actions"><button class="primary" ${!isAcctSeat()||!i.checks.previous||!canRoute(i)||intakeBlockingIssues(i).length?'disabled':''} onclick="routePM()">Route to PM</button><button ${!isAcctSeat()?'disabled':''} onclick="requestCorrection()">Request correction</button>${duplicate(i)?`<button ${!isAcctSeat()?'disabled':''} onclick="archiveDuplicate()">Archive duplicate</button>`:''}${intakeExtras(i)}</div>`;
}else if(i.status==='PM review'){html+=`<h3>PM verification</h3><p class="muted">Accounting intake complete. Review the source pages and field conditions before approval.</p>${['valid','contract','progress','retain'].map(k=>`<label class="check"><input type="checkbox" ${i.checks[k]?'checked':''} ${!isPmSeat(i)?'disabled':''} onchange="toggleCheck('${k}',this.checked)"><span>${({valid:'Valid application / invoice; correct vendor and period',contract:pay?'Contract, approved changes, and three-way reconciliation verified':'Purchase order / contract and cost coding verified',progress:pay?'SOV progress and stored materials verified against field conditions':'Materials received / services performed verified',retain:pay?'Retainage, prior payments, and payment calculation reviewed':'Invoice amount and applicable tax verified'})[k]}</span></label>`).join('')}<div class="actions"><button class="primary" ${!isPmSeat(i)||issues.length||i.markups.length||!['valid','contract','progress','retain'].every(k=>i.checks[k])?'disabled':''} onclick="approve()">Approve ${money(i.amount)}</button><button ${!isPmSeat(i)?'disabled':''} onclick="requestCorrection()">Request correction</button></div>${!isPmSeat(i)?'<p class="muted">Only '+esc(i.pm)+' can complete this review.</p>':''}${i.markups.length?'<p class="muted">Correction markups are present. Request correction, or remove a markup if you added it by mistake.</p>':''}`;
}else if(i.status==='Correction needed'){html+=`<h3>Correction required</h3><p><strong>Next action: ${esc(i.correctionOwner||'PM')}</strong></p><p class="muted">${esc((i.correctionKind==='system'||i.correctionKind==='contract')?'Correct the underlying system reference or commitment selection. No invoice has been entered in CE.':'The PM obtains a revised application from the subcontractor. Accounting rechecks it before PM approval.')}</p>${i.notes.length?`<div class="note">${esc(i.notes.at(-1).text)}</div>`:''}<div class="actions">${(i.correctionKind==='system'||i.correctionKind==='contract')?`<button class="primary" ${!(i.correctionKind==='contract'?isPmSeat(i):isAcctSeat())?'disabled':''} onclick="resolveSystemIssue()">Resolved — return to intake</button>`:`<span class="muted">The corrected application arrives through payables@ and is linked to this record at intake as the next revision.</span>`}</div>`;
}else if(i.status==='Ready for entry'){html+=`<h3>Approved for CE entry</h3><div class="alert success">${esc(i.pm)} approved ${money(i.amount)}. No invoice has been entered in CE.</div>${entryChanged(i)?'<div class="alert">System references changed after approval. Entry is blocked. Return to intake and obtain fresh PM approval.</div>':''}<button ${!isAcctSeat()?'disabled':''} onclick="recheckEntry()">Recheck system references</button>${staleRefs(i).length?'<div class="alert">Reference data is older than this approval: '+esc(staleRefs(i).join(', '))+'. Entry waits for a refresh.</div>':''}<p class="muted">The recheck reloads the published Procore and ComputerEase references and compares them with the approval snapshot. Nothing is written to CE.</p><div class="field"><label for="ceRef">CE entry reference (after entry)</label><input id="ceRef" placeholder="e.g. CE-264012" value="${esc(i.ceSuggest||'')}" ${!isAcctSeat()?'disabled':''}></div><div class="actions"><button class="primary" ${!isAcctSeat()||!i.entryRechecked||entryChanged(i)?'disabled':''} onclick="markEntered()">Record CE entry</button><button ${!isAcctSeat()?'disabled':''} onclick="returnToIntake()">Return for review</button></div>${i.entryRechecked&&!entryChanged(i)?'<p class="match">Final reference check passed.</p>':''}`;
}else if(i.status==='Entered'){html+=`<h3>CE entry recorded</h3><div class="alert success">Reference: ${esc(i.reference)}</div><p class="muted">Payment remains managed in ComputerEase. Entry does not mean paid.</p>`;}html+='</div>'+calc(i)+gridDetails(i);if(i.markups.length)html+=`<div class="card"><h3>Document markups</h3>${markupList(i)}</div>`;return html}
function setCommitment(v){if(!isAcctSeat()||item().status!=='Intake')return;item().commitment=v.trim();item().checks.previous=false;draw();renderDetail()}
function snapshot(i){return{ceAmount:i.ceAmount??null,procoreAmount:i.procoreAmount??null,ledgerPrevious:i.ledgerPrevious??null,commitment:i.commitment,amount:i.amount}}
function entryChanged(i){if(!i.entrySnapshot)return true;const s=snapshot(i);return Object.keys(s).some(k=>s[k]!==i.entrySnapshot[k])||reconIssues(i).length>0}
function routePM(){const i=item();if(!isAcctSeat()||i.status!=='Intake'||!i.checks.previous||!i.commitment||intakeBlockingIssues(i).length)return;i.status='PM review';i.checks={previous:true};audit('Intake reviewed; routed to '+i.pm+(reconIssues(i).length?' with flagged application discrepancies assigned to the PM; contract discrepancies involve the process manager.':'.')+' No CE invoice entry created.');draw();renderDetail();toast('Routed to '+i.pm)}
function approve(){const i=item();if(!isPmSeat(i)||i.status!=='PM review'||reconIssues(i).length||i.markups.length||!['valid','contract','progress','retain'].every(k=>i.checks[k]))return;i.status='Ready for entry';i.entrySnapshot=snapshot(i);i.entryRechecked=false;audit('Approved '+money(i.amount)+'; reference snapshot retained. Awaiting CE entry.');draw();renderDetail();toast('Approved; ready for accounting entry')}
function recheckEntry(){const i=item();if(!isAcctSeat()||i.status!=='Ready for entry')return;i.entryRechecked=!entryChanged(i);audit(i.entryRechecked?'Final system-reference recheck passed.':'Final reference check failed; CE entry blocked.');renderDetail();toast(i.entryRechecked?'References match approval':'References changed; return for review')}
function markEntered(){const i=item();if(!isAcctSeat()||i.status!=='Ready for entry'||!i.entryRechecked||entryChanged(i))return;const ref=document.getElementById('ceRef').value.trim();if(!ref){toast('Enter the CE entry reference.');return}i.reference=ref;i.status='Entered';audit('Recorded CE entry '+ref+'. Payment remains managed in CE.');draw();renderDetail();toast('CE entry recorded')}
function returnToIntake(){const i=item();if(!isAcctSeat()||i.status!=='Ready for entry')return;i.status='Intake';i.checks={};i.entrySnapshot=null;i.entryRechecked=false;audit('Returned to intake for reference discrepancy; prior approval invalidated.');draw();renderDetail();toast('Returned to intake; fresh PM approval required')}
function simulateContractSync(){const i=item();if(!isPmSeat(i)||i.status!=='PM review'||i.id!==10)return;i.ceAmount=i.procoreAmount;i.ceChanges=i.procoreChanges;i.checks.contract=false;audit('Sample: PM / process manager corrected the missing CE commitment change order; reconciliation refreshed. No invoice entry created.');draw();renderDetail();toast('Contract references now match; PM review still required')}
function addMarkup(page,target){const i=item();if(!isPmSeat(i)||i.status!=='PM review')return;modal(`<h2>Mark up ${page===1?'cover sheet':'SOV '+target.replace('line-','line ')}</h2><p class="muted">The selected amount or row will be highlighted, with your note next to it. This is a sample of anchored markup, not a PDF drawing tool.</p><div class="field"><label for="markupText">What is wrong / what needs to change?</label><textarea id="markupText" rows="4" placeholder="Claims 60% complete; field verification supports 50%."></textarea></div><div class="actions"><button class="primary" onclick="saveMarkup(${page},'${target}')">Save markup</button><button onclick="closeModal()">Cancel</button></div>`)}
function saveMarkup(page,target){const i=item();if(!isPmSeat(i)||i.status!=='PM review')return;const text=document.getElementById('markupText').value.trim();if(!text){toast('Enter a markup note.');return}i.markups.push({id:Date.now()+Math.random(),page,target,text,who:role,revision:i.revision});i.checks.progress=false;i.checks.retain=false;audit('Added markup to revision '+i.revision+', page '+page+', '+target+': '+text);closeModal();renderDetail();toast('Markup attached to source document')}
function markupList(i){return i.markups.map(m=>`<div class="markup-item"><strong>Page ${m.page} · ${esc(m.target.replace('line-','SOV line '))}</strong><p>${esc(m.text)}</p><div class="muted">${esc(m.who)} · Revision ${m.revision}</div>${isPmSeat(i)&&i.status==='PM review'?`<button class="smallbutton" onclick="removeMarkup(${m.id})">Remove mistaken markup</button>`:''}</div>`).join('')}
function removeMarkup(id){const i=item();if(!isPmSeat(i)||i.status!=='PM review')return;i.markups=i.markups.filter(m=>m.id!==id);audit('Removed a mistaken markup; activity retains the original note.');renderDetail()}
function requestCorrection(){const i=item();if(!(role==='Accounting'&&i.status==='Intake'||isPmSeat(i)&&i.status==='PM review'))return;modal(`<h2>Request correction</h2><p class="muted">Document markups travel with this request. No email is sent in this demo.</p><div class="field"><label for="correctionKind">Who owns the correction?</label><select id="correctionKind"><option value="billing">PM · Subcontractor billing / progress issue</option><option value="contract" ${reconIssues(i).some(x=>x.startsWith('Revised contract'))?'selected':''}>PM / process manager · Contract discrepancy</option><option value="system">Accounting · Accounting record / coding issue</option></select></div><div class="field"><label for="reason">Correction instructions</label><textarea id="reason" rows="4">${esc(i.markups.map(m=>'Page '+m.page+', '+m.target+': '+m.text).join('\n'))}</textarea></div><div class="actions"><button class="primary" onclick="saveCorrection()">Send to correction queue</button><button onclick="closeModal()">Cancel</button></div>`)}
function saveCorrection(){const text=document.getElementById('reason').value.trim();if(!text){toast('Enter the correction instructions.');return}const i=item();i.correctionKind=document.getElementById('correctionKind').value;i.correctionOwner=i.correctionKind==='system'?'Accounting':i.correctionKind==='contract'?i.pm+' / process manager':i.pm;i.status='Correction needed';i.checks={};i.notes.push({who:role,text});audit('Correction assigned to '+i.correctionOwner+': '+text);closeModal();draw();renderDetail();toast('Correction assigned to '+i.correctionOwner)}
function correctedSubmission(){const i=item();if(!isPmSeat(i)||i.status!=='Correction needed'||(i.correctionKind==='system'||i.correctionKind==='contract'))return;modal(`<h2>Corrected application · Revision ${i.revision+1}</h2><p class="muted">Simulate the replacement from the subcontractor. The original values and markups remain in Activity. A real application could revise individual SOV lines; this sample distributes the revised earned total across the SOV.</p>${i.type==='Pay application'?`<div class="field"><label for="newEarned">Completed & stored to date ($)</label><input id="newEarned" type="number" min="0" max="${revised(i)}" step="0.01" value="${i.vendor==='Oakline Mechanical'?120000:i.earned}"></div><div class="field"><label for="newPrevious">Previous payments ($)</label><input id="newPrevious" type="number" min="0" step="0.01" value="${i.ledgerPrevious}"></div>`:`<div class="field"><label for="newAmount">Corrected amount ($)</label><input id="newAmount" type="number" min="0.01" step="0.01" value="${i.amount}"></div>`}<div class="actions"><button class="primary" onclick="saveCorrected()">Receive corrected application</button><button onclick="closeModal()">Cancel</button></div>`)}
function saveCorrected(){const i=item();if(!isPmSeat(i)||i.status!=='Correction needed'||(i.correctionKind==='system'||i.correctionKind==='contract'))return;let earned,previous,amount;if(i.type==='Pay application'){earned=Number(document.getElementById('newEarned').value);previous=Number(document.getElementById('newPrevious').value);amount=round(earned*(1-i.retain/100)-previous);if(!Number.isFinite(earned)||earned<0||earned>revised(i)||!Number.isFinite(previous)||previous<0||amount<0){toast('Enter valid amounts. Current due cannot be negative.');return}}else{amount=Number(document.getElementById('newAmount').value);if(!Number.isFinite(amount)||amount<=0){toast('Enter a positive amount.');return}}i.versions.push({revision:i.revision,amount:i.amount,earned:i.earned,previous:i.previous,contract:i.contract,changes:i.changes,retain:i.retain,sov:JSON.parse(JSON.stringify(i.sov||[])),markups:JSON.parse(JSON.stringify(i.markups))});if(i.type==='Pay application'){i.earned=earned;i.previous=previous;buildSOV(i)}i.amount=amount;i.revision++;i.markups=[];i.checks={};i.status='Intake';i.entrySnapshot=null;i.notes.push({who:role,text:'Corrected revision '+i.revision+' received for '+money(amount)+'. Accounting must recheck before PM approval.'});audit('Received corrected application; original revision and markups retained. Returned to accounting intake.');closeModal();draw();renderDetail();toast('Corrected submission returned to accounting intake')}
function resolveSystemIssue(){const i=item();if(i.status!=='Correction needed'||!['system','contract'].includes(i.correctionKind)||role!==(i.correctionKind==='contract'?i.pm:'Accounting'))return;if(i.type==='Pay application'){i.ceAmount=i.procoreAmount;i.ceChanges=i.procoreChanges;}i.checks={};i.status='Intake';audit('Sample system discrepancy resolved; returned to intake. Billing differences, if any, remain blocked.');draw();renderDetail()}
function discussion(i){return `<div class="card"><h3>Discussion</h3>${i.notes.map(n=>`<div class="note"><strong>${esc(n.who)}</strong><p>${esc(n.text)}</p></div>`).join('')||'<p class="muted">No comments yet.</p>'}<div class="field" style="margin-top:18px"><label for="comment">Add a comment</label><textarea id="comment" rows="3"></textarea></div><button class="primary" onclick="addComment()">Add comment</button></div>${i.markups.length?'<div class="card"><h3>Attached markups</h3>'+markupList(i)+'</div>':''}`}
function historyPanel(i){return `<div class="card"><h3>Activity & original submissions</h3><div class="audit"><strong>Invoice received</strong><p class="muted">${esc(i.received)} · Sample intake</p></div>${i.audit.map(a=>`<div class="audit"><strong>${esc(a.who)}</strong><p>${esc(a.action)}</p><div class="muted">${esc(a.time)}</div></div>`).join('')}${i.versions.map(v=>`<details class="audit-version"><summary>Original revision ${v.revision} · ${money(v.amount)}</summary><div class="kv"><span>Earned</span><strong>${money(v.earned||v.amount)}</strong></div>${v.previous!=null?`<div class="kv"><span>Previous payments</span><strong>${money(v.previous)}</strong></div>`:''}${v.sov?.length?'<table><thead><tr><th>SOV line</th><th>Scheduled</th><th>Earned</th></tr></thead><tbody>'+v.sov.map(l=>'<tr><td>'+l.line+' · '+esc(l.name)+'</td><td>'+money(l.scheduled)+'</td><td>'+money(l.earned)+'</td></tr>').join('')+'</tbody></table>':''}${v.markups.map(m=>`<div class="markup-item">Page ${m.page}, ${esc(m.target)}: ${esc(m.text)}</div>`).join('')}</details>`).join('')}</div>`}


const gridColumns=[{key:'vendor',label:'Vendor / Inv #',type:'text',width:220},{key:'job',label:'Job # / Name',type:'text',width:185},{key:'commitment',label:'PO/Sub',type:'text',width:115},{key:'description',label:'Inv Description',type:'text',width:200},{key:'amount',label:'Amount',type:'number',width:135},{key:'dueDate',label:'Due Date',type:'date',width:125},{key:'status',label:'Status',type:'choice',width:160},{key:'responsible',label:'Responsible Person',type:'text',width:185},{key:'waiting',label:'Waiting Time',type:'number',width:145},{key:'number',label:'Inv #',type:'text',width:145},{key:'pm',label:'PM Reviewer',type:'text',width:155},{key:'invoiceDate',label:'Inv Date',type:'date',width:125},{key:'period',label:'Period',type:'choice',width:145},{key:'costCode',label:'Cost Code',type:'text',width:200},{key:'reference',label:'CE Voucher / Reference',type:'text',width:185},{key:'receivedDate',label:'Received Date',type:'date',width:145}];
const defaultColumns=gridColumns.slice(0,9).map(c=>c.key);let visibleColumns=[...defaultColumns],columnFilters={},sortColumn='waiting',sortDirection='desc';
function fillGridFields(i){const j=jobs.indexOf(i.job);i.jobNumber=['26-041','26-052','26-063'][j]||'Unassigned';i.invoiceDate=i.invoiceDate||'2026-09-30';i.dueDate=i.dueDate||'2026-10-30';i.period=i.period||'September 2026';i.receivedAt=i.receivedAt||Date.now()-(i.age||0)*86400000;i.receivedDate=new Date(i.receivedAt).toISOString().slice(0,10);if(i.type==='Invoice'){i.costCode=i.vendor.includes('Rental')?'01-500 · Temporary equipment':i.vendor.includes('Supply')?'03-300 · Reinforcing materials':i.costCode||'01-000 · General requirements'}if(!i.stageEnteredAt){i.stageEnteredAt=Date.now()-(i.status==='Entered'?0:Math.max(30,(i.age||0)*240))*60000;i.trackedStatus=i.status}if(i.trackedStatus!==i.status){i.stageEnteredAt=Date.now();i.trackedStatus=i.status}}
function nextOwner(i){if(i.status==='Intake'||i.status==='Ready for entry')return'Accounting';if(i.status==='Correction needed')return i.correctionOwner||i.pm;return i.status==='Entered'?'Completed':i.pm}
function nextAction(i){return i.status==='Intake'?'Verify and route':i.status==='PM review'?(reconIssues(i).length?'Resolve flags; review application':'Review and approve'):i.status==='Correction needed'?(i.correctionKind==='system'?'Resolve accounting record':i.correctionKind==='contract'?'Resolve contract discrepancy':'Obtain corrected submission'):i.status==='Ready for entry'?'Recheck references; enter in CE':i.status==='Entered'?'Payment tracked in CE':''}
function waitingMinutes(i){return i.status==='Entered'?0:Math.max(0,Math.floor((Date.now()-i.stageEnteredAt)/60000))}
function duration(n){return n<60?n+'m':n<1440?Math.floor(n/60)+'h '+n%60+'m':Math.floor(n/1440)+'d '+Math.floor(n%1440/60)+'h'}
function columnValue(i,key){if(key==='waiting')return waitingMinutes(i);if(key==='responsible')return nextOwner(i);if(key==='vendor')return i.vendor;if(key==='job')return i.jobNumber+' '+i.job;if(key==='reference')return i.reference||'';return i[key]??''}
function baseRows(){invoices.forEach(fillGridFields);return invoices.filter(i=>i.status!=='Duplicate archived'&&(role==='Accounting'||inScope(i))&&(!jobFilter||i.job===jobFilter)).filter(i=>!query||[i.vendor,i.number,i.job,i.jobNumber,i.commitment,i.description,i.pm,i.reference].join(' ').toLowerCase().includes(query.toLowerCase())).filter(i=>Object.entries(columnFilters).every(([key,f])=>{const c=gridColumns.find(c=>c.key===key);const v=columnValue(i,key);if(c.type==='number'||c.type==='date'){if(c.type==='date'&&!v)return false;const n=c.type==='number'?Number(v):v;return(f.min===''||n>=(c.type==='number'?Number(f.min):f.min))&&(f.max===''||n<=(c.type==='number'?Number(f.max):f.max))}return c.type==='choice'?String(v)===f.value:String(v).toLowerCase().includes(f.value.toLowerCase())}))}
function summaryRows(){return baseRows()}
function currentRows(){const rows=baseRows().filter(i=>view==='All invoices'||i.status===({'Accounting intake':'Intake',Corrections:'Correction needed'}[view]||view));const c=gridColumns.find(c=>c.key===sortColumn);return rows.sort((a,b)=>{const x=columnValue(a,sortColumn),y=columnValue(b,sortColumn);if(x==='')return y===''?a.id-b.id:1;if(y==='')return-1;const cmp=c.type==='number'?x-y:String(x).localeCompare(String(y),undefined,{numeric:true,sensitivity:'base'});return (sortDirection==='asc'?cmp:-cmp)||a.id-b.id})}
function hasFilters(){return!!query||!!jobFilter||Object.keys(columnFilters).length>0}
function filterChips(){if(!hasFilters())return '';return `<div class="filter-chips"><strong>Filters:</strong>${query?`<button onclick="query='';draw()">Search: ${esc(query)} ×</button>`:''}${jobFilter?`<button onclick="jobFilter='';draw()">Job: ${esc(jobFilter)} ×</button>`:''}${Object.entries(columnFilters).map(([key,f])=>`<button onclick="removeColumnFilter('${key}')">${gridColumns.find(c=>c.key===key).label}: ${esc(f.value||(f.min||'Any')+' to '+(f.max||'Any'))} ×</button>`).join('')}</div>`}
function setSearch(value){const el=document.querySelector('input[aria-label="Search invoices"]');const caret=el?.selectionStart;query=value;draw();const next=document.querySelector('input[aria-label="Search invoices"]');if(next){next.focus();if(caret!=null)next.setSelectionRange(caret,caret)}}
function clearGridFilters(){query='';jobFilter='';columnFilters={};draw()}
function removeColumnFilter(key){delete columnFilters[key];draw()}
function sortGrid(key){if(!gridColumns.some(c=>c.key===key))return;if(sortColumn===key)sortDirection=sortDirection==='asc'?'desc':'asc';else{sortColumn=key;sortDirection='asc'}draw()}
function cellHTML(i,key){switch(key){case'vendor':return `<button onclick="openDetail(${i.id})" aria-label="Review ${esc(i.vendor)} ${esc(i.number)}"><strong>${esc(i.vendor)}</strong><span class="muted">${i.number?esc(i.number)+' · ':''}${i.type}</span>${duplicate(i)?'<span class="rowflag">Possible duplicate</span>':''}</button>`;case'job':return`<strong>${esc(i.jobNumber)}</strong><span class="muted">${esc(i.job)}</span>`;case'amount':return`<strong>${money(i.amount)}</strong>`;case'status':return badge(i.status);case'responsible':return`<strong>${esc(nextOwner(i))}</strong><div class="nextaction">${esc(nextAction(i))}</div>`;case'waiting':return i.status==='Entered'?'<span class="muted">Completed</span>':`<strong>${duration(waitingMinutes(i))}</strong><span class="muted">In current stage</span>`;case'dueDate':case'invoiceDate':case'receivedDate':return i[key]?new Date(i[key]+'T12:00:00Z').toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric',timeZone:'UTC'}):'—';case'reference':return esc(i.reference||'Not entered');default:return esc(columnValue(i,key))}}
function table(rows){const cols=gridColumns.filter(c=>visibleColumns.includes(c.key));return `<table class="invoice-grid" style="min-width:${Math.max(900,cols.reduce((a,c)=>a+c.width,0))}px"><colgroup>${cols.map(c=>`<col style="width:${c.width}px">`).join('')}</colgroup><thead><tr>${cols.map(c=>`<th scope="col" class="${c.key==='vendor'?'vendor-col':''} ${c.key==='amount'?'amount':''}" aria-sort="${sortColumn===c.key?(sortDirection==='asc'?'ascending':'descending'):'none'}"><button class="sort-button" onclick="sortGrid('${c.key}')" title="Sort ${esc(c.label)}">${c.label}<span>${sortColumn===c.key?(sortDirection==='asc'?'▲':'▼'):'↕'}</span></button><button class="filter-button ${columnFilters[c.key]?'on':''}" onclick="openColumnFilter('${c.key}')" aria-label="Filter ${esc(c.label)}">${columnFilters[c.key]?'Filtered':'Filter'}</button></th>`).join('')}</tr></thead><tbody>${rows.map(i=>`<tr>${cols.map(c=>`<td class="${c.key==='vendor'?'vendor-col':''} ${c.key==='amount'?'amount':''}">${cellHTML(i,c.key)}</td>`).join('')}</tr>`).join('')||`<tr><td colspan="${cols.length}"><div class="empty-grid">No invoices match this queue and its filters.${hasFilters()?'<br><button onclick="clearGridFilters()">Clear filters</button>':''}</div></td></tr>`}</tbody></table>`}
function openColumns(){modal(`<h2>Choose columns</h2><p class="muted">Keep the queue simple or add accounting detail. Vendor / Inv # stays visible so every row can be opened.</p><div class="column-options">${gridColumns.map(c=>`<label><input type="checkbox" ${visibleColumns.includes(c.key)?'checked':''} ${c.key==='vendor'?'disabled':''} onchange="toggleColumn('${c.key}',this.checked)">${c.label}</label>`).join('')}</div><div class="actions"><button onclick="resetColumns()">Restore defaults</button><button class="primary" onclick="closeModal()">Done</button></div>`)}
function toggleColumn(key,on){if(key==='vendor')return;if(on&&!visibleColumns.includes(key))visibleColumns.push(key);if(!on)visibleColumns=visibleColumns.filter(k=>k!==key);draw()}
function resetColumns(){visibleColumns=[...defaultColumns];draw();openColumns()}
function openColumnFilter(key){const c=gridColumns.find(c=>c.key===key);if(!c)return;const f=columnFilters[key]||{min:'',max:'',value:''};const options=[...new Set(invoices.filter(i=>i.status!=='Duplicate archived'&&(role==='Accounting'||inScope(i))).map(i=>String(columnValue(i,key))).filter(Boolean))].sort();modal(`<h2>Filter ${c.label}</h2>${c.type==='number'||c.type==='date'?`<p class="muted">${key==='waiting'?'Enter waiting time in minutes (60 = 1 hour; 1,440 = 1 day).':'Leave either limit blank for an open range.'}</p><div class="grid2"><div class="field"><label for="filterMin">${c.type==='date'?'From':'Minimum'}</label><input id="filterMin" type="${c.type==='date'?'date':'number'}" ${key==='waiting'?'min="0"':'step="0.01"'} value="${esc(f.min)}"></div><div class="field"><label for="filterMax">${c.type==='date'?'Through':'Maximum'}</label><input id="filterMax" type="${c.type==='date'?'date':'number'}" ${key==='waiting'?'min="0"':'step="0.01"'} value="${esc(f.max)}"></div></div>`:`<div class="field"><label for="filterValue">${c.type==='choice'?'Select value':'Search or select a value'}</label>${c.type==='choice'?`<select id="filterValue"><option value="">All values</option>${options.map(v=>`<option value="${esc(v)}" ${f.value===v?'selected':''}>${esc(v)}</option>`).join('')}</select>`:`<input id="filterValue" list="filterOptions" value="${esc(f.value)}" placeholder="Type to search…"><datalist id="filterOptions">${options.map(v=>`<option value="${esc(v)}">`).join('')}</datalist><p class="muted">Matches text containing your entry.</p>`}</div>`}<div class="actions"><button class="primary" onclick="applyColumnFilter('${key}')">Apply filter</button><button onclick="delete columnFilters['${key}'];closeModal();draw()">Clear this filter</button><button onclick="closeModal()">Cancel</button></div>`)}
function applyColumnFilter(key){const c=gridColumns.find(c=>c.key===key);if(!c)return;let f;if(c.type==='number'||c.type==='date'){const min=document.getElementById('filterMin').value.trim(),max=document.getElementById('filterMax').value.trim();if(c.type==='number'&&([min,max].some(v=>v!==''&&!Number.isFinite(Number(v)))||(key==='waiting'&&[min,max].some(v=>v!==''&&Number(v)<0)))){toast('Enter valid range values.');return}if(min!==''&&max!==''&&(c.type==='number'?Number(min)>Number(max):min>max)){toast('Minimum must not exceed maximum.');return}f={min,max};if(!min&&!max)delete columnFilters[key];else columnFilters[key]=f;}else{const value=document.getElementById('filterValue').value.trim();if(!value)delete columnFilters[key];else columnFilters[key]={value}}closeModal();draw()}
function gridDetails(i){return `<div class="card grid-metadata"><details><summary>Invoice & coding details</summary>${[['Job',i.jobNumber+' · '+i.job],['PO/Sub',i.commitment],['Description',i.description],['Invoice date',i.invoiceDate],['Due date',i.dueDate],['Accounting period',i.period],['Cost code',i.costCode],['Received',i.receivedDate],['Current stage waiting',i.status==='Entered'?'Completed':duration(waitingMinutes(i))],['Total since received',duration(Math.max(0,Math.floor((Date.now()-i.receivedAt)/60000)))],['CE voucher / reference',i.reference||'Not entered']].map(([label,value])=>`<div class="kv"><span>${label}</span><strong>${esc(value)}</strong></div>`).join('')}</details></div>`}

</script>
<script>
/* ==== Invoice Desk - live connectors ==========================================
   The VP's Invoice Desk (invoice-desk-demo index.html), unchanged in layout and
   workflow, with its sample data replaced by live sources:

     Procore commitments + Billy compliance   APData/ap_commitments.json      (ap_commitments_pull.js)
     CE subcontract SOV / billed-to-date      APData/ap_payapp_expected.json  (ap_payapp_expected.js)
     CE invoice ledger (prior certified)      APData/ap_ce_invoices.json      (Sub Detail + Job Detail exports)
     Pay applications from payables@          /sites/APDesk list "AP Pay Applications" (ap_payapps.py)

   Workflow state is written to that list as the SIGNED-IN user (delegated MSAL).
   Nothing is written to ComputerEase, Procore or Billy, and no email is sent.
   "View as" changes what you SEE; actions need you to be that seat yourself. */

const CLIENT_ID = '1825a1c0-1ce3-4078-aeb7-a4714562c422';
const TENANT_ID = '848aa890-7982-4028-befa-3323d82583ce';
const SCOPES    = ['User.Read','GroupMember.Read.All','Sites.Selected'];
const SP_HOST   = 'baileyharris.sharepoint.com';
const SP_DATA   = '/sites/Dashboard', DATA_LIB = 'APData';
const SP_QUEUE  = '/sites/APDesk',   QUEUE_LIST = 'AP Pay Applications';
const QUEUE_DOCS = 'https://' + SP_HOST + SP_QUEUE + '/Shared Documents/';
const GRAPH = 'https://graph.microsoft.com/v1.0';
const ACCOUNTING_DEPARTMENTS = ['Accounting - Executives','Accounting - Personnel','Executive','Directors'];
const ACCOUNTING_PEOPLE = ['tiffany.blackmon@baileyharris.com','hdatb@baileyharris.com'];

const GL_JOB = 'GL — overhead (no job)';
const LIVE = { me:null, commitments:[], cMeta:null, expected:null, ceInv:null, queue:null,
               byNum:{}, billing:{}, pmName:{}, loadedAt:null, error:null };

const msalApp = new msal.PublicClientApplication({
  auth: { clientId: CLIENT_ID, authority: 'https://login.microsoftonline.com/' + TENANT_ID,
          redirectUri: location.origin + '/ap/' },
  cache: { cacheLocation: 'sessionStorage' } });
async function token(){
  await msalApp.initialize();
  const redir = await msalApp.handleRedirectPromise();
  const account = (redir && redir.account) || msalApp.getAllAccounts()[0];
  if (!account) { await msalApp.loginRedirect({ scopes: SCOPES }); return null; }
  msalApp.setActiveAccount(account);
  try { return (await msalApp.acquireTokenSilent({ scopes: SCOPES, account })).accessToken; }
  catch (e) { await msalApp.acquireTokenRedirect({ scopes: SCOPES }); return null; }
}
async function g(tok, path, opts){
  const r = await fetch(path.startsWith('http') ? path : GRAPH + path,
    Object.assign({ headers: { Authorization: 'Bearer ' + tok } }, opts || {}));
  let body = null; try { body = await r.json(); } catch (_) {}
  return { ok: r.ok, status: r.status, body };
}
const lc = v => String(v || '').trim().toLowerCase();

/* ---- load ------------------------------------------------------------------ */
async function loadLive(){
  const tok = await token(); if (!tok) return false;
  const me = (await g(tok, '/me?$select=displayName,mail,userPrincipalName,department')).body || {};
  const email = lc(me.mail || me.userPrincipalName);
  LIVE.me = { name: me.displayName || email, email, dept: me.department || '',
    isAccounting: ACCOUNTING_PEOPLE.includes(email) || ACCOUNTING_DEPARTMENTS.map(lc).includes(lc(me.department)) };

  const site = await g(tok, '/sites/' + SP_HOST + ':' + SP_DATA);
  if (!site.ok) throw new Error('Could not reach ' + SP_DATA + ' (HTTP ' + site.status + ').');
  const drives = await g(tok, '/sites/' + site.body.id + '/drives?$select=id,name');
  const drive = ((drives.body && drives.body.value) || []).find(d => d.name === DATA_LIB);
  if (!drive) throw new Error('No ' + DATA_LIB + ' library on ' + SP_DATA + '.');
  const file = async name => { const r = await g(tok, '/drives/' + drive.id + '/root:/' + encodeURI(name) + ':/content');
                               return r.ok ? r.body : null; };
  const cm = await file('ap_commitments.json');
  if (!cm) throw new Error('ap_commitments.json could not be read from ' + DATA_LIB + '.');
  LIVE.cMeta = cm; LIVE.commitments = cm.commitments || [];
  LIVE.expected = await file('ap_payapp_expected.json');
  LIVE.ceInv = await file('ap_ce_invoices.json');

  LIVE.byNum = {}; LIVE.pmName = {};
  for (const c of LIVE.commitments) {
    LIVE.byNum[String(c.number || '').trim().toUpperCase()] = c;
    (c.pm_team || []).forEach((e, k) => { if ((c.pm_team_names || [])[k]) LIVE.pmName[lc(e)] = c.pm_team_names[k]; });
  }
  LIVE.billing = {};
  for (const b of ((LIVE.expected && LIVE.expected.rows) || [])) LIVE.billing[String(b.commitment || '').trim().toUpperCase()] = b;

  LIVE.queue = await loadQueue(tok);
  LIVE.loadedAt = new Date();
  return true;
}
async function loadQueue(tok){
  const site = await g(tok, '/sites/' + SP_HOST + ':' + SP_QUEUE);
  if (!site.ok) return { items: [], err: 'Could not reach ' + SP_QUEUE + ' (HTTP ' + site.status + ')' };
  const lr = await g(tok, '/sites/' + site.body.id + '/lists/' + encodeURIComponent(QUEUE_LIST) + '?$select=id');
  if (!lr.ok) return { items: [], err: 'No "' + QUEUE_LIST + '" list (HTTP ' + lr.status + ')' };
  const items = [];
  let url = '/sites/' + site.body.id + '/lists/' + lr.body.id + '/items?$expand=fields&$top=200';
  for (let p = 0; url && p < 40; p++) {
    const r = await g(tok, url);
    if (!r.ok) return { items, err: 'List items HTTP ' + r.status };
    for (const it of r.body.value || []) items.push({ id: it.id, etag: it['@odata.etag'], f: it.fields || {} });
    url = r.body['@odata.nextLink'] || null;
  }
  return { items, siteId: site.body.id, listId: lr.body.id, err: null };
}

/* ---- the CE ledger: previous CERTIFIED, not cash paid ----------------------
   Sum of "Invoiced -> Payable" on the commitment's prior invoices, plus
   retention released since (paid above payable). Only from a FULL-HISTORY
   ledger - a --since export drops earlier invoices and would understate it. */
const ledgerFull = () => !!(LIVE.ceInv && LIVE.ceInv.subcontracts && LIVE.ceInv.has_payment_data !== false
                            && !(LIVE.ceInv.filters && LIVE.ceInv.filters.since));
const digits = v => String(v == null ? '' : v).replace(/[^0-9]/g, '');
function ledgerFor(num, payReq){
  if (!ledgerFull()) return { available: false, why: LIVE.ceInv ? 'CE ledger is partial history' : 'CE ledger not published' };
  const led = LIVE.ceInv.subcontracts[String(num || '').trim().toUpperCase()];
  const inv = (led && led.invoices) || [];
  const want = digits(payReq);
  const thisApp = want ? inv.filter(x => digits(x.number) === want) : [];
  const prior = inv.filter(x => !thisApp.includes(x));
  const n = v => Number(v || 0);
  const cert = xs => xs.reduce((t, x) => t + n(x.payable) + Math.max(0, n(x.paid) - n(x.payable)), 0);
  return { available: true, exists: !!led, prior: round(cert(prior)), paidPrior: round(prior.reduce((t, x) => t + n(x.paid), 0)),
           thisApp, invoices: inv, asOf: LIVE.ceInv.as_of || null };
}

/* ---- list item -> desk record ----------------------------------------------- */
const STATUS_IN = { 'received':'Intake', 'AP verified':'Intake', 'not a pay app':'Intake',
  'with PM':'PM review', 'revise and resubmit':'Correction needed', 'PM returned':'Correction needed',
  'PM approved':'Ready for entry', 'ready for entry':'Ready for entry', 'approved as noted':'Ready for entry',
  'approved and entered':'Entered', 'duplicate archived':'Duplicate archived' };
const parseJ = (s, d) => { try { const v = JSON.parse(s || ''); return v == null ? d : v; } catch (_) { return d; } };
const numOrNull = v => (v === null || v === undefined || v === '') ? null : Number(v);
const groupKey = f => String(f.OriginalTitle || f.Title || '').trim();
const fmtTime = iso => iso ? new Date(iso).toLocaleString('en-US', { month:'short', day:'numeric', hour:'numeric', minute:'2-digit' }) : '';

function buildRecord(x, allRows){
  const f = x.f;
  const num = String(f.Subcontract || '').trim().toUpperCase();
  const c = LIVE.byNum[num] || null, b = LIVE.billing[num] || null;
  const isInvoice = f.DocType === 'invoice' || f.Status === 'not a pay app';
  const log = parseJ(f.StatusLog, []), comments = parseJ(f.Comments, []);
  const lastCorr = [...log].reverse().find(e => e.k);
  const pmEmail = lc(f.AssignedApprover) || lc(((c && c.pm_team) || [])[0]);
  const rev = Number(f.Revision || 1);
  const status = STATUS_IN[f.Status] || 'Intake';
  const L = ledgerFor(num, f.PayRequest);
  const retPct = c && c.retainage_percent != null ? Number(c.retainage_percent) : null;
  const thru50 = !!c && /50/.test(c.retainage_duration || '') && /thru|through/i.test(c.retainage_duration || '');
  const procore = c ? numOrNull(c.revised_contract) : null;
  const removed = new Set(comments.filter(m => m.kind === 'unmark').map(m => m.ref));
  const i = {
    id: Number(x.id), itemId: x.id, etag: x.etag, f, c, b, ledger: L,
    vendor: f.Vendor || (c && c.vendor) || 'Unknown vendor',
    /* Title is the pull's dedup key ("msg|<internet message id>" when the PDF gave
       nothing) - never show it. No pay request number means no number. */
    number: f.PayRequest || '', type: isInvoice ? 'Invoice' : 'Pay application',
    job: f.JobNumber === 'GL' ? GL_JOB : ((c && c.project) || f.JobNumber || 'Unassigned'),
    jobNumber: f.JobNumber === 'GL' ? 'GL' : ((c && c.project_number) || f.JobNumber || ''),
    pm: LIVE.pmName[pmEmail] || pmEmail || 'Unassigned', pmEmail,
    team: ((c && c.pm_team) || []).map(lc), teamNames: (c && c.pm_team_names) || [],
    amount: Number(f.BalanceDue || 0), status, rawStatus: f.Status,
    commitment: num, description: f.Description || (isInvoice ? 'Invoice' : 'Pay application'),
    // pay application figures, exactly as submitted (parsed or keyed)
    contract: Number(f.AdjustedContract || 0), changes: 0,
    earned: numOrNull(f.CompletedToDate), retainHeld: numOrNull(f.RetainageHeld),
    previous: numOrNull(f.PreviousPayments),
    retain: retPct, thru50,
    retAt: v => (retPct == null || v == null) ? null : (thru50 ? Math.min(v, (procore ?? Number(f.AdjustedContract || 0)) / 2) : v) * retPct / 100,
    // references
    procoreAmount: procore, ceAmount: b && b.ce_sov != null ? Number(b.ce_sov) : null,
    ledgerPrevious: L.available ? (L.exists || (b && !(b.flags || []).includes('no_ce_subcontract')) ? L.prior : null) : null,
    ledgerPaid: L.available ? L.paidPrior : null,
    ceHolds: L.available && L.thisApp.length > 0,
    ceSuggest: L.available && L.thisApp.length ? (L.thisApp[0].raw_reference || L.thisApp[0].number) : '',
    compliance: c && c.compliance ? c.compliance.billy_is_compliant : null,
    checks: { previous: f.Status === 'AP verified' },
    notes: comments.filter(m => !m.kind || m.kind === 'comment' || m.kind === 'correction').map(m => ({ who: m.who, text: m.text })),
    markups: comments.filter(m => m.kind === 'markup' && (m.rev || 1) === rev && !removed.has(m.id))
                     .map(m => ({ id: m.id, page: m.page || 1, target: m.target, text: m.text, who: m.who, revision: m.rev || 1 })),
    audit: log.map(e => ({ who: e.by || 'Pipeline', action: (e.s ? 'Status: ' + e.s : '') + (e.note ? ' — ' + e.note : ''), time: fmtTime(e.at) })),
    correctionKind: lastCorr && lastCorr.k, correctionOwner: null,
    entrySnapshot: parseJ(f.ApprovedSnapshot, null), entryRechecked: false,
    reference: f.CEReference || '', revision: rev, versions: [], sov: [],
    received: fmtTime(f.ReceivedAt), receivedAt: f.ReceivedAt ? Date.parse(f.ReceivedAt) : Date.now(),
    stageEnteredAt: Date.parse(f.StatusChangedAt || f.ReceivedAt || '') || Date.now(),
    invoiceDate: f.InvoiceDate ? String(f.InvoiceDate).slice(0, 10) : '',
    dueDate: '', period: f.PeriodEnding ? new Date(f.PeriodEnding).toLocaleDateString('en-US', { month:'long', year:'numeric', timeZone:'UTC' }) : '',
    costCode: f.CostCode || '', pdfPath: f.PdfPath || '', messageLink: f.MessageLink || '',
    parseNote: f.ParseNote || '',
  };
  if (i.correctionKind) i.correctionOwner = i.correctionKind === 'system' ? 'Accounting'
                                          : i.correctionKind === 'contract' ? i.pm + ' / process manager' : i.pm;
  i.receivedDate = new Date(i.receivedAt).toISOString().slice(0, 10);
  return i;
}
function rebuild(){
  const rows = (LIVE.queue && LIVE.queue.items) || [];
  const recs = rows.map(x => buildRecord(x, rows));
  /* Revisions stay linked: rows sharing OriginalTitle are one document. The
     highest revision is the live record; earlier ones are its history. */
  const groups = {};
  for (const r of recs) (groups[groupKey(r.f)] = groups[groupKey(r.f)] || []).push(r);
  const live = [];
  for (const k in groups) {
    const g2 = groups[k].sort((a, b) => a.revision - b.revision || a.id - b.id);
    const head = g2[g2.length - 1];
    head.versions = g2.slice(0, -1).map(v => ({ revision: v.revision, amount: v.amount, earned: v.earned, previous: v.previous,
      contract: v.contract, changes: 0, retain: v.retain, sov: [], markups: parseJ(v.f.Comments, []).filter(m => m.kind === 'markup') }));
    live.push(head);
  }
  const prev = {}; for (const o of invoices) prev[o.id] = o;
  for (const r of live) { const o = prev[r.id]; if (o && o.status === r.status) { r.checks = Object.assign({}, o.checks, r.checks.previous ? { previous: true } : {}); r.entryRechecked = o.entryRechecked; } }
  invoices = live;
  jobs.length = 0; jobs.push(GL_JOB);
  [...new Set(LIVE.commitments.map(c => c.project).filter(Boolean))].sort().forEach(j => jobs.push(j));
  pms.length = 0; [...new Set(Object.values(LIVE.pmName))].sort().forEach(p => pms.push(p));
}

/* ---- seats: what you see vs what you may do --------------------------------- */
function roleOptions(){
  const me = LIVE.me || {};
  return me.isAccounting ? ['Accounting', ...pms] : [me.name];
}
const meIsPm = i => !!LIVE.me && !!i.pmEmail && LIVE.me.email === i.pmEmail;
const isPmSeat = i => meIsPm(i) && (role === i.pm || role === LIVE.me.name);
const isAcctSeat = () => role === 'Accounting' && !!(LIVE.me && LIVE.me.isAccounting);
const inScope = i => i.pm === role || i.teamNames.includes(role)
  || (!!LIVE.me && role === LIVE.me.name && i.pmEmail === LIVE.me.email);
/* An overhead invoice has no job and no commitment; it routes on the job field
   reading GL and an approver. A pay application always needs its commitment. */
const canRoute = i => i.type === 'Pay application' ? !!i.commitment : !!(i.commitment || i.jobNumber);

/* ---- write-back ------------------------------------------------------------- */
async function saveRow(i, fields, logEntry, comment){
  const q = LIVE.queue;
  if (!q || !q.siteId) { toast('The queue list is not loaded.'); return false; }
  const tok = await token(); if (!tok) return false;
  const base = '/sites/' + q.siteId + '/lists/' + q.listId + '/items/' + encodeURIComponent(i.itemId);
  const cur = await g(tok, base + '?$expand=fields');
  if (!cur.ok) { toast('Could not re-read this row (HTTP ' + cur.status + ').'); return false; }
  const f = cur.body.fields || {};
  const now = new Date().toISOString(), who = LIVE.me.name;
  const body = Object.assign({}, fields);
  if (logEntry) {
    const log = parseJ(f.StatusLog, []);
    if (!log.length && f.ReceivedAt) log.push({ s: f.Status || 'received', at: f.ReceivedAt });
    log.push(Object.assign({ at: now, by: who }, logEntry));
    body.StatusLog = JSON.stringify(log.slice(-60));
    if (fields.Status) body.StatusChangedAt = now;
  }
  if (comment) {
    const cm = parseJ(f.Comments, []);
    cm.push(Object.assign({ id: now + '-' + Math.random().toString(36).slice(2, 7), who, email: LIVE.me.email, at: now }, comment));
    body.Comments = JSON.stringify(cm);
  }
  const r = await fetch(GRAPH + base + '/fields', { method: 'PATCH',
    headers: { Authorization: 'Bearer ' + tok, 'Content-Type': 'application/json', 'If-Match': cur.body['@odata.etag'] || '*' },
    body: JSON.stringify(body) });
  if (r.status === 412) { toast('Someone else changed this row. Refreshing.'); await reloadLive(); return false; }
  if (!r.ok) { let why = 'HTTP ' + r.status; try { why += ' ' + ((await r.json()).error.message || ''); } catch (_) {}
               if (r.status === 403) why += ' (you need Contribute on the AP Desk site)'; toast('Not saved: ' + why); return false; }
  const got = await r.json();
  const dropped = Object.keys(body).filter(k => k !== 'StatusLog' && k !== 'Comments' && String(got[k] ?? '').slice(0, 10) !== String(body[k] ?? '').slice(0, 10));
  if (dropped.length) toast('SharePoint stored nothing for ' + dropped.join(', ') + ' — run Sync-PayAppListSchema-3.ps1.');
  const row = q.items.find(x => x.id === i.itemId); if (row) { row.f = got; }
  const keep = selected; rebuild(); draw(); if (keep && invoices.some(x => x.id === keep)) { selected = keep; renderDetail(); }
  return !dropped.length;
}
async function reloadLive(){ const keep = selected; try { await loadLive(); rebuild(); draw(); if (keep && invoices.some(x => x.id === keep)) openDetail(keep); toast('Refreshed'); } catch (e) { toast(e.message); } }

/* ---- reconciliation, on live references -------------------------------------- */
function duplicate(i){
  return invoices.some(x => x.id !== i.id && x.status !== 'Duplicate archived'
    && ((x.commitment && x.commitment === i.commitment && digits(x.number) && digits(x.number) === digits(i.number))
        || (!i.commitment && lc(x.vendor) === lc(i.vendor) && lc(x.number) === lc(i.number))));
}
function figuresMissing(i){ return i.type === 'Pay application' && [i.contract || null, i.earned, i.retainHeld, i.previous].some(v => v == null); }
function reconIssues(i){
  const issues = [];
  if (duplicate(i)) issues.push('Possible duplicate vendor and invoice number.');
  if (i.type !== 'Pay application') return issues;
  if (!i.commitment || !i.c) issues.push('No Procore commitment matched; assign the subcontract.');
  if (figuresMissing(i)) { issues.push('Application figures incomplete; key them from the PDF.'); return issues; }
  const refs = [i.procoreAmount, i.ceAmount].filter(v => v != null);
  if (refs.some(v => Math.abs(v - i.contract) > .01))
    issues.push('Revised contract amounts do not match across the pay app, Procore, and ComputerEase.');
  if (i.ledgerPrevious != null && Math.abs(i.previous - i.ledgerPrevious) > .01)
    issues.push('Previous-paid amount does not match ComputerEase (prior certified).');
  const want = i.retAt(i.earned);
  if (want != null && Math.abs(want - i.retainHeld) > 1) issues.push('Retainage held differs from the subcontract terms.');
  if (Math.abs((i.earned - i.retainHeld - i.previous) - i.amount) > .01)
    issues.push('Submitted current due does not match the pay application calculation.');
  /* Against THEIR contract it is a form error and stops at intake. Against
     Procore's (lower) revised contract it is the contract discrepancy above,
     which rides through to the PM - Specialty PR2 billed a pre-CO contract. */
  if (i.contract && i.earned > i.contract + .01) issues.push('Completed and stored amount exceeds the revised contract.');
  return issues;
}
/* Same asymmetry as the demo: duplicates, math and missing data stop at intake;
   contract, prior-billing and retainage discrepancies ride through to the PM. */
function intakeBlockingIssues(i){
  return reconIssues(i).filter(x => !x.startsWith('Revised contract amounts') && !x.startsWith('Previous-paid amount')
                                 && !x.startsWith('Retainage held'));
}
function recon(i){
  if (i.type !== 'Pay application') return '<p class="muted">Regular invoice: three-way pay application reconciliation does not apply.</p>';
  const cell = (v, ok) => v == null ? '<strong class="mismatch">Unavailable</strong>'
                                     : '<strong class="' + (ok ? 'match' : 'mismatch') + '">' + money(v) + '</strong>';
  const L = i.ledger;
  return '<div class="recon-row"><span>Pay app · adjusted contract</span><strong>' + money(i.contract) + '</strong></div>'
    + '<div class="recon-row"><span>Procore · commitment revised</span>' + cell(i.procoreAmount, i.procoreAmount != null && Math.abs(i.procoreAmount - i.contract) < .01) + '</div>'
    + '<div class="recon-row"><span>ComputerEase · subcontract SOV</span>' + cell(i.ceAmount, i.ceAmount != null && Math.abs(i.ceAmount - i.contract) < .01) + '</div>'
    + '<p class="muted">Procore as of ' + esc(fmtTime(LIVE.cMeta && LIVE.cMeta.generated_at)) + ' · CE SOV as of ' + esc(fmtTime(LIVE.expected && LIVE.expected.generated_at)) + '.</p>'
    + '<div class="recon-row"><span>Pay app · previous payments</span><strong>' + money(i.previous) + '</strong></div>'
    + '<div class="recon-row"><span>ComputerEase · previous certified</span>' + cell(i.ledgerPrevious, i.ledgerPrevious != null && Math.abs(i.previous - i.ledgerPrevious) < .01) + '</div>'
    + '<p class="muted">Sum of CE payable on the commitment\'s earlier invoices (Subcontractor Detail Report)'
    + (L.available ? ', as of ' + esc(L.asOf || '?') : ' &mdash; ' + esc(L.why)) + '. Cash actually paid on them: '
    + (i.ledgerPaid == null ? 'unavailable' : money(i.ledgerPaid)) + '. Previous certified, not cash paid, is what the form\'s line must equal.</p>'
    + (i.ceHolds ? '<p class="mismatch">ComputerEase already holds this application (' + esc(i.ceSuggest) + '). It was entered before dashboard approval.</p>' : '')
    + (i.previous != null && i.ledgerPrevious != null && Math.abs(i.previous - i.ledgerPrevious) > .01
        ? '<p class="mismatch">Accounting verifies CE is correct for the selected commitment and payment basis. If the application is wrong, the PM marks it up and obtains a correction. If CE is wrong, accounting corrects its record.</p>' : '')
    + (i.compliance && i.compliance !== 'Yes' ? '<p class="mismatch">Billy: subcontractor is not compliant on this contract. Billing approval can proceed; payment release cannot.</p>' : '')
    + (i.compliance == null && i.c ? '<p class="muted">Billy: no compliance record for this contract.</p>' : '');
}
function calc(i){
  if (i.type !== 'Pay application' || figuresMissing(i)) return '';
  const want = i.retAt(i.earned);
  return '<div class="card calc"><details><summary>Show payment calculation</summary><div class="formula">'
    + '<div class="kv"><span>Completed & stored</span><strong>' + money(i.earned) + '</strong></div>'
    + '<div class="kv"><span>Less retainage (as submitted)</span><strong>− ' + money(i.retainHeld) + '</strong></div>'
    + '<div class="kv"><span>Less previous payments</span><strong>− ' + money(i.previous) + '</strong></div>'
    + '<div class="kv total"><span>Calculated current due</span><strong>' + money(round(i.earned - i.retainHeld - i.previous)) + '</strong></div>'
    + '<p class="muted">Submitted due: ' + money(i.amount) + '. Retainage per the subcontract ('
    + (i.retain == null ? 'no term' : i.retain + '%' + (i.thru50 ? ' through 50%' : ' throughout')) + '): '
    + (want == null ? 'unavailable' : money(round(want))) + '.'
    + (i.ledgerPrevious != null ? ' Due on CE previous certified: ' + money(round(i.earned - (want ?? i.retainHeld) - i.ledgerPrevious)) + '.' : '')
    + ' Correct arithmetic does not verify that the work or stored materials have been earned.</p></div></details></div>';
}

/* ---- source document ------------------------------------------------------- */
function documentPages(i){
  const pay = i.type === 'Pay application';
  let html = '<article class="paper" id="paper-1" style="font-size:' + (14 * docZoom / 100) + 'px"><div class="dochead"><div><h3>' + esc(i.vendor)
    + '</h3><small>' + esc(i.number) + ' · Revision ' + i.revision + '</small></div></div><h3>' + (pay ? 'Application for payment' : 'Invoice') + '</h3><p>'
    + esc(i.jobNumber + ' ' + i.job) + '<br>Commitment: ' + esc(i.commitment || 'not assigned') + '<br>Billing period: ' + esc(i.period || '—') + '</p><p>' + esc(i.description) + '</p>'
    + (i.parseNote ? '<p class="mismatch">' + esc(i.parseNote) + '</p>' : '')
    + (pay ? paperRow(i, 'revised', 'Adjusted contract', i.contract || null) + paperRow(i, 'earned', 'Completed & stored to date', i.earned)
            + paperRow(i, 'retain', 'Retainage held', i.retainHeld) + paperRow(i, 'previous', 'Previous payments', i.previous)
           : paperRow(i, 'invoice', 'Services / materials', i.amount))
    + paperRow(i, 'due', 'Current payment due', i.amount)
    + '<div class="page-num">Cover sheet figures as parsed or keyed at intake. The submitted PDF is not altered.</div></article>'
    + '<article class="paper" id="paper-2"><h3>Submitted document</h3>'
    + (i.pdfPath ? '<iframe id="pdfFrame" title="Submitted PDF" style="width:100%;height:70vh;border:1px solid #E8E6E7"></iframe>'
                 + '<p><a href="' + esc(QUEUE_DOCS + i.pdfPath) + '" target="_blank" rel="noopener">Open the PDF in SharePoint</a>'
                 + (i.messageLink ? ' · <a href="' + esc(i.messageLink) + '" target="_blank" rel="noopener">Open the original email</a>' : '') + '</p>'
                 : '<p class="muted">No PDF is filed against this row.</p>')
    + '<div class="page-num">Schedule of values lines are not extracted yet; review them on the PDF.</div></article>';
  setTimeout(() => loadPdf(i), 0);
  return html;
}
const pdfCache = {};
async function loadPdf(i){
  const el = document.getElementById('pdfFrame'); if (!el || !i.pdfPath) return;
  if (pdfCache[i.pdfPath]) { el.src = pdfCache[i.pdfPath]; return; }
  try {
    const tok = await token(); const q = LIVE.queue;
    const r = await fetch(GRAPH + '/sites/' + q.siteId + '/drive/root:/' + i.pdfPath.split('/').map(encodeURIComponent).join('/') + ':/content',
                          { headers: { Authorization: 'Bearer ' + tok } });
    if (!r.ok) return;
    pdfCache[i.pdfPath] = URL.createObjectURL(new Blob([await r.arrayBuffer()], { type: 'application/pdf' }));
    const now = document.getElementById('pdfFrame'); if (now) now.src = pdfCache[i.pdfPath];
  } catch (_) {}
}

function paperRow(i, key, label, value){
  const marks = marked(i, 1, key), can = isPmSeat(i) && i.status === 'PM review';
  return '<div class="kv ' + (marks.length ? 'marked-line' : '') + '" ' + (can ? 'onclick="addMarkup(1,\'' + key + '\')" role="button" tabindex="0" onkeydown="if(event.key===\'Enter\')addMarkup(1,\'' + key + '\')"' : '')
    + '><span>' + label + '</span><strong>' + (value == null ? '<span class="mismatch">not keyed</span>' : money(value)) + '</strong></div>' + annotationHTML(i, 1, key);
}
function commitDatalist(i){
  const list = LIVE.commitments.filter(c => !i.jobNumber || c.project_number === i.jobNumber || c.project === i.job);
  return '<datalist id="commitList">' + list.map(c => '<option value="' + esc(c.number) + '">' + esc(c.vendor + ' · ' + (c.title || '')) + '</option>').join('') + '</datalist>';
}

/* ---- grid fields ------------------------------------------------------------ */
function fillGridFields(i){ i.receivedDate = new Date(i.receivedAt).toISOString().slice(0, 10); }
function enrichMissing(i){ i.markups = i.markups || []; }

/* ---- intake actions --------------------------------------------------------- */
function pmChoices(i){
  const names = i.teamNames.length ? i.teamNames : pms;
  return names.map(n => '<option ' + (i.pm === n ? 'selected' : '') + '>' + esc(n) + '</option>').join('');
}
const emailOf = name => Object.keys(LIVE.pmName).find(e => LIVE.pmName[e] === name) || '';
function assignIntake(k, v){
  const i = item(); if (!i || !isAcctSeat() || i.status !== 'Intake') return;
  if (k === 'pm') { i.pm = v; i.pmEmail = emailOf(v); }
  if (k === 'job') {
    i.job = v;
    if (v === GL_JOB) { i.jobNumber = 'GL'; i.commitment = ''; }
    else { const c = LIVE.commitments.find(x => x.project === v); i.jobNumber = c ? c.project_number : ''; }
  }
  i.checks.previous = false; renderDetail();
}
function setCommitment(v){
  const i = item(); if (!isAcctSeat() || i.status !== 'Intake') return;
  const row = LIVE.queue.items.find(x => x.id === i.itemId);
  row.f = Object.assign({}, row.f, { Subcontract: v.trim().toUpperCase() });   // local until routed
  rebuild(); draw(); selected = i.id; renderDetail();
}
function intakeExtras(i){
  if (i.status !== 'Intake') return '';
  const dis = !isAcctSeat() ? 'disabled' : '';
  const sib = revisionCandidates(i);
  const freeApprover = i.jobNumber === 'GL' || !i.teamNames.length;
  return (freeApprover ? '<div class="field" style="flex-basis:100%;margin:6px 0 0"><label for="apprEmail">Approver email'
      + (i.jobNumber === 'GL' ? ' (overhead invoice)' : '') + '</label><input id="apprEmail" type="email" ' + dis
      + ' placeholder="name@baileyharris.com" value="' + esc(i.pmEmail || '') + '" onchange="setApprover(this.value)"></div>' : '')
    + '<button ' + dis + ' onclick="editFigures()">Key / correct figures</button>'
    + (sib.length ? '<button ' + dis + ' onclick="linkRevision()">Link as revision ' + (Math.max(...sib.map(s => s.revision)) + 1) + ' of ' + esc(sib[0].number) + '</button>' : '');
}
function setApprover(v){
  const i = item(); if (!i || !isAcctSeat() || i.status !== 'Intake') return;
  const e = lc(v);
  if (e && !/^[^@\s]+@baileyharris\.com$/.test(e)) { toast('Use a @baileyharris.com address.'); return; }
  if (e === i.pmEmail) return;
  i.pmEmail = e; i.pm = LIVE.pmName[e] || e || 'Unassigned'; i.checks.previous = false;
  setTimeout(renderDetail, 0);   // not inside the input's own change/blur
}
function revisionCandidates(i){
  return invoices.filter(x => x.id !== i.id && x.commitment && x.commitment === i.commitment
    && digits(x.number) && digits(x.number) === digits(i.number) && x.status !== 'Duplicate archived');
}
async function linkRevision(){
  const i = item(); const sib = revisionCandidates(i); if (!isAcctSeat() || !sib.length) return;
  const base = sib.sort((a, b) => a.revision - b.revision)[0];
  const rev = Math.max(...sib.map(s => s.revision)) + 1;
