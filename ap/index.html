    cell: x => rqStatusPill(x.status)
      + (x.ceState
          ? ' <span class="pill b" title="' + esc(x.ceState === 'exact'
              ? 'ComputerEase already carries this application at the amount asked for. It is entered; '
                + 'whether it has been PAID depends on the invoice ledger beside the figures.'
              : 'ComputerEase carries more against this subcontract than this application claims, so it '
                + 'is already entered and something else is on it too. Check the subcontract\'s invoices.')
            + '">in CE</span>'
          : '') },

  { k:'period',
    triage: false,
    facet: x => x.f.PeriodEnding ? billingPeriod(x.f.PeriodEnding) : 'not a billing period',
    h:'Period', tip:'Billing period the application covers, from its period ending.',
    sort: x => x.f.PeriodEnding ? String(x.f.PeriodEnding).slice(0,7) : '',
    find: x => x.f.PeriodEnding ? billingPeriod(x.f.PeriodEnding) : '',
    cell: x => x.f.PeriodEnding ? esc(billingPeriod(x.f.PeriodEnding))
                                : '<span class="muted">&mdash;</span>' },

/* A column hidden in triage is still filterable from review, and its filter
   keeps applying - hiding a column does not silently widen the view. */
const qcolShown = c => !(queueMode() === 'triage' && c.triage === false)
                    && !(c.full && !((STATE.me || {}).seesAll));

/* Oldest first is the queue's job, so age descending is the default. */
let QSORT = { k:'age', dir:-1 };
/* The order the review asked for. Done by permuting the array rather than
   rewriting it, so every column keeps the definition it was tested with. Any
   key not listed keeps its place at the end. */
const QCOL_ORDER = ['vendor','job','sub','desc','amount','invdate','status',
                    'with','age','overall','group','period'];
QCOLS.sort((a,b) => {
  const ia = QCOL_ORDER.indexOf(a.k), ib = QCOL_ORDER.indexOf(b.k);
  return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib);
});

const QFILT = {};      // column key -> Set of ticked facet values, or null

function qcolSort(rows){
  const c = QCOLS.find(c => c.k === QSORT.k) || QCOLS[5];
  return rows.slice().sort((a,b) => {
    const va = c.sort(a), vb = c.sort(b);
    let r;
    if (typeof va === 'number' && typeof vb === 'number') r = va - vb;
    else r = String(va).localeCompare(String(vb), undefined, { numeric:true });
    return r * QSORT.dir;
  });
}

/* ---- Excel-style column filters --------------------------------------------
   QFILT[k] is null when a column is unfiltered, or a Set of the facet values
   that are ticked. Facets for a column are computed from the rows that pass
   every OTHER column's filter, which is what Excel does - narrow by vendor and
   the Job Name list shrinks to that vendor's jobs rather than still offering
   you jobs that would return nothing. */
function qFacet(c, x){
  const v = c.facet ? c.facet(x) : String(c.find(x) || '').trim();
  return v === '' ? '(blank)' : String(v);
}
function qRowPasses(x, exceptKey){
  return QCOLS.every(c => {
    if (c.k === exceptKey) return true;
    const sel = QFILT[c.k];
    if (!sel) return true;
    return sel.has(qFacet(c, x));
  });
}
function qFacetCounts(c, rows){
  const m = new Map();
  rows.filter(x => qRowPasses(x, c.k)).forEach(x => {
    const v = qFacet(c, x); m.set(v, (m.get(v) || 0) + 1);
  });
  /* Order by the column's own sort value, so Age reads 1d, 2d, 19d rather than
     1d, 19d, 2d. Falls back to a numeric-aware text compare. */
  const rank = new Map();
  rows.forEach(x => { const v = qFacet(c, x); if (!rank.has(v)) rank.set(v, c.sort(x)); });
  return [...m.entries()].sort((a,b) => {
    if (a[0] === '(blank)') return 1;
    if (b[0] === '(blank)') return -1;
    const ra = rank.get(a[0]), rb = rank.get(b[0]);
    if (typeof ra === 'number' && typeof rb === 'number') return ra - rb;
    return String(ra == null ? a[0] : ra).localeCompare(String(rb == null ? b[0] : rb),
                                                        undefined, { numeric:true });
  });
}

let QF_OPEN = null;                       // the column whose panel is showing
function closeFilterPanel(){
  const p = document.getElementById('qfpanel');
  if (p) p.remove();
  QF_OPEN = null;
}
function openFilterPanel(el, colKey, th){
  const wasOpen = QF_OPEN === colKey;
  closeFilterPanel();
  if (wasOpen) return;                    // clicking the funnel again closes it
  QF_OPEN = colKey;
  const c = QCOLS.find(c => c.k === colKey);
  const rows = Object.values(QROWS);
  const facets = qFacetCounts(c, rows);
  const sel = QFILT[colKey];

  const p = document.createElement('div');
  p.id = 'qfpanel'; p.className = 'qfpanel';
  p.innerHTML =
      '<div class="qfsort"><button data-dir="1">Sort A &rarr; Z</button>'
    + '<button data-dir="-1">Sort Z &rarr; A</button></div>'
    + '<input class="qfsearch" placeholder="Search" autocomplete="off">'
    + '<label class="qfrow qfall"><input type="checkbox" data-all><span>(Select All)</span></label>'
    + '<div class="qflist">'
    + facets.map(([v,n]) =>
        '<label class="qfrow" data-fv="' + esc(v) + '"><input type="checkbox" data-v="' + esc(v) + '"'
        + (!sel || sel.has(v) ? ' checked' : '') + '><span>' + esc(v) + '</span>'
        + '<span class="qfn">' + n + '</span></label>').join('')
    + '</div>'
    + '<div class="qffoot"><a href="#" data-clear>Clear filter</a>'
    + '<span class="qfnote">' + facets.length + ' value' + (facets.length===1?'':'s') + '</span></div>';
  document.body.appendChild(p);

  const r = th.getBoundingClientRect();
  p.style.top = Math.round(r.bottom + 2) + 'px';
  /* Keep it on screen when the column is near the right edge. */
  p.style.left = Math.round(Math.min(r.left, window.innerWidth - p.offsetWidth - 12)) + 'px';

  const boxes = () => [...p.querySelectorAll('.qflist input[data-v]')];
  const visible = () => boxes().filter(b => b.closest('.qfrow').style.display !== 'none');
  const syncAll = () => {
    const v = visible(), on = v.filter(b => b.checked).length;
    const all = p.querySelector('input[data-all]');
    all.checked = on > 0 && on === v.length;
    all.indeterminate = on > 0 && on < v.length;
  };
  const commit = () => {
    const on = boxes().filter(b => b.checked).map(b => b.dataset.v);
    /* Everything ticked is the same as no filter, and showing a funnel on a
       column that excludes nothing is a lie. */
    QFILT[colKey] = on.length === boxes().length ? null : new Set(on);
    applyQueueFilter(el);
    markFilterHeaders(el);
  };

  p.querySelector('.qfsearch').oninput = ev => {
    const t = ev.target.value.trim().toLowerCase();
    p.querySelectorAll('.qflist .qfrow').forEach(row => {
      row.style.display = !t || row.dataset.fv.toLowerCase().includes(t) ? '' : 'none';
    });
    syncAll();
  };
  p.querySelector('input[data-all]').onchange = ev => {
    visible().forEach(b => { b.checked = ev.target.checked; });
    syncAll(); commit();
  };
  boxes().forEach(b => { b.onchange = () => { syncAll(); commit(); }; });
  p.querySelector('[data-clear]').onclick = ev => {
    ev.preventDefault(); QFILT[colKey] = null;
    boxes().forEach(b => { b.checked = true; });
    syncAll(); applyQueueFilter(el); markFilterHeaders(el);
  };
  p.querySelectorAll('.qfsort button').forEach(btn => {
    btn.onclick = () => { QSORT = { k: colKey, dir: Number(btn.dataset.dir) }; closeFilterPanel(); renderReceived(); };
  });
  syncAll();
  p.querySelector('.qfsearch').focus();

  setTimeout(() => {
    document.addEventListener('mousedown', function off(e){
      if (p.contains(e.target) || (th && th.contains(e.target))) return;
      document.removeEventListener('mousedown', off); closeFilterPanel();
    });
  }, 0);
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeFilterPanel(); });

function markFilterHeaders(el){
  el.querySelectorAll('th.qsort').forEach(th => {
    th.classList.toggle('qfon', !!QFILT[th.dataset.qs]);
  });
}

/* Hides rows in place rather than re-rendering, so an open panel and the page
   position both survive a filter change. */
function applyQueueFilter(el){
  const active = QCOLS.filter(c => QFILT[c.k]).length;
  let shown = 0, total = 0;
  el.querySelectorAll('tr.rqrow').forEach(tr => {
    total++;
    const x = QROWS[tr.dataset.rq];
    const ok = !x || qRowPasses(x, null);
    tr.style.display = ok ? '' : 'none';
    const d = tr.nextElementSibling;
    if (d && d.classList.contains('rqdetail')) d.style.display = ok ? '' : 'none';
    if (ok) shown++;
  });
  const n = el.querySelector('#qfiltn');
  if (n) n.innerHTML = active
    ? shown + ' of ' + total + ' shown &middot; <a href="#" id="qfclearall">clear filters</a>' : '';
  const ca = el.querySelector('#qfclearall');
  if (ca) ca.onclick = ev => { ev.preventDefault();
    QCOLS.forEach(c => { QFILT[c.k] = null; }); closeFilterPanel();
    applyQueueFilter(el); markFilterHeaders(el); };
}

/* row id -> row, so the filter can read a row's values without re-deriving them */
let QROWS = {};

/* The date to show in the Inv Date column. InvoiceDate wins when it is there -
   only a real invoice has one - and the period ending is the fallback, which is
   what every pay application carries. */
function effectiveInvDate(x){
  const i = x.f.InvoiceDate, p = x.f.PeriodEnding;
  if (i) return { v:i, src:'invoice' };
  if (p) return { v:p, src:'period' };
  return { v:null, src:null };
}

/* "Aug 2020" - the month of work the application covers, which is how CE and
   everyone in the office names a billing period. */
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function billingPeriod(v){
  const d = new Date(v); if (isNaN(d)) return '';
  return MON[d.getUTCMonth()] + ' ' + d.getUTCFullYear();
}
/* The Project Management Team in Procore, which is what scopes this queue. */
function groupAssigned(x){
  const n = (x.c && x.c.pm_team_names) || [];
  if (!n.length) return '\u2014';
  return n.length > 2 ? n[0] + ' +' + (n.length - 1) : n.join(', ');
}

const RQ_OPEN = new Set();
let HIDE_ENTERED = true;   // entered AND clean; never entered-and-wrong
let HIDE_NOTAPP  = true;   // invoices that are not pay applications
/* row id -> {cls,text}. Survives the re-render that follows a save. */
const RQ_MSG  = new Map();

function receivedRows(){
  const q = STATE.queue;
  if (!q || !q.items) return null;
  const byNum = {};
  for (const r of STATE.commitments) {
    const n = String(r.number || '').trim().toUpperCase();
    if (n) byNum[n] = r;
  }
  return q.items.map(f => {
    const num = String(f.Subcontract || '').trim().toUpperCase();
    const c = byNum[num] || null;
    /* Whether ComputerEase already carries this application, and how many of its
       figures disagree with the subcontract. An entered application with nothing
       wrong is finished work; one with something wrong still needs a person. */
    const ceRow = { state: null, exc: 0 };
    if (c) {
      const ee = payappExpected(c);
      const pre0 = { contract:f.AdjustedContract, billed:f.CompletedToDate, retNow:f.RetainageHeld,
                     prevPaid:f.PreviousPayments, due:f.BalanceDue, payReq:f.PayRequest };
      ceRow.state = ceEntryState(ee, pre0);
      try { ceRow.exc = correctionFigures(ee, pre0).lines.length; } catch (_) { ceRow.exc = 0; }
    }
    return {
      f, c,
      /* The list item id, not a field - a field can be edited, and an id that
         changes when you key a number in drops the row out of RQ_OPEN and
         collapses it on re-render. */
      id:       String(f._itemId || f.Title || f.MessageId || num || Math.random()),
      itemId:   f._itemId,
      vendor:   (c && c.vendor) || f.Vendor || '',
      job:      String(f.JobNumber || (c && c.project_number) || '').trim(),
      project:  (c && c.project) || '',
      number:   num,
      age:      daysSince(f.ReceivedAt),
      ceState:  ceRow.state, excCount: ceRow.exc,
      due:      f.BalanceDue == null ? null : Number(f.BalanceDue),
      status:   String(f.Status || 'received'),
    };
  });
}

/* The one-glance triage column. Only the adjusted contract is a FIXED check -
   completed-to-date is a range and retainage is derived, so neither can be
   called wrong from the list alone. Anything else here would be a false alarm. */
function rqCheck(x){
  if (!x.c) return ['<span class="pill" style="background:#e8e6e7;color:#484b4d" title="No commitment in Procore carries this subcontract number, so there is nothing to check it against. Usually a number mis-keyed on the form, or a commitment that was never created.">no commitment</span>', 3];
  /* A roster match was made from the vendor and project NAMED in the subject,
     not from a number on the document. It is the weakest basis we accept and the
     PM has to confirm it is their subcontract before anything else is believed. */
  if (String(x.f.MatchBasis || '') === 'roster')
    return ['<span class="pill y" title="No subcontract number appeared anywhere on this application. It was matched because the vendor and project named in the subject identified exactly one commitment. Confirm it is the right subcontract before checking the figures.">matched by name</span>', 2];
  /* Keyed on whether a number is present, NOT on MatchBasis - once someone
     types the number in below, the row is identified and must stop calling
     itself unidentified even though the pull's own basis still says unmatched. */
  if (!x.number)
    return ['<span class="pill y" title="No subcontract number was found on the form, in the subject or in the filename. Open the row and type it in.">unidentified</span>', 2];
  if (x.f.AdjustedContract == null)
    return ['<span class="pill y" title="No adjusted contract figure came off the PDF - usually a scan. The figures need keying by hand before this can be checked.">needs keying</span>', 2];
  const e = payappExpected(x.c);
  if (!e || e.contract == null) return ['<span class="muted">&mdash;</span>', 1];
  const d = Number(x.f.AdjustedContract) - e.contract;
  if (Math.abs(d) < 0.005) return ['<span class="pill g" title="Their adjusted contract agrees with Procore to the cent.">contract ties</span>', 0];
  return ['<span class="pill r" title="Their adjusted contract is ' + money2(Math.abs(d))
        + (d > 0 ? ' higher' : ' lower') + ' than Procore. Either a change order has not reached one of the systems, or they are billing against something we have not approved.">'
        + (d > 0 ? '+' : '&minus;') + money(Math.abs(d)) + '</span>', 4];
}

function renderReceived(){
  const el = document.getElementById('received');
  if (!el) return;
  const q = STATE.queue || {};
  const me = STATE.me || {};

  /* --- not built yet, or not reachable --- */
  const msg = t => { el.innerHTML = '<div class="rqwrap"><div class="rqmsg">' + t + '</div></div>';
                     setTabCount('received', 0); };
  if (!q.items) {
    const detail = '<div class="sub" style="margin-top:8px">Graph: <code>GET ' + esc(q.path || '')
      + '</code> &rarr; <b>HTTP ' + esc(String(q.status || '?')) + '</b>'
      + (q.err ? ' &mdash; ' + esc(String(q.err)) : '') + '</div>';
    if (q.reason === 'nosite') return msg(
      '<b>Graph cannot find <code>' + esc(SP_PATH_QUEUE) + '</code>.</b><br>'
      + 'A 404 means no site resolves at that path for this sign-in. Either the site is at a '
      + 'different URL than <code>' + esc(SP_PATH_QUEUE) + '</code>, or it was created so recently '
      + 'that Graph has not caught up. Everything else on this desk works without it.' + detail);
    if (q.reason === 'nosite403') return msg(
      '<b>The site exists, but this sign-in cannot read it.</b><br>'
      + 'A 403 is a permission answer, not a missing site. Either this page&rsquo;s app has no '
      + '<code>Sites.Selected</code> grant on <code>' + esc(SP_PATH_QUEUE) + '</code>, or the signed-in '
      + 'account has no access to the site itself &mdash; delegated access needs both.' + detail);
    if (q.reason === 'nolist') return msg(
      '<b>The site exists; the list does not.</b><br>'
      + 'Create a list called <code>' + esc(QUEUE_LIST) + '</code> on <code>' + esc(SP_PATH_QUEUE)
      + '</code>. Column names must carry no spaces &mdash; Graph writes by internal name, so '
      + '"Job Number" becomes <code>Job_x0020_Number</code> and the write fails.');
    return msg('<b>Could not read the queue.</b><br>'
      + esc(QUEUE_LIST) + ' on ' + esc(SP_PATH_QUEUE) + ' returned HTTP ' + esc(String(q.status || '?'))
      + '. If that is 403, this page&rsquo;s app has no <code>Sites.Selected</code> grant on that site yet. '
      + 'Ask ' + esc(CONTACT) + '.' + detail);
  }

  let rows = receivedRows() || [];
  const total = rows.length;

  /* --- scope to the viewer --- */
  let scopeNote = '';
  const seesAll = wsSeesAll(me);
  if (!seesAll) {
    if (!me.resolved) {
      return msg('<b>Could not confirm who you are.</b><br>Graph did not return your account, so '
        + 'nothing is shown rather than everything. Sign out and back in; if it persists, ask '
        + esc(CONTACT) + '.');
    }
    if (!anyPmTeamEmail()) {
      return msg('<b>No project in Procore carries a Project Management Team email address.</b><br>'
        + 'Scoping the queue to the right PMs depends on that, so nothing is shown rather than '
        + 'everything &mdash; this is a data gap, not an empty inbox. Procore team members need an '
        + 'email on the Project Management Team role before this tab can work for anyone outside '
        + 'Accounting. Ask ' + esc(CONTACT) + '.');
    }
    const asPm = viewAsPm();
    const mine = asPm ? viewAsProjectNumbers(asPm) : myProjectNumbers();
    if (!mine.size) {
      if (asPm) return msg('<b>No project lists ' + esc(asPm)
        + ' on its Project Management Team.</b><br>Their queue is empty because Procore does not '
        + 'name them on any job, not because nothing has arrived.');
      return msg('<b>No project lists you on its Project Management Team.</b><br>'
        + 'The queue is scoped by that role in Procore, so there is nothing here for '
        + esc(me.email) + '. If you run a job and this is wrong, you are missing from its '
        + 'Project Management Team in Procore &mdash; ask ' + esc(CONTACT) + ' to add you.');
    }
    rows = rows.filter(x => mine.has(x.job));
    scopeNote = asPm ? esc(asPm) + '\u2019s projects only' : 'your projects only';
  } else {
    scopeNote = 'all projects &middot; '
      + esc(VIEWAS === 'me' ? (me.dept || 'allowlisted') : 'viewing as ' + viewAsLabel());
  }

  /* --- the desk's own filters still apply --- */
  const projSel = document.getElementById('f-proj');
  const pmSel   = document.getElementById('f-pm');
  const qBox    = document.getElementById('f-q');
  const proj = projSel ? projSel.value : '';
  const pm   = pmSel ? pmSel.value : 'all';
  const term = qBox ? qBox.value.trim().toUpperCase() : '';
  if (proj && proj !== 'all') rows = rows.filter(x => x.project === proj);
  if (pm && pm !== 'all') rows = rows.filter(x => x.c && (x.c.pm_team_names || []).includes(pm));
  if (term) rows = rows.filter(x => (x.vendor + ' ' + x.number + ' ' + x.job).toUpperCase().includes(term));

  /* The rail and the cards count the whole queue as the viewer sees it, before
     the workspace slice - otherwise opening Corrections would report that there
     is nothing anywhere else. */
  renderWsCounts(rows);
  rows = rows.filter(x => wsMatches(x, WS));
  document.querySelectorAll('.nav[data-ws]').forEach(
    b => b.classList.toggle('active', TAB === 'received' && b.dataset.ws === WS));

  setTabCount('received', rows.length);

  if (!rows.length) {
    return msg(total
      ? '<b>Nothing here matches the current filters.</b><br>' + total
        + ' pay application' + (total === 1 ? '' : 's') + ' in the queue overall.'
      : '<b>Nothing in the queue.</b><br>No pay application has been imported from payables@ yet.');
  }

  /* Oldest first - this is a work queue, not a report. */
  /* Entered and clean is done. Entered and wrong stays - see 42025AU010, which
     CE holds at 28,155.60 against a contract that cannot support it. */
  const notApps = rows.filter(x => x.status === 'not a pay app');
  if (HIDE_NOTAPP) rows = rows.filter(x => x.status !== 'not a pay app');
  const settled = rows.filter(x => x.ceState && !x.excCount);
  if (HIDE_ENTERED) rows = rows.filter(x => !(x.ceState && !x.excCount));

  rows = qcolSort(rows);
  const sum = rows.reduce((t,x) => t + (x.due || 0), 0);
  /* A scan carries no figures. Totalling those as zero reads as 'they are asking
     for nothing', which is the opposite of the truth - they are asking for an
     amount nobody has keyed yet. */
  const withFig = rows.filter(x => x.due != null).length;

  const details = [];
  const body = rows.map(x => {
    const [chk] = rqCheck(x);
    const a = x.age;
    const acls = a == null ? 'a0' : a > 7 ? 'a2' : a > 3 ? 'a1' : 'a0';
    const open = RQ_OPEN.has(x.id);
    const head =
      '<tr class="rqrow' + (open ? ' rqopen' : '') + '" data-rq="' + esc(x.id) + '">'
      + QCOLS.filter(qcolShown).map(c => '<td' + (c.cls ? ' class="' + c.cls + '"' : '') + '>' + c.cell(x) + '</td>').join('')
      + '</tr>';
    if (!open) return head;

    const pre = {
      contract: x.f.AdjustedContract, billed: x.f.CompletedToDate,
      retNow:   x.f.RetainageHeld,    prevPaid: x.f.PreviousPayments,
      due:      x.f.BalanceDue,       // needed to back the current request out of CE
      payReq:   x.f.PayRequest,       // to find this application in the CE ledger
    };
    const note = x.f.ParseNote ? '<div class="rqnote">&#9888;&nbsp;' + esc(x.f.ParseNote) + '</div>' : '';
    const links = []
      .concat(x.f.PdfPath ? ['<a class="rqlink" href="' + esc(QUEUE_DOCS + x.f.PdfPath) + '" target="_blank" rel="noopener">Open the pay app PDF &rarr;</a>'] : [])
      .concat(x.f.MessageLink ? ['<a class="rqlink" href="' + esc(x.f.MessageLink) + '" target="_blank" rel="noopener">Open the original mail &rarr;</a>'] : [])
      .join(' &nbsp;&middot;&nbsp; ');
    if (queueMode() === 'triage') {
      details.push({ x, details: triageActions(x) + triagePanel(x),
                     source: documentPages(x), activity: statusTrail(x) });
      return head;
    }
    const trail = statusTrail(x);
    const panel = x.c ? payappPanel(x.c, pre, x.id)
      : '<div class="rqmsg" style="padding:16px 0">No commitment in Procore carries <b>'
        + esc(x.number || 'this number') + '</b>, so there is nothing to check these figures against.</div>';
    /* Correcting a row by hand. The pull cannot read a scan, and roughly 142 of
       252 rows arrived with no figures and often no number - so the queue is
       only workable if a person can finish the identification here. The write
       goes through this page's MSAL session, so SharePoint records WHO changed
       it in the item's version history. That is the audit trail; nothing extra
       is built for it. */
    const F = (key, label, value, type) =>
      '<label>' + label + '<input data-f="' + key + '" type="' + (type||'text') + '"'
      + ' value="' + esc(value == null ? '' : String(value)) + '"'
      + (value ? '' : ' class="miss"') + '></label>';
    const editor = !x.itemId ? '' :
      '<div class="rqedit" data-edit="' + esc(x.id) + '">'
      + '<h4>Identify this application</h4>'
      + '<div class="hint">Amber fields came back empty from the PDF. Filling the subcontract number matches it to a commitment and shows it to that job&rsquo;s PMs.</div>'
      + '<div class="fields">'
      +   F('Subcontract', 'Subcontract #', x.f.Subcontract)
      +   F('JobNumber',   'Job',           x.f.JobNumber)
      +   F('PayRequest',  'Pay request #', x.f.PayRequest)
      +   F('PeriodEnding','Period ending', (x.f.PeriodEnding||'').slice(0,10), 'date')
      +   F('InvoiceDate','Invoice date', (x.f.InvoiceDate||'').slice(0,10), 'date')
      +   '<button data-save="' + esc(x.id) + '">Save</button>'
      +   '<span class="msg"></span>'
      + '</div></div>';

    details.push({ x, activity: trail, source: documentPages(x),
      details: editor + note + panel
        + (links ? '<div style="margin-top:10px">' + links + '</div>' : '') });
    return head;
  }).join('');

  /* Their guide block, keyed to our status vocabulary. The words are theirs -
     this is the instruction the seat is given before it does anything. */
  const DESK_GUIDE = {
    'received':
      '<strong>Accounting seat \u00b7 intake only</strong>Assign the job and commitment. Review the '
      + 'automatic checks, verify the ComputerEase previous-paid reference and flag application '
      + 'discrepancies for the PM; a contract mismatch involves the process manager. Nothing is '
      + 'entered in ComputerEase yet.',
    'AP verified':
      '<strong>PM seat \u00b7 verify what has been earned</strong>Review the document and the '
      + 'figures. Expand the calculation to see how the payment is derived.',
    'with PM':
      '<strong>PM seat \u00b7 verify what has been earned</strong>Review the document and the '
      + 'figures. Expand the calculation to see how the payment is derived.',
    'revise and resubmit':
      '<strong>Correction pending \u00b7 the subcontractor owns the next step</strong>Obtain a '
      + 'corrected application, which returns through intake and needs fresh approval.',
    'PM returned':
      '<strong>Correction pending \u00b7 Accounting owns the next step</strong>Resolve the '
      + 'accounting record or the coding, then return it through intake.',
    'PM approved':
      '<strong>Accounting seat \u00b7 approved, not entered</strong>Recheck the system references '
      + 'before recording the ComputerEase entry. A changed reference blocks entry and returns the '
      + 'document for review.',
    'approved as noted':
      '<strong>Accounting seat \u00b7 approved with an exception recorded</strong>Recheck the '
      + 'references before recording the entry.',
    'approved and entered':
      '<strong>Accounting entry recorded</strong>Approval and accounting entry are separate from '
      + 'payment.',
    'not a pay app':
      '<strong>Not a pay application</strong>Worked as an ordinary invoice.',
  };

  /* One row open at a time: a drawer has one position, and two open rows would
     mean two detail panels fighting over it. */
  const openOne = details.find(d => RQ_OPEN.has(d.x.id)) || null;
  const drawer = (() => {
    if (!openOne) return '';
    const x = openOne.x, f = x.f;
    const pay = (f.DocType || 'pay app') !== 'invoice';
    const ttl = esc(x.vendor || '(no vendor)');
    let comments = [];
    try { comments = JSON.parse(f.Comments || '[]'); } catch (_) { comments = []; }
    if (!Array.isArray(comments)) comments = [];
    const pane = (k, on, html) =>
      '<div class="dpane' + (on ? ' on' : '') + '" data-dpane="' + k + '">' + html + '</div>';

    return '<div class="overlay">'
      + '<section class="drawer" role="dialog" aria-modal="true" aria-label="Invoice review">'
      + '<header class="drawerheader"><div>'
      +   '<div class="eyebrow">' + esc(String(f.PayRequest || f.Title || '')) + ' \u00b7 '
      +     (pay ? 'Pay application' : 'Invoice') + ' \u00b7 Revision '
      +     esc(String(f.Revision || 1)) + '</div>'
      +   '<h2>' + ttl + '</h2>'
      +   '<span class="muted">' + esc([x.job, f.AssignedApprover || groupAssigned(x)]
            .filter(Boolean).join(' \u00b7 ')) + '</span>'
      + '</div>'
      + '<div class="closegroup">' + rqStatusPill(x.status)
      +   '<button aria-label="Close review" data-drawerx>&#10005;</button></div>'
      + '</header>'
      + '<div class="drawerbody" data-rqd="' + esc(x.id) + '">'
      +   '<div class="sourcecol">' + (openOne.source || '') + '</div>'
      +   '<div>'
      +     '<div class="guide">' + (DESK_GUIDE[x.status] || '') + '</div>'
      +     '<div class="tabs">'
      +       '<button class="dtab active" data-dtab="details">Review</button>'
      +       '<button class="dtab" data-dtab="discussion">Discussion ('
      +         comments.length + ')</button>'
      +       '<button class="dtab" data-dtab="activity">Activity</button>'
      +     '</div>'
      +     pane('details', true, '<div class="card">' + openOne.details + '</div>')
      +     pane('discussion', false, '<div class="card"><h3>Discussion</h3>'
            + (comments.length
                ? comments.map(c => '<div class="note"><strong>' + esc(c.who || 'someone')
                    + '</strong><p>' + esc(c.text || '') + '</p>'
                    + '<div class="muted">' + esc(shortDate(c.at)) + '</div></div>').join('')
                : '<p class="muted">No comments yet.</p>')
            + '<p class="muted" style="margin-top:14px">The composer is not wired up yet. The '
            + '<code>Comments</code> column holds {who, at, text}; writing to it is the next '
            + 'piece.</p></div>')
      +     pane('activity', false, '<div class="card"><h3>Activity</h3>'
            + (openOne.activity || '<p class="muted">No status history on this row.</p>')
            + '</div>')
      +   '</div>'
      + '</div></section></div>';
  })();

  /* What this desk is for, in the words of the process the VP signed off. It
     says "intake only" because the single most expensive mistake available here
     is keying something into ComputerEase before a PM has seen it.
     (Lost once already: it was defined inside a block I replaced wholesale, and
     the page died on "duties is not defined" before anything rendered.) */
  const duties = queueMode() !== 'triage' ? '' :
      '<div class="demo"><div><strong>Accounting duties \u00b7 intake only</strong> '
    + 'Assign the job and the commitment \u2014 subcontract or PO. Review the automatic checks, '
    + 'verify the ComputerEase previous-paid reference, and flag application discrepancies for '
    + 'the PM. A contract mismatch involves the process manager. '
    + 'Nothing is entered into ComputerEase at this stage.</div></div>';

  el.innerHTML = duties + '<div class="panel">'
    + '<div class="toolbar"><span class="rqcount">' + rows.length + ' pay application'
    +   (rows.length === 1 ? '' : 's') + '</span>'
    +   '<span>' + (withFig
          ? money(sum) + ' requested' + (withFig < rows.length
              ? ' &middot; ' + (rows.length - withFig) + ' not yet keyed' : '')
          : 'no figures keyed yet') + '</span>'
    +   '<span>&middot;</span><span>' + scopeNote + '</span>'
    +   (settled.length
          ? '<span>&middot;</span><span>' + settled.length + ' already entered in ComputerEase'
            + ' and agreeing &middot; <a href="#" id="togentered">'
            + (HIDE_ENTERED ? 'show' : 'hide') + '</a></span>'
          : '')
    +   (notApps.length
          ? '<span>&middot;</span><span title="Not pay applications. They stay in payables@ for '
            + 'Drew to work there - nothing was moved anywhere, this queue just stops showing them.">'
            + notApps.length + ' not a pay app &middot; <a href="#" id="tognotapp">'
            + (HIDE_NOTAPP ? 'show' : 'hide') + '</a></span>'
          : '')
    +   '<span>&middot;</span><span class="qmode">'
    +   (queueMode() === 'triage' ? '<b>Triage</b> &middot; <a href="#" id="qmodesw">review</a>'
                                  : '<a href="#" id="qmodesw">triage</a> &middot; <b>Review</b>') + '</span>'
    +   '<span id="qfiltn"></span>'
    +   '<span style="margin-left:auto">'
    +   esc((QCOLS.find(c => c.k === QSORT.k) || {}).h || '') + (QSORT.dir > 0 ? ' \u25b2' : ' \u25bc')
    +   '</span></div>'
    + '<table class="rqtab"><thead><tr>'
    +   QCOLS.filter(qcolShown).map(c => '<th class="qsort' + (c.cls ? ' ' + c.cls : '')
          + (QSORT.k === c.k ? ' on' : '') + '" data-qs="' + c.k + '"'
          + (c.tip ? ' title="' + esc(c.tip) + '"' : '') + '>'
          + '<span class="qfh">' + c.h
          + (QSORT.k === c.k ? (QSORT.dir > 0 ? ' \u25b2' : ' \u25bc') : '') + '</span>'
          + '<button class="qffun" data-qfun="' + c.k + '" title="Filter this column"'
          + ' aria-label="Filter ' + esc(c.h) + '">\u25be</button>'
          + (c.h2 ? '<div class="rqth2">' + c.h2 + '</div>' : '') + '</th>').join('')
    + '</tr></thead><tbody>' + body + '</tbody></table></div>';

  QROWS = {}; rows.forEach(r => { QROWS[r.id] = r; });

  /* The drawer is part of this element and every handler below queries off
     it, so it has to exist before any of them bind. Inserted after the
     handlers, the triage buttons and the intake checkboxes were dead. */
  el.insertAdjacentHTML('beforeend', drawer);

  el.querySelectorAll('th.qsort').forEach(th => {
    th.onclick = () => {
      const k = th.dataset.qs;
      /* Same column toggles direction; a new column starts descending for
         numbers and ascending for text, which is what people expect. */
      if (QSORT.k === k) QSORT.dir = -QSORT.dir;
      else { const c = QCOLS.find(c => c.k === k); QSORT = { k, dir: c && c.cls === 'n' ? -1 : 1 }; }
      renderReceived();
    };
  });
  el.querySelectorAll('button[data-qfun]').forEach(btn => {
    btn.onclick = ev => {
      ev.stopPropagation();                        // the funnel filters, it does not sort
      openFilterPanel(el, btn.dataset.qfun, btn.closest('th'));
    };
  });
  markFilterHeaders(el);
  applyQueueFilter(el);

  const sw = el.querySelector('#qmodesw');
  if (sw) sw.onclick = ev => { ev.preventDefault();
    QMODE = queueMode() === 'triage' ? 'review' : 'triage'; RQ_OPEN.clear(); renderReceived(); };

  el.querySelectorAll('.tract button[data-tr]').forEach(btn => {
    btn.onclick = async () => {
      const row = rows.find(r => r.id === btn.dataset.tr);
      const act = TRIAGE_ACTIONS.find(a => a.k === btn.dataset.trk);
      const msgEl = btn.parentNode.querySelector('.msg');
      if (!row || !act) return;
      if (!row.itemId) { msgEl.className = 'msg bad';
                         msgEl.textContent = 'This row has no list item behind it.'; return; }
      btn.parentNode.querySelectorAll('button').forEach(b => { b.disabled = true; });
      RQ_MSG.set(row.id, { cls:'', text:'Saving\u2026' }); paintSaveNotes(el);
      const res = await saveQueueItem(row.itemId, statusPatch(row, act.status));
      btn.parentNode.querySelectorAll('button').forEach(b => { b.disabled = false; });
      if (res && typeof res === 'object') {
        Object.assign(row.f, res.stored || { Status: act.status });
        row.status = act.status;
        RQ_MSG.set(row.id, { cls:'ok', text: res.warn || ('Moved to \u201c' + act.status + '\u201d.') });
        setTimeout(renderReceived, 400);
      } else {
        RQ_MSG.set(row.id, { cls:'bad', text:'Not saved \u2014 ' + res });
      }
      paintSaveNotes(el);
    };
  });

  el.querySelectorAll('input[data-ick]').forEach(cb => {
    cb.onchange = () => {
      const id = cb.dataset.icr;
      const set = RQ_CHECKED.get(id) || new Set();
      if (cb.checked) set.add(cb.dataset.ick); else set.delete(cb.dataset.ick);
      RQ_CHECKED.set(id, set);
      /* Only the routing button's state changes, so the panel is left alone -
         a re-render here would close the drawer under the pointer. */
      const row = rows.find(r => r.id === id);
      const btn = el.querySelector('button[data-tr="' + CSS.escape(id) + '"][data-trk="topm"]');
      if (row && btn) btn.disabled = !intakeReady(row);
    };
  });

  const tna = el.querySelector('#tognotapp');
  if (tna) tna.onclick = ev => { ev.preventDefault(); HIDE_NOTAPP = !HIDE_NOTAPP; renderReceived(); };

  const tog = el.querySelector('#togentered');
  if (tog) tog.onclick = ev => { ev.preventDefault(); HIDE_ENTERED = !HIDE_ENTERED; renderReceived(); };

  el.querySelectorAll('tr.rqrow').forEach(tr => {
    tr.onclick = () => {
      const id = tr.dataset.rq;
      const was = RQ_OPEN.has(id);
      RQ_OPEN.clear(); RQ_MSG.delete(id);          // one at a time
      if (!was) RQ_OPEN.add(id);
      renderReceived();
    };
  });

  el.querySelectorAll('.paper-tabs button[data-paper]').forEach(b => b.onclick = ev => {
    ev.stopPropagation();
    const p = el.querySelector('#paper-' + b.dataset.paper);
    if (p) p.scrollIntoView({ behavior:'smooth', block:'nearest' });
  });

  const shut = () => { RQ_OPEN.clear(); renderReceived(); };
  const xBtn = el.querySelector('[data-drawerx]');
  if (xBtn) xBtn.onclick = shut;
  const veil = el.querySelector('.overlay');
  if (veil) veil.onclick = shut;
  el.querySelectorAll('.dtab').forEach(b => b.onclick = () => {
    el.querySelectorAll('.dtab').forEach(t => t.classList.toggle('active', t === b));
    el.querySelectorAll('.dpane').forEach(p =>
      p.classList.toggle('on', p.dataset.dpane === b.dataset.dtab));
  });

  /* The detail row sits inside the table; without this a click on an input
     bubbles to the row handler and collapses the thing being typed into. */
  el.querySelectorAll('.drawer').forEach(d => d.onclick = e => e.stopPropagation());

  paintSaveNotes(el);

  el.querySelectorAll('.rqedit button[data-save]').forEach(btn => {
    btn.onclick = async () => {
      const box = btn.closest('.rqedit');
      const msgEl = box.querySelector('.msg');
      const row = rows.find(r => r.id === btn.dataset.save);
      if (!row) return;
      const patch = {};
      box.querySelectorAll('input[data-f]').forEach(i => {
        const k = i.dataset.f;
        let v = i.value.trim();
        if (k === 'Subcontract') v = v.toUpperCase();
        const isDate = (k === 'PeriodEnding' || k === 'InvoiceDate');
        if (isDate && v) v = new Date(v + 'T00:00:00Z').toISOString();
        const was = row.f[k] == null ? '' : String(isDate ? String(row.f[k]).slice(0,10) : row.f[k]);
        const now = isDate ? v.slice(0,10) : v;
        if (now !== was) patch[k] = v || null;
      });
      if (!Object.keys(patch).length) { msgEl.className = 'msg'; msgEl.textContent = 'Nothing changed.'; return; }
      btn.disabled = true; msgEl.className = 'msg'; msgEl.textContent = 'Saving\u2026';
      const res = await saveQueueItem(row.itemId, patch);
      btn.disabled = false;
      if (res && typeof res === 'object') {
        /* Take what SharePoint actually holds, not what we hoped it took. */
        Object.assign(row.f, res.stored || patch);
        RQ_MSG.set(row.id, { cls: 'ok', text: res.warn || 'Saved.' });
        setTimeout(renderReceived, 400);
      } else {
        RQ_MSG.set(row.id, { cls: 'bad', text: 'Not saved \u2014 ' + res });
      }
      paintSaveNotes(el);
    };
  });
  /* The figures keyed into the "theirs" column are a reading of the PDF, so they
     belong in the list next to the ones the parser managed - not thrown away on
     the next render. */
  const PA_FIELD = { contract:'AdjustedContract', billed:'CompletedToDate',
                     retNow:'RetainageHeld', prevPaid:'PreviousPayments', due:'BalanceDue' };
  el.querySelectorAll('.rqrev button[data-savefigs]').forEach(btn => {
    btn.onclick = async () => {
      const row = rows.find(r => r.id === btn.dataset.savefigs);
      const msgEl = btn.parentNode.querySelector('.msg');
      if (!row) return;
      const tab = btn.closest('.pawrap').querySelector('table[data-pa]');
      const patch = {};
      Object.keys(PA_FIELD).forEach(k => {
        const i = tab.querySelector('input[data-k="' + k + '"]'); if (!i) return;
        const raw = i.value.replace(/[$,\s]/g,'');
        const v = raw === '' ? null : Number(raw);
        if (raw !== '' && isNaN(v)) return;
        const was = row.f[PA_FIELD[k]];
        const same = (v == null && (was == null || was === ''))
                  || (v != null && was != null && was !== '' && Math.round(Number(was)*100) === Math.round(v*100));
        if (!same) patch[PA_FIELD[k]] = v;
      });
      if (!Object.keys(patch).length) {
        RQ_MSG.set(row.id, { cls:'', text:'Nothing changed.' }); paintSaveNotes(el); return;
      }
      btn.disabled = true;
      RQ_MSG.set(row.id, { cls:'', text:'Saving\u2026' }); paintSaveNotes(el);
      const res = await saveQueueItem(row.itemId, patch);
      btn.disabled = false;
      if (res && typeof res === 'object') {
        Object.assign(row.f, res.stored || patch);
        RQ_MSG.set(row.id, { cls:'ok', text: res.warn || 'Figures saved.' });
        setTimeout(renderReceived, 400);   // headline recomputes from what was stored
      } else {
        RQ_MSG.set(row.id, { cls:'bad', text:'Not saved \u2014 ' + res });
      }
      paintSaveNotes(el);
    };
  });

  el.querySelectorAll('.rqrev button[data-noted]').forEach(btn => {
    btn.onclick = async () => {
      const row = rows.find(r => r.id === btn.dataset.noted);
      if (!row) return;
      if (!row.itemId) { RQ_MSG.set(row.id, { cls:'bad', text:'This row has no list item behind it.' });
                         return paintSaveNotes(el); }
      btn.disabled = true;
      RQ_MSG.set(row.id, { cls:'', text:'Saving\u2026' }); paintSaveNotes(el);
      const res = await saveQueueItem(row.itemId, statusPatch(row, 'approved as noted'));
      btn.disabled = false;
      if (res && typeof res === 'object') {
        Object.assign(row.f, res.stored || { Status:'approved as noted' });
        row.status = 'approved as noted';
        RQ_MSG.set(row.id, { cls:'ok', text: res.warn || 'Approved as noted.' });
        setTimeout(renderReceived, 400);
      } else RQ_MSG.set(row.id, { cls:'bad', text:'Not saved \u2014 ' + res });
      paintSaveNotes(el);
    };
  });

  el.querySelectorAll('.rqrev button[data-revise]').forEach(btn => {
    btn.onclick = async () => {
      const row = rows.find(r => r.id === btn.dataset.revise);
      if (!row) return;
      btn.disabled = true;
      try { await requestRevision(row, btn.parentNode.querySelector('.msg')); }
      catch (err) { const m = btn.parentNode.querySelector('.msg');
                    m.className = 'msg bad'; m.textContent = 'No draft created \u2014 ' + (err.message || err); }
      finally { btn.disabled = false; }
    };
  });

  /* Bind the deltas on whichever rows are expanded, so the pre-filled "theirs"
     figures are reconciled the moment the row opens rather than on first keypress. */
  rows.forEach(x => {
    if (!RQ_OPEN.has(x.id) || !x.c) return;
    const d = el.querySelector('[data-rqd="' + CSS.escape(x.id) + '"]');
    if (d) payappBind(d, x.c);
  });
}

/* PATCH one list item as the SIGNED-IN USER, not as an app. SharePoint then
   records the name against the change in the item's version history, which is
   the whole reason queue state lives in a list rather than in a JSON file. */
/* The editor is rebuilt by renderReceived, so anything written straight into
   the .msg span is lost on the next pass. Repaint from RQ_MSG instead. */
function paintSaveNotes(el){
  RQ_MSG.forEach((m, id) => {
    const sel = '.rqedit[data-edit="' + CSS.escape(id) + '"] .msg,'
              + ' .rqrev button[data-savefigs="' + CSS.escape(id) + '"] ~ .msg,'
              + ' .rqrev button[data-noted="' + CSS.escape(id) + '"] ~ .msg,'
              + ' .tract button[data-tr="' + CSS.escape(id) + '"] ~ .msg';
    el.querySelectorAll(sel).forEach(box => { box.className = 'msg ' + m.cls; box.textContent = m.text; });
  });
}

/* A field survived the round trip. Dates come back as full ISO whatever was
   sent, so they are compared on the day only. */
function sameFieldValue(got, sent){
  const s = x => String(x == null ? '' : x).trim();
  if (sent == null) return s(got) === '';
  if (/^\d{4}-\d{2}-\d{2}T/.test(s(sent)) || /^\d{4}-\d{2}-\d{2}T/.test(s(got)))
    return s(got).slice(0,10) === s(sent).slice(0,10);
  return s(got) === s(sent);
}

async function saveQueueItem(itemId, fields){
  const q = STATE.queue;
  if (!q || !q.siteId || !q.listId) return 'the queue list is not loaded';
  if (!itemId) return 'this row has no list item behind it';
  const url = GRAPH + '/sites/' + q.siteId + '/lists/' + q.listId
            + '/items/' + encodeURIComponent(itemId) + '/fields';
  try {
    const tok = await token();
    if (!tok) return 'not signed in';
    const r = await fetch(url,
      { method: 'PATCH',
        headers: { Authorization: 'Bearer ' + tok, 'Content-Type': 'application/json' },
        body: JSON.stringify(fields) });
    if (!r.ok) {
      let why = 'HTTP ' + r.status;
      try { const b = await r.json(); if (b && b.error && b.error.message) why += ' - ' + b.error.message; } catch (_) {}
      if (r.status === 403) why += ' (you need Contribute on the site, not just read)';
      return why;
    }
    /* A 200 is NOT proof the value landed. Graph writes columns by their
       INTERNAL name; a name that does not match one is accepted and dropped
       without complaint. Read the item back and say which fields did not
       stick, rather than printing "Saved." over a write that did nothing. */
    const v = await fetch(url, { headers: { Authorization: 'Bearer ' + tok } });
    if (!v.ok)
      return { warn: 'Saved, but it could not be read back to confirm (HTTP ' + v.status + ').' };
    const got = await v.json();
    const dropped = Object.keys(fields).filter(k => !sameFieldValue(got[k], fields[k]));
    if (dropped.length)
      return 'SharePoint accepted the request but stored nothing for '
           + dropped.join(', ') + ' \u2014 those column names do not match the list';
    return { stored: got };
  } catch (e) { return e.message || 'request failed'; }
}

/* Keep the top scrollbar the same width as the table and in step with the real
   one. Re-measured on every render and on resize, because the column widths
   change with the data. */
function syncTableScrollbars(){
  const wrap = document.getElementById('table');
  if (!wrap) return;
  const top = wrap.querySelector('.tablescroll-top');
  const bot = wrap.querySelector('.tablescroll');
  const spacer = top && top.firstElementChild;
  const tbl = bot && bot.querySelector('table');
  if (!top || !bot || !spacer || !tbl) return;
  spacer.style.width = tbl.scrollWidth + 'px';
  top.style.display = tbl.scrollWidth > bot.clientWidth + 1 ? '' : 'none';
  /* A scroll handler that writes to the other element fires its scroll event in
     turn; without the latch they ping-pong and the bar stutters under the
     pointer. */
  let latch = false;
  top.onscroll = () => { if (latch) return; latch = true; bot.scrollLeft = top.scrollLeft; latch = false; };
  bot.onscroll = () => { if (latch) return; latch = true; top.scrollLeft = bot.scrollLeft; latch = false; };
}
/* Attached once, not per render - re-adding it on every render leaks a listener
   for every filter change. */
window.addEventListener('resize', syncTableScrollbars);

function render(){
  const proj = document.getElementById('f-proj').value;
  const pm   = document.getElementById('f-pm').value;
  /* Either entry point opens the desk: one project, or one PM across every job
     they run. Only the two together being unset is the blank state. */
  /* The received queue is an INBOX: it is not gated on picking a project, because a
     PM opening the desk wants to see what has arrived for them across every job. */
  renderReceived();
  if (!proj && pm === 'all') {
    document.getElementById('cards').innerHTML = '';
    { const q = document.getElementById('queue'); if (q) q.innerHTML = ''; }
    document.getElementById('table').innerHTML =
      '<div class="empty" style="padding:38px 20px;line-height:1.7">'
      + '<b>Select a project</b> to see its AP status and pay app comparison'
      + '<div class="sub" style="margin-top:6px">&mdash; or pick a <b>PM</b> to see every job they run. '
      + 'Either gives you commitments, compliance, billed to date and the expected pay app '
      + 'for each subcontractor.</div></div>';
    return;
  }
  const comp = document.getElementById('f-comp').value;
  const q    = document.getElementById('f-q').value.trim().toUpperCase();

  let rows = STATE.commitments.filter(r => {
    if (proj && proj !== 'all' && r.project !== proj) return false;
    if (pm   !== 'all' && !((r.pm_team_names||[]).includes(pm))) return false;
    if (q && !(String(r.vendor).toUpperCase().includes(q) || String(r.number).toUpperCase().includes(q))) return false;
    if (comp !== 'all') {
      const c = complianceFor(r);
      const state = !c ? 'missing' : (c.billy_is_compliant === 'Yes' ? 'ok' : 'nc');
      if (comp !== state) return false;
    }
    return true;
  });

  const { col, dir } = STATE.sort;
  rows.sort((a,b) => {
    let x, y;
    if (col === 'ce_billed') { const ba=billingFor(a), bb=billingFor(b); x=(ba&&ba.ce_billed)||0; y=(bb&&bb.ce_billed)||0; }
    else if (col === 'ce_sov') { const ba=billingFor(a), bb=billingFor(b); x=(ba&&ba.ce_sov)||0; y=(bb&&bb.ce_sov)||0; }
    else if (col === 'pm_team') { x=(a.pm_team_names||[]).join(', '); y=(b.pm_team_names||[]).join(', '); }
    else { x = a[col]; y = b[col]; }
    if (typeof x === 'number' || typeof y === 'number') return ((x||0)-(y||0))*dir;
    return String(x||'').localeCompare(String(y||''))*dir;
  });

  const value = rows.reduce((s,r)=>s+(r.contract_value||0),0);
  const billed= rows.reduce((s,r)=>{ const b=billingFor(r); return s + ((b && b.ce_billed) || 0); },0);
  const left  = rows.reduce((s,r)=>{ const b=billingFor(r); return s + ((b && b.ce_balance) || 0); },0);
  const exc   = rows.filter(r=>{ const b=billingFor(r);
                  return b && (b.flags||[]).some(f=>['over_billed','contract_mismatch','sov_gap'].includes(f)); }).length;
  const cos   = rows.reduce((s,r)=>s+(r.approved_change_orders||0),0);
  /* Pending is summed from BOTH systems and shown as the larger, because a
     CO sitting in one and not the other is the thing worth noticing. */
  const pendPc= rows.reduce((s,r)=>s+(r.pending_change_orders||0),0);
  const pendCe= rows.reduce((s,r)=>{ const b=billingFor(r); return s+((b&&b.ce_pending_sov)||0); },0);
  const nc    = rows.filter(r => { const c = complianceFor(r); return c && c.billy_is_compliant !== 'Yes'; }).length;
  const noTerm= rows.filter(r => r.retainage_percent > 0 && !(r.retainage_duration||'').trim().match(/throughout|thru/i)).length;
  const noCe  = rows.filter(r => !r.ce_code).length;

  /* Contract, billed and left deliberately do NOT sum: billed and balance come
     from CE's SOV, contract value from Procore's revised, and the two disagree on
     20 commitments. Showing them as a progression would imply arithmetic that is
     not true, so they stay three separate figures. */
  const pctBilled = value ? Math.round(100 * billed / value) : null;
  const chip = (n, label, cls) => n
    ? `<span class="exchip ${cls}"><b>${n}</b> ${label}</span>` : '';
  const chips = chip(exc, 'billing exceptions', 'r') + chip(nc, 'non-compliant', 'r')
              + chip(noTerm, 'retainage term not set', 'y') + chip(noCe, 'no CE code', 'b');

  document.getElementById('cards').innerHTML = `
    <div class="cardcap">${rows.length} commitment${rows.length===1?'':'s'}</div>
    <div class="cardrow">
      <div class="card"><div class="n">${money(value)}</div><div class="l">Contract value</div>
        ${cos ? `<div class="s">includes ${money(cos)} in change orders</div>` : ''}</div>
      <div class="card ok"><div class="n">${money(billed)}</div><div class="l">Billed to date (CE)</div>
        ${pctBilled != null ? `<div class="s">${pctBilled}% of contract value</div>` : ''}</div>
      <div class="card gap"><div class="n">${money(left)}</div><div class="l">Left to bill</div>
        <div class="s">per ComputerEase schedules of values</div></div>
      <div class="card${pendPc || pendCe ? ' soon' : ''}"><div class="n">${money(Math.max(pendPc, pendCe))}</div>
        <div class="l">Pending change orders</div>
        <div class="s">${pendPc === pendCe
            ? 'raised but not approved &mdash; in none of the figures left of this'
            : 'Procore ' + money(pendPc) + ' &middot; CE ' + money(pendCe) + ' &mdash; the two disagree'}</div></div>
    </div>
    <div class="exrow">${chips || '<span class="exclear">&#10003; No exceptions on these commitments</span>'}</div>`;

  const cols = [
    ['project','Project','l'], ['number','Commitment','l'], ['vendor','Subcontractor','l'],
    ['compliance','Compliance',''],
    ['revised_contract','Rev contract &middot; Procore','num'], ['ce_sov','Rev contract &middot; CE','num'],
    ['ce_billed','Billed to date','num'],
    ['retainage_percent','Retainage',''], ['pm_team','PM','l']
  ];
  const head = cols.map(([k,label,cls]) =>
    `<th class="${cls}" data-col="${k}">${label}${STATE.sort.col===k ? (STATE.sort.dir>0?' ▲':' ▼') : ''}</th>`).join('');

  const body = rows.length ? rows.map(r => `<tr class="${(() => {
      const c = complianceFor(r);
      return !c ? 'nobilly' : (c.billy_is_compliant === 'Yes' ? '' : 'noncompliant');
    })()}">
      <td class="l wrap"><span title="${esc(r.project)}">${esc(shortProject(r.project))}</span>${r.project_number ? `<div class="sub">${esc(r.project_number)}</div>` : ''}</td>
      <td class="l"><a href="${esc(r.procore_url)}" target="_blank" rel="noopener">${esc(r.number||'—')}</a>
        ${(r.status || r.executed === 'No') ? `<div class="sub">${esc(r.status||'')}${
            r.executed === 'No' ? ' <span class="pill y" title="Not executed in Procore - the commitment has not been signed by both parties, so the contract value shown is not yet binding.">unexecuted</span>' : ''
          }</div>` : ''}
        ${(r.contract_value !== null && r.contract_value !== undefined && r.contract_value !== '')
            ? `<div class="sub" title="The subcontract as originally executed, before any change order. The revised figure is in the Rev contract &middot; Procore column; the difference is what has been added since signing.">orig ${money(r.contract_value)}</div>` : ''}
        ${r.billing_day ? `<div class="sub">bills ${esc(r.billing_day)}</div>` : ''}
        <div class="sub pacell"><button type="button" class="pabtn" aria-expanded="false" data-pa-for="${esc(r.number||'')}"
          title="Expected pay app: what their cover sheet should say, and the most they can ask for">pay app check</button></div></td>
      <td class="l wrap">${esc(r.vendor)}
        <div class="sub code">${r.ce_code ? esc(r.ce_code)
          : '<span class="warn" title="No Abbreviated Name in Procore - Accounting has nothing to key the entry on">no CE code</span>'}</div></td>
      <td>${compCell(r)}</td>
      <td class="num">${pcContractCell(r)}</td>
      <td class="num">${ceContractCell(r)}</td>
      <td class="num">${billedCell(r)}</td>
      <td>${retainageCell(r)}</td>
      <td class="l">${pmCell(r)}</td>
    </tr>`).join('') : `<tr><td colspan="9" class="empty">No commitments match these filters.</td></tr>`;

  document.getElementById('table').innerHTML =
    `<div class="tablescroll-top"><div></div></div>`
  + `<div class="tablescroll"><table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>`;
  syncTableScrollbars();

  renderQueue(rows);

  /* One expandable panel per commitment rather than more columns - the table is
     already nine wide and the check is something you open for one sub at a time. */
  document.querySelectorAll('button[data-pa-for]').forEach(btn => btn.onclick = () => {
    const tr = btn.closest('tr');
    if (tr.nextElementSibling && tr.nextElementSibling.classList.contains('parow')) {
      tr.nextElementSibling.remove(); btn.setAttribute('aria-expanded','false'); return;
    }
    const num = btn.dataset.paFor;
    const r = STATE.commitments.find(x => String(x.number||'').trim() === num);
    if (!r) return;
    const det = document.createElement('tr');
    det.className = 'parow';
    det.innerHTML = '<td colspan="10">' + payappPanel(r) + '</td>';
    tr.insertAdjacentElement('afterend', det);
    btn.setAttribute('aria-expanded','true');
    payappBind(det, r);
  });

  document.querySelectorAll('th[data-col]').forEach(th => th.onclick = () => {
    const c = th.dataset.col;
    STATE.sort = { col: c, dir: STATE.sort.col === c ? -STATE.sort.dir : 1 };
    render();
  });
}

    document.getElementById('f-pm').value = data.me.name;          // a PM lands on their own jobs
  const save = () => { JV_FILTERS.proj = document.getElementById('f-proj').value; JV_FILTERS.pm = document.getElementById('f-pm').value;
                       JV_FILTERS.comp = document.getElementById('f-comp').value; JV_FILTERS.q = document.getElementById('f-q').value; };
  ['f-proj','f-pm','f-comp'].forEach(id => document.getElementById(id).onchange = () => { save(); render(); });

}

<script>

const CLIENT_ID = '1825a1c0-1ce3-4078-aeb7-a4714562c422';

const LIVE = { me:null, commitments:[], cMeta:null, expected:null, ceInv:null, queue:null,
               byNum:{}, billing:{}, pmName:{}, loadedAt:null, error:null };

const msalApp = new msal.PublicClientApplication({
  auth: { clientId: CLIENT_ID, authority: 'https://login.microsoftonline.com/' + TENANT_ID,
          redirectUri: location.origin + '/ap/' },

async function token(){

async function g(tok, path, opts){

    Object.assign({ headers: { Authorization: 'Bearer ' + tok } }, opts || {}));

}
const lc = v => String(v || '').trim().toLowerCase();

/* ---- load ------------------------------------------------------------------ */
async function loadLive(){

async function loadQueue(tok){
  const site = await g(tok, '/sites/' + SP_HOST + ':' + SP_QUEUE);
  if (!site.ok) return { items: [], err: 'Could not reach ' + SP_QUEUE + ' (HTTP ' + site.status + ')' };

/* ---- the CE ledger: previous CERTIFIED, not cash paid ----------------------
   Sum of "Invoiced -> Payable" on the commitment's prior invoices, plus
   retention released since (paid above payable). Only from a FULL-HISTORY
   ledger - a --since export drops earlier invoices and would understate it. */
const ledgerFull = () => !!(LIVE.ceInv && LIVE.ceInv.subcontracts && LIVE.ceInv.has_payment_data !== false
                            && !(LIVE.ceInv.filters && LIVE.ceInv.filters.since));
const digits = v => String(v == null ? '' : v).replace(/[^0-9]/g, '');
function ledgerFor(num, payReq){
  if (!ledgerFull()) return { available: false, why: LIVE.ceInv ? 'CE ledger is partial history' : 'CE ledger not published' };
  const led = LIVE.ceInv.subcontracts[String(num || '').trim().toUpperCase()];
  const inv = (led && led.invoices) || [];
  const want = digits(payReq);
  const thisApp = want ? inv.filter(x => digits(x.number) === want) : [];
  const prior = inv.filter(x => !thisApp.includes(x));
  const n = v => Number(v || 0);
  const cert = xs => xs.reduce((t, x) => t + n(x.payable) + Math.max(0, n(x.paid) - n(x.payable)), 0);
  return { available: true, exists: !!led, prior: round(cert(prior)), paidPrior: round(prior.reduce((t, x) => t + n(x.paid), 0)),
           thisApp, invoices: inv, asOf: LIVE.ceInv.as_of || null };
}

/* ---- list item -> desk record ----------------------------------------------- */
const STATUS_IN = { 'received':'Intake', 'AP verified':'Intake', 'not a pay app':'Intake',
  'with PM':'PM review', 'revise and resubmit':'Correction needed', 'PM returned':'Correction needed',
  'PM approved':'Ready for entry', 'ready for entry':'Ready for entry', 'approved as noted':'Ready for entry',
  'approved and entered':'Entered', 'duplicate archived':'Duplicate archived' };
const parseJ = (s, d) => { try { const v = JSON.parse(s || ''); return v == null ? d : v; } catch (_) { return d; } };
const numOrNull = v => (v === null || v === undefined || v === '') ? null : Number(v);
const groupKey = f => String(f.OriginalTitle || f.Title || '').trim();
const fmtTime = iso => iso ? new Date(iso).toLocaleString('en-US', { month:'short', day:'numeric', hour:'numeric', minute:'2-digit' }) : '';

function buildRecord(x, allRows){
  const f = x.f;
  const num = String(f.Subcontract || '').trim().toUpperCase();
  const c = LIVE.byNum[num] || null, b = LIVE.billing[num] || null;
  const isInvoice = f.DocType === 'invoice' || f.Status === 'not a pay app';
  const log = parseJ(f.StatusLog, []), comments = parseJ(f.Comments, []);
  const lastCorr = [...log].reverse().find(e => e.k);
  const pmEmail = lc(f.AssignedApprover) || lc(((c && c.pm_team) || [])[0]);
  const rev = Number(f.Revision || 1);
  const status = STATUS_IN[f.Status] || 'Intake';
  const L = ledgerFor(num, f.PayRequest);
  const retPct = c && c.retainage_percent != null ? Number(c.retainage_percent) : null;
  const thru50 = !!c && /50/.test(c.retainage_duration || '') && /thru|through/i.test(c.retainage_duration || '');
  const procore = c ? numOrNull(c.revised_contract) : null;
  const removed = new Set(comments.filter(m => m.kind === 'unmark').map(m => m.ref));
  const i = {
    id: Number(x.id), itemId: x.id, etag: x.etag, f, c, b, ledger: L,
    vendor: f.Vendor || (c && c.vendor) || 'Unknown vendor',
    /* Title is the pull's dedup key ("msg|<internet message id>" when the PDF gave
       nothing) - never show it. No pay request number means no number. */
    number: f.PayRequest || '', type: isInvoice ? 'Invoice' : 'Pay application',
    job: f.JobNumber === 'GL' ? GL_JOB : ((c && c.project) || f.JobNumber || 'Unassigned'),
    jobNumber: f.JobNumber === 'GL' ? 'GL' : ((c && c.project_number) || f.JobNumber || ''),
    pm: LIVE.pmName[pmEmail] || pmEmail || 'Unassigned', pmEmail,
    team: ((c && c.pm_team) || []).map(lc), teamNames: (c && c.pm_team_names) || [],
    amount: Number(f.BalanceDue || 0), status, rawStatus: f.Status,
    commitment: num, description: f.Description || (isInvoice ? 'Invoice' : 'Pay application'),
    // pay application figures, exactly as submitted (parsed or keyed)
    contract: Number(f.AdjustedContract || 0), changes: 0,
    earned: numOrNull(f.CompletedToDate), retainHeld: numOrNull(f.RetainageHeld),
    previous: numOrNull(f.PreviousPayments),
    retain: retPct, thru50,
    retAt: v => (retPct == null || v == null) ? null : (thru50 ? Math.min(v, (procore ?? Number(f.AdjustedContract || 0)) / 2) : v) * retPct / 100,
    // references
    procoreAmount: procore, ceAmount: b && b.ce_sov != null ? Number(b.ce_sov) : null,
    ledgerPrevious: L.available ? (L.exists || (b && !(b.flags || []).includes('no_ce_subcontract')) ? L.prior : null) : null,
    ledgerPaid: L.available ? L.paidPrior : null,
    ceHolds: L.available && L.thisApp.length > 0,
    ceSuggest: L.available && L.thisApp.length ? (L.thisApp[0].raw_reference || L.thisApp[0].number) : '',
    compliance: c && c.compliance ? c.compliance.billy_is_compliant : null,
    checks: { previous: f.Status === 'AP verified' },
    notes: comments.filter(m => !m.kind || m.kind === 'comment' || m.kind === 'correction').map(m => ({ who: m.who, text: m.text })),
    markups: comments.filter(m => m.kind === 'markup' && (m.rev || 1) === rev && !removed.has(m.id))
                     .map(m => ({ id: m.id, page: m.page || 1, target: m.target, text: m.text, who: m.who, revision: m.rev || 1 })),
    audit: log.map(e => ({ who: e.by || 'Pipeline', action: (e.s ? 'Status: ' + e.s : '') + (e.note ? ' — ' + e.note : ''), time: fmtTime(e.at) })),
    correctionKind: lastCorr && lastCorr.k, correctionOwner: null,
    entrySnapshot: parseJ(f.ApprovedSnapshot, null), entryRechecked: false,
    reference: f.CEReference || '', revision: rev, versions: [], sov: [],
    received: fmtTime(f.ReceivedAt), receivedAt: f.ReceivedAt ? Date.parse(f.ReceivedAt) : Date.now(),
    stageEnteredAt: Date.parse(f.StatusChangedAt || f.ReceivedAt || '') || Date.now(),
    invoiceDate: f.InvoiceDate ? String(f.InvoiceDate).slice(0, 10) : '',
    dueDate: '', period: f.PeriodEnding ? new Date(f.PeriodEnding).toLocaleDateString('en-US', { month:'long', year:'numeric', timeZone:'UTC' }) : '',
    costCode: f.CostCode || '', pdfPath: f.PdfPath || '', messageLink: f.MessageLink || '',
    parseNote: f.ParseNote || '',
  };
  if (i.correctionKind) i.correctionOwner = i.correctionKind === 'system' ? 'Accounting'
                                          : i.correctionKind === 'contract' ? i.pm + ' / process manager' : i.pm;
  i.receivedDate = new Date(i.receivedAt).toISOString().slice(0, 10);
  return i;
}
function rebuild(){
  const rows = (LIVE.queue && LIVE.queue.items) || [];
  const recs = rows.map(x => buildRecord(x, rows));
  /* Revisions stay linked: rows sharing OriginalTitle are one document. The
     highest revision is the live record; earlier ones are its history. */
  const groups = {};
  for (const r of recs) (groups[groupKey(r.f)] = groups[groupKey(r.f)] || []).push(r);
  const live = [];
  for (const k in groups) {
    const g2 = groups[k].sort((a, b) => a.revision - b.revision || a.id - b.id);
    const head = g2[g2.length - 1];
    head.versions = g2.slice(0, -1).map(v => ({ revision: v.revision, amount: v.amount, earned: v.earned, previous: v.previous,
      contract: v.contract, changes: 0, retain: v.retain, sov: [], markups: parseJ(v.f.Comments, []).filter(m => m.kind === 'markup') }));
    live.push(head);
  }
  const prev = {}; for (const o of invoices) prev[o.id] = o;
  for (const r of live) { const o = prev[r.id]; if (o && o.status === r.status) { r.checks = Object.assign({}, o.checks, r.checks.previous ? { previous: true } : {}); r.entryRechecked = o.entryRechecked; } }
  invoices = live;
  jobs.length = 0; jobs.push(GL_JOB);
  [...new Set(LIVE.commitments.map(c => c.project).filter(Boolean))].sort().forEach(j => jobs.push(j));
  pms.length = 0; [...new Set(Object.values(LIVE.pmName))].sort().forEach(p => pms.push(p));
}

/* ---- seats: what you see vs what you may do --------------------------------- */
function roleOptions(){
  const me = LIVE.me || {};
  return me.isAccounting ? ['Accounting', ...pms] : [me.name];
}
const meIsPm = i => !!LIVE.me && !!i.pmEmail && LIVE.me.email === i.pmEmail;
const isPmSeat = i => meIsPm(i) && (role === i.pm || role === LIVE.me.name);
const isAcctSeat = () => role === 'Accounting' && !!(LIVE.me && LIVE.me.isAccounting);
const inScope = i => i.pm === role || i.teamNames.includes(role)
  || (!!LIVE.me && role === LIVE.me.name && i.pmEmail === LIVE.me.email);
/* An overhead invoice has no job and no commitment; it routes on the job field
   reading GL and an approver. A pay application always needs its commitment. */
const canRoute = i => i.type === 'Pay application' ? !!i.commitment : !!(i.commitment || i.jobNumber);

/* ---- write-back ------------------------------------------------------------- */
async function saveRow(i, fields, logEntry, comment){
  const q = LIVE.queue;
  if (!q || !q.siteId) { toast('The queue list is not loaded.'); return false; }
  const tok = await token(); if (!tok) return false;
  const base = '/sites/' + q.siteId + '/lists/' + q.listId + '/items/' + encodeURIComponent(i.itemId);
  const cur = await g(tok, base + '?$expand=fields');
  if (!cur.ok) { toast('Could not re-read this row (HTTP ' + cur.status + ').'); return false; }
  const f = cur.body.fields || {};
  const now = new Date().toISOString(), who = LIVE.me.name;
  const body = Object.assign({}, fields);
  if (logEntry) {
    const log = parseJ(f.StatusLog, []);
    if (!log.length && f.ReceivedAt) log.push({ s: f.Status || 'received', at: f.ReceivedAt });
    log.push(Object.assign({ at: now, by: who }, logEntry));
    body.StatusLog = JSON.stringify(log.slice(-60));
    if (fields.Status) body.StatusChangedAt = now;
  }
  if (comment) {
    const cm = parseJ(f.Comments, []);
    cm.push(Object.assign({ id: now + '-' + Math.random().toString(36).slice(2, 7), who, email: LIVE.me.email, at: now }, comment));
    body.Comments = JSON.stringify(cm);
  }
  const r = await fetch(GRAPH + base + '/fields', { method: 'PATCH',
    headers: { Authorization: 'Bearer ' + tok, 'Content-Type': 'application/json', 'If-Match': cur.body['@odata.etag'] || '*' },
    body: JSON.stringify(body) });
  if (r.status === 412) { toast('Someone else changed this row. Refreshing.'); await reloadLive(); return false; }
  if (!r.ok) { let why = 'HTTP ' + r.status; try { why += ' ' + ((await r.json()).error.message || ''); } catch (_) {}
               if (r.status === 403) why += ' (you need Contribute on the AP Desk site)'; toast('Not saved: ' + why); return false; }
  const got = await r.json();
  const dropped = Object.keys(body).filter(k => k !== 'StatusLog' && k !== 'Comments' && String(got[k] ?? '').slice(0, 10) !== String(body[k] ?? '').slice(0, 10));
  if (dropped.length) toast('SharePoint stored nothing for ' + dropped.join(', ') + ' — run Sync-PayAppListSchema-3.ps1.');
  const row = q.items.find(x => x.id === i.itemId); if (row) { row.f = got; }
  const keep = selected; rebuild(); draw(); if (keep && invoices.some(x => x.id === keep)) { selected = keep; renderDetail(); }
  return !dropped.length;
}
async function reloadLive(){ const keep = selected; try { await loadLive(); rebuild(); draw(); if (keep && invoices.some(x => x.id === keep)) openDetail(keep); toast('Refreshed'); } catch (e) { toast(e.message); } }

/* ---- reconciliation, on live references -------------------------------------- */
function duplicate(i){
  return invoices.some(x => x.id !== i.id && x.status !== 'Duplicate archived'
    && ((x.commitment && x.commitment === i.commitment && digits(x.number) && digits(x.number) === digits(i.number))
        || (!i.commitment && lc(x.vendor) === lc(i.vendor) && lc(x.number) === lc(i.number))));
}
function figuresMissing(i){ return i.type === 'Pay application' && [i.contract || null, i.earned, i.retainHeld, i.previous].some(v => v == null); }
function reconIssues(i){
  const issues = [];
  if (duplicate(i)) issues.push('Possible duplicate vendor and invoice number.');
  if (i.type !== 'Pay application') return issues;
  if (!i.commitment || !i.c) issues.push('No Procore commitment matched; assign the subcontract.');
  if (figuresMissing(i)) { issues.push('Application figures incomplete; key them from the PDF.'); return issues; }
  const refs = [i.procoreAmount, i.ceAmount].filter(v => v != null);
  if (refs.some(v => Math.abs(v - i.contract) > .01))
    issues.push('Revised contract amounts do not match across the pay app, Procore, and ComputerEase.');
  if (i.ledgerPrevious != null && Math.abs(i.previous - i.ledgerPrevious) > .01)
    issues.push('Previous-paid amount does not match ComputerEase (prior certified).');
  const want = cents(i.retAt(i.earned));
  if (want != null && Math.abs(want - i.retainHeld) > 1) issues.push('Retainage held differs from the subcontract terms.');
  if (Math.abs((i.earned - i.retainHeld - i.previous) - i.amount) > .01)
    issues.push('Submitted current due does not match the pay application calculation.');
  /* Against THEIR contract it is a form error and stops at intake. Against
     Procore's (lower) revised contract it is the contract discrepancy above,
     which rides through to the PM - Specialty PR2 billed a pre-CO contract. */
  if (i.contract && i.earned > i.contract + .01) issues.push('Completed and stored amount exceeds the revised contract.');
  return issues;
}
/* Same asymmetry as the demo: duplicates, math and missing data stop at intake;
   contract, prior-billing and retainage discrepancies ride through to the PM. */
function intakeBlockingIssues(i){
  return reconIssues(i).filter(x => !x.startsWith('Revised contract amounts') && !x.startsWith('Previous-paid amount')
                                 && !x.startsWith('Retainage held'));
}
/* ---- where every figure comes from (hover) ---------------------------------- */
const cents = v => v == null ? null : Math.round((v + Math.sign(v) * 1e-7) * 100) / 100;   // half-up, not float-down
const tip = t => ' title="' + esc(t) + '" tabindex="0" style="cursor:help;text-decoration:underline dotted;text-underline-offset:3px"';
const SRC = {
  payapp: i => 'From the pay application itself. ' + (/^keyed by hand/i.test(i.parseNote || '')
      ? i.parseNote : (/^no text/i.test(i.parseNote || '') ? 'The PDF is a scan: this was typed in by hand, not read off the document.'
      : 'Read off the PDF by the payables@ pull (ap_payapps.py), or keyed by hand at intake.'))
      + ' Stored on the AP Pay Applications list.',
  procore: () => 'Procore > Commitments > this commitment > Revised Contract (original plus approved change orders). '
      + 'Pulled by ap_commitments_pull.js, as of ' + fmtTime(LIVE.cMeta && LIVE.cMeta.generated_at) + '.',
  ceSov: () => 'ComputerEase API > subcontract schedule of values (approved amount on the CE subcontract). '
      + 'Pulled by ap_payapp_expected.js, as of ' + fmtTime(LIVE.expected && LIVE.expected.generated_at) + '.',
  ceCert: () => 'ComputerEase > Subcontractor Detail Report by Vendor > Invoiced > Payable, summed over this commitment\'s '
      + 'earlier invoices (this application excluded), plus any retention released since. Export as of '
      + ((LIVE.ceInv && LIVE.ceInv.as_of) || '?') + '.',
  cePaid: () => 'ComputerEase > Subcontractor Detail Report by Vendor > Payment > Amount: cheques actually cut on the earlier invoices. Information only.',
  retTerms: i => 'Procore commitment: Retainage % (' + (i.retain == null ? 'not set' : i.retain + '%') + ') and the Retainage Duration field ('
      + ((i.c && i.c.retainage_duration) || 'not set') + '), applied to completed & stored. Thru 50% caps it at half the Procore revised contract.',
  calcDue: () => 'Completed & stored, less retainage, less previous payments - all three as submitted on the pay application.',
  ceDue: () => 'Completed & stored (as submitted), less retainage per the subcontract terms, less ComputerEase previous certified.',
};
function recon(i){
  if (i.type !== 'Pay application') return '<p class="muted">Regular invoice: three-way pay application reconciliation does not apply.</p>';
  const cell = (v, ok) => v == null ? '<strong class="mismatch">Unavailable</strong>'
                                     : '<strong class="' + (ok ? 'match' : 'mismatch') + '">' + money(v) + '</strong>';
  const L = i.ledger;
  return '<div class="recon-row"><span' + tip(SRC.payapp(i)) + '>Pay app · adjusted contract</span><strong>' + money(i.contract) + '</strong></div>'
    + '<div class="recon-row"><span' + tip(SRC.procore()) + '>Procore · commitment revised</span>' + cell(i.procoreAmount, i.procoreAmount != null && Math.abs(i.procoreAmount - i.contract) < .01) + '</div>'
