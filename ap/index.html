/* ---- source document ------------------------------------------------------- */
/* ---- the cover sheet IS the intake form ---------------------------------------
   Accounting corrects what the pull misread right where it is shown. Nothing is
   written until Save; a half-finished edit survives re-renders and closing the
   drawer, and routing refuses while one is pending. */
const DRAFT = {};
const COVER_KEYS = ['DocType','JobNumber','Subcontract','PayRequest','PeriodEnding','CostCode',
                    'AdjustedContract','CompletedToDate','RetainageHeld','PreviousPayments','BalanceDue'];
const FIGS = ['AdjustedContract','CompletedToDate','RetainageHeld','PreviousPayments','BalanceDue'];
function coverValues(i){
  const f = i.f, n = v => (v === null || v === undefined || v === '') ? '' : String(v);
  return { DocType: i.type === 'Invoice' ? 'invoice' : 'pay app', JobNumber: i.jobNumber || '', Subcontract: i.commitment || '',
    PayRequest: f.PayRequest || '', PeriodEnding: f.PeriodEnding ? String(f.PeriodEnding).slice(0, 10) : '', CostCode: f.CostCode || '',
    AdjustedContract: n(f.AdjustedContract), CompletedToDate: n(f.CompletedToDate), RetainageHeld: n(f.RetainageHeld),
    PreviousPayments: n(f.PreviousPayments), BalanceDue: n(f.BalanceDue) };
}
function draftOf(i){ if (!DRAFT[i.id]) DRAFT[i.id] = { orig: coverValues(i), cur: coverValues(i) }; return DRAFT[i.id]; }
const coverChanged = i => { const d = DRAFT[i.id]; if (!d) return [];
  return COVER_KEYS.filter(k => String(d.cur[k]).trim() !== String(d.orig[k]).trim()); };
function draftSet(k, v){
  const i = item(); if (!i || !isAcctSeat() || i.status !== 'Intake') return;
  draftOf(i).cur[k] = v;
  if (k === 'JobNumber') { const dl = document.getElementById('commitList'); if (dl) dl.innerHTML = commitOptions(v); }
  const n = coverChanged(i).length, b = document.getElementById('coverSave'), u = document.getElementById('coverDirty');
  if (b) b.disabled = !n; const x = document.getElementById('coverDiscard'); if (x) x.disabled = !n;
  if (u) u.textContent = n ? n + ' unsaved change' + (n === 1 ? '' : 's') : '';
}
function jobOptions(sel){
  const seen = new Map(); for (const c of LIVE.commitments) if (c.project_number && !seen.has(c.project_number)) seen.set(c.project_number, c.project);
  const list = [['GL', GL_JOB]].concat([...seen].sort((a, b) => a[0].localeCompare(b[0])).map(([n, p]) => [n, n + ' · ' + p]));
  if (sel && !list.some(([n]) => n === sel)) list.push([sel, sel + ' · not in Procore']);
  return '<option value="">Choose a job…</option>' + list.map(([n, l]) => '<option value="' + esc(n) + '"' + (n === sel ? ' selected' : '') + '>' + esc(l) + '</option>').join('');
}
function commitOptions(job){
  return LIVE.commitments.filter(c => !job || job === 'GL' || c.project_number === job)
    .map(c => '<option value="' + esc(c.number) + '">' + esc(c.vendor + ' · ' + (c.title || '')) + '</option>').join('');
}
function coverEditor(i){
  const d = draftOf(i).cur, pay = d.DocType !== 'invoice';
  const inp = (k, type, extra) => '<input data-k="' + k + '" type="' + (type || 'text') + '" value="' + esc(d[k]) + '" oninput="draftSet(\'' + k + '\',this.value)"'
    + ' style="max-width:190px;text-align:' + (type === 'number' ? 'right' : 'left') + '"' + (extra || '') + '>';
  const row = (label, k, type, extra) => '<div class="kv" style="align-items:center"><span>' + label + '</span>' + inp(k, type, extra) + '</div>';
  const num = ' step="0.01"';
  const n = coverChanged(i).length;
  const sub = String(d.Subcontract || '').trim().toUpperCase();
  const onRoster = !sub || !!LIVE.byNum[sub];
  return '<div class="kv" style="align-items:center"><span>Document</span><select onchange="draftSet(\'DocType\',this.value);renderDetail()" style="max-width:190px">'
      + '<option value="pay app"' + (pay ? ' selected' : '') + '>Pay application</option><option value="invoice"' + (!pay ? ' selected' : '') + '>Invoice</option></select></div>'
    + '<div class="kv" style="align-items:center"><span>Job</span><select id="coverJob" onchange="draftSet(\'JobNumber\',this.value)" style="max-width:260px">' + jobOptions(d.JobNumber) + '</select></div>'
    + row(pay ? 'Commitment (subcontract)' : 'Commitment / PO (optional)', 'Subcontract', 'text', ' list="commitList" placeholder="e.g. 41225AU002"')
    + '<datalist id="commitList">' + commitOptions(d.JobNumber) + '</datalist>'
    + (onRoster ? '' : '<p class="mismatch" style="margin:4px 0">No Procore commitment carries ' + esc(sub) + '.</p>')
    + row(pay ? 'Pay request #' : 'Invoice #', 'PayRequest')
    + row('Billing period ending', 'PeriodEnding', 'date')
    + row('Cost code / GL account', 'CostCode', 'text', ' placeholder="25AU018.01.402 or GL"')
    + (pay ? row('Adjusted contract', 'AdjustedContract', 'number', num) + row('Completed & stored to date', 'CompletedToDate', 'number', num)
           + row('Retainage held', 'RetainageHeld', 'number', num) + row('Previous payments', 'PreviousPayments', 'number', num)
           + row('Current payment due', 'BalanceDue', 'number', num)
         : row('Invoice amount', 'BalanceDue', 'number', num))
    + '<div class="actions" style="align-items:center"><button class="primary" id="coverSave" ' + (n ? '' : 'disabled') + ' onclick="saveCover()">Save changes</button>'
    + '<button id="coverDiscard" ' + (n ? '' : 'disabled') + ' onclick="discardCover()">Discard</button>'
    + '<span class="muted" id="coverDirty">' + (n ? n + ' unsaved change' + (n === 1 ? '' : 's') : '') + '</span></div>';
}
function discardCover(){ const i = item(); delete DRAFT[i.id]; renderDetail(); }
async function saveCover(){
  const i = item(); if (!isAcctSeat() || i.status !== 'Intake') return;
  const changed = coverChanged(i); if (!changed.length) return;
  const d = DRAFT[i.id].cur, o = DRAFT[i.id].orig;
  const fields = {};
  for (const k of changed) {
    const v = String(d[k]).trim();
    if (FIGS.includes(k)) fields[k] = v === '' ? null : Number(v);
    else if (k === 'PeriodEnding') fields[k] = v ? v + 'T00:00:00Z' : null;
    else if (k === 'Subcontract') fields[k] = v.toUpperCase();
    else fields[k] = v;
  }
  if (fields.Subcontract && LIVE.byNum[fields.Subcontract]) fields.Vendor = LIVE.byNum[fields.Subcontract].vendor;
  if (changed.some(k => FIGS.includes(k)))
    fields.ParseNote = 'Keyed by hand from the PDF by ' + LIVE.me.name + ', '
      + new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) + '.';
  const note = 'Cover sheet corrected: ' + changed.map(k => k + ' ' + (o[k] || '—') + ' → ' + (String(d[k]).trim() || '—')).join('; ');
  const id = i.id;
  if (await saveRow(i, fields, { note })) {
    delete DRAFT[id];
    const j = invoices.find(x => x.id === id); if (j) { j.checks.previous = false; selected = id; renderDetail(); }
    toast('Cover sheet saved. Re-tick the intake verification.');
  }
}
function documentPages(i){
  const pay = i.type === 'Pay application';
  if (isAcctSeat() && i.status === 'Intake') {
    setTimeout(() => loadPdf(i), 0);
    return '<article class="paper" id="paper-1" style="font-size:' + (14 * docZoom / 100) + 'px"><div class="dochead"><div><h3>' + esc(i.vendor)
      + '</h3><small>' + (i.number ? esc(i.number) + ' · ' : '') + 'Revision ' + i.revision + '</small></div></div>'
      + '<h3>' + (pay ? 'Application for payment' : 'Invoice') + '</h3>' + parseNoteHTML(i)
      + '<p class="muted">Correct anything the pull misread, straight from the PDF below. Nothing is saved until you press Save changes.</p>'
      + coverEditor(i)
      + '<div class="page-num">Type figures exactly as the subcontractor submitted them, even if they are wrong.</div></article>'
      + pdfArticle(i);
  }
  let html = '<article class="paper" id="paper-1" style="font-size:' + (14 * docZoom / 100) + 'px"><div class="dochead"><div><h3>' + esc(i.vendor)
    + '</h3><small>' + (i.number ? esc(i.number) + ' · ' : '') + 'Revision ' + i.revision + '</small></div></div><h3>' + (pay ? 'Application for payment' : 'Invoice') + '</h3><p>'
    + esc(i.jobNumber + ' ' + i.job) + '<br>Commitment: ' + esc(i.commitment || 'not assigned') + '<br>Billing period: ' + esc(i.period || '—') + '</p><p>' + esc(i.description) + '</p>'
    + parseNoteHTML(i)
    + (pay ? paperRow(i, 'revised', 'Adjusted contract', i.contract || null) + paperRow(i, 'earned', 'Completed & stored to date', i.earned)
            + paperRow(i, 'retain', 'Retainage held', i.retainHeld) + paperRow(i, 'previous', 'Previous payments', i.previous)
           : paperRow(i, 'invoice', 'Services / materials', i.amount))
    + paperRow(i, 'due', 'Current payment due', i.amount)
    + '<div class="page-num">Cover sheet figures as parsed or keyed at intake. The submitted PDF is not altered.</div></article>'
    + pdfArticle(i);
  setTimeout(() => loadPdf(i), 0);

}
function pdfArticle(i){
  return '<article class="paper" id="paper-2"><h3>Submitted document</h3>'
    + (i.pdfPath ? '<iframe id="pdfFrame" title="Submitted PDF" style="width:100%;height:70vh;border:1px solid #E8E6E7"></iframe>'
                 + '<p><a href="' + esc(QUEUE_DOCS + i.pdfPath) + '" target="_blank" rel="noopener">Open the PDF in SharePoint</a>'

/* The pull writes ParseNote ONCE, at intake, and never revisits it. A scan arrives
   with "no text in the PDF" and blank figures; if figures are on the row now,
   a person typed them later - so say that, not the stale note. */
function parseNoteHTML(i){
  const n = i.parseNote || '';
  const keyed = /^keyed by hand/i.test(n);
  const hasFigures = [i.earned, i.retainHeld, i.previous].some(v => v != null) || !!i.contract;
  if (keyed) return '<p class="mismatch">' + esc(n) + ' Check them against the PDF below.</p>';
  if (/^no text in the PDF/i.test(n) && hasFigures)
    return '<p class="mismatch">The PDF is a scan, so the pull read nothing from it. These figures were typed in '
      + 'afterwards, not read off the document &mdash; check them against the PDF below. '
      + 'SharePoint version history on this row shows who entered them.</p>';
  return n ? '<p class="mismatch">' + esc(n) + '</p>' : '';
}
const pdfCache = {};
async function loadPdf(i){
  const el = document.getElementById('pdfFrame'); if (!el || !i.pdfPath) return;
  if (pdfCache[i.pdfPath]) { el.src = pdfCache[i.pdfPath]; return; }
  try {
    const tok = await token(); const q = LIVE.queue;
    const r = await fetch(GRAPH + '/sites/' + q.siteId + '/drive/root:/' + i.pdfPath.split('/').map(encodeURIComponent).join('/') + ':/content',
                          { headers: { Authorization: 'Bearer ' + tok } });
    if (!r.ok) return;
    pdfCache[i.pdfPath] = URL.createObjectURL(new Blob([await r.arrayBuffer()], { type: 'application/pdf' }));
    const now = document.getElementById('pdfFrame'); if (now) now.src = pdfCache[i.pdfPath];
  } catch (_) {}
}

async function routePM(){

}
async function archiveDuplicate(){ const i = item(); if (!isAcctSeat() || i.status !== 'Intake' || !duplicate(i)) return;
  modal('<h2>Archive duplicate?</h2><p>This exact resend leaves the original active. A corrected submission should be linked as a revision instead.</p><div class="actions"><button class="danger" onclick="confirmArchive()">Archive this duplicate</button><button onclick="closeModal()">Cancel</button></div>'); }
async function confirmArchive(){ const i = item(); closeModal();
  if (await saveRow(i, { Status: 'duplicate archived' }, { s: 'duplicate archived', note: 'Archived exact resend; no accounting entry created.' })) { closeDetail(); draw(); } }
async function addComment(){ const t = document.getElementById('comment').value.trim(); if (!t) return;
  await saveRow(item(), {}, null, { kind: 'comment', text: t }); tab = 'notes'; renderDetail(); }
async function saveMarkup(page, target){
  const i = item(); if (!isPmSeat(i) || i.status !== 'PM review') return;
  const text = document.getElementById('markupText').value.trim(); if (!text) { toast('Enter a markup note.'); return; }
  closeModal(); i.checks.progress = false; i.checks.retain = false;
  await saveRow(i, {}, { note: 'Markup on ' + target + ': ' + text }, { kind: 'markup', page, target, text, rev: i.revision });
}
async function removeMarkup(id){ const i = item(); if (!isPmSeat(i) || i.status !== 'PM review') return;
  await saveRow(i, {}, { note: 'Removed a mistaken markup.' }, { kind: 'unmark', ref: id }); }
async function saveCorrection(){
  { const i0 = item(); if (!((isAcctSeat() && i0.status === 'Intake') || (isPmSeat(i0) && i0.status === 'PM review'))) return; }
  const text = document.getElementById('reason').value.trim(); if (!text) { toast('Enter the correction instructions.'); return; }
  const i = item(); const k = document.getElementById('correctionKind').value; closeModal();
  await saveRow(i, { Status: 'revise and resubmit' }, { s: 'revise and resubmit', k, note: text }, { kind: 'correction', text });
}
async function resolveSystemIssue(){
  const i = item(); if (i.status !== 'Correction needed' || !['system', 'contract'].includes(i.correctionKind)) return;
  const ok = i.correctionKind === 'contract' ? isPmSeat(i) : isAcctSeat(); if (!ok) return;
  await saveRow(i, { Status: 'received' }, { s: 'received', note: (i.correctionKind === 'contract' ? 'Contract discrepancy' : 'Accounting record') + ' resolved; returned to intake.' });
}
function asOfs(){ return { commitments: LIVE.cMeta && LIVE.cMeta.generated_at, expected: LIVE.expected && LIVE.expected.generated_at, ce: LIVE.ceInv && LIVE.ceInv.as_of }; }
function snapshot(i){ return { ceAmount: i.ceAmount ?? null, procoreAmount: i.procoreAmount ?? null, ledgerPrevious: i.ledgerPrevious ?? null,
                               commitment: i.commitment, amount: i.amount }; }
function entryChanged(i){
  if (!i.entrySnapshot) return true;
  const s = snapshot(i);
  return Object.keys(s).some(k => s[k] !== i.entrySnapshot[k]) || reconIssues(i).length > 0;
}
/* The recheck refuses when the reference data is older than the approval -
   otherwise it compares the approval against itself and always passes. */
function staleRefs(i){
  const at = i.f.ApprovedAt ? Date.parse(i.f.ApprovedAt) : null; if (!at) return [];
  const a = asOfs(), out = [];
  if (a.commitments && Date.parse(a.commitments) < at) out.push('Procore commitments (' + fmtTime(a.commitments) + ')');
  if (a.expected && Date.parse(a.expected) < at) out.push('CE SOV (' + fmtTime(a.expected) + ')');
  if (i.type === 'Pay application' && a.ce && a.ce < String(i.f.ApprovedAt).slice(0, 10)) out.push('CE invoice ledger (' + a.ce + ')');
  return out;
}
async function approve(){
  const i = item();
  if (!isPmSeat(i) || i.status !== 'PM review' || reconIssues(i).length || i.markups.length || !['valid', 'contract', 'progress', 'retain'].every(k => i.checks[k])) return;
  const now = new Date().toISOString();
  await saveRow(i, { Status: 'ready for entry', ApprovedSnapshot: JSON.stringify(Object.assign(snapshot(i), { asOf: asOfs() })),
                     ApprovedBy: LIVE.me.email, ApprovedAt: now },
    { s: 'ready for entry', note: 'Approved ' + money(i.amount) + '; reference snapshot retained. Awaiting CE entry.' });
}
async function recheckEntry(){
  const i = item(); if (!isAcctSeat() || i.status !== 'Ready for entry') return;
  await reloadLive();
  const j = item(); const stale = staleRefs(j);
  j.entryRechecked = !entryChanged(j) && !stale.length;
  if (j.entryRechecked) await saveRow(j, { EntryRecheckedAt: new Date().toISOString() }, { note: 'Final system-reference recheck passed.' });
  const k = item(); if (k) { k.entryRechecked = j.entryRechecked; renderDetail(); }
  toast(j.entryRechecked ? 'References match approval' : stale.length ? 'Reference data is older than the approval: ' + stale.join(', ') : 'References changed; return for review');
}
async function markEntered(){
  const i = item(); if (!isAcctSeat() || i.status !== 'Ready for entry' || !i.entryRechecked || entryChanged(i)) return;
  const ref = document.getElementById('ceRef').value.trim(); if (!ref) { toast('Enter the CE entry reference.'); return; }
  await saveRow(i, { Status: 'approved and entered', CEReference: ref, EnteredAt: new Date().toISOString(), EnteredBy: LIVE.me.email },
    { s: 'approved and entered', note: 'Recorded CE entry ' + ref + '. Payment remains managed in CE.' });
}
async function returnToIntake(){
  const i = item(); if (!isAcctSeat() || i.status !== 'Ready for entry') return;
  await saveRow(i, { Status: 'received', ApprovedSnapshot: '' }, { s: 'received', note: 'Returned to intake for reference discrepancy; prior approval invalidated.' });
}

/* ---- page chrome ------------------------------------------------------------ */
function liveBanner(){
  const a = asOfs(), q = LIVE.queue || {};
  return '<span><strong>Live</strong> · Signed in as ' + esc((LIVE.me || {}).name || '') + '. Procore ' + esc(fmtTime(a.commitments))
    + ' · CE SOV ' + esc(fmtTime(a.expected)) + ' · CE invoices ' + esc(a.ce || 'not published') + (ledgerFull() ? '' : ' (partial; previous certified unavailable)')
    + (q.err ? ' · <b>' + esc(q.err) + '</b>' : '') + '. Nothing here writes to ComputerEase.</span><button onclick="reloadLive()">Refresh</button>';
}
/* ---- By job: the previous desk's project view, put back --------------------- */
const JOB_VIEWS = { 'Job view': 'commitments', 'Expected to bill': 'expected' };
function draw(){
  legacyDraw();
  const navs = document.querySelector('.sidebar .navs');
  if (navs && !document.getElementById('byjob')) navs.insertAdjacentHTML('afterend',
    '<div id="byjob"><div class="eyebrow" style="margin-top:18px">By job</div><nav class="navs" aria-label="By job">'
    + Object.keys(JOB_VIEWS).map(v => '<button class="nav ' + (v === view ? 'active' : '') + '" onclick="setView(\'' + v + '\')">' + v + '</button>').join('')
    + '</nav></div>');
  if (!JOB_VIEWS[view]) return;
  const main = document.querySelector('main'); if (!main) return;
  main.innerHTML = '<div class="heading"><div><div class="eyebrow">By job</div><h1>' + esc(view) + '</h1><p class="muted">'
    + (view === 'Job view'
        ? 'Commitments for a project or PM: compliance, Procore and ComputerEase contract, billed to date, retainage terms, and the pay app check for each subcontractor.'
        : 'Who can still bill this cycle, how much, and who has not sent an application yet.')
    + '</p></div></div><div class="demo">' + liveBanner() + '</div><div id="jobview"></div>';
  try {
    window.JobView.mount(document.getElementById('jobview'), JOB_VIEWS[view],
      { cm: LIVE.cMeta, expected: LIVE.expected, ceInv: LIVE.ceInv, me: LIVE.me, queue: LIVE.queue });
  } catch (e) { document.getElementById('jobview').innerHTML = '<div class="alert">Job view could not load: ' + esc(e.message) + '</div>'; }
}

async function boot(){
  document.getElementById('app').innerHTML = '<main style="padding:40px"><p class="muted">Signing in and loading live data…</p></main>';
  try {
    if (!(await loadLive())) return;
    rebuild();
    role = LIVE.me.isAccounting ? 'Accounting' : LIVE.me.name;
    view = role === 'Accounting' ? 'All invoices' : 'PM review';
    draw();
  } catch (e) {
    document.getElementById('app').innerHTML = '<main style="padding:40px"><h1>AP Desk</h1><div class="alert">' + esc(e.message || String(e)) + '</div><p class="muted">Contact itadmin@baileyharris.com.</p></main>';
  }
}
boot();
