<title>AP Desk</title>
<style>
  /* The Bailey-Harris palette, as the compliance dashboard uses it. Declared
     once here so the desk is LINKED to the design system rather than
     coincidentally the same hex. Montserrat throughout, as everywhere else. */
  :root {
    color-scheme: light;
    --ink:#211E1E; --ink-2:#484B4D; --muted:#5b6472; --faint:#8a92a1;
    --maroon:#7F1B29; --red:#ED2B30;
    /* There is no Bailey-Harris navy. What used to be navy is the ink. */
    --navy:#211E1E;
    --line:#E8E6E7; --line-2:#e3e8f0; --rule:#eef1f6;
    --bg:#f5f7fa; --panel:#fff; --sand:#F2ECE1;
    --ok:#1a7f37; --warn:#9a6a00; --bad:#b3261e;
    --side:220px;          /* the demo's rail width */
    --rail:#484B4D;          /* the design system's dark grey */
  }
  * { box-sizing: border-box; }
  body { margin:0; font-family:'Montserrat',Arial,Helvetica,sans-serif; background:#f5f7fa; color:#211E1E; }
  .wrap { max-width:1500px; margin:0 auto; padding:20px; }
  .bh-banner{background:#fff;border-bottom:1px solid #E8E6E7;width:100%}
  .bh-banner-inner{max-width:1500px;margin:0 auto;padding:12px 20px 14px;display:flex;align-items:center;gap:18px}
  .bh-logo{height:54px;width:auto;flex:none}
  .bh-titles{line-height:1.2}
  .bh-title{color:#211E1E;font-size:22px;font-weight:800;letter-spacing:.02em;text-transform:uppercase}
  .bh-sub{color:#5b6472;font-size:12.5px;margin-top:3px}
  .bh-badge{margin-left:auto;border:1px solid #1a7f37;color:#1a7f37;background:#fff;padding:4px 12px;border-radius:6px;font-size:11px;font-weight:bold;letter-spacing:.05em;white-space:nowrap}
  .banner{background:#fff7e6;border:1px solid #f0d089;color:#7a5a12;padding:9px 13px;border-radius:8px;font-size:13px;margin-bottom:14px}
  .err{background:#FFC7CE;border-color:#e6a3a3;color:#9C0006}
  .notice{background:#eef3fb;border:1px solid #c3d4ee;color:var(--ink);padding:10px 14px;border-radius:9px;font-size:13px;margin-bottom:16px;line-height:1.5}
  .notice p{margin:5px 0 0}
  .notice p:first-child{margin-top:0}
  .notice b{color:var(--ink-2)}
  .controls{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
  .controls label{font-size:13px;color:#40485a;font-weight:bold}
  select,input[type=text]{padding:8px 12px;border:1px solid #c7cfdb;border-radius:8px;font-size:14px;background:#fff;font-family:inherit}
  /* Nine equal tiles gave "0 no CE code" the same weight as $15.3M billed, and
     spent two of them on zeros. Three money tiles carry the position; the
     exceptions are a strip beneath and only appear when the count is non-zero. */
  .cards{margin-bottom:18px}
  .cardcap{font-size:12px;color:#6b7482;margin:0 0 8px}
  .cardrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
  .card{background:#fff;border:1px solid #e3e8f0;border-radius:10px;padding:13px 15px}
  .card .n{font-size:25px;font-weight:bold;font-variant-numeric:tabular-nums}
  .card .l{font-size:11.5px;color:#5b6472;margin-top:2px;text-transform:uppercase;letter-spacing:.03em}
  .card .s{font-size:11.5px;color:#8a94a3;margin-top:3px;font-variant-numeric:tabular-nums}
  .exrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  .exchip{display:inline-flex;align-items:baseline;gap:6px;background:#fff;border:1px solid #e3e8f0;
          border-radius:7px;padding:7px 11px;font-size:12px;color:#54607a}
  .exchip b{font-size:15px;font-variant-numeric:tabular-nums}
  .exchip.r{border-color:#f0bcbc;background:#fdf4f4}.exchip.r b{color:#b3261e}
  .exchip.y{border-color:#f0cf8e;background:#fffaf1}.exchip.y b{color:#9a6a00}
  .exchip.b{border-color:#c9d8ef;background:#f6f9fd}.exchip.b b{color:var(--ink-2)}
  .exclear{font-size:12px;color:#1a7f37;padding:7px 0}
  .pacell{white-space:nowrap;margin-top:3px}
  .pabtn{font:inherit;font-size:10.5px;padding:2px 7px;border:1px solid #cfd8e4;background:#fff;color:var(--ink-2);border-radius:3px;cursor:pointer;line-height:1.5}
  .pabtn:hover{background:#eef3fa;border-color:#9fb4d0}
  .pabtn[aria-expanded="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
  tr.parow>td{background:#f7f9fc;border-top:0;padding:0}
  /* Pinned left and width-capped: the panel lives in a colspan cell inside a
     horizontally scrolling table and would otherwise stretch off screen. */
  .pawrap{position:sticky;left:0;box-sizing:border-box;width:min(1180px,calc(100vw - 80px));
          padding:16px 24px 20px;text-align:left;overflow-wrap:anywhere}
  .pawrap td,.pawrap div,.pawrap th{text-align:left}
  .pamax{display:flex;align-items:baseline;gap:10px;margin:0 0 12px}
  .pamax .l{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:#7a869a}
  .pamax .n{font-size:22px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
  .patab{width:100%;border-collapse:collapse;font-size:12.5px}
  /* The page styles thead th as a dark bar; inside the panel that reads as a
     second table header, so it is overridden here rather than globally. */
  .pawrap .patab thead th{background:none;background-color:transparent;color:#9aa4b2;
    font-size:10px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;
    padding:0 0 7px 2px;border-bottom:1px solid #e3eaf3;white-space:nowrap}
  .pawrap .patab td{border-bottom:1px solid #eef2f8;padding:7px 0 7px 2px;vertical-align:middle}
  .patab tr:last-child td{border-bottom:0}
  .patab th.n,.patab td.n{text-align:right;padding-left:10px;white-space:nowrap;font-variant-numeric:tabular-nums}
  .paq{color:#243040}
  .pawrap .patab td.paloose{color:#7a869a;font-size:11.5px}
  /* The queue sat flush against the section title with no container while the
     stub beneath it had a card, so it read as unfinished. */
  .qwrap{background:#fff;border:1px solid #e3e8f0;border-radius:10px;padding:16px 18px 18px;margin-bottom:16px}
  .qbar{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin:0 0 4px}
  .qbar select{font:inherit;font-size:12px;padding:3px 6px;border:1px solid #cfd8e4;border-radius:4px;background:#fff}
  .qbar label{font-size:11.5px;color:#6b7482}
  .qempty{font-size:12.5px;color:#6b7482;padding:6px 0}
  .qhead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:0 0 8px}
  .qhead .n{font-size:19px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
  .qhead .l{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:#7a869a}
  .qday{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:#7a869a;
        margin:12px 0 4px;padding-top:9px;border-top:1px solid #e3eaf3}
  .qtab{width:100%;border-collapse:collapse;font-size:12.5px}
  .qtab td{border-bottom:1px solid #eef2f8;padding:5px 0;text-align:left;vertical-align:baseline}
  .qtab td.n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;padding-left:12px}
  .qsub{font-size:10.5px;color:#9aa4b2}
  .qblock{color:#b3261e;font-weight:600}
  .paref{font-size:10.5px;color:#9aa4b2;margin-top:1px}
  .pain{width:104px;font:inherit;font-size:12px;padding:3px 6px;border:1px solid #cfd8e4;border-radius:3px;text-align:right;background:#fff}
  .pain:focus{outline:2px solid #bcd0ea;outline-offset:-1px;border-color:#9fb4d0}
  .padelta{font-size:11px;white-space:nowrap;text-align:right;padding-left:8px;font-variant-numeric:tabular-nums}
  .paok{color:#1a7f37}.pabad{color:#b3261e;font-weight:600}
  .pawarn{margin-top:11px;font-size:11.5px;line-height:1.55;color:#54607a}
  .pawarn div{padding:2px 0 2px 15px;text-indent:-15px}
  .total .n{color:#7F1B29}.ok .n{color:#1a7f37}.soon .n{color:#9a6a00}.bad .n{color:#b3261e}.gap .n{color:var(--ink-2)}
  .section-title{font-size:15px;font-weight:bold;color:#7F1B29;margin:22px 0 10px}
  /* ---- the intake checklist ---- */
  .intchk{display:grid;gap:5px;margin:0 0 11px}
  .intchk label{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;color:var(--ink-2);
                line-height:1.45;cursor:pointer}
  .intchk input{margin:2px 0 0;flex:none}
  .intwarn{font-size:12px;color:var(--warn);margin-top:4px}
  .tract button[disabled]{opacity:.45;cursor:not-allowed}

  /* ---- the duties note ---- */
  .duties{background:#fff;border:1px solid var(--line-2);border-left:3px solid var(--navy);
          border-radius:9px;padding:13px 16px 14px;margin-bottom:14px}
  .duties h4{margin:0 0 6px;font-size:12px;font-weight:700;letter-spacing:.05em;
             text-transform:uppercase;color:var(--navy)}
  .duties p{margin:0 0 7px;font-size:12.5px;line-height:1.6;color:var(--ink-2)}
  .duties p:last-child{margin-bottom:0}
  .duties .dutieswhere{color:var(--muted)}
  .duties .dutiesgap{color:var(--bad)}
  .duties code{font-size:11.5px;background:var(--rule);padding:1px 5px;border-radius:3px}

  /* ---- the source document ---- */
  .srcpage{background:#fff;border:1px solid var(--line-2);border-radius:8px;padding:18px 20px 20px;
           margin:14px 0 4px}
  .srchead{font-size:13px;font-weight:800;letter-spacing:.08em;color:var(--ink);text-align:center;
           padding-bottom:12px;border-bottom:1px solid var(--line-2)}
  .srchead span{display:block;font-size:10.5px;font-weight:600;letter-spacing:.03em;
                text-transform:none;color:var(--muted);margin-top:3px}
  .srcmeta{width:100%;border-collapse:collapse;margin:12px 0 16px;font-size:11.5px}
  .srcmeta td{padding:3px 0;vertical-align:top}
  .srcmeta td:first-child{color:var(--faint);font-weight:700;letter-spacing:.05em;width:130px}
  .srctab{width:100%;border-collapse:collapse;font-size:12.5px}
  .srctab td{padding:6px 0;border-bottom:1px dotted #d8dee7}
  .srctab td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;padding-left:14px}
  .srctab tr.srctot td{border-bottom:0;border-top:2px solid var(--ink);font-weight:700;padding-top:9px}
  .srcmiss{color:#b8bfc9;font-size:11px;font-style:italic}
  .srcsov{margin-top:16px;padding-top:12px;border-top:1px solid var(--line-2)}
  .srcsov h4{margin:0;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
             color:var(--faint)}
  .tracttop{margin:0 0 14px}

  /* ---- the detail drawer -------------------------------------------------
     The panel used to open as a row inside the table, which pushed everything
     below it down the page and made the thing you were reading move while you
     read it. A drawer leaves the queue where it is. */
  /* Drawn the way the demonstration draws it: a wide sheet off the right edge
     over a navy wash, a sticky white header, and a grey body carrying white
     panels - with the source document in its own column BESIDE the work rather
     than behind a tab. Reading the figures and checking them is one job. */
  /* Their overlay + drawer carry the chrome. What stays here is only what
     they have no equivalent for: the two columns' own padding, and undoing the
     table-cell assumptions in the pay app panel. */
  .drawerbody .dwork{min-width:0}
  .drawerbody .sourcecol{min-width:0}
  .dpane{display:none}.dpane.on{display:block}
  .dsoon{color:var(--muted);font-size:12.5px;line-height:1.6;padding:16px 0}
  .drawerbody .pawrap{position:static;width:auto;padding:10px 0 4px}
  .drawerbody .trwrap{padding:10px 0 4px}
  .drawerbody .trcols{display:block}
  .drawerttl{display:flex;align-items:flex-start;gap:15px;width:100%}
  .drawerttl .sub{font-size:12.5px;color:var(--muted)}
  .drawerx{margin-left:auto;width:32px;height:32px;padding:0;font-size:18px;line-height:1;flex:none}

<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@3/lib/msal-browser.min.js"></script>
<script>
/* ==== Sign-in and data source ====
   Same app registration, scopes and site as the Precon and Prequal desks, so a
   PM signs in once for all of them. Sites.Selected is granted per site, and the
   grant that matters here is on /sites/Dashboard - NOT the compliance
   dashboard's app, which reads sites/Resources with Files.Read.All.
   The redirect URI must be registered on this app as .../ap/ (with the trailing
   slash) exactly as /precon/ and /prequal/ are. */
const CLIENT_ID = '1825a1c0-1ce3-4078-aeb7-a4714562c422';
const TENANT_ID = '848aa890-7982-4028-befa-3323d82583ce';
const SCOPES    = ['User.Read','GroupMember.Read.All','Sites.Selected'];
const SP_HOST   = 'baileyharris.sharepoint.com';
const SP_PATH   = '/sites/Dashboard';
const LIBRARY   = 'APData';
const DATA_FILE = 'ap_commitments.json';
/* Billed-to-date comes from ComputerEase, published by ap_payapp_expected.js.
   The page must still work if that file has never been written, so its absence
   is tolerated and every billing cell falls back to "no data" rather than 0. */
const EXPECTED_FILE = 'ap_payapp_expected.json';
const CONTACT   = 'itadmin@baileyharris.com';

/* ---- the RECEIVED queue -----------------------------------------------------
   Phase B, and a DIFFERENT OBJECT from "expected to bill". Expected = who may
   still bill, derived from commitments and CE's billed-to-date. Received = the
   pay applications that have actually arrived in payables@. ap-payapp-handoff.md
   section 0 is explicit that conflating the two is how this goes in circles, so
   they are separate tabs and are never merged.

   State lives on its OWN site, not /sites/Dashboard. Sites.Selected cannot scope
   below site level, and /sites/Dashboard also holds LauncherData, which
   LAUNCHER-DEPLOY.md requires be writable by nobody but IT. Same test that moved
   the IT tracker off /sites/IT.

   None of this exists yet. Every failure below degrades to a message rather than
   an exception, so the rest of the desk works before the site is created. */
const SP_PATH_QUEUE = '/sites/APDesk';
const QUEUE_LIST    = 'AP Pay Applications';
/* Where the pull writes the PDF it captured. MUST match the pull - it currently
   writes to APData on /sites/Dashboard, which is the grant section 6 refuses, so
   it has to move here with the list. */
const QUEUE_DOCS    = 'https://' + SP_HOST + SP_PATH_QUEUE + '/Shared Documents/';


const msalApp = new msal.PublicClientApplication({
  auth: { clientId: CLIENT_ID, authority: 'https://login.microsoftonline.com/' + TENANT_ID,
          redirectUri: location.origin + '/ap/' },
  cache: { cacheLocation: 'sessionStorage' }
});

async function token(){
  await msalApp.initialize();
  const redir = await msalApp.handleRedirectPromise();
  let account = (redir && redir.account) || msalApp.getAllAccounts()[0];
  if (!account) { await msalApp.loginRedirect({ scopes: SCOPES }); return null; }
  msalApp.setActiveAccount(account);
  try { const t = await msalApp.acquireTokenSilent({ scopes: SCOPES, account }); return t.accessToken; }
  catch (e) { await msalApp.acquireTokenRedirect({ scopes: SCOPES }); return null; }
}

const GRAPH = 'https://graph.microsoft.com/v1.0';

/* ---- who may see the whole queue -------------------------------------------
   Everyone is kept current in AD and synced to Entra, so department is the
   authority and nothing here has to be maintained by hand. The page asks Graph
   for the SIGNED-IN USER'S OWN department (/me, User.Read - already in SCOPES),
   never for anyone else's, so this needs no new grant and reads no other
   person's record.

   NOT A SECURITY BOUNDARY. ap_commitments.json is one file and anyone who can
   read APData can fetch all of it with their own token. This decides what the
   page SHOWS, not what a determined person could reach. If the restriction has
   to be enforced rather than respected, the filtering has to move server-side -
   a per-viewer file - or APData needs item-level permissions. */
const ALL_QUEUE_DEPARTMENTS = [
  'Accounting - Executives',
  'Accounting - Personnel',
  'Executive',
  'Directors',
];
const ALL_QUEUE_PEOPLE = [
  'tiffany.blackmon@baileyharris.com',
  'hdatb@baileyharris.com',
];
const norm = v => String(v || '').trim().toLowerCase();

async function whoAmI(tok){
  try {
    const r = await g(tok, '/me?$select=displayName,mail,userPrincipalName,department');
    const me = (r.ok && r.body) || {};
    const email = norm(me.mail || me.userPrincipalName);
    const dept  = String(me.department || '');
    const seesAll = ALL_QUEUE_PEOPLE.map(norm).includes(email)
                 || ALL_QUEUE_DEPARTMENTS.map(norm).includes(norm(dept));
    return { name: me.displayName || '', email, dept, seesAll, resolved: !!email };
  } catch (_) {
    /* Fail CLOSED on the identity call, not open: an unresolved viewer sees
       only what their email matches, which is nothing, and the page says why. */
    return { name:'', email:'', dept:'', seesAll:false, resolved:false };
  }
}
async function g(tok, path){
  const r = await fetch(GRAPH + path, { headers: { Authorization: 'Bearer ' + tok } });
  let body = null; try { body = await r.json(); } catch(_) {}
  return { ok: r.ok, status: r.status, body };
}

/* Resolve site -> library -> file, the same way the Precon desk does. A 403 here
   is an access problem, not a missing file, and says so. */
async function loadData(tok){
  const site = await g(tok, '/sites/' + SP_HOST + ':' + SP_PATH);
  if (!site.ok || !site.body || !site.body.id)
    throw new Error('Could not reach ' + SP_PATH + ' (HTTP ' + site.status + ').');
  const dr = await g(tok, '/sites/' + site.body.id + '/drives?$select=id,name');
  const drive = ((dr.body && dr.body.value) || []).find(d => d.name === LIBRARY);
  if (!drive) throw new Error('No document library called ' + LIBRARY + ' on ' + SP_PATH + '.');
  const r = await fetch(GRAPH + '/drives/' + drive.id + '/root:/' + encodeURI(DATA_FILE) + ':/content',
                        { headers: { Authorization: 'Bearer ' + tok } });
  if (r.status === 403)
    throw new Error('Your account is not permitted to read ' + LIBRARY + '. Ask ' + CONTACT + ' for access.');
  if (r.status === 404)
    throw new Error(DATA_FILE + ' is not in ' + LIBRARY + ' yet - has the AP commitments pull run?');
  if (!r.ok) throw new Error(DATA_FILE + ': HTTP ' + r.status);
  const commitments = await r.json();

  /* Second file, optional. A 404 here is not an error - it means the CE billing
     pull has not run yet, and the page says so instead of showing zeros. */
  let expected = null;
  try {
    const e = await fetch(GRAPH + '/drives/' + drive.id + '/root:/' + encodeURI(EXPECTED_FILE) + ':/content',
                          { headers: { Authorization: 'Bearer ' + tok } });
    if (e.ok) expected = await e.json();
  } catch (_) { /* leave expected null */ }
  let ceInv = null;
  try {
    const c = await fetch(GRAPH + '/drives/' + drive.id + '/root:/' + encodeURI(CEINV_FILE) + ':/content',
                          { headers: { Authorization: 'Bearer ' + tok } });
    if (c.ok) ceInv = await c.json();
  } catch (_) { /* leave ceInv null - the panel explains what is missing */ }
  const me = await whoAmI(tok);
  /* The queue site may not exist yet; loadQueue reports that rather than throwing. */
  const queue = await loadQueue(tok);
  return { commitments, expected, ceInv, me, queue };
}

/* Read the received queue. Every branch returns a REASON rather than throwing:
   the site, the list and the items are each absent until IT creates them, and
   the rest of the desk has to keep working meanwhile. */
async function loadQueue(tok){
  /* 404 and 403 mean opposite things and were being reported with the same
     message ("nothing has been built"), which is a confident wrong answer when
     the site exists and the caller simply cannot see it. Carry the status and
     the error Graph returned. */
  const sitePath = '/sites/' + SP_HOST + ':' + SP_PATH_QUEUE;
  const site = await g(tok, sitePath);
  const gErr = (site.body && site.body.error && (site.body.error.message || site.body.error.code)) || '';
  if (site.status === 404) return { items: null, reason: 'nosite', status: 404, path: sitePath, err: gErr };
  if (site.status === 403) return { items: null, reason: 'nosite403', status: 403, path: sitePath, err: gErr };
  if (!site.ok || !site.body || !site.body.id)
    return { items: null, reason: 'site', status: site.status, path: sitePath, err: gErr };

  const lr = await g(tok, '/sites/' + site.body.id + '/lists/' + encodeURIComponent(QUEUE_LIST) + '?$select=id');
  if (lr.status === 404) return { items: null, reason: 'nolist' };
  if (!lr.ok || !lr.body || !lr.body.id) return { items: null, reason: 'list', status: lr.status };

  const out = [];
  let url = '/sites/' + site.body.id + '/lists/' + lr.body.id + '/items?$expand=fields&$top=200';
  for (let page = 0; url && page < 40; page++) {
    const r = await g(tok, url);
    if (!r.ok) return { items: null, reason: 'items', status: r.status };
    for (const it of (r.body.value || [])) if (it.fields) out.push({ ...it.fields, _itemId: it.id });
    const next = r.body['@odata.nextLink'];
    /* Graph hands back an absolute URL and g() prepends GRAPH, so strip it. */
    url = next ? String(next).replace(GRAPH, '') : null;
  }
  /* siteId and listId are kept so a correction can be PATCHed back without
     resolving them again. */
  return { items: out, reason: null, siteId: site.body.id, listId: lr.body.id };
}

/* ---- who sees which rows ----------------------------------------------------
   pm_team carries the Project Management Team's EMAIL addresses, published by
   ap_commitments_pull.js off projects_pull.js. Allowlisted departments and
   people see every row; everyone else sees the projects they are on.

   NOT A SECURITY BOUNDARY, same as the commitments file: anyone who can read the
   list can read all of it with their own token. This decides what the page
   SHOWS. Enforcing it needs item-level permissions on the list, or a per-viewer
   file written server-side. */
function myProjectNumbers(){
  const me = STATE.me || {};
  const mine = new Set();
  if (!me.email) return mine;
  for (const r of STATE.commitments) {
    const n = String(r.project_number || '').trim();
    if (n && (r.pm_team || []).some(e => norm(e) === me.email)) mine.add(n);
  }
  return mine;
}
/* Distinguishes "no project is yours" from "Procore holds no PM Team email at
   all" - the second is a data problem and must not read as an empty inbox. */
const anyPmTeamEmail = () => STATE.commitments.some(r => (r.pm_team || []).length > 0);

const daysSince = iso => {
  const t = Date.parse(iso);
  if (isNaN(t)) return null;
  return Math.floor((Date.now() - t) / 86400000);
};
const shortDate = iso => {
  const t = Date.parse(iso);
  return isNaN(t) ? '' : new Date(t).toLocaleDateString(undefined, { month:'short', day:'numeric' });
};

/* ==== helpers ==== */
// Same normalisation compliance_pull.js uses, so the join keys agree.
const normName = n => String(n||'').toUpperCase().replace(/&/g,' AND ').replace(/[.,'"]/g,' ')
  .replace(/\b(LLC|L L C|INC|INCORPORATED|CO|COMPANY|CORP|CORPORATION|LP|LLP|PC|PLLC)\b/g,' ')
  .replace(/[^A-Z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
const money = v => (v === null || v === undefined || v === '') ? '' :
  (Number(v) < 0 ? '-' : '') + '$' + Math.abs(Math.round(Number(v))).toLocaleString();
const pct = v => (v === null || v === undefined || v === '') ? '' : Number(v).toFixed(0) + '%';
/* Procore project names are institutional and long. Shorten for DISPLAY ONLY:
   the full name stays in the title attribute, the job number sits on the line
   beneath, and every filter still compares the full name - nothing downstream
   ever sees the short form. */
/* The rule below gets 57 of 58 right, but it cannot know that Wallace State is
   WSCC to everyone here - the probe's own mail sample is full of "FW: WSCC PR5"
   and "WSCC STEM & Auto". House names win over any rule. Match on a distinctive
   fragment of the Procore name, case-insensitive; add a line when you spot one. */
const PROJ_HOUSE = [
  [/wallace\s+state/i, 'WSCC STEM & Auto'],
];
const PROJ_INST = /\b(community college|technical college|university|college|high school|middle school|elementary school|medical center|hospital|city of|county of)\b/i;
const PROJ_DROP = /\b(renovations?|additions?|improvements?|construction|upgrades?|replacements?|expansions?|project|building|phase\s+[ivx\d]+)\b/gi;

function shortProject(name){
  const full = String(name || '').replace(/\s+/g, ' ').trim();
  if (!full) return '';
  for (const [re, label] of PROJ_HOUSE) if (re.test(full)) return label;
  let s = full.replace(/\s*\([^)]*\)\s*$/, '');

  /* An institution named before a separator is the campus, not the job.
     "Auburn University - Comer Hall" is Comer Hall to everyone on it. */
  const seg = s.split(/\s*[-–—:|]\s*/).map(x => x.trim()).filter(Boolean);
  if (seg.length > 1 && seg[seg.length - 1].length >= 6) s = seg[seg.length - 1];

  /* Same idea without a separator: keep what follows the institution, but only
     when enough is left for the result to still identify the job. */
  const m = s.match(PROJ_INST);
  if (m) {
    const tail = s.slice(s.indexOf(m[0]) + m[0].length).trim();
    if (tail.split(/\s+/).filter(Boolean).length >= 2) s = tail;
  }

  const beforeDrop = s;
  s = s.replace(PROJ_DROP, ' ').replace(/\s*&\s*/g, ' & ').replace(/\s+/g, ' ').trim();
  s = s.replace(/^[-–—:|,\s]+|[-–—:|,\s]+$/g, '');
  /* Stripping generic words off an already-trimmed name can leave a single word
     that no longer identifies the job - "East Alabama Medical Center MRI
     Addition" collapsed to "MRI". When that happens, keep the step before. */
  const words = x => x.split(/\s+/).filter(Boolean).length;
  if (words(s) < 2 && words(full) >= 4) s = beforeDrop;
  if (!s) s = full;                                  // never return nothing

  if (s.length > 26) {
    const cut = s.slice(0, 26);
    const sp  = cut.lastIndexOf(' ');
    s = (sp > 12 ? cut.slice(0, sp) : cut).replace(/[\s,&-]+$/, '') + '…';
  }
  return s;
}

const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* Retainage is two fields. The percent alone cannot say whether it stops at 50%
   completion - which is exactly how the GL Pack shortage happened. Show both,
   and flag the commitments where the term is missing rather than assuming. */
function retainageCell(r){
  const p = r.retainage_percent, d = (r.retainage_duration||'').trim();
  if (p === null && !d) return '<span class="muted">—</span>';
  if (p === 0) return '<span class="pill b" title="This contract withholds no retainage">0% &middot; no retainage</span>';
  const dur = d && d.toLowerCase() !== 'n/a' ? d : '<span class="pill y" title="A percentage is withheld but the commitment does not record when it stops, so it is unknown whether retainage runs throughout or ends at 50% completion.">term not set</span>';
  return '<b>' + pct(p) + '</b> ' + dur;
}

let STATE = { commitments: [], sort: { col: 'project', dir: 1 }, billing: {}, billingMeta: null,

let TAB = 'received';

/* ---- the workspace -----------------------------------------------------------
   Six views over one queue, named for WHERE A THING IS. The VP's review framed
   the desk as a workflow rather than a list, and a status is only interesting
   because it says whose problem the row is now. "Not a pay application" is not a
   stage and is kept out of All invoices; it is reachable from the status filter
   on the grid, where it belongs. */
let WS = 'all';
const WS_VIEWS = [
  { k:'all',         label:'All invoices',       st:null },

const WS_BY = Object.fromEntries(WS_VIEWS.map(v => [v.k, v]));

/* The four the VP asked to see above the queue. Each one opens its view. */

function wsMatches(x, key){

/* ---- View As ----------------------------------------------------------------
   Changes WHAT YOU SEE and nothing else. Every write still goes to Graph as the
   signed-in user, so this cannot be used to act as somebody else - and it is
   only offered to people who can already see the whole queue. The demo's own
   notes call its role dropdown a demonstration control; this is the version that

let VIEWAS = 'me';

/* WHO GETS THE CONTROL and WHAT IS IN IT are two different questions.

   Who: only somebody who can already see the whole queue - Accounting,
   Directors, Executives, the VP, or an allowlisted person. Offering it to a PM
   would let them read another PM's jobs, which is the one thing the scoping
   exists to prevent. This is the same gate as me.seesAll, so it needs no list
   of its own and nothing to maintain.

   What: the PMs by name, plus Accounting. Not abstract role labels - "PM" is
   not a view, Blake Orum's queue is. The names come from the Project Management
   Team in Procore, the same source the queue is scoped by, so the list is right

function wsMayViewAs(){

}
function viewAsOptions(){

         .concat(pms.map(p => ['pm:' + p, p]));

function viewAsLabel(){

const viewAsPm = () => VIEWAS.startsWith('pm:') ? VIEWAS.slice(3) : null;

function wsSeesAll(me){

/* The projects a NAMED PM runs. myProjectNumbers() answers the same question for

/* Joined on commitment number, which the probe work established equals the CE
   subcontract code exactly (40325AU002 in both systems). Vendor name is NOT a
   safe key - 25AU002 carries Turner Fence on two separate commitments. */
const billingFor = r => STATE.billing[String(r.number || '').trim()] || null;

const FLAG_TEXT = {
  over_billed:            ['r','over-billed','Billed more than the commitment. Either a change order went into billings but not onto the subcontract, or the sub over-billed.'],
  contract_mismatch:      ['r','contract differs','Procore and ComputerEase disagree on the contract value. Procore higher: an approved change order never reached CE - a CO title over the character limit fails to sync silently. CE higher: the change order was entered straight into CE and Procore is understating the contract.'],
  sov_gap:                ['y','SOV gap','ComputerEase does not agree with itself on this subcontract - billed plus remaining should equal its schedule of values and does not. Usually billings posted to a cost code the subcontract does not carry, or an item on the subcontract that posts nowhere. The gap is normally one line.'],
  shared_cost_code:       ['y','shared cost code','Another subcontract posts to the same phase/category/cost type, so some dollars cannot be attributed to this one.'],
  no_job_totals:          ['b','no CE data','This job does not publish to the ComputerEase API, so no billing figure is available.'],
  no_ce_subcontract:      ['b','no CE match','No ComputerEase subcontract carries this commitment number.'],
  retainage_stop_reached: ['b','past 50%','Billings have passed half the revised contract - on a "thru 50%" term, withholding should have stopped.'],
  pending_rfc:            ['b','pending CO','A change order sits on this ComputerEase subcontract at pending approval. It is not contract value yet, so it is excluded from the schedule of values here - which is right, but it also means the sub may bill against it before anyone approves it.'],
  no_committed_cells:     ['b','nothing in job cost','The subcontract exists in ComputerEase but none of its cost codes carries a committed cell in job cost, so nothing has been posted against it yet. Expected on a subcontract entered recently. Worth asking about on an old one.'],
};

/* Billed to date, with what is left and any exception beneath it. Keeping the
   qualifier in the same cell avoids spending two more columns on a table that
   is already wide. */
/* A pending RFC is worth seeing whether or not there is a billed figure, so it
   renders on both paths rather than only in the pills row below. */
function pendingPill(b){
  if (!b || !b.ce_pending_sov) return '';
  const [cls,label,tip] = FLAG_TEXT.pending_rfc;
  return ' <span class="pill ' + cls + '" title="' + esc(tip
    + ' RFC ' + (b.ce_pending_rfcs||'?') + ', ' + money(b.ce_pending_sov) + '.') + '">' + label + '</span>';
}

/* Procore's revised contract and CE's schedule of values are two different
   figures from two different systems, and the desk used to show only Procore's.
   The "contract differs" flag said they disagreed but not which way, and the
   direction IS the diagnosis: Procore higher means an approved change order
   never reached CE (a CO title over the character limit fails to sync silently);
   CE higher means it was entered straight into CE and Procore understates the
   contract. Both figures now sit side by side with the gap signed from CE. */
/* The two contract columns are rendered by a pair of cells that share the same
   two sub-line helpers, so "includes X CO" and "pending" land on the SAME LINE in
   both columns and can be read straight across. Procore's revised contract and
   CE's schedule of values both count approved change orders only, so the pending
   line sits outside both figures on both sides. */
function pcContractCell(r){
  const b = billingFor(r);
  return money(r.revised_contract || r.contract_value)
    + coLine(r.approved_change_orders, b && b.ce_approved_cos)
    + pendingLine(r.pending_change_orders, b && b.ce_pending_sov);
}

/* Procore higher means an approved change order never reached CE (a CO title
   over the character limit fails to sync silently); CE higher means it was
   entered straight into CE and Procore understates the contract. Agreement is
   the normal case and says nothing; a disagreement is red. */
function ceContractCell(r){
  const b = billingFor(r);
  if (!b) return '<span class="muted" title="No row in ' + EXPECTED_FILE + ' for this commitment">&mdash;</span>';
  if (b.ce_sov === null || b.ce_sov === undefined) {
    const f = (b.flags||[]).find(x => ['no_ce_subcontract','no_job_totals','no_committed_cells'].includes(x));
    const label = f ? FLAG_TEXT[f][1] : 'not matched';
    const tip = ((f ? FLAG_TEXT[f][2] : '') + ' ' + (b.billed_source||'')).trim();
    return '<span class="pill b" title="' + esc(tip) + '">' + label + '</span>';
  }
  const gap = b.pc_vs_ce_contract_gap;          // Procore revised - CE SOV
  /* The gap goes LAST so the two shared lines above it stay level across the
     two columns. Red carries it; position does not need to. */
  const gapLine = !gap ? ''
    : gap > 0
      ? '<div class="sub bad" title="Procore is higher by this much. An approved change order has not reached CE.">'
          + money(gap) + ' under Procore</div>'
      : '<div class="sub bad" title="CE is higher by this much. The change order was entered straight into CE and Procore is understating the contract.">'
          + money(Math.abs(gap)) + ' over Procore</div>';
  return (gap ? '<span class="figbad">' + money(b.ce_sov) + '</span>' : money(b.ce_sov))
    + coLine(b.ce_approved_cos, r.approved_change_orders)
    + pendingLine(b.ce_sov == null ? null : (b.ce_pending_sov || 0), r.pending_change_orders)
    + gapLine;
}

/* `other` is the opposite column's figure. A zero prints only when the other
   side is non-zero - otherwise every commitment without a change order would
   carry two blank lines in both columns. */
function coLine(v, other){
  if (v === null || v === undefined)
    return '<div class="sub muted" title="Approved change orders have not been pulled on this side yet. The CE figure was added to ap_payapp_expected.js on 7 Oct 2026; re-run it.">CO not pulled</div>';
  if (!v && !other) return '';
  return '<div class="sub co" title="The figure above is the REVISED contract. This says how much of it is approved change orders - it is not an amount to add on. Read it against the same line in the other column.">'
    + 'includes ' + money(v) + ' CO</div>';
}

/* Pending change orders sit in NEITHER contract figure - Procore counts approved
   COs only, and ce_sov excludes unapproved RFCs. Showing both sides is what makes
   it visible whether the two systems hold the same unapproved work. */
function pendingLine(v, other){
  if (v === null || v === undefined)
    return '<div class="sub muted" title="Procore pending change orders have not been pulled yet. The field was added to ap_commitments_pull.js on 7 Oct 2026; re-run it. The run logs how many commitments carry it.">pending not pulled</div>';
  if (!v && !other) return '';
  return '<div class="sub" title="A change order is raised but not approved, so it is in neither contract figure. Read it against the same line in the other column: different pending amounts mean one system is missing a change order.">'
    + money(v) + ' pending</div>';
}

/* The PM column is the project's Project Management Team from Procore project_roles,
   NOT the commitment's own custom_field_300705. That field names whoever wrote the
   subcontract and goes stale - Comer Hall was still reading a name of someone who
   has left. The team is the right answer for a queue and is maintained per project. */
function pmCell(r){
  const team = (r.pm_team_names || []).filter(Boolean);
  return team.length ? esc(team.join(', '))
    : '<span class="muted" title="No Project Management Team on this project in Procore.">\u2014</span>';
}

function billedCell(r){
  const b = billingFor(r);
  if (!b) return '<span class="muted" title="No row in ' + EXPECTED_FILE + ' for this commitment">—</span>';
  if (b.ce_billed === null || b.ce_billed === undefined) {
    /* Three different reasons there is no figure, and they are not the same
       thing. "not matched" was being shown for all of them. */
    const f = (b.flags||[]).find(x => ['no_committed_cells','no_job_totals','no_ce_subcontract'].includes(x));
    const label = f ? FLAG_TEXT[f][1] : 'not matched';
    const tip = ((f ? FLAG_TEXT[f][2] : '') + ' ' + (b.billed_source||'')).trim();
    return '<span class="pill b" title="' + esc(tip) + '">' + label + '</span>' + pendingPill(b);
  }
  const flags = (b.flags||[]).filter(f => FLAG_TEXT[f]);
  const pills = flags.map(f => {
    const [cls,label,tip] = FLAG_TEXT[f];
    return '<span class="pill ' + cls + '" title="' + esc(tip) + '">' + label + '</span>';
  }).join(' ');
  return money(b.ce_billed)
    + '<div class="sub">' + (b.pct_billed != null ? Number(b.pct_billed).toFixed(0) + '%' : '')
    + (b.ce_balance ? ' &middot; ' + (b.ce_balance < 0
         ? money(Math.abs(b.ce_balance)) + ' over'    // a negative balance is an over-bill, not "-$5,100 left"
         : money(b.ce_balance) + ' left') : '') + '</div>'
    + (pills ? '<div class="sub">' + pills + '</div>' : '');
}

/* ---- Expected pay app -------------------------------------------------------
   Every quantity on a sub's cover sheet is derivable from the commitment and
   CE's billed-to-date, whatever form the sub uses. The reviewer types the four
   figures off their cover sheet and the deltas fall out. This exists because
   two reviews in one morning each took an hour and each turned on a single
   number: a $6,776 change order missing from one app, $2,160 missing from
   another. Both were visible from the contract alone.

   committed_billed is GROSS of retainage. Confirmed 1 Oct 2026 against H.C.
   Blake's G702 on 2506-00400: the desk read $310,186 and the application showed
   $310,186.31 billed with $300,646.75 paid. Previously inferred, now measured. */
function payappExpected(r){
  const b = billingFor(r);
  const contract = num0(r.revised_contract) || num0(r.contract_value);
  const pctR = (r.retainage_percent === null || r.retainage_percent === undefined)
    ? null : Number(r.retainage_percent);
  const dur  = String(r.retainage_duration || '');
  /* "thru 50%" caps total retainage at half the contract's worth of withholding.
     Anything else (throughout, or unset) withholds on every dollar. A missing
     term is NOT assumed to be thru-50 - that assumption is what let the GL Pack
     shortage through. */
  const thru50 = /50/.test(dur) && /thru|through/i.test(dur);
  const billed = b && b.ce_billed != null ? Number(b.ce_billed) : null;
  const rate = pctR == null ? null : pctR/100;
  const retAt = v => {            // retainage held once v has been billed
    if (rate == null || v == null) return null;
    if (!thru50) return v * rate;
    return Math.min(v, contract/2) * rate;
  };
  const retNow  = retAt(billed);
  const retFull = retAt(contract);
  const prevPaid = (billed != null && retNow != null) ? billed - retNow : null;
  const maxDue = (retFull != null && prevPaid != null) ? (contract - retFull) - prevPaid : null;
  return { contract, original:num0(r.contract_value), cos:num0(r.approved_change_orders),
           pctR, dur, thru50, billed, retNow, retFull, prevPaid, maxDue, retAt,
           minBilled:billed, maxBilled:contract,
           past50: b ? !!b.past_50_pct : null,
           ceSov: b && b.ce_sov != null ? Number(b.ce_sov) : null,
           gap: b && b.pc_vs_ce_contract_gap != null ? Number(b.pc_vs_ce_contract_gap) : null,
           flags: (b && b.flags) || [], hasBilling: !!b && b.ce_billed != null,
           billedSource: (b && b.billed_source) || '',
           /* CE holds the subcontract but nothing is posted to its cost codes.
              Billed is zero, not unknown - the usual shape of a first billing. */
           assumedZero: !!b && b.ce_billed == null
                        && ((b.flags || []).indexOf('no_committed_cells') !== -1) };
}
const num0 = v => (v === null || v === undefined || v === '') ? 0 : Number(v);
const money2 = v => (v === null || v === undefined || isNaN(v)) ? '—'
  : (Number(v) < 0 ? '-' : '') + '$'
    + Math.abs(Number(v)).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});

/* Line names on both forms BH actually receives. The quantities are identical;
   only the labels move, so one panel serves an AIA G702/G703 and BH's own
   Attachment G without the reviewer translating. */
/* Not every line has a single expected value, and pretending otherwise produced
   false mismatches. Billed-to-date from CE is the position as at the LAST posted
   application; a new pay app is expected to exceed it. Retainage likewise moves
   with whatever they have completed this period. So three kinds of row:

     fixed   - one right answer (adjusted contract, previous payments)
     range   - a floor and a ceiling (completed to date)
     derived - computed from what they entered above (retainage held)

   Only the ceiling on the payment is knowable in advance, which is why the
   headline is "most they can ask for" and not an expected amount. */
const PA_LINES = [
  ['contract','fixed','Adjusted contract','Amount of Original Contract + Approved Change Order(s) — AIA G702 line 3'],
  ['billed','range','Completed to date','Total Completed Work & Stored Materials to Date — AIA G702 line 4, G703 column G'],
  ['retNow','derived','Retainage held','Less Retainage — AIA G702 line 5'],
  ['prevPaid','fixed','Less previous payments','Less Previous Payments — AIA G702 line 7'],
  ['due','derived','Balance due this payment','Current Payment Due — AIA G702 line 8. What we would pay on these figures: completed (capped at the contract) less retainage less previous payments.'],
];

/* CE's billed-to-date equals, to the cent, what the subcontractor says is
   complete. There is no innocent reading of that: CE has already posted this
   application, so nothing derived from ce_billed describes the position BEFORE
   it. */
function ceEntryState(e, pre){
  if (!pre || e.billed == null) return null;
  const t = pre.billed;
  if (t === null || t === undefined || t === '') return null;
  const theirs = Math.round(Number(t) * 100), ce = Math.round(Number(e.billed) * 100);
  if (ce === theirs) return 'exact';
  if (ce >  theirs) return 'ahead';
  return null;                       // CE is behind it - a genuinely new application
}
function ceHoldsThisApp(e, pre){ return ceEntryState(e, pre) === 'exact'; }

/* ---- The ComputerEase invoice ledger ---------------------------------------
   ap_payapp_expected.json carries ONE number per subcontract: committed_billed,
   cumulative and gross. Everything awkward on this page comes from that - the
   double-counted previous payment, the cent-match test for whether CE already
   holds an application, "most they can ask for $0.00". None of it is visible as
   a fault because one aggregate cannot show you that Kone's PR5 was entered on
   two lines, or that Specialty's PR2 is sitting unpaid.

   This panel reads the per-invoice ledger instead, in the shape of CE's
   "Subcontractor Detail Report by Vendor". Written by a Q-Tool export; absent
   until that is scheduled, and the panel says so rather than showing nothing. */
const CEINV_FILE = 'ap_ce_invoices.json';

const ceLedger = number => {
  const d = STATE.ceInv;
  if (!d || !d.subcontracts) return null;
  const k = String(number || '').trim().toUpperCase();
  return d.subcontracts[k] || null;
};

/* What the ledger says that one aggregate cannot. */
function ceLedgerFacts(led, payReq){
  const inv = (led && led.invoices) || [];
  const n2 = v => Number(v || 0);
  const sum = f => inv.reduce((t,i) => t + n2(i[f]), 0);
  /* An invoice whose lines were posted on DIFFERENT days was entered more than
     once. Kone's PR5: base on 10/01, CO 002 on 10/05 - four days and two
     decisions apart. Lines posted the same day are one invoice split across cost
     codes and are nobody's problem. */
  const split = inv.filter(i => (i.entered_separately || []).length > 1);
  const unpaid = inv.filter(i => !i.check);
  const want = String(payReq == null ? '' : payReq).trim();
  const norm = v => String(v||'').toUpperCase().replace(/[^0-9]/g,'');
  const thisApp = want ? inv.filter(i => norm(i.number) && norm(i.number) === norm(want)) : [];
  return {
    inv, split, unpaid, thisApp,
    invoiced: sum('total'), retention: sum('retention'),
    payable: sum('payable'), paid: sum('paid'),
    outstanding: sum('payable') - sum('paid'),
  };
}

function ceLedgerPanel(number, payReq, e, theirDue, ourDue, ceState){
  const d = STATE.ceInv;
  const led = ceLedger(number);
  if (!led) {
    return '<div class="celed"><h4>ComputerEase invoices</h4><div class="celnone">'
      + (d
         ? 'No ledger rows for <b>' + esc(String(number || '')) + '</b> in the last ComputerEase export'
           + (d.as_of ? ' (' + esc(d.as_of) + ')' : '') + '. Either nothing has been invoiced against it, '
             + 'or the subcontract was not in scope of the export.'
         : 'Not available yet. This needs a ComputerEase export parsed into <code>' + CEINV_FILE
           + '</code>. Until then this page sees only <code>committed_billed</code> &mdash; one '
           + 'cumulative, gross number per subcontract, with no invoices, no dates and no payments.')
      + '</div></div>';
  }
  /* Job Cost Detail carries billings and nothing else. Without this the panel
     would mark every invoice unpaid, including Kone's four cleared by cheque. */
  const hasPay = !(d && d.has_payment_data === false);
  const f = ceLedgerFacts(led, payReq);

  const lineNote = i => (i.lines || []).length > 1
    ? '<div class="celsub">' + i.lines.map(l => esc(l.description || 'line') + ' ' + money2(l.amount)
        + (l.posted ? ' &middot; ' + esc(l.posted) : '')).join('<br>') + '</div>'
    : '';
  const row = i => '<tr' + (hasPay && !i.check ? ' class="celunpaid"' : '') + '>'
    + '<td>' + esc(i.number || '') + lineNote(i) + '</td>'
    + '<td>' + esc(i.date || '') + '</td>'
    + '<td class="n">' + money2(i.total) + '</td>'
    + (hasPay
        ? '<td class="n">' + money2(i.retention) + '</td>'
          + '<td class="n">' + money2(i.payable) + '</td>'
          + '<td class="n">' + (i.check
              ? money2(i.paid) + '<div class="celsub">#' + esc(i.check)
                + (i.check_date ? ' &middot; ' + esc(i.check_date) : '') + '</div>'
              : '<span class="pill y">unpaid</span>') + '</td>'
        : '<td>' + esc(i.posted || '') + '</td>')
    + '</tr>';

  const notes = [];
  if (f.thisApp.length)
    notes.push('<b>This application is in ComputerEase</b> as '
      + f.thisApp.map(i => esc(i.number) + ' ' + money2(i.total)).join(' + ')
      + (hasPay
          ? (f.thisApp.every(i => !i.check)
              ? ' &mdash; <b>entered, not paid</b>, '
                + money2(f.thisApp.reduce((t,i)=>t+Number(i.payable||0),0)) + ' payable.'
              : ' &mdash; paid.')
          : ' &mdash; <b>entered</b>. Whether it has been paid is not in this feed.'));

  f.split.forEach(sp => notes.push('Invoice <b>' + esc(sp.number) + '</b> was entered on '
    + sp.entered_separately.length + ' different days (' + sp.entered_separately.map(esc).join(', ')
    + ') totalling ' + money2(sp.total) + '. Separate entries under one reference &mdash; check the '
    + 'lines beside it, and whether an application covers each.'));

  /* payable is net of retention and comparable to their balance due; total is
     gross and is not. With no payable in the feed there is nothing to compare. */
  if (hasPay && f.thisApp.length && theirDue != null) {
    const appTotal = f.thisApp.reduce((t,i) => t + Number(i.payable || 0), 0);
    if (Math.abs(appTotal - theirDue) >= 1)      // cents are rounding, not scope
      notes.push('<span class="celwrong">ComputerEase holds ' + money2(appTotal) + ' under this invoice '
        + 'number, but the application only asks for ' + money2(theirDue) + '.</span> The difference, '
        + money2(appTotal - theirDue) + ', is entered in CE and supported by no application. Pay what '
        + 'the application asks for, and either reverse the unsupported entry in CE or get an '
        + 'application that covers it.');
  }

  if (hasPay && f.unpaid.length) {
    const comparable = ceState === 'exact' && ourDue != null
                       && Math.round(f.outstanding * 100) !== Math.round(ourDue * 100);
    notes.push(f.unpaid.length + ' invoice' + (f.unpaid.length===1?'':'s') + ' unpaid, <b>'
      + money2(f.outstanding) + '</b> outstanding'
      + (comparable
          ? ' &mdash; <span class="celwrong">' + money2(Math.abs(f.outstanding - ourDue))
            + (f.outstanding > ourDue ? ' more' : ' less') + ' than the ' + money2(ourDue)
            + ' this application supports. The ComputerEase invoice carries the same error as the '
            + 'paperwork, so correcting the subcontractor does not fix it &mdash; the posted invoice '
            + 'has to be corrected too, before the cheque run.</span>'
          : '.'));
  }
  if (!hasPay)
    notes.push('<b>Billings only.</b> This feed is the Job Cost Detail export, which carries no '
      + 'retention, payable or payment. An invoice with no cheque shown here has <b>not</b> been '
      + 'shown to be unpaid. The Subcontractor Detail Report by Vendor adds that half.');

  if (e && e.billed != null && Math.round(f.invoiced*100) !== Math.round(e.billed*100))
    notes.push('<b>This ledger and <code>committed_billed</code> disagree</b> &mdash; ' + money2(f.invoiced)
      + ' here against ' + money2(e.billed) + ' on the billing feed. One of the two exports is stale.');

  return '<div class="celed"><h4>ComputerEase invoices'
    + (led.vendor_code ? ' <span class="celcode">' + esc(led.vendor_code) + '</span>' : '')
    + (hasPay ? '' : ' <span class="celcode">billings only</span>') + '</h4>'
    + '<table class="celtab"><thead><tr><th>Invoice</th><th>Date</th><th class="n">Total</th>'
    + (hasPay ? '<th class="n">Retention</th><th class="n">Payable</th><th class="n">Paid</th>'
              : '<th>Posted</th>')
    + '</tr></thead>'
    + '<tbody>' + f.inv.map(row).join('') + '</tbody>'
    + '<tfoot><tr><td colspan="2">Invoiced to date</td>'
    + '<td class="n">' + money2(f.invoiced) + '</td>'
    + (hasPay ? '<td class="n">' + money2(f.retention) + '</td>'
                + '<td class="n">' + money2(f.payable) + '</td>'
                + '<td class="n">' + money2(f.paid) + '</td>'
              : '<td></td>')
    + '</tr></tfoot></table>'
    + (notes.length ? '<div class="celnotes">' + notes.map(n=>'<div>'+n+'</div>').join('') + '</div>' : '')
    + '</div>';
}

/* One source of truth for what is payable. payappPanel renders it and the
   correction notice quotes it; if these ever came from two places the email to
   the subcontractor would eventually disagree with the screen. */
function payappPosition(e, pre){
  const nz = v => (v === null || v === undefined || v === '') ? null : Number(v);
  const absorbed = ceHoldsThisApp(e, pre);
  const theirPrev = nz(pre && pre.prevPaid);
  const theirDue  = nz(pre && pre.due);
  /* CE's cumulative payable less the request on the table = what was paid before.
     Sound only because CE posted this application at the amount asked for - which
     is exactly what ce_billed matching their completed-to-date tells us. */
  const derivedPrev = (absorbed && theirDue != null && e.prevPaid != null)
                        ? e.prevPaid - theirDue : null;
  const usePrev = derivedPrev != null ? derivedPrev : theirPrev;
  /* Completed is capped at the contract - they cannot earn more than exists -
     and retainage is recomputed on that capped figure. */
  const earned  = absorbed ? Math.min(nz(pre.billed), e.contract) : null;
  const retDue  = earned == null ? null : e.retAt(earned);
  const payNow  = (earned != null && retDue != null && usePrev != null)
                    ? earned - retDue - usePrev : null;
  const theirAsk = (nz(pre && pre.billed) != null && nz(pre && pre.retNow) != null && theirPrev != null)
                    ? nz(pre.billed) - nz(pre.retNow) - theirPrev : null;
  /* What we would pay on THEIR completed figure - capped at the contract, with
     our retainage and our previous payments. ourDue - theirDue is exactly the
     amount the commitment is over-billed, which is the number the sub disputes. */
  const tb = nz(pre && pre.billed);
  const cap = tb == null ? null : Math.min(tb, e.contract);
  /* NOT usePrev. usePrev falls back to their own previous-payments figure, which
     is the only source available once CE has absorbed the application - fine for
     the ceiling, fatal here: an estimate built from their number agrees with
     their number by construction and prints "matches" on a bad application. */
  const ourPrev = derivedPrev != null ? derivedPrev : e.prevPaid;
  const ourDue = (cap != null && ourPrev != null && e.retAt(cap) != null)
                   ? cap - e.retAt(cap) - ourPrev : null;
  /* CE carrying MORE than they claim complete is its own finding: it means CE
     is ahead of their application, so nothing on our side describes the position
     before it. */
  const ceState = ceEntryState(e, pre);
  const ceAhead = ceState === 'ahead' ? e.billed - tb : null;
  return { nz, absorbed, ceState, theirPrev, theirDue, derivedPrev, usePrev, ourPrev, earned, retDue,
           payNow, theirAsk, ourDue, ceAhead };
}

function payappPanel(r, pre, rowId){
  let e = payappExpected(r);
  if (!e.hasBilling && e.assumedZero) {
    e = Object.assign({}, e, {
      billed: 0, minBilled: 0, retNow: e.retAt(0), prevPaid: 0,
      maxDue: e.contract - (e.retFull == null ? 0 : e.retFull),
      hasBilling: true,
    });
  }
  if (!e.hasBilling) {
    /* Say WHICH of the three it is. The feed has always known; the panel used to
       throw it away and leave everyone guessing at a Deltek outage. */
    const why = e.flags.indexOf('no_ce_subcontract') !== -1
      ? 'No ComputerEase subcontract carries this commitment number, so there is no billing position '
        + 'to check against. A Procore commitment with no CE subcontract cannot be billed or paid - '
        + 'that is worth chasing before the application is.'
      : e.flags.indexOf('no_job_totals') !== -1
        ? 'This job does not publish to the ComputerEase API, so no billing figure is available for '
          + 'any subcontract on it. Known gap, with Deltek - not a problem with this application.'
        : 'No billed-to-date figure for this commitment'
          + (e.billedSource ? ' (' + esc(e.billedSource) + ')' : '') + '.';
    return '<div class="pawrap"><div class="pamax"><span class="l">Adjusted contract</span>'
      + '<span class="n">' + money2(e.contract) + '</span></div>'
      + '<div class="pawarn"><div>&#9888;&nbsp; ' + why + '</div></div></div>';
  }
  const P = payappPosition(e, pre);
  const { nz, absorbed, theirPrev, theirDue, derivedPrev, earned, retDue, payNow, theirAsk } = P;
  /* No floor can be stated once CE holds the application, or when CE already
     carries more than the contract. Only the ceiling is real. */
  const noFloor = !!P.ceState || e.minBilled > e.maxBilled + 0.005;
  /* Retainage expected at the completed figure THEY state - the same call
     payappBind makes as the reviewer types, so the two never disagree. */
  const tbill   = P.nz(pre && pre.billed);
  const retWant = (e.pctR == null || tbill == null) ? null : e.retAt(tbill);
  const atCap   = retWant != null && e.retFull != null
                  && Math.round(retWant * 100) === Math.round(e.retFull * 100);

  const ours = {
    contract: money2(e.contract),
    billed: 'at most ' + money2(e.maxBilled),
    retNow: retWant != null ? money2(retWant)
            : (e.pctR == null ? '&mdash;'
               : e.pctR + '% of completed'
                 + (e.thru50 ? ', capped at ' + money2(e.retFull) : '')),
    prevPaid: absorbed ? (derivedPrev == null ? '&mdash;' : money2(derivedPrev)) : money2(e.prevPaid),
    due: P.ourDue == null ? '&mdash;' : money2(P.ourDue),
  };
  const sub = {
    contract: money2(e.original) + ' + ' + money2(e.cos) + ' CO',
    billed: noFloor
      ? (P.ceState
          ? 'the contract. No floor &mdash; CE already holds this application'
          : 'the contract. No floor &mdash; CE already carries more than the contract')
      : 'the contract, and not below the ' + money2(e.minBilled) + ' already billed',
    retNow: e.pctR == null
      ? 'no retainage term on the commitment'
      : e.thru50
        ? e.pctR + '% through 50% completion &mdash; '
          + (atCap ? 'cap of ' + money2(e.retFull) + ' reached, nothing further is withheld'
                   : 'caps at ' + money2(e.retFull))
        : e.pctR + '% of completed, no cap',
    prevPaid: absorbed
      ? (derivedPrev == null ? 'needs their balance due &mdash; see below'
                             : 'CE payable to date less this request')
      : 'billed less retainage held',
    due: 'what we would pay on these figures',
  };
  const rows = PA_LINES.map(([k,kind,what,tip]) =>
    '<tr><td><div class="paq" title="' + esc(tip) + '">' + what + '</div>'
    + '<div class="paref">' + sub[k] + '</div></td>'
    + '<td class="n' + (kind==='fixed'?'':' paloose') + '">' + ours[k] + '</td>'
    + '<td class="n"><input class="pain" type="text" inputmode="decimal" data-k="' + k + '"'
    + ((pre && pre[k] !== null && pre[k] !== undefined && pre[k] !== '')
        ? ' value="' + esc(Number(pre[k]).toFixed(2)) + '"' : '')
    + ' placeholder="&mdash;"></td>'
    + '<td class="padelta" data-d="' + k + '"></td></tr>').join('');

  const warn = [];
  if (P.ceState)
    warn.push('<b>Already entered in ComputerEase.</b> Whatever is agreed here has to be corrected on '
      + 'the CE invoice as well as with the subcontractor &mdash; asking them for a revised application '
      + 'does not change what is already posted. Whether it has been paid is not visible from this page; '
      + 'the Payment / Amount column of <b>Subcontractor Detail Report by Vendor</b> says.');
  if (e.assumedZero) {
    warn.push('ComputerEase holds this subcontract but nothing is posted against its cost codes, so '
      + 'billed to date is taken as <b>zero</b> &mdash; the shape of a first or only billing. '
      + 'Previous payments should therefore be 0.00.');
    if (P.theirPrev != null && Math.abs(P.theirPrev) > 0.005)
      warn.push('They are claiming <b>' + money2(P.theirPrev) + '</b> in previous payments against a '
        + 'subcontract with nothing posted in CE. Either a billing never reached job cost, or it was '
        + 'posted to cost codes this subcontract does not carry. Settle that before paying.');
  }
  if (absorbed) {
    warn.push('ComputerEase already holds this application &mdash; its billed-to-date ('
      + money2(e.billed) + ') equals their completed-to-date to the cent, '
      + 'so the usual previous-payments figure would be this application counted twice.');
    warn.push(derivedPrev == null
      ? 'Previous payments cannot be derived until their balance due is keyed. Until then the '
        + 'ceiling rests on their own figure. <b>Subcontractor Detail Report by Vendor</b>, '
        + 'Payment / Amount column, settles it.'
      : 'Previous payments above is <b>derived</b>: CE payable to date (' + money2(e.prevPaid)
        + ') less the ' + money2(theirDue) + ' being requested. That holds because CE posted this '
        + 'application at the amount asked for. Confirm against <b>Subcontractor Detail Report by '
        + 'Vendor</b>, Payment / Amount column, before paying.');
    if (e.billed > e.contract + 0.005)
      warn.push('CE carries <b>' + money2(e.billed) + '</b> against a contract of '
        + money2(e.contract) + ' &mdash; <b>' + money2(e.billed - e.contract)
        + '</b> more than the commitment. That needs correcting in CE whatever is paid.');
    if (earned != null && nz(pre.billed) > e.contract + 0.005)
      warn.push('Completed is capped at the contract above. If their schedule of values still '
        + 'bills scope that an approved change order removed, less than this is due &mdash; '
        + 'check column G against the deducted line before paying.');
  }
  if (P.ceAhead != null) {
    warn.push('ComputerEase shows <b>' + money2(e.billed) + '</b> billed against this subcontract, <b>'
      + money2(P.ceAhead) + '</b> MORE than they are claiming complete. CE is ahead of their own '
      + 'application, so previous payments on the left is not the position before this one and the '
      + 'ceiling above is understated.'
      + (e.cos && Math.round(P.ceAhead * 100) === Math.round(e.cos * 100)
          ? ' The difference is <b>exactly the approved change order</b> of ' + money2(e.cos)
            + ', so the change order value has most likely been posted into billings in CE while the '
            + 'subcontractor is still billing the original contract. Check the subcontract\'s invoices '
            + 'in CE before treating anything here as a finding against them.'
          : ' Reconcile the subcontract\'s invoices in CE against their applications before paying.'));
  }
  if (e.gap) warn.push(e.gap > 0
    ? 'Procore is <b>' + money2(e.gap) + '</b> higher than CE &mdash; an approved change order has not reached CE.'
    : 'CE is <b>' + money2(-e.gap) + '</b> higher than Procore &mdash; the change order was entered straight into CE.');
  if (e.thru50 && e.past50) warn.push('Past 50% &mdash; no further retainage should be withheld. '
    + 'Their retainage &divide; ' + (e.pctR/2) + '% recovers the contract they are billing against.');
  if (e.flags.includes('sov_gap')) warn.push('Billed plus remaining does not reconcile to the schedule of values.');
  if (e.pctR && !e.dur) warn.push('No retainage term on the commitment &mdash; assuming it is withheld on every dollar.');

  return '<div class="pawrap"><div class="pacols"><div class="pacol1">'
   /* A negative ceiling is not "they may ask for minus two thousand" - it means
      the commitment is already billed past its contract. Seven live rows are in
      that state, so it is a real case, not a theoretical one. */
   + (absorbed
      /* The ceiling cannot come from CE here, so it comes from their own form
         or it is not shown at all. Never "nothing further is due". */
      ? (payNow == null
          ? '<div class="pamax"><span class="l">Ceiling not available</span>'
            + '<span class="paref" style="margin-left:2px">CE already holds this application, and their previous-payments figure is not keyed</span></div>'
          : payNow <= 0.005
            ? '<div class="pamax"><span class="l" style="color:#b3261e">Nothing is due</span>'
              + '<span class="paref" style="margin-left:2px">they have already been paid '
              + money2(theirPrev) + ' of the ' + money2(earned - retDue) + ' earned net of retainage</span></div>'
            : '<div class="pamax"><span class="l">Pay no more than</span>'
              + '<span class="n">' + money2(payNow) + '</span>'
              + '<span class="paref" style="margin-left:2px">'
              + (theirAsk == null ? 'recomputed on the adjusted contract of ' + money2(e.contract)
                 : 'they asked for ' + money2(theirAsk)
                   + (theirAsk - payNow > 0.005 ? ' &mdash; ' + money2(theirAsk - payNow) + ' less'
                      : theirAsk - payNow < -0.005 ? ' &mdash; ' + money2(payNow - theirAsk) + ' more' : ''))
              + '</span></div>')
      : e.maxDue != null && e.maxDue < -0.005
        ? '<div class="pamax"><span class="l" style="color:#b3261e">Already over-billed by</span>'
          + '<span class="n" style="color:#b3261e">' + money2(-e.maxDue) + '</span>'
          + '<span class="paref" style="margin-left:2px">nothing further is due</span></div>'
        : '<div class="pamax"><span class="l">Most they can ask for</span><span class="n">' + money2(e.maxDue) + '</span>'
          + '<span class="paref" style="margin-left:2px">'
          + (P.ceAhead != null
              ? 'not a ceiling &mdash; ComputerEase already holds this application and more'
              : e.maxDue != null && e.maxDue <= 0.005
                ? 'ComputerEase has this subcontract at ' + money2(e.billed) + ' of ' + money2(e.contract)
                  + ' &mdash; nothing is left on the contract'
                : 'if they bill to 100%') + '</span></div>')
   + '<table class="patab" data-pa="x"' + (absorbed ? ' data-absorbed="1"' : '')
   + (derivedPrev != null ? ' data-prevderived="' + derivedPrev.toFixed(2) + '"' : '')
   + (P.ourPrev   != null ? ' data-ourprev="'     + P.ourPrev.toFixed(2)   + '"' : '')
   + (noFloor ? ' data-nofloor="1"' : '') + '><thead><tr><th></th><th class="n">Ours</th>'
   +   '<th class="n">Theirs</th><th class="n"></th></tr></thead><tbody>' + rows + '</tbody></table>'
   + '</div>'
   + ceLedgerPanel(r.number, pre && pre.payReq, e, P.theirDue, P.ourDue, P.ceState)
   + '<div class="pacol2">'
   + (warn.length ? '<div class="pawarn">' + warn.map(w=>'<div>&#9888;&nbsp; '+w+'</div>').join('') + '</div>' : '')
   + (rowId ? '<div class="rqrev">'
              + '<button data-savefigs="' + esc(rowId) + '" class="ghost">Save these figures</button>'
              + '<button data-noted="' + esc(rowId) + '" class="ghost"'
                + ' title="Approve for payment with the exception recorded - pay the corrected amount '
                + 'rather than holding the cheque. Procore calls this Approved as Noted.">'
                + 'Approve as noted</button>'
              + '<button data-revise="' + esc(rowId) + '">Request revision&hellip;</button>'
              + '<span class="msg"></span></div>' : '')
   + '</div></div>';
}

/* ---- Request revision -------------------------------------------------------
   Builds the correction notice from the SAME figures the panel shows - that is
   why payappPosition() was extracted - and leaves it as a DRAFT in the signed-in
   user's mailbox. Never Mail.Send: nothing reaches a subcontractor without a
   person reading it and pressing send. */

/* Mail.ReadWrite is asked for only when the button is used, so everyone else
   keeps working on the original consent. Popup, not redirect - a redirect here
   would throw away the open row and everything keyed into it. */
async function tokenFor(extra){
  try {
    await msalApp.initialize();
    const account = msalApp.getAllAccounts()[0];
    if (!account) return { tok: null, err: 'not signed in' };
    const scopes = SCOPES.concat(extra || []);
    try { const t = await msalApp.acquireTokenSilent({ scopes, account }); return { tok: t.accessToken }; }
    catch (_) {
      const t = await msalApp.acquireTokenPopup({ scopes, account });
      return { tok: t.accessToken };
    }
  } catch (e) {
    const c = (e && (e.errorCode || e.message)) || '';
    if (/popup_window_error|popup_blocked/i.test(c))
      return { tok: null, err: 'the consent popup was blocked - allow popups for this site and try again' };
    if (/consent_required|interaction_required|user_cancelled/i.test(c))
      return { tok: null, err: 'Mail.ReadWrite has not been granted to this app yet' };
    return { tok: null, err: c || 'could not get a token' };
  }
}

/* The four lines, with the difference stated the way it goes to the sub. Mirrors
   payappBind exactly; cent precision, never an epsilon. */
function correctionFigures(e, pre){
  const P = payappPosition(e, pre);
  const cents = v => Math.round(Number(v) * 100);
  const out = [];
  const add = (label, theirs, ours, note) => {
    if (theirs == null || ours == null) return;
    if (cents(theirs) === cents(ours)) return;
    out.push({ label, theirs, ours, diff: ours - theirs, note: note || '' });
  };
  add('Adjusted contract', P.nz(pre.contract), e.contract,
      'Original contract plus approved change orders.');
  const tb = P.nz(pre.billed);
  if (tb != null && tb > e.contract + 0.005)
    out.push({ label: 'Completed to date', theirs: tb, ours: e.contract,
               diff: e.contract - tb,
               note: 'Completed work cannot exceed the adjusted contract.' });
  if (tb != null && P.nz(pre.retNow) != null && e.retAt(tb) != null)
    add('Retainage held', P.nz(pre.retNow), e.retAt(tb),
        e.thru50 ? ('Retainage is ' + e.pctR + '% through 50% completion, capped at '
                    + money2(e.retFull) + '.') : '');
  const wantPrev = P.derivedPrev != null ? P.derivedPrev : e.prevPaid;
  add('Less previous payments', P.nz(pre.prevPaid), wantPrev,
      'Per our records of payments issued against this subcontract.');
  return { lines: out, pos: P };
}
