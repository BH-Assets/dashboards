function enrich(i){i.commitment=i.commitment||('SC-'+(2600+i.id));i.costCode=i.costCode||'03-300 · Concrete / trade scope';i.markups=i.markups||[];i.versions=i.versions||[];i.revision=i.revision||1;fillGridFields(i);if(i.type==='Pay application'){i.procoreOriginal=i.contract;i.procoreChanges=i.changes;i.ceOriginal=i.contract;i.ceChanges=i.changes;i.procoreAmount=i.procoreAmount??revised(i);i.ceAmount=i.ceAmount??revised(i);buildSOV(i)}return i}
function buildSOV(i){if(i.type!=='Pay application')return;const names=['Mobilization','Foundations / primary scope','Material procurement','Area A installation','Area B installation','Area C installation','Testing / commissioning','Closeout'];let sched=0,earned=0; i.sov=names.map((name,j)=>{const total=j===7?round(revised(i)-sched):round(revised(i)/8);const completed=j===7?round(i.earned-earned):round(i.earned/8);sched+=total;earned+=completed;return{line:j+1,name,scheduled:total,earned:completed,percent:total?completed/total*100:0}})}

function reconIssues(i){const issues=[];if(duplicate(i))issues.push('Possible duplicate vendor and invoice number.');if(i.type==='Pay application'){if(Math.abs(i.procoreAmount-revised(i))>.01||Math.abs(i.ceAmount-revised(i))>.01)issues.push('Revised contract amounts do not match across the pay app, Procore, and ComputerEase.');if(Math.abs(i.previous-i.ledgerPrevious)>.01)issues.push('Previous-paid amount does not match ComputerEase.');if(Math.abs(due(i)-i.amount)>.01)issues.push('Submitted current due does not match the pay application calculation.');if(i.earned>revised(i))issues.push('Completed and stored amount exceeds the revised contract.');}return issues}
function intakeBlockingIssues(i){return reconIssues(i).filter(issue=>!issue.startsWith('Revised contract amounts')&&!issue.startsWith('Previous-paid amount'))}
function recon(i){if(i.type!=='Pay application')return '<p class="muted">Regular invoice: three-way pay application reconciliation does not apply.</p>';return `<div class="recon-row"><span>Pay app · revised contract</span><strong>${money(revised(i))}</strong></div><div class="recon-row"><span>Procore · subcontract / PO</span><strong class="${Math.abs(i.procoreAmount-revised(i))<.01?'match':'mismatch'}">${money(i.procoreAmount)}</strong></div><div class="recon-row"><span>ComputerEase · subcontract / PO</span><strong class="${Math.abs(i.ceAmount-revised(i))<.01?'match':'mismatch'}">${money(i.ceAmount)}</strong></div><p class="muted">Including approved changes. Reference amounts are simulated.</p><div class="recon-row"><span>Pay app · previous payments</span><strong>${money(i.previous)}</strong></div><div class="recon-row"><span>ComputerEase · previous paid</span><strong class="${Math.abs(i.previous-i.ledgerPrevious)<.01?'match':'mismatch'}">${money(i.ledgerPrevious)}</strong></div>${Math.abs(i.previous-i.ledgerPrevious)>.01?'<p class="mismatch">Accounting verifies CE is correct for the selected commitment and payment basis. If the application is wrong, the PM marks it up and obtains a correction. If CE is wrong, accounting corrects its record.</p>':''}`}

eduled-l.earned)}</td></tr>`).join('')}</tbody></table>${page===3?`<div class="kv"><span>Total scheduled</span><strong>${money(revised(i))}</strong></div><div class="kv"><span>Total complete & stored</span><strong>${money(i.earned)}</strong></div>`:''}${lines.map(l=>annotationHTML(i,page,'line-'+l.line)).join('')}<div class="page-num">Page ${page} of 3 · SOV continuation · Completed and stored are combined in this sample.</div></article>`}return html}

}else if(i.status==='PM review'){html+=`<h3>PM verification</h3><p class="muted">Accounting intake complete. Review the source pages and field conditions before approval.</p>${['valid','contract','progress','retain'].map(k=>`<label class="check"><input type="checkbox" ${i.checks[k]?'checked':''} ${role!==i.pm?'disabled':''} onchange="toggleCheck('${k}',this.checked)"><span>${({valid:'Valid application / invoice; correct vendor and period',contract:pay?'Contract, approved changes, and three-way reconciliation verified':'Purchase order / contract and cost coding verified',progress:pay?'SOV progress and stored materials verified against field conditions':'Materials received / services performed verified',retain:pay?'Retainage, prior payments, and payment calculation reviewed':'Invoice amount and applicable tax verified'})[k]}</span></label>`).join('')}<div class="actions"><button class="primary" ${role!==i.pm||issues.length||i.markups.length||!['valid','contract','progress','retain'].every(k=>i.checks[k])?'disabled':''} onclick="approve()">Approve ${money(i.amount)}</button><button ${role!==i.pm?'disabled':''} onclick="requestCorrection()">Request correction</button></div>${role!==i.pm?'<p class="muted">Select '+esc(i.pm)+' at the top of this panel to complete review.</p>':''}${i.markups.length?'<p class="muted">Correction markups are present. Request correction, or remove a markup if you added it by mistake.</p>':''}`;
}else if(i.status==='Correction needed'){html+=`<h3>Correction required</h3><p><strong>Next action: ${esc(i.correctionOwner||'PM')}</strong></p><p class="muted">${esc((i.correctionKind==='system'||i.correctionKind==='contract')?'Correct the underlying system reference or commitment selection. No invoice has been entered in CE.':'The PM obtains a revised application from the subcontractor. Accounting rechecks it before PM approval.')}</p>${i.notes.length?`<div class="note">${esc(i.notes.at(-1).text)}</div>`:''}<div class="actions">${(i.correctionKind==='system'||i.correctionKind==='contract')?`<button class="primary" ${role!==(i.correctionKind==='contract'?i.pm:'Accounting')?'disabled':''} onclick="resolveSystemIssue()">Simulate resolved ${i.correctionKind==='contract'?'contract':'accounting'} discrepancy</button>`:`<button class="primary" ${role!==i.pm?'disabled':''} onclick="correctedSubmission()">Simulate corrected application received</button>`}</div>`;
}else if(i.status==='Ready for entry'){html+=`<h3>Approved for CE entry</h3><div class="alert success">${esc(i.pm)} approved ${money(i.amount)}. No invoice has been entered in CE.</div>${entryChanged(i)?'<div class="alert">System references changed after approval. Entry is blocked. Return to intake and obtain fresh PM approval.</div>':''}<button ${role!=='Accounting'?'disabled':''} onclick="recheckEntry()">Recheck system references</button><p class="muted">The sample recheck compares current reference values with the approval snapshot. It does not contact CE or Procore.</p><div class="field"><label for="ceRef">CE entry reference (after entry)</label><input id="ceRef" placeholder="e.g. CE-264012" ${role!=='Accounting'?'disabled':''}></div><div class="actions"><button class="primary" ${role!=='Accounting'||!i.entryRechecked||entryChanged(i)?'disabled':''} onclick="markEntered()">Record CE entry</button><button ${role!=='Accounting'?'disabled':''} onclick="returnToIntake()">Return for review</button></div>${i.entryRechecked&&!entryChanged(i)?'<p class="match">Final reference check passed.</p>':''}`;
}else if(i.status==='Entered'){html+=`<h3>CE entry recorded</h3><div class="alert success">Reference: ${esc(i.reference)}</div><p class="muted">Payment remains managed in ComputerEase. Entry does not mean paid.</p>`;}html+='</div>'+calc(i)+gridDetails(i);if(i.markups.length)html+=`<div class="card"><h3>Document markups</h3>${markupList(i)}</div>`;return html}
function setCommitment(v){if(role!=='Accounting'||item().status!=='Intake')return;item().commitment=v.trim();item().checks.previous=false;draw();renderDetail()}
function snapshot(i){return{ceAmount:i.ceAmount??null,procoreAmount:i.procoreAmount??null,ledgerPrevious:i.ledgerPrevious??null,commitment:i.commitment,amount:i.amount}}
function entryChanged(i){if(!i.entrySnapshot)return true;const s=snapshot(i);return Object.keys(s).some(k=>s[k]!==i.entrySnapshot[k])||reconIssues(i).length>0}
function routePM(){const i=item();if(role!=='Accounting'||i.status!=='Intake'||!i.checks.previous||!i.commitment||intakeBlockingIssues(i).length)return;i.status='PM review';i.checks={previous:true};audit('Intake reviewed; routed to '+i.pm+(reconIssues(i).length?' with flagged application discrepancies assigned to the PM; contract discrepancies involve the process manager.':'.')+' No CE invoice entry created.');draw();renderDetail();toast('Routed to '+i.pm)}
function approve(){const i=item();if(role!==i.pm||i.status!=='PM review'||reconIssues(i).length||i.markups.length||!['valid','contract','progress','retain'].every(k=>i.checks[k]))return;i.status='Ready for entry';i.entrySnapshot=snapshot(i);i.entryRechecked=false;audit('Approved '+money(i.amount)+'; reference snapshot retained. Awaiting CE entry.');draw();renderDetail();toast('Approved; ready for accounting entry')}
function recheckEntry(){const i=item();if(role!=='Accounting'||i.status!=='Ready for entry')return;i.entryRechecked=!entryChanged(i);audit(i.entryRechecked?'Final system-reference recheck passed.':'Final reference check failed; CE entry blocked.');renderDetail();toast(i.entryRechecked?'References match approval':'References changed; return for review')}
function markEntered(){const i=item();if(role!=='Accounting'||i.status!=='Ready for entry'||!i.entryRechecked||entryChanged(i))return;const ref=document.getElementById('ceRef').value.trim();if(!ref){toast('Enter the CE entry reference.');return}i.reference=ref;i.status='Entered';audit('Recorded CE entry '+ref+'. Payment remains managed in CE.');draw();renderDetail();toast('CE entry recorded')}
function returnToIntake(){const i=item();if(role!=='Accounting'||i.status!=='Ready for entry')return;i.status='Intake';i.checks={};i.entrySnapshot=null;i.entryRechecked=false;audit('Returned to intake for reference discrepancy; prior approval invalidated.');draw();renderDetail();toast('Returned to intake; fresh PM approval required')}
function simulateContractSync(){const i=item();if(role!==i.pm||i.status!=='PM review'||i.id!==10)return;i.ceAmount=i.procoreAmount;i.ceChanges=i.procoreChanges;i.checks.contract=false;audit('Sample: PM / process manager corrected the missing CE commitment change order; reconciliation refreshed. No invoice entry created.');draw();renderDetail();toast('Contract references now match; PM review still required')}
function addMarkup(page,target){const i=item();if(role!==i.pm||i.status!=='PM review')return;modal(`<h2>Mark up ${page===1?'cover sheet':'SOV '+target.replace('line-','line ')}</h2><p class="muted">The selected amount or row will be highlighted, with your note next to it. This is a sample of anchored markup, not a PDF drawing tool.</p><div class="field"><label for="markupText">What is wrong / what needs to change?</label><textarea id="markupText" rows="4" placeholder="Claims 60% complete; field verification supports 50%."></textarea></div><div class="actions"><button class="primary" onclick="saveMarkup(${page},'${target}')">Save markup</button><button onclick="closeModal()">Cancel</button></div>`)}
function saveMarkup(page,target){const i=item();if(role!==i.pm||i.status!=='PM review')return;const text=document.getElementById('markupText').value.trim();if(!text){toast('Enter a markup note.');return}i.markups.push({id:Date.now()+Math.random(),page,target,text,who:role,revision:i.revision});i.checks.progress=false;i.checks.retain=false;audit('Added markup to revision '+i.revision+', page '+page+', '+target+': '+text);closeModal();renderDetail();toast('Markup attached to source document')}
function markupList(i){return i.markups.map(m=>`<div class="markup-item"><strong>Page ${m.page} · ${esc(m.target.replace('line-','SOV line '))}</strong><p>${esc(m.text)}</p><div class="muted">${esc(m.who)} · Revision ${m.revision}</div>${role===i.pm&&i.status==='PM review'?`<button class="smallbutton" onclick="removeMarkup(${m.id})">Remove mistaken markup</button>`:''}</div>`).join('')}
function removeMarkup(id){const i=item();if(role!==i.pm||i.status!=='PM review')return;i.markups=i.markups.filter(m=>m.id!==id);audit('Removed a mistaken markup; activity retains the original note.');renderDetail()}
function requestCorrection(){const i=item();if(!(role==='Accounting'&&i.status==='Intake'||role===i.pm&&i.status==='PM review'))return;modal(`<h2>Request correction</h2><p class="muted">Document markups travel with this request. No email is sent in this demo.</p><div class="field"><label for="correctionKind">Who owns the correction?</label><select id="correctionKind"><option value="billing">PM · Subcontractor billing / progress issue</option><option value="contract" ${i.id===10?'selected':''}>PM / process manager · Contract discrepancy</option><option value="system">Accounting · Accounting record / coding issue</option></select></div><div class="field"><label for="reason">Correction instructions</label><textarea id="reason" rows="4">${esc(i.markups.map(m=>'Page '+m.page+', '+m.target+': '+m.text).join('\n'))}</textarea></div><div class="actions"><button class="primary" onclick="saveCorrection()">Send to correction queue</button><button onclick="closeModal()">Cancel</button></div>`)}
function saveCorrection(){const text=document.getElementById('reason').value.trim();if(!text){toast('Enter the correction instructions.');return}const i=item();i.correctionKind=document.getElementById('correctionKind').value;i.correctionOwner=i.correctionKind==='system'?'Accounting':i.correctionKind==='contract'?i.pm+' / process manager':i.pm;i.status='Correction needed';i.checks={};i.notes.push({who:role,text});audit('Correction assigned to '+i.correctionOwner+': '+text);closeModal();draw();renderDetail();toast('Correction assigned to '+i.correctionOwner)}
function correctedSubmission(){const i=item();if(role!==i.pm||i.status!=='Correction needed'||(i.correctionKind==='system'||i.correctionKind==='contract'))return;modal(`<h2>Corrected application · Revision ${i.revision+1}</h2><p class="muted">Simulate the replacement from the subcontractor. The original values and markups remain in Activity. A real application could revise individual SOV lines; this sample distributes the revised earned total across the SOV.</p>${i.type==='Pay application'?`<div class="field"><label for="newEarned">Completed & stored to date ($)</label><input id="newEarned" type="number" min="0" max="${revised(i)}" step="0.01" value="${i.vendor==='Oakline Mechanical'?120000:i.earned}"></div><div class="field"><label for="newPrevious">Previous payments ($)</label><input id="newPrevious" type="number" min="0" step="0.01" value="${i.ledgerPrevious}"></div>`:`<div class="field"><label for="newAmount">Corrected amount ($)</label><input id="newAmount" type="number" min="0.01" step="0.01" value="${i.amount}"></div>`}<div class="actions"><button class="primary" onclick="saveCorrected()">Receive corrected application</button><button onclick="closeModal()">Cancel</button></div>`)}
function saveCorrected(){const i=item();if(role!==i.pm||i.status!=='Correction needed'||(i.correctionKind==='system'||i.correctionKind==='contract'))return;let earned,previous,amount;if(i.type==='Pay application'){earned=Number(document.getElementById('newEarned').value);previous=Number(document.getElementById('newPrevious').value);amount=round(earned*(1-i.retain/100)-previous);if(!Number.isFinite(earned)||earned<0||earned>revised(i)||!Number.isFinite(previous)||previous<0||amount<0){toast('Enter valid amounts. Current due cannot be negative.');return}}else{amount=Number(document.getElementById('newAmount').value);if(!Number.isFinite(amount)||amount<=0){toast('Enter a positive amount.');return}}i.versions.push({revision:i.revision,amount:i.amount,earned:i.earned,previous:i.previous,contract:i.contract,changes:i.changes,retain:i.retain,sov:JSON.parse(JSON.stringify(i.sov||[])),markups:JSON.parse(JSON.stringify(i.markups))});if(i.type==='Pay application'){i.earned=earned;i.previous=previous;buildSOV(i)}i.amount=amount;i.revision++;i.markups=[];i.checks={};i.status='Intake';i.entrySnapshot=null;i.notes.push({who:role,text:'Corrected revision '+i.revision+' received for '+money(amount)+'. Accounting must recheck before PM approval.'});audit('Received corrected application; original revision and markups retained. Returned to accounting intake.');closeModal();draw();renderDetail();toast('Corrected submission returned to accounting intake')}
function resolveSystemIssue(){const i=item();if(i.status!=='Correction needed'||!['system','contract'].includes(i.correctionKind)||role!==(i.correctionKind==='contract'?i.pm:'Accounting'))return;if(i.type==='Pay application'){i.ceAmount=i.procoreAmount;i.ceChanges=i.procoreChanges;}i.checks={};i.status='Intake';audit('Sample system discrepancy resolved; returned to intake. Billing differences, if any, remain blocked.');draw();renderDetail()}
function discussion(i){return `<div class="card"><h3>Discussion</h3>${i.notes.map(n=>`<div class="note"><strong>${esc(n.who)}</strong><p>${esc(n.text)}</p></div>`).join('')||'<p class="muted">No comments yet.</p>'}<div class="field" style="margin-top:18px"><label for="comment">Add a comment</label><textarea id="comment" rows="3"></textarea></div><button class="primary" onclick="addComment()">Add comment</button></div>${i.markups.length?'<div class="card"><h3>Attached markups</h3>'+markupList(i)+'</div>':''}`}
function historyPanel(i){return `<div class="card"><h3>Activity & original submissions</h3><div class="audit"><strong>Invoice received</strong><p class="muted">${esc(i.received)} · Sample intake</p></div>${i.audit.map(a=>`<div class="audit"><strong>${esc(a.who)}</strong><p>${esc(a.action)}</p><div class="muted">${esc(a.time)}</div></div>`).join('')}${i.versions.map(v=>`<details class="audit-version"><summary>Original revision ${v.revision} · ${money(v.amount)}</summary><div class="kv"><span>Earned</span><strong>${money(v.earned||v.amount)}</strong></div>${v.previous!=null?`<div class="kv"><span>Previous payments</span><strong>${money(v.previous)}</strong></div>`:''}${v.sov?.length?'<table><thead><tr><th>SOV line</th><th>Scheduled</th><th>Earned</th></tr></thead><tbody>'+v.sov.map(l=>'<tr><td>'+l.line+' · '+esc(l.name)+'</td><td>'+money(l.scheduled)+'</td><td>'+money(l.earned)+'</td></tr>').join('')+'</tbody></table>':''}${v.markups.map(m=>`<div class="markup-item">Page ${m.page}, ${esc(m.target)}: ${esc(m.text)}</div>`).join('')}</details>`).join('')}</div>`}


const gridColumns=[{key:'vendor',label:'Vendor / Inv #',type:'text',width:220},{key:'job',label:'Job # / Name',type:'text',width:185},{key:'commitment',label:'PO/Sub',type:'text',width:115},{key:'description',label:'Inv Description',type:'text',width:200},{key:'amount',label:'Amount',type:'number',width:135},{key:'dueDate',label:'Due Date',type:'date',width:125},{key:'status',label:'Status',type:'choice',width:160},{key:'responsible',label:'Responsible Person',type:'text',width:185},{key:'waiting',label:'Waiting Time',type:'number',width:145},{key:'number',label:'Inv #',type:'text',width:145},{key:'pm',label:'PM Reviewer',type:'text',width:155},{key:'invoiceDate',label:'Inv Date',type:'date',width:125},{key:'period',label:'Period',type:'choice',width:145},{key:'costCode',label:'Cost Code',type:'text',width:200},{key:'reference',label:'CE Voucher / Reference',type:'text',width:185},{key:'receivedDate',label:'Received Date',type:'date',width:145}];
const defaultColumns=gridColumns.slice(0,9).map(c=>c.key);let visibleColumns=[...defaultColumns],columnFilters={},sortColumn='waiting',sortDirection='desc';
function fillGridFields(i){const j=jobs.indexOf(i.job);i.jobNumber=['26-041','26-052','26-063'][j]||'Unassigned';i.invoiceDate=i.invoiceDate||'2026-09-30';i.dueDate=i.dueDate||'2026-10-30';i.period=i.period||'September 2026';i.receivedAt=i.receivedAt||Date.now()-(i.age||0)*86400000;i.receivedDate=new Date(i.receivedAt).toISOString().slice(0,10);if(i.type==='Invoice'){i.costCode=i.vendor.includes('Rental')?'01-500 · Temporary equipment':i.vendor.includes('Supply')?'03-300 · Reinforcing materials':i.costCode||'01-000 · General requirements'}if(!i.stageEnteredAt){i.stageEnteredAt=Date.now()-(i.status==='Entered'?0:Math.max(30,(i.age||0)*240))*60000;i.trackedStatus=i.status}if(i.trackedStatus!==i.status){i.stageEnteredAt=Date.now();i.trackedStatus=i.status}}
function nextOwner(i){if(i.status==='Intake'||i.status==='Ready for entry')return'Accounting';if(i.status==='Correction needed')return i.correctionOwner||i.pm;return i.status==='Entered'?'Completed':i.pm}
function nextAction(i){return i.status==='Intake'?'Verify and route':i.status==='PM review'?(reconIssues(i).length?'Resolve flags; review application':'Review and approve'):i.status==='Correction needed'?(i.correctionKind==='system'?'Resolve accounting record':i.correctionKind==='contract'?'Resolve contract discrepancy':'Obtain corrected submission'):i.status==='Ready for entry'?'Recheck references; enter in CE':i.status==='Entered'?'Payment tracked in CE':''}
function waitingMinutes(i){return i.status==='Entered'?0:Math.max(0,Math.floor((Date.now()-i.stageEnteredAt)/60000))}
function duration(n){return n<60?n+'m':n<1440?Math.floor(n/60)+'h '+n%60+'m':Math.floor(n/1440)+'d '+Math.floor(n%1440/60)+'h'}
function columnValue(i,key){if(key==='waiting')return waitingMinutes(i);if(key==='responsible')return nextOwner(i);if(key==='vendor')return i.vendor;if(key==='job')return i.jobNumber+' '+i.job;if(key==='reference')return i.reference||'';return i[key]??''}
function baseRows(){invoices.forEach(fillGridFields);return invoices.filter(i=>i.status!=='Duplicate archived'&&(role==='Accounting'||i.pm===role)&&(!jobFilter||i.job===jobFilter)).filter(i=>!query||[i.vendor,i.number,i.job,i.jobNumber,i.commitment,i.description,i.pm,i.reference].join(' ').toLowerCase().includes(query.toLowerCase())).filter(i=>Object.entries(columnFilters).every(([key,f])=>{const c=gridColumns.find(c=>c.key===key);const v=columnValue(i,key);if(c.type==='number'||c.type==='date'){if(c.type==='date'&&!v)return false;const n=c.type==='number'?Number(v):v;return(f.min===''||n>=(c.type==='number'?Number(f.min):f.min))&&(f.max===''||n<=(c.type==='number'?Number(f.max):f.max))}return c.type==='choice'?String(v)===f.value:String(v).toLowerCase().includes(f.value.toLowerCase())}))}
function summaryRows(){return baseRows()}
function currentRows(){const rows=baseRows().filter(i=>view==='All invoices'||i.status===({'Accounting intake':'Intake',Corrections:'Correction needed'}[view]||view));const c=gridColumns.find(c=>c.key===sortColumn);return rows.sort((a,b)=>{const x=columnValue(a,sortColumn),y=columnValue(b,sortColumn);if(x==='')return y===''?a.id-b.id:1;if(y==='')return-1;const cmp=c.type==='number'?x-y:String(x).localeCompare(String(y),undefined,{numeric:true,sensitivity:'base'});return (sortDirection==='asc'?cmp:-cmp)||a.id-b.id})}
function hasFilters(){return!!query||!!jobFilter||Object.keys(columnFilters).length>0}
function filterChips(){if(!hasFilters())return '';return `<div class="filter-chips"><strong>Filters:</strong>${query?`<button onclick="query='';draw()">Search: ${esc(query)} ×</button>`:''}${jobFilter?`<button onclick="jobFilter='';draw()">Job: ${esc(jobFilter)} ×</button>`:''}${Object.entries(columnFilters).map(([key,f])=>`<button onclick="removeColumnFilter('${key}')">${gridColumns.find(c=>c.key===key).label}: ${esc(f.value||(f.min||'Any')+' to '+(f.max||'Any'))} ×</button>`).join('')}</div>`}
function setSearch(value){const el=document.querySelector('input[aria-label="Search invoices"]');const caret=el?.selectionStart;query=value;draw();const next=document.querySelector('input[aria-label="Search invoices"]');if(next){next.focus();if(caret!=null)next.setSelectionRange(caret,caret)}}
function clearGridFilters(){query='';jobFilter='';columnFilters={};draw()}
function removeColumnFilter(key){delete columnFilters[key];draw()}
function sortGrid(key){if(!gridColumns.some(c=>c.key===key))return;if(sortColumn===key)sortDirection=sortDirection==='asc'?'desc':'asc';else{sortColumn=key;sortDirection='asc'}draw()}
function cellHTML(i,key){switch(key){case'vendor':return `<button onclick="openDetail(${i.id})" aria-label="Review ${esc(i.vendor)} ${esc(i.number)}"><strong>${esc(i.vendor)}</strong><span class="muted">${esc(i.number)} · ${i.type}</span>${duplicate(i)?'<span class="rowflag">Possible duplicate</span>':''}</button>`;case'job':return`<strong>${esc(i.jobNumber)}</strong><span class="muted">${esc(i.job)}</span>`;case'amount':return`<strong>${money(i.amount)}</strong>`;case'status':return badge(i.status);case'responsible':return`<strong>${esc(nextOwner(i))}</strong><div class="nextaction">${esc(nextAction(i))}</div>`;case'waiting':return i.status==='Entered'?'<span class="muted">Completed</span>':`<strong>${duration(waitingMinutes(i))}</strong><span class="muted">In current stage</span>`;case'dueDate':case'invoiceDate':case'receivedDate':return i[key]?new Date(i[key]+'T12:00:00Z').toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric',timeZone:'UTC'}):'—';case'reference':return esc(i.reference||'Not entered');default:return esc(columnValue(i,key))}}
function table(rows){const cols=gridColumns.filter(c=>visibleColumns.includes(c.key));return `<table class="invoice-grid" style="min-width:${Math.max(900,cols.reduce((a,c)=>a+c.width,0))}px"><colgroup>${cols.map(c=>`<col style="width:${c.width}px">`).join('')}</colgroup><thead><tr>${cols.map(c=>`<th scope="col" class="${c.key==='vendor'?'vendor-col':''} ${c.key==='amount'?'amount':''}" aria-sort="${sortColumn===c.key?(sortDirection==='asc'?'ascending':'descending'):'none'}"><button class="sort-button" onclick="sortGrid('${c.key}')" title="Sort ${esc(c.label)}">${c.label}<span>${sortColumn===c.key?(sortDirection==='asc'?'▲':'▼'):'↕'}</span></button><button class="filter-button ${columnFilters[c.key]?'on':''}" onclick="openColumnFilter('${c.key}')" aria-label="Filter ${esc(c.label)}">${columnFilters[c.key]?'Filtered':'Filter'}</button></th>`).join('')}</tr></thead><tbody>${rows.map(i=>`<tr>${cols.map(c=>`<td class="${c.key==='vendor'?'vendor-col':''} ${c.key==='amount'?'amount':''}">${cellHTML(i,c.key)}</td>`).join('')}</tr>`).join('')||`<tr><td colspan="${cols.length}"><div class="empty-grid">No invoices match this queue and its filters.${hasFilters()?'<br><button onclick="clearGridFilters()">Clear filters</button>':''}</div></td></tr>`}</tbody></table>`}
function openColumns(){modal(`<h2>Choose columns</h2><p class="muted">Keep the queue simple or add accounting detail. Vendor / Inv # stays visible so every row can be opened.</p><div class="column-options">${gridColumns.map(c=>`<label><input type="checkbox" ${visibleColumns.includes(c.key)?'checked':''} ${c.key==='vendor'?'disabled':''} onchange="toggleColumn('${c.key}',this.checked)">${c.label}</label>`).join('')}</div><div class="actions"><button onclick="resetColumns()">Restore defaults</button><button class="primary" onclick="closeModal()">Done</button></div>`)}
function toggleColumn(key,on){if(key==='vendor')return;if(on&&!visibleColumns.includes(key))visibleColumns.push(key);if(!on)visibleColumns=visibleColumns.filter(k=>k!==key);draw()}
function resetColumns(){visibleColumns=[...defaultColumns];draw();openColumns()}
function openColumnFilter(key){const c=gridColumns.find(c=>c.key===key);if(!c)return;const f=columnFilters[key]||{min:'',max:'',value:''};const options=[...new Set(invoices.filter(i=>i.status!=='Duplicate archived'&&(role==='Accounting'||i.pm===role)).map(i=>String(columnValue(i,key))).filter(Boolean))].sort();modal(`<h2>Filter ${c.label}</h2>${c.type==='number'||c.type==='date'?`<p class="muted">${key==='waiting'?'Enter waiting time in minutes (60 = 1 hour; 1,440 = 1 day).':'Leave either limit blank for an open range.'}</p><div class="grid2"><div class="field"><label for="filterMin">${c.type==='date'?'From':'Minimum'}</label><input id="filterMin" type="${c.type==='date'?'date':'number'}" ${key==='waiting'?'min="0"':'step="0.01"'} value="${esc(f.min)}"></div><div class="field"><label for="filterMax">${c.type==='date'?'Through':'Maximum'}</label><input id="filterMax" type="${c.type==='date'?'date':'number'}" ${key==='waiting'?'min="0"':'step="0.01"'} value="${esc(f.max)}"></div></div>`:`<div class="field"><label for="filterValue">${c.type==='choice'?'Select value':'Search or select a value'}</label>${c.type==='choice'?`<select id="filterValue"><option value="">All values</option>${options.map(v=>`<option value="${esc(v)}" ${f.value===v?'selected':''}>${esc(v)}</option>`).join('')}</select>`:`<input id="filterValue" list="filterOptions" value="${esc(f.value)}" placeholder="Type to search…"><datalist id="filterOptions">${options.map(v=>`<option value="${esc(v)}">`).join('')}</datalist><p class="muted">Matches text containing your entry.</p>`}</div>`}<div class="actions"><button class="primary" onclick="applyColumnFilter('${key}')">Apply filter</button><button onclick="delete columnFilters['${key}'];closeModal();draw()">Clear this filter</button><button onclick="closeModal()">Cancel</button></div>`)}
function applyColumnFilter(key){const c=gridColumns.find(c=>c.key===key);if(!c)return;let f;if(c.type==='number'||c.type==='date'){const min=document.getElementById('filterMin').value.trim(),max=document.getElementById('filterMax').value.trim();if(c.type==='number'&&([min,max].some(v=>v!==''&&!Number.isFinite(Number(v)))||(key==='waiting'&&[min,max].some(v=>v!==''&&Number(v)<0)))){toast('Enter valid range values.');return}if(min!==''&&max!==''&&(c.type==='number'?Number(min)>Number(max):min>max)){toast('Minimum must not exceed maximum.');return}f={min,max};if(!min&&!max)delete columnFilters[key];else columnFilters[key]=f;}else{const value=document.getElementById('filterValue').value.trim();if(!value)delete columnFilters[key];else columnFilters[key]={value}}closeModal();draw()}
function gridDetails(i){return `<div class="card grid-metadata"><details><summary>Invoice & coding details</summary>${[['Job',i.jobNumber+' · '+i.job],['PO/Sub',i.commitment],['Description',i.description],['Invoice date',i.invoiceDate],['Due date',i.dueDate],['Accounting period',i.period],['Cost code',i.costCode],['Received',i.receivedDate],['Current stage waiting',i.status==='Entered'?'Completed':duration(waitingMinutes(i))],['Total since received',duration(Math.max(0,Math.floor((Date.now()-i.receivedAt)/60000)))],['CE voucher / reference',i.reference||'Not entered']].map(([label,value])=>`<div class="kv"><span>${label}</span><strong>${esc(value)}</strong></div>`).join('')}</details></div>`}

seed();if(document.modelContext?.registerTool){for(const tool of [{name:'list_sample_invoices',description:'Read the current sample invoice records. Does not connect to accounting systems.',inputSchema:{type:'object',properties:{},additionalProperties:false},annotations:{readOnlyHint:true},execute:()=>invoices.map(({id,vendor,number,job,pm,amount,status})=>({id,vendor,number,job,pm,amount,status}))},{name:'open_sample_invoice',description:'Open a sample invoice detail panel without approving or changing the invoice.',inputSchema:{type:'object',properties:{invoice_id:{type:'integer'}},required:['invoice_id'],additionalProperties:false},annotations:{readOnlyHint:false},execute:input=>{if(!Number.isInteger(input.invoice_id)||!invoices.some(i=>i.id===input.invoice_id))throw new Error('Unknown invoice ID');openDetail(input.invoice_id);return{opened:input.invoice_id}}}])try{Promise.resolve(document.modelContext.registerTool(tool)).catch(()=>{})}catch(e){}}
</script></body></html>
