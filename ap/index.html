/* Joined on commitment number, which the probe work established equals the CE
   subcontract code exactly (40325AU002 in both systems). Vendor name is NOT a
   safe key - 25AU002 carries Turner Fence on two separate commitments. */
const billingFor = r => STATE.billing[String(r.number || '').trim()] || null;

const FLAG_TEXT = {
  over_billed:            ['r','over-billed','Billed more than the commitment. Either a change order went into billings but not onto the subcontract, or the sub over-billed.'],
  contract_mismatch:      ['r','contract differs','Procore and ComputerEase disagree on the contract value. Procore higher: an approved change order never reached CE - a CO title over the character limit fails to sync silently. CE higher: the change order was entered straight into CE and Procore is understating the contract.'],
  sov_gap:                ['y','SOV gap','ComputerEase does not agree with itself on this subcontract - billed plus remaining should equal its schedule of values and does not. Usually billings posted to a cost code the subcontract does not carry, or an item on the subcontract that posts nowhere. The gap is normally one line.'],
  shared_cost_code:       ['y','shared cost code','Another subcontract posts to the same phase/category/cost type, so some dollars cannot be attributed to this one.'],
  no_job_totals:          ['b','no CE data','This job does not publish to the ComputerEase API, so no billing figure is available.'],
  no_ce_subcontract:      ['b','no CE match','No ComputerEase subcontract carries this commitment number.'],
  retainage_stop_reached: ['b','past 50%','Billings have passed half the revised contract - on a "thru 50%" term, withholding should have stopped.'],
  pending_rfc:            ['b','pending CO','A change order sits on this ComputerEase subcontract at pending approval. It is not contract value yet, so it is excluded from the schedule of values here - which is right, but it also means the sub may bill against it before anyone approves it.'],
  no_committed_cells:     ['b','nothing in job cost','The subcontract exists in ComputerEase but none of its cost codes carries a committed cell in job cost, so nothing has been posted against it yet. Expected on a subcontract entered recently. Worth asking about on an old one.'],
};

/* Billed to date, with what is left and any exception beneath it. Keeping the
   qualifier in the same cell avoids spending two more columns on a table that
   is already wide. */
/* A pending RFC is worth seeing whether or not there is a billed figure, so it
   renders on both paths rather than only in the pills row below. */
function pendingPill(b){
  if (!b || !b.ce_pending_sov) return '';
  const [cls,label,tip] = FLAG_TEXT.pending_rfc;
  return ' <span class="pill ' + cls + '" title="' + esc(tip
    + ' RFC ' + (b.ce_pending_rfcs||'?') + ', ' + money(b.ce_pending_sov) + '.') + '">' + label + '</span>';
}

/* Procore's revised contract and CE's schedule of values are two different
   figures from two different systems, and the desk used to show only Procore's.
   The "contract differs" flag said they disagreed but not which way, and the
   direction IS the diagnosis: Procore higher means an approved change order
   never reached CE (a CO title over the character limit fails to sync silently);
   CE higher means it was entered straight into CE and Procore understates the
   contract. Both figures now sit side by side with the gap signed from CE. */
/* The two contract columns are rendered by a pair of cells that share the same
   two sub-line helpers, so "includes X CO" and "pending" land on the SAME LINE in
   both columns and can be read straight across. Procore's revised contract and
   CE's schedule of values both count approved change orders only, so the pending
   line sits outside both figures on both sides. */
function pcContractCell(r){
  const b = billingFor(r);
  return money(r.revised_contract || r.contract_value)
    + coLine(r.approved_change_orders, b && b.ce_approved_cos)
    + pendingLine(r.pending_change_orders, b && b.ce_pending_sov);
}

/* Procore higher means an approved change order never reached CE (a CO title
   over the character limit fails to sync silently); CE higher means it was
   entered straight into CE and Procore understates the contract. Agreement is
   the normal case and says nothing; a disagreement is red. */
function ceContractCell(r){
  const b = billingFor(r);
  if (!b) return '<span class="muted" title="No row in ' + EXPECTED_FILE + ' for this commitment">&mdash;</span>';
  if (b.ce_sov === null || b.ce_sov === undefined) {
    const f = (b.flags||[]).find(x => ['no_ce_subcontract','no_job_totals','no_committed_cells'].includes(x));
    const label = f ? FLAG_TEXT[f][1] : 'not matched';
    const tip = ((f ? FLAG_TEXT[f][2] : '') + ' ' + (b.billed_source||'')).trim();
    return '<span class="pill b" title="' + esc(tip) + '">' + label + '</span>';
  }
  const gap = b.pc_vs_ce_contract_gap;          // Procore revised - CE SOV
  /* The gap goes LAST so the two shared lines above it stay level across the
     two columns. Red carries it; position does not need to. */
  const gapLine = !gap ? ''
    : gap > 0
      ? '<div class="sub bad" title="Procore is higher by this much. An approved change order has not reached CE.">'
          + money(gap) + ' under Procore</div>'
      : '<div class="sub bad" title="CE is higher by this much. The change order was entered straight into CE and Procore is understating the contract.">'
          + money(Math.abs(gap)) + ' over Procore</div>';
  return (gap ? '<span class="figbad">' + money(b.ce_sov) + '</span>' : money(b.ce_sov))
    + coLine(b.ce_approved_cos, r.approved_change_orders)
    + pendingLine(b.ce_sov == null ? null : (b.ce_pending_sov || 0), r.pending_change_orders)
    + gapLine;
}

/* `other` is the opposite column's figure. A zero prints only when the other
   side is non-zero - otherwise every commitment without a change order would
   carry two blank lines in both columns. */
function coLine(v, other){
  if (v === null || v === undefined)
    return '<div class="sub muted" title="Approved change orders have not been pulled on this side yet. The CE figure was added to ap_payapp_expected.js on 7 Oct 2026; re-run it.">CO not pulled</div>';
  if (!v && !other) return '';
  return '<div class="sub co" title="The figure above is the REVISED contract. This says how much of it is approved change orders - it is not an amount to add on. Read it against the same line in the other column.">'
    + 'includes ' + money(v) + ' CO</div>';
}

/* Pending change orders sit in NEITHER contract figure - Procore counts approved
   COs only, and ce_sov excludes unapproved RFCs. Showing both sides is what makes
   it visible whether the two systems hold the same unapproved work. */
function pendingLine(v, other){
  if (v === null || v === undefined)
    return '<div class="sub muted" title="Procore pending change orders have not been pulled yet. The field was added to ap_commitments_pull.js on 7 Oct 2026; re-run it. The run logs how many commitments carry it.">pending not pulled</div>';
  if (!v && !other) return '';
  return '<div class="sub" title="A change order is raised but not approved, so it is in neither contract figure. Read it against the same line in the other column: different pending amounts mean one system is missing a change order.">'
    + money(v) + ' pending</div>';
}

/* The PM column is the project's Project Management Team from Procore project_roles,
   NOT the commitment's own custom_field_300705. That field names whoever wrote the
   subcontract and goes stale - Comer Hall was still reading a name of someone who
   has left. The team is the right answer for a queue and is maintained per project. */
function pmCell(r){
  const team = (r.pm_team_names || []).filter(Boolean);
  return team.length ? esc(team.join(', '))
    : '<span class="muted" title="No Project Management Team on this project in Procore.">\u2014</span>';
}

function billedCell(r){
  const b = billingFor(r);
  if (!b) return '<span class="muted" title="No row in ' + EXPECTED_FILE + ' for this commitment">—</span>';
  if (b.ce_billed === null || b.ce_billed === undefined) {
    /* Three different reasons there is no figure, and they are not the same
       thing. "not matched" was being shown for all of them. */
    const f = (b.flags||[]).find(x => ['no_committed_cells','no_job_totals','no_ce_subcontract'].includes(x));
    const label = f ? FLAG_TEXT[f][1] : 'not matched';
    const tip = ((f ? FLAG_TEXT[f][2] : '') + ' ' + (b.billed_source||'')).trim();
    return '<span class="pill b" title="' + esc(tip) + '">' + label + '</span>' + pendingPill(b);
  }
  const flags = (b.flags||[]).filter(f => FLAG_TEXT[f]);
  const pills = flags.map(f => {
    const [cls,label,tip] = FLAG_TEXT[f];
    return '<span class="pill ' + cls + '" title="' + esc(tip) + '">' + label + '</span>';
  }).join(' ');
  return money(b.ce_billed)
    + '<div class="sub">' + (b.pct_billed != null ? Number(b.pct_billed).toFixed(0) + '%' : '')
    + (b.ce_balance ? ' &middot; ' + (b.ce_balance < 0
         ? money(Math.abs(b.ce_balance)) + ' over'    // a negative balance is an over-bill, not "-$5,100 left"
         : money(b.ce_balance) + ' left') : '') + '</div>'
    + (pills ? '<div class="sub">' + pills + '</div>' : '');
}

/* ---- Expected pay app -------------------------------------------------------
   Every quantity on a sub's cover sheet is derivable from the commitment and
   CE's billed-to-date, whatever form the sub uses. The reviewer types the four
   figures off their cover sheet and the deltas fall out. This exists because
   two reviews in one morning each took an hour and each turned on a single
   number: a $6,776 change order missing from one app, $2,160 missing from
   another. Both were visible from the contract alone.

   committed_billed is GROSS of retainage. Confirmed 1 Oct 2026 against H.C.
   Blake's G702 on 2506-00400: the desk read $310,186 and the application showed
   $310,186.31 billed with $300,646.75 paid. Previously inferred, now measured. */
/* ---- Previous certified, from the CE invoice ledger (connector, 9 Oct 2026) --
   The figure the subcontractor's "Less previous payments" line must equal is
   what BH previously CERTIFIED as payable: the sum of CE "Invoiced -> Payable"
   on the commitment's earlier invoices, plus any retention since released.
   NOT cheques cut (Payment -> Amount) - on the 10/9 export prior paid differs
   from prior payable on 73 of 177 commitments - and NOT committed_billed less
   an estimated retainage, which double counts once CE holds the application.

   Used only when the ledger is FULL HISTORY. A ledger built with --since drops
   earlier invoices (112 of 204 commitments understated on the June-cut file),
   so with a since-filter the page falls back to committed_billed and says so. */
const ledgerFull = () => {
  const d = STATE.ceInv;
  return !!(d && d.subcontracts && d.has_payment_data !== false
            && !(d.filters && d.filters.since));
};
function ledgerSummary(number){
  if (!ledgerFull()) return null;
  const led = ceLedger(number);
  if (!led || !(led.invoices || []).length) return null;
  const n2 = v => Number(v || 0);
  const inv = led.invoices;
  const sum = (xs, f) => xs.reduce((t,i) => t + (typeof f === 'function' ? f(i) : n2(i[f])), 0);
  /* Retention released later is paid against the ORIGINAL invoice, so it shows
     as paid above payable. It has been certified by then, and a G702 counts it
     in previous certificates - add it back. */
  const released = i => Math.max(0, n2(i.paid) - n2(i.payable));
  return { inv, asOf: STATE.ceInv.as_of || null,
           invoiced: sum(inv,'total'), retention: sum(inv,'retention') - sum(inv, released),
           certified: sum(inv,'payable') + sum(inv, released), paid: sum(inv,'paid'),
           certOf: xs => sum(xs,'payable') + sum(xs, released), totalOf: xs => sum(xs,'total') };
}
const appDigits = v => String(v == null ? '' : v).toUpperCase().replace(/[^0-9]/g,'');
/* The application under review, found in the ledger by its pay request number.
   [] = not entered yet. null = cannot tell (no number keyed). */
function ledgerThisApp(e, payReq){
  if (!e || !e.ledger) return null;
  const want = appDigits(payReq);
  if (!want) return null;
  return e.ledger.inv.filter(i => appDigits(i.number) === want);
}

function payappExpected(r){
  const b = billingFor(r);
  const contract = num0(r.revised_contract) || num0(r.contract_value);
  const pctR = (r.retainage_percent === null || r.retainage_percent === undefined)
    ? null : Number(r.retainage_percent);
  const dur  = String(r.retainage_duration || '');
  /* "thru 50%" caps total retainage at half the contract's worth of withholding.
     Anything else (throughout, or unset) withholds on every dollar. A missing
     term is NOT assumed to be thru-50 - that assumption is what let the GL Pack
     shortage through. */
  const thru50 = /50/.test(dur) && /thru|through/i.test(dur);
  const billed = b && b.ce_billed != null ? Number(b.ce_billed) : null;
  const rate = pctR == null ? null : pctR/100;
  const retAt = v => {            // retainage held once v has been billed
    if (rate == null || v == null) return null;
    if (!thru50) return v * rate;
    return Math.min(v, contract/2) * rate;
  };
  const retFull = retAt(contract);
  /* Ledger first; committed_billed only when the ledger cannot answer. */
  const L = ledgerSummary(r.number);
  const apiBilled = billed;
  const useBilled = L ? L.invoiced : billed;
  const retNow  = L ? L.retention : retAt(useBilled);
  const prevPaid = L ? L.certified
                     : ((useBilled != null && retNow != null) ? useBilled - retNow : null);
  const maxDue = (retFull != null && prevPaid != null) ? (contract - retFull) - prevPaid : null;
  if (L) return Object.assign(base(), {
           billed: useBilled, retNow, prevPaid, maxDue, minBilled: useBilled,
           hasBilling: true, assumedZero: false, ledger: L, apiBilled,
           prevSource: 'ledger',
           billedSource: 'CE invoice ledger' + (L.asOf ? ' as of ' + L.asOf : '') });
  return Object.assign(base(), { prevSource: 'committed_billed', apiBilled });
  function base(){ return { contract, original:num0(r.contract_value), cos:num0(r.approved_change_orders),
           pctR, dur, thru50, billed, retNow, retFull, prevPaid, maxDue, retAt,
           minBilled:billed, maxBilled:contract,
           past50: b ? !!b.past_50_pct : null,
           ceSov: b && b.ce_sov != null ? Number(b.ce_sov) : null,
           gap: b && b.pc_vs_ce_contract_gap != null ? Number(b.pc_vs_ce_contract_gap) : null,
           flags: (b && b.flags) || [], hasBilling: !!b && b.ce_billed != null,
           billedSource: (b && b.billed_source) || '',
           /* CE holds the subcontract but nothing is posted to its cost codes.
              Billed is zero, not unknown - the usual shape of a first billing. */
           assumedZero: !!b && b.ce_billed == null
                        && ((b.flags || []).indexOf('no_committed_cells') !== -1),
           number: r.number }; }
}
const num0 = v => (v === null || v === undefined || v === '') ? 0 : Number(v);
const money2 = v => (v === null || v === undefined || isNaN(v)) ? '—'
  : (Number(v) < 0 ? '-' : '') + '$'
    + Math.abs(Number(v)).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});

/* Line names on both forms BH actually receives. The quantities are identical;
   only the labels move, so one panel serves an AIA G702/G703 and BH's own
   Attachment G without the reviewer translating. */
/* Not every line has a single expected value, and pretending otherwise produced
   false mismatches. Billed-to-date from CE is the position as at the LAST posted
   application; a new pay app is expected to exceed it. Retainage likewise moves
   with whatever they have completed this period. So three kinds of row:

     fixed   - one right answer (adjusted contract, previous payments)
     range   - a floor and a ceiling (completed to date)
     derived - computed from what they entered above (retainage held)

   Only the ceiling on the payment is knowable in advance, which is why the
   headline is "most they can ask for" and not an expected amount. */
const PA_LINES = [
  ['contract','fixed','Adjusted contract','Amount of Original Contract + Approved Change Order(s) — AIA G702 line 3'],
  ['billed','range','Completed to date','Total Completed Work & Stored Materials to Date — AIA G702 line 4, G703 column G'],
  ['retNow','derived','Retainage held','Less Retainage — AIA G702 line 5'],
  ['prevPaid','fixed','Less previous payments','Less Previous Payments — AIA G702 line 7'],
  ['due','derived','Balance due this payment','Current Payment Due — AIA G702 line 8. What we would pay on these figures: completed (capped at the contract) less retainage less previous payments.'],
];

/* CE's billed-to-date equals, to the cent, what the subcontractor says is
   complete. There is no innocent reading of that: CE has already posted this
   application, so nothing derived from ce_billed describes the position BEFORE
   it. */
function ceEntryState(e, pre){
  const hit = ledgerThisApp(e, pre && pre.payReq);
  if (hit && hit.length) return 'exact';          // the ledger has it, by number
  if (hit && pre && pre.billed != null && pre.billed !== '') {
    /* Not in the ledger: a new application. CE ahead of their claim is still a finding. */
    return Number(e.billed) > Number(pre.billed) + 0.005 ? 'ahead' : null;
  }
  if (!pre || e.billed == null) return null;
  const t = pre.billed;
  if (t === null || t === undefined || t === '') return null;
  const theirs = Math.round(Number(t) * 100), ce = Math.round(Number(e.billed) * 100);
  if (ce === theirs) return 'exact';
  if (ce >  theirs) return 'ahead';
  return null;                       // CE is behind it - a genuinely new application
}
function ceHoldsThisApp(e, pre){ return ceEntryState(e, pre) === 'exact'; }

/* ---- The ComputerEase invoice ledger ---------------------------------------
   ap_payapp_expected.json carries ONE number per subcontract: committed_billed,
   cumulative and gross. Everything awkward on this page comes from that - the
   double-counted previous payment, the cent-match test for whether CE already
   holds an application, "most they can ask for $0.00". None of it is visible as
   a fault because one aggregate cannot show you that Kone's PR5 was entered on
   two lines, or that Specialty's PR2 is sitting unpaid.

   This panel reads the per-invoice ledger instead, in the shape of CE's
   "Subcontractor Detail Report by Vendor". Written by a Q-Tool export; absent
   until that is scheduled, and the panel says so rather than showing nothing. */
const CEINV_FILE = 'ap_ce_invoices.json';

const ceLedger = number => {
  const d = STATE.ceInv;
  if (!d || !d.subcontracts) return null;
  const k = String(number || '').trim().toUpperCase();
  return d.subcontracts[k] || null;
};

/* What the ledger says that one aggregate cannot. */
function ceLedgerFacts(led, payReq){
  const inv = (led && led.invoices) || [];
  const n2 = v => Number(v || 0);
  const sum = f => inv.reduce((t,i) => t + n2(i[f]), 0);
  /* An invoice whose lines were posted on DIFFERENT days was entered more than
     once. Kone's PR5: base on 10/01, CO 002 on 10/05 - four days and two
     decisions apart. Lines posted the same day are one invoice split across cost
     codes and are nobody's problem. */
  const split = inv.filter(i => (i.entered_separately || []).length > 1);
  const unpaid = inv.filter(i => !i.check);
  const want = String(payReq == null ? '' : payReq).trim();
  const norm = v => String(v||'').toUpperCase().replace(/[^0-9]/g,'');
  const thisApp = want ? inv.filter(i => norm(i.number) && norm(i.number) === norm(want)) : [];
  return {
    inv, split, unpaid, thisApp,
    invoiced: sum('total'), retention: sum('retention'),
    payable: sum('payable'), paid: sum('paid'),
    outstanding: sum('payable') - sum('paid'),
  };
}

function ceLedgerPanel(number, payReq, e, theirDue, ourDue, ceState){
  const d = STATE.ceInv;
  const led = ceLedger(number);
  if (!led) {
    return '<div class="celed"><h4>ComputerEase invoices</h4><div class="celnone">'
      + (d
         ? 'No ledger rows for <b>' + esc(String(number || '')) + '</b> in the last ComputerEase export'
           + (d.as_of ? ' (' + esc(d.as_of) + ')' : '') + '. Either nothing has been invoiced against it, '
             + 'or the subcontract was not in scope of the export.'
         : 'Not available yet. This needs a ComputerEase export parsed into <code>' + CEINV_FILE
           + '</code>. Until then this page sees only <code>committed_billed</code> &mdash; one '
           + 'cumulative, gross number per subcontract, with no invoices, no dates and no payments.')
      + '</div></div>';
  }
  /* Job Cost Detail carries billings and nothing else. Without this the panel
     would mark every invoice unpaid, including Kone's four cleared by cheque. */
  const hasPay = !(d && d.has_payment_data === false);
  const f = ceLedgerFacts(led, payReq);

  const lineNote = i => (i.lines || []).length > 1
    ? '<div class="celsub">' + i.lines.map(l => esc(l.description || 'line') + ' ' + money2(l.amount)
        + (l.posted ? ' &middot; ' + esc(l.posted) : '')).join('<br>') + '</div>'
    : '';
  const row = i => '<tr' + (hasPay && !i.check ? ' class="celunpaid"' : '') + '>'
    + '<td>' + esc(i.number || '') + lineNote(i) + '</td>'
    + '<td>' + esc(i.date || '') + '</td>'
    + '<td class="n">' + money2(i.total) + '</td>'
    + (hasPay
        ? '<td class="n">' + money2(i.retention) + '</td>'
          + '<td class="n">' + money2(i.payable) + '</td>'
          + '<td class="n">' + (i.check
              ? money2(i.paid) + '<div class="celsub">#' + esc(i.check)
                + (i.check_date ? ' &middot; ' + esc(i.check_date) : '') + '</div>'
              : '<span class="pill y">unpaid</span>') + '</td>'
        : '<td>' + esc(i.posted || '') + '</td>')
    + '</tr>';

  const notes = [];
  if (f.thisApp.length)
    notes.push('<b>This application is in ComputerEase</b> as '
      + f.thisApp.map(i => esc(i.number) + ' ' + money2(i.total)).join(' + ')
      + (hasPay
          ? (f.thisApp.every(i => !i.check)
              ? ' &mdash; <b>entered, not paid</b>, '
                + money2(f.thisApp.reduce((t,i)=>t+Number(i.payable||0),0)) + ' payable.'
              : ' &mdash; paid.')
          : ' &mdash; <b>entered</b>. Whether it has been paid is not in this feed.'));

  f.split.forEach(sp => notes.push('Invoice <b>' + esc(sp.number) + '</b> was entered on '
    + sp.entered_separately.length + ' different days (' + sp.entered_separately.map(esc).join(', ')
    + ') totalling ' + money2(sp.total) + '. Separate entries under one reference &mdash; check the '
    + 'lines beside it, and whether an application covers each.'));

  /* payable is net of retention and comparable to their balance due; total is
     gross and is not. With no payable in the feed there is nothing to compare. */
  if (hasPay && f.thisApp.length && theirDue != null) {
    const appTotal = f.thisApp.reduce((t,i) => t + Number(i.payable || 0), 0);
    if (Math.abs(appTotal - theirDue) >= 1)      // cents are rounding, not scope
      notes.push('<span class="celwrong">ComputerEase holds ' + money2(appTotal) + ' under this invoice '
        + 'number, but the application only asks for ' + money2(theirDue) + '.</span> The difference, '
        + money2(appTotal - theirDue) + ', is entered in CE and supported by no application. Pay what '
        + 'the application asks for, and either reverse the unsupported entry in CE or get an '
        + 'application that covers it.');
  }

  if (hasPay && f.unpaid.length) {
    const comparable = ceState === 'exact' && ourDue != null
                       && Math.round(f.outstanding * 100) !== Math.round(ourDue * 100);
    notes.push(f.unpaid.length + ' invoice' + (f.unpaid.length===1?'':'s') + ' unpaid, <b>'
      + money2(f.outstanding) + '</b> outstanding'
      + (comparable
          ? ' &mdash; <span class="celwrong">' + money2(Math.abs(f.outstanding - ourDue))
            + (f.outstanding > ourDue ? ' more' : ' less') + ' than the ' + money2(ourDue)
            + ' this application supports. The ComputerEase invoice carries the same error as the '
            + 'paperwork, so correcting the subcontractor does not fix it &mdash; the posted invoice '
            + 'has to be corrected too, before the cheque run.</span>'
          : '.'));
  }
  if (!hasPay)
    notes.push('<b>Billings only.</b> This feed is the Job Cost Detail export, which carries no '
      + 'retention, payable or payment. An invoice with no cheque shown here has <b>not</b> been '
      + 'shown to be unpaid. The Subcontractor Detail Report by Vendor adds that half.');

  const apiB = e ? (e.apiBilled != null ? e.apiBilled : e.billed) : null;
  if (apiB != null && Math.round(f.invoiced*100) !== Math.round(apiB*100))
    notes.push('<b>This ledger and <code>committed_billed</code> disagree</b> &mdash; ' + money2(f.invoiced)
      + ' here against ' + money2(apiB) + ' on the billing feed. committed_billed is attributed by '
      + 'phase / category / cost type and is not a ledger; the invoices here are what CE holds'
      + (d && d.as_of ? ' as of ' + esc(d.as_of) : '') + '.');
  if (d && d.filters && d.filters.since)
    notes.push('<b>Partial history.</b> This export starts at ' + esc(d.filters.since)
      + '; invoices before it are missing, so the totals above are not invoiced-to-date.');

  return '<div class="celed"><h4>ComputerEase invoices'
    + (led.vendor_code ? ' <span class="celcode">' + esc(led.vendor_code) + '</span>' : '')
    + (hasPay ? '' : ' <span class="celcode">billings only</span>') + '</h4>'
    + '<table class="celtab"><thead><tr><th>Invoice</th><th>Date</th><th class="n">Total</th>'
    + (hasPay ? '<th class="n">Retention</th><th class="n">Payable</th><th class="n">Paid</th>'
              : '<th>Posted</th>')
    + '</tr></thead>'
    + '<tbody>' + f.inv.map(row).join('') + '</tbody>'
    + '<tfoot><tr><td colspan="2">Invoiced to date</td>'
    + '<td class="n">' + money2(f.invoiced) + '</td>'
    + (hasPay ? '<td class="n">' + money2(f.retention) + '</td>'
                + '<td class="n">' + money2(f.payable) + '</td>'
                + '<td class="n">' + money2(f.paid) + '</td>'
              : '<td></td>')
    + '</tr></tfoot></table>'
    + (notes.length ? '<div class="celnotes">' + notes.map(n=>'<div>'+n+'</div>').join('') + '</div>' : '')
    + '</div>';
}

/* One source of truth for what is payable. payappPanel renders it and the
   correction notice quotes it; if these ever came from two places the email to
   the subcontractor would eventually disagree with the screen. */
function payappPosition(e, pre){
  const nz = v => (v === null || v === undefined || v === '') ? null : Number(v);
  const absorbed = ceHoldsThisApp(e, pre);
  const theirPrev = nz(pre && pre.prevPaid);
  const theirDue  = nz(pre && pre.due);
  /* CE's cumulative payable less the request on the table = what was paid before.
     Sound only because CE posted this application at the amount asked for - which
     is exactly what ce_billed matching their completed-to-date tells us. */
  const hit = ledgerThisApp(e, pre && pre.payReq);
  const derivedPrev = (absorbed && hit && hit.length)
                        ? e.prevPaid - e.ledger.certOf(hit)        // prior invoices only
                        : (absorbed && theirDue != null && e.prevPaid != null)
                          ? e.prevPaid - theirDue : null;
  const usePrev = derivedPrev != null ? derivedPrev : theirPrev;
  /* Completed is capped at the contract - they cannot earn more than exists -
     and retainage is recomputed on that capped figure. */
  const earned  = absorbed ? Math.min(nz(pre.billed), e.contract) : null;
  const retDue  = earned == null ? null : e.retAt(earned);
  const payNow  = (earned != null && retDue != null && usePrev != null)
                    ? earned - retDue - usePrev : null;
  const theirAsk = (nz(pre && pre.billed) != null && nz(pre && pre.retNow) != null && theirPrev != null)
                    ? nz(pre.billed) - nz(pre.retNow) - theirPrev : null;
  /* What we would pay on THEIR completed figure - capped at the contract, with
     our retainage and our previous payments. ourDue - theirDue is exactly the
     amount the commitment is over-billed, which is the number the sub disputes. */
  const tb = nz(pre && pre.billed);
  const cap = tb == null ? null : Math.min(tb, e.contract);
  /* NOT usePrev. usePrev falls back to their own previous-payments figure, which
     is the only source available once CE has absorbed the application - fine for
     the ceiling, fatal here: an estimate built from their number agrees with
     their number by construction and prints "matches" on a bad application. */
  const ourPrev = derivedPrev != null ? derivedPrev : e.prevPaid;
  const ourDue = (cap != null && ourPrev != null && e.retAt(cap) != null)
                   ? cap - e.retAt(cap) - ourPrev : null;
  /* CE carrying MORE than they claim complete is its own finding: it means CE
     is ahead of their application, so nothing on our side describes the position
     before it. */
  const ceState = ceEntryState(e, pre);
  const ceAhead = ceState === 'ahead' ? e.billed - tb : null;
  return { nz, absorbed, ceState, theirPrev, theirDue, derivedPrev, usePrev, ourPrev, earned, retDue,
           payNow, theirAsk, ourDue, ceAhead };
}

function payappPanel(r, pre, rowId){
  let e = payappExpected(r);
  if (!e.hasBilling && e.assumedZero) {
    e = Object.assign({}, e, {
      billed: 0, minBilled: 0, retNow: e.retAt(0), prevPaid: 0,
      maxDue: e.contract - (e.retFull == null ? 0 : e.retFull),
      hasBilling: true,
    });
  }
  if (!e.hasBilling) {
    /* Say WHICH of the three it is. The feed has always known; the panel used to
       throw it away and leave everyone guessing at a Deltek outage. */
    const why = e.flags.indexOf('no_ce_subcontract') !== -1
      ? 'No ComputerEase subcontract carries this commitment number, so there is no billing position '
        + 'to check against. A Procore commitment with no CE subcontract cannot be billed or paid - '
        + 'that is worth chasing before the application is.'
      : e.flags.indexOf('no_job_totals') !== -1
        ? 'This job does not publish to the ComputerEase API, so no billing figure is available for '
          + 'any subcontract on it. Known gap, with Deltek - not a problem with this application.'
        : 'No billed-to-date figure for this commitment'
          + (e.billedSource ? ' (' + esc(e.billedSource) + ')' : '') + '.';
    return '<div class="pawrap"><div class="pamax"><span class="l">Adjusted contract</span>'
      + '<span class="n">' + money2(e.contract) + '</span></div>'
      + '<div class="pawarn"><div>&#9888;&nbsp; ' + why + '</div></div></div>';
  }
  const P = payappPosition(e, pre);
  const { nz, absorbed, theirPrev, theirDue, derivedPrev, earned, retDue, payNow, theirAsk } = P;
  /* No floor can be stated once CE holds the application, or when CE already
     carries more than the contract. Only the ceiling is real. */
  const noFloor = !!P.ceState || e.minBilled > e.maxBilled + 0.005;
  /* Retainage expected at the completed figure THEY state - the same call
     payappBind makes as the reviewer types, so the two never disagree. */
  const tbill   = P.nz(pre && pre.billed);
  const retWant = (e.pctR == null || tbill == null) ? null : e.retAt(tbill);
  const atCap   = retWant != null && e.retFull != null
                  && Math.round(retWant * 100) === Math.round(e.retFull * 100);

  const ours = {
    contract: money2(e.contract),
    billed: 'at most ' + money2(e.maxBilled),
    retNow: retWant != null ? money2(retWant)
            : (e.pctR == null ? '&mdash;'
               : e.pctR + '% of completed'
                 + (e.thru50 ? ', capped at ' + money2(e.retFull) : '')),
    prevPaid: absorbed ? (derivedPrev == null ? '&mdash;' : money2(derivedPrev)) : money2(e.prevPaid),
    due: P.ourDue == null ? '&mdash;' : money2(P.ourDue),
  };
  const sub = {
    contract: money2(e.original) + ' + ' + money2(e.cos) + ' CO',
    billed: noFloor
      ? (P.ceState
          ? 'the contract. No floor &mdash; CE already holds this application'
          : 'the contract. No floor &mdash; CE already carries more than the contract')
      : 'the contract, and not below the ' + money2(e.minBilled) + ' already billed',
    retNow: e.pctR == null
      ? 'no retainage term on the commitment'
      : e.thru50
        ? e.pctR + '% through 50% completion &mdash; '
          + (atCap ? 'cap of ' + money2(e.retFull) + ' reached, nothing further is withheld'
                   : 'caps at ' + money2(e.retFull))
        : e.pctR + '% of completed, no cap',
    prevPaid: absorbed
      ? (derivedPrev == null ? 'needs their balance due &mdash; see below'
                             : 'CE payable to date less this request')
      : (e.prevSource === 'ledger'
          ? 'CE payable on prior invoices (certified, not cash paid)'
          : 'billed less retainage held &mdash; estimate, ledger not loaded'),
    due: 'what we would pay on these figures',
  };
  const rows = PA_LINES.map(([k,kind,what,tip]) =>
    '<tr><td><div class="paq" title="' + esc(tip) + '">' + what + '</div>'
    + '<div class="paref">' + sub[k] + '</div></td>'
    + '<td class="n' + (kind==='fixed'?'':' paloose') + '">' + ours[k] + '</td>'
    + '<td class="n"><input class="pain" type="text" inputmode="decimal" data-k="' + k + '"'
    + ((pre && pre[k] !== null && pre[k] !== undefined && pre[k] !== '')
        ? ' value="' + esc(Number(pre[k]).toFixed(2)) + '"' : '')
    + ' placeholder="&mdash;"></td>'
    + '<td class="padelta" data-d="' + k + '"></td></tr>').join('');

  const warn = [];
  if (P.ceState)
    warn.push('<b>Already entered in ComputerEase.</b> Whatever is agreed here has to be corrected on '
      + 'the CE invoice as well as with the subcontractor &mdash; asking them for a revised application '
      + 'does not change what is already posted. '
      + (e.prevSource === 'ledger'
          ? 'Paid or not is in the CE invoices table below (as of ' + esc(e.ledger.asOf || 'the last export') + ').'
          : 'Whether it has been paid is not visible from this page; '
            + 'the Payment / Amount column of <b>Subcontractor Detail Report by Vendor</b> says.'));
  if (e.assumedZero) {
    warn.push('ComputerEase holds this subcontract but nothing is posted against its cost codes, so '
      + 'billed to date is taken as <b>zero</b> &mdash; the shape of a first or only billing. '
      + 'Previous payments should therefore be 0.00.');
    if (P.theirPrev != null && Math.abs(P.theirPrev) > 0.005)
      warn.push('They are claiming <b>' + money2(P.theirPrev) + '</b> in previous payments against a '
        + 'subcontract with nothing posted in CE. Either a billing never reached job cost, or it was '
        + 'posted to cost codes this subcontract does not carry. Settle that before paying.');
  }
  if (absorbed) {
    warn.push(e.prevSource === 'ledger' && (ledgerThisApp(e, pre && pre.payReq) || []).length
      ? 'ComputerEase already holds this application &mdash; the CE invoice ledger carries pay request '
        + esc(String(pre.payReq)) + ', so it is left out of previous payments.'
      : 'ComputerEase already holds this application &mdash; its billed-to-date ('
        + money2(e.billed) + ') equals their completed-to-date to the cent, '
        + 'so the usual previous-payments figure would be this application counted twice.');
    warn.push(derivedPrev == null
      ? 'Previous payments cannot be derived until their balance due is keyed. Until then the '
        + 'ceiling rests on their own figure. <b>Subcontractor Detail Report by Vendor</b>, '
        + 'Payment / Amount column, settles it.'
      : (e.prevSource === 'ledger' && ledgerThisApp(e, pre && pre.payReq)
         && ledgerThisApp(e, pre && pre.payReq).length
          ? 'Previous payments above is the CE payable on every invoice <b>except</b> this one, '
            + 'read from the CE invoice ledger' + (e.ledger.asOf ? ' (as of ' + esc(e.ledger.asOf) + ')' : '')
            + '. It is what BH certified, not what has been cheque-cut.'
          : 'Previous payments above is <b>derived</b>: CE payable to date (' + money2(e.prevPaid)
            + ') less the ' + money2(theirDue) + ' being requested. That holds because CE posted this '
            + 'application at the amount asked for. Confirm against <b>Subcontractor Detail Report by '
            + 'Vendor</b>, Payment / Amount column, before paying.'));
    if (e.billed > e.contract + 0.005)
      warn.push('CE carries <b>' + money2(e.billed) + '</b> against a contract of '
        + money2(e.contract) + ' &mdash; <b>' + money2(e.billed - e.contract)
        + '</b> more than the commitment. That needs correcting in CE whatever is paid.');
    if (earned != null && nz(pre.billed) > e.contract + 0.005)
      warn.push('Completed is capped at the contract above. If their schedule of values still '
        + 'bills scope that an approved change order removed, less than this is due &mdash; '
        + 'check column G against the deducted line before paying.');
  }
  if (P.ceAhead != null) {
    warn.push('ComputerEase shows <b>' + money2(e.billed) + '</b> billed against this subcontract, <b>'
      + money2(P.ceAhead) + '</b> MORE than they are claiming complete. CE is ahead of their own '
      + 'application, so previous payments on the left is not the position before this one and the '
      + 'ceiling above is understated.'
      + (e.cos && Math.round(P.ceAhead * 100) === Math.round(e.cos * 100)
          ? ' The difference is <b>exactly the approved change order</b> of ' + money2(e.cos)
            + ', so the change order value has most likely been posted into billings in CE while the '
            + 'subcontractor is still billing the original contract. Check the subcontract\'s invoices '
            + 'in CE before treating anything here as a finding against them.'
          : ' Reconcile the subcontract\'s invoices in CE against their applications before paying.'));
  }
  if (e.prevSource !== 'ledger')
    warn.push('Previous payments is an <b>estimate</b> from <code>committed_billed</code> less a computed '
      + 'retainage' + (STATE.ceInv && STATE.ceInv.filters && STATE.ceInv.filters.since
          ? ' &mdash; the CE invoice ledger loaded starts at ' + esc(STATE.ceInv.filters.since)
            + ', so it cannot supply prior certificates. Publish a full-history export.'
          : ' &mdash; no full-history CE invoice ledger row for this commitment.'));
  if (e.gap) warn.push(e.gap > 0
    ? 'Procore is <b>' + money2(e.gap) + '</b> higher than CE &mdash; an approved change order has not reached CE.'
    : 'CE is <b>' + money2(-e.gap) + '</b> higher than Procore &mdash; the change order was entered straight into CE.');
  if (e.thru50 && e.past50) warn.push('Past 50% &mdash; no further retainage should be withheld. '
    + 'Their retainage &divide; ' + (e.pctR/2) + '% recovers the contract they are billing against.');
  if (e.flags.includes('sov_gap')) warn.push('Billed plus remaining does not reconcile to the schedule of values.');
  if (e.pctR && !e.dur) warn.push('No retainage term on the commitment &mdash; assuming it is withheld on every dollar.');

  return '<div class="pawrap"><div class="pacols"><div class="pacol1">'
   /* A negative ceiling is not "they may ask for minus two thousand" - it means
      the commitment is already billed past its contract. Seven live rows are in
      that state, so it is a real case, not a theoretical one. */
   + (absorbed
      /* The ceiling cannot come from CE here, so it comes from their own form
         or it is not shown at all. Never "nothing further is due". */
      ? (payNow == null
          ? '<div class="pamax"><span class="l">Ceiling not available</span>'
            + '<span class="paref" style="margin-left:2px">CE already holds this application, and their previous-payments figure is not keyed</span></div>'
          : payNow <= 0.005
            ? '<div class="pamax"><span class="l" style="color:#7f1b29">Nothing is due</span>'
              + '<span class="paref" style="margin-left:2px">they have already been paid '
              + money2(theirPrev) + ' of the ' + money2(earned - retDue) + ' earned net of retainage</span></div>'
            : '<div class="pamax"><span class="l">Pay no more than</span>'
              + '<span class="n">' + money2(payNow) + '</span>'
              + '<span class="paref" style="margin-left:2px">'
              + (theirAsk == null ? 'recomputed on the adjusted contract of ' + money2(e.contract)
                 : 'they asked for ' + money2(theirAsk)
                   + (theirAsk - payNow > 0.005 ? ' &mdash; ' + money2(theirAsk - payNow) + ' less'
                      : theirAsk - payNow < -0.005 ? ' &mdash; ' + money2(payNow - theirAsk) + ' more' : ''))
              + '</span></div>')
      : e.maxDue != null && e.maxDue < -0.005
        ? '<div class="pamax"><span class="l" style="color:#7f1b29">Already over-billed by</span>'
          + '<span class="n" style="color:#7f1b29">' + money2(-e.maxDue) + '</span>'
          + '<span class="paref" style="margin-left:2px">nothing further is due</span></div>'
        : '<div class="pamax"><span class="l">Most they can ask for</span><span class="n">' + money2(e.maxDue) + '</span>'
          + '<span class="paref" style="margin-left:2px">'
          + (P.ceAhead != null
              ? 'not a ceiling &mdash; ComputerEase already holds this application and more'
              : e.maxDue != null && e.maxDue <= 0.005
                ? 'ComputerEase has this subcontract at ' + money2(e.billed) + ' of ' + money2(e.contract)
                  + ' &mdash; nothing is left on the contract'
                : 'if they bill to 100%') + '</span></div>')
   + '<table class="patab" data-pa="x"' + (absorbed ? ' data-absorbed="1"' : '')
   + (derivedPrev != null ? ' data-prevderived="' + derivedPrev.toFixed(2) + '"' : '')
   + (P.ourPrev   != null ? ' data-ourprev="'     + P.ourPrev.toFixed(2)   + '"' : '')
   + (noFloor ? ' data-nofloor="1"' : '') + '><thead><tr><th></th><th class="n">Ours</th>'
   +   '<th class="n">Theirs</th><th class="n"></th></tr></thead><tbody>' + rows + '</tbody></table>'
   + '</div>'
   + ceLedgerPanel(r.number, pre && pre.payReq, e, P.theirDue, P.ourDue, P.ceState)
   + '<div class="pacol2">'
   + (warn.length ? '<div class="pawarn">' + warn.map(w=>'<div>&#9888;&nbsp; '+w+'</div>').join('') + '</div>' : '')
   + (rowId ? '<div class="rqrev">'
              + '<button data-savefigs="' + esc(rowId) + '" class="ghost">Save these figures</button>'
              + '<button data-noted="' + esc(rowId) + '" class="ghost"'
                + ' title="Approve for payment with the exception recorded - pay the corrected amount '
                + 'rather than holding the cheque. Procore calls this Approved as Noted.">'
                + 'Approve as noted</button>'
              + '<button data-revise="' + esc(rowId) + '">Request revision&hellip;</button>'
              + '<span class="msg"></span></div>' : '')
   + '</div></div>';
}

/* ---- Request revision -------------------------------------------------------
   Builds the correction notice from the SAME figures the panel shows - that is
   why payappPosition() was extracted - and leaves it as a DRAFT in the signed-in
   user's mailbox. Never Mail.Send: nothing reaches a subcontractor without a
   person reading it and pressing send. */

/* Mail.ReadWrite is asked for only when the button is used, so everyone else
   keeps working on the original consent. Popup, not redirect - a redirect here
   would throw away the open row and everything keyed into it. */
async function tokenFor(extra){
  try {
    await msalApp.initialize();
    const account = msalApp.getAllAccounts()[0];
    if (!account) return { tok: null, err: 'not signed in' };
    const scopes = SCOPES.concat(extra || []);
    try { const t = await msalApp.acquireTokenSilent({ scopes, account }); return { tok: t.accessToken }; }
    catch (_) {
      const t = await msalApp.acquireTokenPopup({ scopes, account });
      return { tok: t.accessToken };
    }
  } catch (e) {
    const c = (e && (e.errorCode || e.message)) || '';
    if (/popup_window_error|popup_blocked/i.test(c))
      return { tok: null, err: 'the consent popup was blocked - allow popups for this site and try again' };
    if (/consent_required|interaction_required|user_cancelled/i.test(c))
      return { tok: null, err: 'Mail.ReadWrite has not been granted to this app yet' };
    return { tok: null, err: c || 'could not get a token' };
  }
}

/* The four lines, with the difference stated the way it goes to the sub. Mirrors
   payappBind exactly; cent precision, never an epsilon. */
function correctionFigures(e, pre){
  const P = payappPosition(e, pre);
  const cents = v => Math.round(Number(v) * 100);
  const out = [];
  const add = (label, theirs, ours, note) => {
    if (theirs == null || ours == null) return;
    if (cents(theirs) === cents(ours)) return;
    out.push({ label, theirs, ours, diff: ours - theirs, note: note || '' });
  };
  add('Adjusted contract', P.nz(pre.contract), e.contract,
      'Original contract plus approved change orders.');
  const tb = P.nz(pre.billed);
  if (tb != null && tb > e.contract + 0.005)
    out.push({ label: 'Completed to date', theirs: tb, ours: e.contract,
               diff: e.contract - tb,
               note: 'Completed work cannot exceed the adjusted contract.' });
  if (tb != null && P.nz(pre.retNow) != null && e.retAt(tb) != null)
    add('Retainage held', P.nz(pre.retNow), e.retAt(tb),
        e.thru50 ? ('Retainage is ' + e.pctR + '% through 50% completion, capped at '
                    + money2(e.retFull) + '.') : '');
  const wantPrev = P.derivedPrev != null ? P.derivedPrev : e.prevPaid;
  add('Less previous payments', P.nz(pre.prevPaid), wantPrev,
      'Per our records of payments issued against this subcontract.');
  return { lines: out, pos: P };
}

/* Fetch the submitted PDF out of the queue library so it rides along with the
   notice. A failure here must not block the draft - the notice is the point. */
async function fetchPayappPdf(tok, path){
  const q = STATE.queue;
  if (!q || !q.siteId || !path) return { bytes: null, why: 'no PDF is filed against this row' };
  const url = GRAPH + '/sites/' + q.siteId + '/drive/root:/'
            + String(path).split('/').map(encodeURIComponent).join('/') + ':/content';
  const r = await fetch(url, { headers: { Authorization: 'Bearer ' + tok } });
  if (!r.ok) return { bytes: null, why: 'the PDF could not be read (HTTP ' + r.status + ')' };
  const buf = await r.arrayBuffer();
  if (buf.byteLength > 3 * 1024 * 1024)
    return { bytes: null, why: 'the PDF is over 3 MB, too large to attach from here' };
  const b = new Uint8Array(buf); let bin = '', CH = 0x8000;
  for (let i = 0; i < b.length; i += CH) bin += String.fromCharCode.apply(null, b.subarray(i, i + CH));
  return { bytes: btoa(bin) };
}

async function requestRevision(x, msgEl){
  const say = (cls, t) => { msgEl.className = 'msg ' + cls; msgEl.innerHTML = t; };
  if (!x.c) return say('bad', 'There is no commitment behind this row to compare against.');
  const e = payappExpected(x.c);
  const pre = { contract: x.f.AdjustedContract, billed: x.f.CompletedToDate,
                retNow: x.f.RetainageHeld, prevPaid: x.f.PreviousPayments, due: x.f.BalanceDue,
                payReq: x.f.PayRequest };
  const fig = correctionFigures(e, pre);
  if (!fig.lines.length)
    return say('', 'Nothing on this application differs from the subcontract, so there is nothing to correct.');

  say('', 'Asking for permission to create a draft…');
  const { tok, err } = await tokenFor(['Mail.ReadWrite']);
  if (!tok) return say('bad', 'No draft created — ' + esc(err));

  say('', 'Fetching the submitted PDF…');
  const pdf = await fetchPayappPdf(tok, x.f.PdfPath);

  const subject = x.number + ' · Pay Application ' + (x.f.PayRequest || '')
                + ' — revision requested';
  const msg = {
    subject,
    body: { contentType: 'HTML', content: correctionHTML(x, e, fig, STATE.me) },
    toRecipients: (x.c.vendor_email ? [{ emailAddress: { address: x.c.vendor_email } }] : []),
  };
  if (pdf.bytes) msg.attachments = [{
    '@odata.type': '#microsoft.graph.fileAttachment',
    name: (String(x.f.PdfPath || 'pay application.pdf').split('/').pop()),
    contentType: 'application/pdf', contentBytes: pdf.bytes,
  }];

  say('', 'Creating the draft…');
  const r = await fetch(GRAPH + '/me/messages', {
    method: 'POST',
    headers: { Authorization: 'Bearer ' + tok, 'Content-Type': 'application/json' },
    body: JSON.stringify(msg),
  });
  if (!r.ok) {
    let why = 'HTTP ' + r.status;
    try { const b = await r.json(); if (b && b.error && b.error.message) why += ' – ' + b.error.message; } catch (_) {}
    return say('bad', 'No draft created — ' + esc(why));
  }
  const draft = await r.json();
  if (draft.webLink) window.open(draft.webLink, '_blank', 'noopener');

  /* The queue only stays true if returning an application is recorded. */
  let tail = '';
  if (x.itemId) {
    const ok = await saveQueueItem(x.itemId, statusPatch(x, 'revise and resubmit'));
    if (ok && typeof ok === 'object') { x.f.Status = 'revise and resubmit'; tail = ' Status set to revise and resubmit.'; }
    else tail = ' <b>Status not updated</b> — ' + esc(String(ok)) + '.';
  }
  say('ok', 'Draft created in your mailbox — review it before sending.'
     + (pdf.bytes ? '' : ' <b>No attachment</b>: ' + esc(pdf.why) + '.')
     + (x.c.vendor_email ? '' : ' <b>No recipient</b>: Procore carries no email for this vendor.')
     + tail);
}

/* Deltas recompute as the reviewer types; nothing is stored or sent anywhere. */
function payappBind(tr, r){
  const e = payappExpected(r);
  const tab = tr.querySelector('table[data-pa]'); if (!tab) return;
  const val = k => { const i = tab.querySelector('input[data-k="'+k+'"]'); if(!i) return null;
    const raw = i.value.replace(/[$,\s]/g,''); if(!raw) return null;
    const v = Number(raw); return isNaN(v) ? null : v; };
  const put = (k,cls,txt) => { const c = tab.querySelector('[data-d="'+k+'"]');
    c.className = 'padelta ' + cls; c.innerHTML = txt; };
  /* Compare at CENT precision, not with an epsilon. 'Ours' is computed at full
     precision (5% of 412,211.50 is 20,610.575) while 'theirs' comes off a PDF at
     two decimals, so a half-cent lands exactly on a 0.005 epsilon and reported a
     1c difference on a correct application. Rounding both to cents first keeps
     real differences - H.C. Blake's CO 002 was 11c short and still flags. */
  const cents = v => Math.round(Number(v) * 100);
  const near = (a,b) => cents(a) === cents(b);

  const upd = () => {
    PA_LINES.forEach(([k,kind]) => {
      const v = val(k);
      if (v === null) { put(k,'',''); return; }

      if (kind === 'fixed') {
        if (k === 'prevPaid' && tab.dataset.absorbed === '1') {
          const dp = tab.dataset.prevderived;
          if (dp === undefined) { put(k,'','needs their balance due'); return; }
          const want = Number(dp), d = v - want, same = near(v, want);
          put(k, same ? 'paok' : 'pabad', same ? 'matches' : (d>0?'+':'') + money2(d));
          return;
        }
        if (e[k] == null) { put(k,'',''); return; }
        const d = v - e[k];
        const same = near(v, e[k]);
        put(k, same?'paok':'pabad', same ? 'matches' : (d>0?'+':'') + money2(d));

      } else if (kind === 'range') {
        /* A new application SHOULD exceed what CE has posted - that is the work
           done this period. Only below the floor or above the contract is wrong. */
        const noFloor = tab.dataset.nofloor === '1';
        if (v > e.maxBilled + 0.005) put(k,'pabad','over contract by ' + money2(v - e.maxBilled));
        else if (!noFloor && v < e.minBilled - 0.005)
          put(k,'pabad','below the ' + money2(e.minBilled) + ' already billed');
        else put(k,'paok','within the contract');

      } else if (k === 'due') {
        /* Our estimate of this payment, from THEIR completed figure but OUR
           contract, retainage and previous payments. */
        const base = val('billed');
        const op = tab.dataset.ourprev;
        if (base === null || op === undefined || !e.retAt) { put(k,'','needs completed'); return; }
        const cap = Math.min(base, e.contract);
        const r = e.retAt(cap);
        if (r == null) { put(k,'',''); return; }
        const want = cap - r - Number(op);
        const d = v - want, same = near(v, want);
        put(k, same ? 'paok' : 'pabad', same ? 'matches' : (d>0?'+':'') + money2(d));

      } else { // derived: retainage follows whatever they say is completed
        const base = val('billed');
        if (base === null || !e.retAt) { put(k,'','needs completed'); return; }
        const want = e.retAt(base);
        if (want == null) { put(k,'',''); return; }
        const d = v - want;
        const same = near(v, want);
        put(k, same?'paok':'pabad', same ? 'matches' : (d>0?'+':'') + money2(d));
      }
    });
  };
  tab.querySelectorAll('input[data-k]').forEach(i => i.addEventListener('input', upd));
  /* Pre-filled 'theirs' values must reconcile on open, not on first keypress. */
  upd();
}

/* Compliance is folded into each row by the pull, so there is no join here and
   no second SharePoint site to reach. */
const complianceFor = r => r.compliance || null;

function compCell(r){
  const c = complianceFor(r);
  if (!c) {
    /* Billy tracks compliance PER CONTRACT. Where Billy holds other contracts
       for this vendor on this job but none for THIS commitment, that is a
       record someone needs to create - not a subcontractor nobody ever asked
       for a certificate. Naming the contracts Billy does have makes it
       actionable instead of a shrug. */
    const others = (r.billy_other_contracts || []).filter(Boolean);
    /* Say only what the data proves. The compliance FEED carries no row for this
       commitment - that is certain. Whether Billy holds the contract is a
       separate question, and for Western AG 40324HV003 it demonstrably does:
       Billy shows it alongside 30924HV003, non-compliant on four coverages,
       while compliance_data.json carries 30924HV003 twice and 40324HV003 not at
       all. So this is a gap in the pull, and the pill must not send anyone into
       Billy to create a record that already exists. */
    if (others.length) return '<span class="pill y" title="The compliance feed carries no row for this commitment, so the desk has nothing to show for it. It does carry ' + esc(others.join(', ')) + ' for this subcontractor on this job - a different contract with different coverage requirements, which is why that status is not shown here. Billy may well hold this contract; check it there before assuming nothing was verified.">no compliance record</span>';
    return '<span class="pill" style="background:#e8e6e7;color:#484b4d" title="This subcontractor holds a commitment but has no compliance record in Billy at all - not that they failed a check, that there is nothing to check.">not in Billy</span>';
  }
  if (c.billy_is_compliant === 'Yes') return '<span class="pill g">compliant</span>';
  const t = c.notes ? ' title="' + esc(c.notes).replace(/"/g,'&quot;') + '"' : '';
  return '<span class="pill r"' + t + '>non-compliant</span>';
}

/* The desk opens on one project, not all of them. A sub pay app is reviewed
   against one job, and 150-odd commitments across every job is a wall to scroll
   past before the work starts. "All projects" is still in the list for anyone
   who wants the portfolio view. */
/* Expected to bill this cycle. Deliberately NOT "who has billed" - neither
   ap_commitments.json nor ap_payapp_expected.json carries a billing date, so that
   half has to wait for the payables@ join. What this can say is who still has
   contract left, how much they can claim, and who cannot be paid when it arrives. */
/* Which slice of the cycle to look at. "Submitted to payables / not submitted"
   is the one people ask for first and the one that cannot be built yet - it
   needs the payables@ join, because nothing we hold records that a draw arrived. */
let QVIEW = 'notbilled';   // the question people actually open this tab for
/* Five views, not seven. "Billed out" and "No ComputerEase figure" were views of
   their own and are now labels on the row - they describe a commitment, they are
   not questions anyone opens this tab to ask.

   The question people DO open it to ask is "who hasn't billed yet this cycle",
   which this tab could never answer: nothing it held carried a date. The
   received queue does, so it can now. */
const QVIEWS = [
  ['notbilled','Not billed this cycle'],
  ['open',     'Left to bill'],
  ['blocked',  'Cannot be paid'],
  ['over',     'Over-billed'],
  ['all',      'Everything'],
];

/* "This cycle" is keyed on WHEN THE APPLICATION ARRIVED, not on the period it
   covers. A subcontractor bills for the period that just closed, so a 30
   September application lands in the first days of October - the first version
   of this matched PeriodEnding against the current month and so reported every
   sub as unbilled for the first three weeks of every month. Caught in test,
   not in production, but only just.

   35 days rather than 30 so a 25th-of-the-month biller is never briefly
   invisible between cycles. PeriodEnding is a secondary signal for the rare
   application that arrives late for an old period. */
function receivedThisCycle(number){
  const q = STATE.queue;
  if (!q || !q.items) return undefined;          // list not loaded - say so, do not claim nobody billed
  const want = String(number || '').trim().toUpperCase();
  if (!want) return null;
  const now = Date.now(), WINDOW = 35 * 86400000;
  let best = null, bestAt = -1;
  for (const f of q.items) {
    if (String(f.Subcontract || '').trim().toUpperCase() !== want) continue;
    const ra = f.ReceivedAt ? Date.parse(f.ReceivedAt) : NaN;
    const pe = f.PeriodEnding ? Date.parse(f.PeriodEnding) : NaN;
    const arrived = !isNaN(ra) && (now - ra) < WINDOW;
    /* A period ending inside the window counts too, for an application that
       arrived late but covers the cycle in question. */
    const covers  = !isNaN(pe) && (now - pe) < WINDOW + 15 * 86400000 && pe <= now;
    if (!arrived && !covers) continue;
    const at = isNaN(ra) ? 0 : ra;
    if (at > bestAt) { best = f; bestAt = at; }
  }
  return best;
}

function renderQueue(rows){
  const el = document.getElementById('queue'); if (!el) return;
  if (!rows || !rows.length) { el.innerHTML = ''; return; }

  const all = rows.map(r => {
    const e = payappExpected(r);
    const c = complianceFor(r);
    return { r, e, blocked: !!(c && c.billy_is_compliant !== 'Yes'), noBilly: !c };
  });
  const open   = all.filter(x => x.e.hasBilling && x.e.maxDue != null && x.e.maxDue > 0.5);
  const over   = all.filter(x => x.e.hasBilling && x.e.maxDue != null && x.e.maxDue < -0.5);
  const done   = all.filter(x => x.e.hasBilling && x.e.maxDue != null && Math.abs(x.e.maxDue) <= 0.5);
  const nodata = all.filter(x => !x.e.hasBilling);
  /* Who still has contract left AND has not sent an application this cycle. */
  all.forEach(x => { x.got = receivedThisCycle(x.r.number); });
  const queueLoaded = !!(STATE.queue && STATE.queue.items);
  const notbilled = open.filter(x => !x.got);

  const pick = { notbilled, open, blocked: open.filter(x => x.blocked), over, all };
  if (!queueLoaded && QVIEW === 'notbilled') QVIEW = 'open';
  const live = pick[QVIEW] || open;

  const counts = { notbilled: notbilled.length, open: open.length,
                   blocked: open.filter(x=>x.blocked).length, over: over.length, all: all.length };
  const sel = '<label>Show</label><select id="q-view">'
    + QVIEWS.map(([k,label]) => `<option value="${k}"${k===QVIEW?' selected':''}>`
        + `${label} (${counts[k]})</option>`).join('') + '</select>';

  if (!live.length) {
    /* An empty "not billed this cycle" is the GOOD outcome, and "Nothing in this
       view" reads like a broken page rather than a clear month. */
    const msg = QVIEW === 'notbilled'
      ? 'Every subcontractor with contract left has sent an application this cycle.'
        + '<div class="sub" style="margin-top:6px">Counted from what reached payables@ &mdash; an application sent somewhere else, or one we could not identify, is not visible here.</div>'
      : 'Nothing in this view.';
    el.innerHTML = '<div class="qwrap"><div class="qbar">' + sel + '</div>'
      + '<div class="qempty">' + msg + '</div></div>';
    bindQView();
    return;
  }

  const total = live.reduce((t,x) => t + (x.e.maxDue || 0), 0);
  const blocked = live.filter(x => x.blocked);

  /* Grouped by the day they bill, because that is how the cycle actually runs and
     it is the one scheduling fact the commitment carries. */
  const byDay = {};
  live.forEach(x => { const d = String(x.r.billing_day||'').trim() || 'no billing day set';
    (byDay[d] = byDay[d] || []).push(x); });
  const dayNum = d => { const m = String(d).match(/\d+/); return m ? Number(m[0]) : 999; };
  const days = Object.keys(byDay).sort((a,b) => dayNum(a) - dayNum(b));

  const body = days.map(d => {
    const g = byDay[d].sort((a,b) => b.e.maxDue - a.e.maxDue);
    const sum = g.reduce((t,x) => t + x.e.maxDue, 0);
    const label = /^no billing day/.test(d) ? 'No billing day set' : 'Bills ' + esc(d);
    return '<div class="qday">' + label + ' &middot; ' + g.length + ' subcontractor'
      + (g.length===1?'':'s') + ' &middot; ' + money(sum) + '</div>'
      + '<table class="qtab"><tbody>' + g.map(x =>
        '<tr><td>' + esc(x.r.vendor)
          + '<div class="qsub">' + esc(x.r.number||'') + (x.r.project ? ' &middot; ' + esc(shortProject(x.r.project)) : '') + '</div></td>'
        + '<td class="n">' + money(QVIEW === 'over' ? -(x.e.maxDue||0) : (x.e.maxDue||0))
          + '<div class="qsub">of ' + money(x.e.contract) + '</div></td>'
        + '<td class="n">' + (!queueLoaded
            ? '<span class="qsub">&mdash;</span>'
            : x.got
              ? '<span class="pill g" title="A pay application for this commitment is in the received queue for this cycle.">billed</span>'
                + '<div class="qsub">' + esc(shortDate(x.got.ReceivedAt)) + (x.got.PayRequest ? ' &middot; #' + esc(String(x.got.PayRequest)) : '') + '</div>'
              : '<span class="qsub" style="color:#211e1e">not billed yet</span>')
          + '</td>'
        + '<td class="n">' + (x.blocked
            ? '<span class="qblock">cannot be paid</span><div class="qsub">non-compliant in Billy</div>'
            : (x.noBilly ? '<span class="pill" style="background:#e8e6e7;color:#484b4d" title="This subcontractor holds a commitment but has no compliance record in Billy at all - not that they failed a check, that there is nothing to check.">not in Billy</span>' : ''))
          + '</td></tr>').join('') + '</tbody></table>';
  }).join('');

  const headLabel = QVIEW === 'over' ? 'Over-billed by'
                  : QVIEW === 'notbilled' ? 'Left to bill, not yet billed this cycle'
                  : 'Left to bill';
  const headNum = '<span class="n">' + money(QVIEW === 'over' ? -total : total) + '</span>';
  /* The two dropped views, kept as facts rather than as places to navigate to. */
  const tail = ' &middot; ' + done.length + ' billed out, ' + nodata.length + ' with no ComputerEase figure'
    + (queueLoaded ? '' : ' &middot; <span style="color:#211e1e">pay app queue not loaded, so '
        + '&ldquo;billed this cycle&rdquo; is unknown rather than no</span>');

  el.innerHTML = '<div class="qwrap">'
    + '<div class="qbar">' + sel + '</div>'
    + '<div class="qhead"><span class="l">' + headLabel + '</span>' + headNum
    +   '<span class="qsub">across ' + live.length + ' commitment' + (live.length===1?'':'s')
    +   (blocked.length && QVIEW !== 'blocked' ? ' &middot; <span class="qblock">' + blocked.length + ' cannot be paid until compliance clears</span>' : '')
    +   tail
    +   '</span></div>' + body + '</div>';
  bindQView();
}

function bindQView(){
  const s = document.getElementById('q-view');
  if (s) s.onchange = () => { QVIEW = s.value; render(); };
}

/* ==== the received queue =====================================================
   What a PM opens the desk for: the pay applications that have actually arrived,

const RQ_STATUS = {

  'AP verified':          ['#e8e6e7','var(--ink)','AP confirmed the mail carries a real pay application PDF. Waiting on the PM.'],

  'PM returned':          ['#f9e3e4','#7f1b29','The PM sent it back. See their note before it goes to the sub.'],

};
function rqStatusPill(s){

       + (d[2] ? ' title="' + esc(d[2]) + '"' : '') + '>' + esc(k) + '</span>';

/* ---- whose court, and how long ---------------------------------------------
   An application is always waiting on somebody. The status says who, and
   StatusChangedAt says since when - so "stuck" stops meaning "old" and starts
   meaning "old IN ONE PLACE". A pay app 19 days in with 14 of them sitting with
   a PM is a different conversation from one that arrived yesterday. */
const STATUS_COURT = {
  'received':             'AP',    // Drew has not triaged it
  'AP verified':          'PM',    // triaged, waiting on the job's team
  'with PM':              'PM',
  'PM returned':          'AP',
  'PM approved':          'AP',    // back to AP to enter
  'approved as noted':    'AP',
  'approved and entered': 'done',
  'revise and resubmit':  'sub',
  'not a pay app':        'out',
};
function withWhom(x){
  switch (STATUS_COURT[x.status] || 'AP') {
    case 'PM':   return groupAssigned(x) === '—' ? 'PM (unassigned)' : groupAssigned(x);
    case 'sub':  return x.vendor || 'the subcontractor';
    case 'done': return 'done';
    case 'out':  return 'payables@';
    default:     return 'AP';
  }
}
/* Days in the CURRENT status. Falls back to arrival, which is right: a row
   nobody has touched has been in "received" since it landed. */
const ageInStatus = x => daysSince(x.f.StatusChangedAt || x.f.ReceivedAt);

/* Every status write carries the clock with it, so the next person can see how
   long it sat rather than inferring it from the version history. */
function statusPatch(row, status){
  const now = new Date().toISOString();
  let log = [];
  try { log = JSON.parse(row.f.StatusLog || '[]'); } catch (_) { log = []; }
  if (!Array.isArray(log)) log = [];
  /* Seed the first leg from arrival, or the time before the first triage
     decision is simply missing from the trail. */
  if (!log.length && row.f.ReceivedAt) log.push({ s: row.f.Status || 'received', at: row.f.ReceivedAt });
  log.push({ s: status, at: now });
  if (log.length > 40) log = log.slice(-40);
  return { Status: status, StatusChangedAt: now, StatusLog: JSON.stringify(log) };
}

/* The trail, for anyone who can see the whole queue. Legs are closed by the
   next entry; the last one is still running. */
function statusTrail(x){
  if (!(STATE.me || {}).seesAll) return '';
  let log = [];
  try { log = JSON.parse(x.f.StatusLog || '[]'); } catch (_) { log = []; }
  if (!Array.isArray(log) || !log.length) {
    if (!x.f.ReceivedAt) return '';
    log = [{ s: x.status || 'received', at: x.f.ReceivedAt }];
  }
  const legs = log.map((e, i) => {
    const end = i + 1 < log.length ? new Date(log[i+1].at) : new Date();
    const d = Math.max(0, Math.round((end - new Date(e.at)) / 86400000));
    return { s: e.s, at: e.at, days: d, open: i + 1 === log.length };
  });
  return '<div class="sttrail"><span class="stlab">Trail</span>'
    + legs.map(l => '<span class="stleg' + (l.open ? ' on' : '') + '"'
        + ' title="' + esc(l.s + ' since ' + shortDate(l.at)) + '">'
        + esc(l.s) + ' <b>' + l.days + 'd</b></span>').join('<span class="starr">&rarr;</span>')
    + '</div>';
}

/* ---- triage vs review ------------------------------------------------------
   One queue, two defaults. Drew in AP opens the condensed view: is this a pay
   app, and what happens to it. A PM opens the figures. Either can switch, and
   the switch is remembered for the session only - it is a lens, not a setting.

   Role decides the DEFAULT, never what anyone may see. The desk is already
   explicit that department scoping is not a security boundary. */
const AP_TRIAGE_DEPARTMENTS = ['Accounting - Personnel', 'Accounting - Executives'];
/* Named accounts beat department, for people whose department does not say what
   they are doing on this page. */
const TRIAGE_PEOPLE = ['hdatb@baileyharris.com'];
const REVIEW_PEOPLE = ['tiffany.blackmon@baileyharris.com'];
let QMODE = null;                         // 'triage' | 'review', null until /me resolves
function queueMode(){
  if (QMODE) return QMODE;
  /* Viewing as somebody shows you THEIR desk, which is the point - Accounting's
     desk is the triage one. The actions still write as the signed-in user. */
  if (VIEWAS === 'accounting') return 'triage';
  if (viewAsPm()) return 'review';
  const me = norm((STATE.me || {}).email || '');
  if (TRIAGE_PEOPLE.map(norm).includes(me)) return 'triage';
  if (REVIEW_PEOPLE.map(norm).includes(me)) return 'review';
  const d = norm((STATE.me || {}).dept || '');
  return AP_TRIAGE_DEPARTMENTS.map(norm).includes(d) ? 'triage' : 'review';
}

/* The three decisions Drew makes, in his words. Each is a status write and
   nothing else - no side effects, so a mis-click is undone by the next one. */
/* The intake checklist the VP's review settled on. Ticking all four is what
   unlocks Route to PM - the same shape as the demo, where routing requires the
   previous-payment check and a commitment before it will move.

   NOT PERSISTED. These live for as long as the page is open. What survives is
   the consequence: routing writes a status change, and the trail records who
   moved it and when. A column to store the ticks themselves would be the honest
   next step if the audit has to show them individually. */
const INTAKE_CHECKS = [
  ['ident',  'Vendor, job, and commitment confirmed'],
  ['prev',   'CE previous-paid reference verified on the same payment basis'],
  ['dupmath','Duplicate / math checks reviewed'],
  ['flag',   'Application discrepancies flagged'],
];
const RQ_CHECKED = new Map();        // row id -> Set of ticked check keys

function intakeTicked(id){ return RQ_CHECKED.get(id) || new Set(); }
function intakeReady(x){
  const t = intakeTicked(x.id);
  return INTAKE_CHECKS.every(([k]) => t.has(k)) && !!(x.f.Subcontract || '').trim();
}

const TRIAGE_ACTIONS = [
  { k:'topm', label:'Route to PM', status:'with PM', cls:'go', gated:true,
    tip:'All four intake checks ticked and a commitment assigned. Goes to the job’s Project '
      + 'Management Team to be checked against the contract. Nothing is entered into ComputerEase.' },
  { k:'resubmit', label:'Request correction', status:'revise and resubmit', cls:'bad',
    tip:'The application cannot stand as submitted - wrong form, or figures that do not hold. '
      + 'Goes back to the subcontractor for a corrected application, which returns through intake.' },
  { k:'notpayapp', label:'Move to invoice queue', status:'not a pay app', cls:'',
    tip:'Not a subcontractor pay application. It leaves the pay app queue and is worked as an '
      + 'ordinary invoice.' },
  { k:'undo', label:'Back to the pay app queue', status:'received', cls:'' },
];

/* What Drew needs in the row he opens: the document, the mail it came in, and

/* The actions, lifted out so they can sit ABOVE the document in triage. Drew is
   deciding what the thing is, not reading it end to end - the decision should

function triageActions(x){
  const t = intakeTicked(x.id);

    + (noCom ? '<div class="intwarn">No commitment on this row yet &mdash; key the subcontract '
             + 'number on the Details tab before routing.</div>' : '')
    + '</div>';

    +   (x.status === 'not a pay app'
          ? '<button data-tr="' + esc(x.id) + '" data-trk="undo" title="Put it back in the pay '
            + 'application queue as it arrived.">Back to the pay app queue</button>'
          : TRIAGE_ACTIONS.filter(a => a.k !== 'undo').map(a => {

                + ' class="' + a.cls + '"' + (off ? ' disabled' : '')
                + ' title="' + esc(off ? 'Tick all four intake checks, and assign a commitment, '
                                       + 'before routing this to the PM.' : a.tip) + '">'
                + a.label + '</button>';
            }).join(''))
    +   '<span class="msg"></span>'
    + '</div>';
}

/* ---- the source document ----------------------------------------------------
   The Attachment G cover, laid out the way the form lays it out, filled in with
   what the parser took off the PDF. It is NOT a picture of the document and

   There is no schedule of values here because nothing extracts one. The parser

const SRC_LINES = [

  ['APPROVED CHANGE ORDER(S)',                        null,               'not captured'],
  ['ADJUSTED CONTRACT AMOUNT',                        'AdjustedContract', ''],

  ['LESS PREVIOUS PAYMENTS',                          'PreviousPayments', ''],

];

function docKv(label, v, note, cls){

/* The demonstration's document viewer, with our figures in it. Two pages rather
   than three: their SOV is sample data over two sheets, and we have no schedule
   of values at all - the parser reads the cover, and a G703 only as far as its
   grand totals row. Page 2 says so instead of inventing lines. */
function documentPages(x){
  const f = x.f;
  const pay = (f.DocType || 'pay app') !== 'invoice';
  const rev = Number(f.Revision || 1);
  const pdf = f.PdfPath
    ? '<a class="rqlink" href="' + esc(QUEUE_DOCS + f.PdfPath) + '" target="_blank" '
      + 'rel="noopener">Open the original PDF &rarr;</a>'
    : '<span class="muted">No PDF was filed with this row.</span>';

  const cover =
      '<article class="paper" id="paper-1">'
    + '<div class="dochead"><div><h3>' + esc(x.vendor || '(no vendor)') + '</h3>'
    +   '<small>' + esc(String(f.PayRequest || '\u2014')) + ' \u00b7 Revision ' + rev + '</small>'
    + '</div></div>'
    + '<h3>' + (pay ? 'Application for payment' : 'Invoice') + '</h3>'
    + '<p>' + esc(x.project || x.job || '') + '<br>Commitment: ' + esc(f.Subcontract || '\u2014')
    +   '<br>Period ending: ' + esc(f.PeriodEnding ? shortDate(f.PeriodEnding) : '\u2014') + '</p>'
    + (f.Subject ? '<p>' + esc(String(f.Subject)) + '</p>' : '')
    + (pay
        ? docKv('Original contract',          null, 'not captured')
        + docKv('Approved changes',           null, 'not captured')
        + docKv('Revised contract',           f.AdjustedContract)
        + docKv('Completed &amp; stored to date', f.CompletedToDate)
        + docKv('Retainage',                  f.RetainageHeld)
        + docKv('Previous payments',          f.PreviousPayments)
        : docKv('Services / materials',       f.BalanceDue))
    + docKv('Current payment due', f.BalanceDue, null, 'total')
    + '<div class="page-num">Page 1 of ' + (pay ? 2 : 1) + ' \u00b7 Cover sheet \u00b7 '
    +   'Figures as read off the PDF; a line reading &ldquo;not captured&rdquo; is not on the list, '
    +   'and is not zero.</div></article>';

  const sov = !pay ? '' :
      '<article class="paper" id="paper-2"><h3>Schedule of values</h3>'
    + '<p>' + esc(x.vendor || '') + ' \u00b7 ' + esc(String(f.PayRequest || '')) + '<br>'
    +   esc(x.job || '') + ' \u00b7 Revision ' + rev + '</p>'
    + '<p class="muted">Not extracted. Nothing reads line items off a continuation sheet yet &mdash; '
    +   'the parser takes the cover, and a G703 only as far as its grand totals row. Until that is '
    +   'built, the schedule is in the PDF.</p>'
    + '<p>' + pdf + '</p>'
    + '<div class="page-num">Page 2 of 2 \u00b7 Schedule of values</div></article>';

  return '<div class="viewer-toolbar"><strong>Source document \u00b7 '
      +   (pay ? '2 pages' : '1 page') + '</strong>'
      +   '<div class="paper-tabs">'
      +     (pay ? [1,2] : [1]).map(p => '<button data-paper="' + p + '">' + p + '</button>').join('')
      +   '</div></div>'
      + '<p class="source-warning">Rendered from the figures the parser read, not a picture of the '
      +   'document. The original is one click away.</p>'
      + '<div class="pages-scroll">' + cover + sov + '</div>';
}

/* ---- the queue's columns, defined once --------------------------------------
   Header, filter row, sort and cell all read this list, so "every column is
   sortable and filterable" is true by construction rather than ten times over
   by hand. Titles are ComputerEase's, named by Tiffany, so the queue reads the
   way the office talks.

   sort: a comparable value - a number, or a string that sorts correctly (dates
         as ISO, so lexical order is chronological).

         words a person would actually type, so "no period" and "needs keying"

    sort: x => { const d = effectiveInvDate(x); return d.v ? String(d.v).slice(0,10) : ''; },
    find: x => { const d = effectiveInvDate(x);

    cell: x => { const d = effectiveInvDate(x);
      if (!d.v) return '<span class="muted">no date</span>';
      return esc(shortDate(d.v))
           + (d.src === 'invoice' ? '<div class="rqsub">invoice date</div>' : ''); } },

  { k:'vendor',
    facet: x => x.vendor || '(no vendor)',
    h:'Vendor', h2:'Inv #',

    find: x => (x.project || '') + ' ' + (x.project ? shortProject(x.project) : '') + ' ' + (x.job || ''),

  { k:'overall',

  { k:'desc',

               : '<span class="muted">&mdash;</span>'; } },

  { k:'sub',
    triage: false,
    facet: x => x.number || 'no subcontract number',
    h:'PO / Sub', tip:'The commitment in Procore and ComputerEase.',
    sort: x => x.number || '',
    find: x => x.number || 'no subcontract number',
    cell: x => x.number ? esc(x.number) : '<span class="muted">no subcontract number</span>' },

  { k:'amount',
    facet: x => x.due == null ? 'needs keying' : money(x.due),
    h:'Amount', h2:'Balance Due', cls:'n',
    tip:'Balance due this application - what the subcontractor is asking to be paid now. Blank means the figure was not read off the PDF, usually because it is a scan.',
    sort: x => x.due == null ? -Infinity : x.due,

             + '<div class="rqsub">' + rqCheck(x)[0] + '</div>' },

  { k:'status',
    facet: x => (x.status || 'received') + (x.ceState ? ' \u00b7 in CE' : ''),

    sort: x => (x.status || '') + (x.ceState ? ' 1' : ' 0'),
