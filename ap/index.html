<title>AP Desk</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:'Montserrat',Arial,Helvetica,sans-serif; background:#f5f7fa; color:#211E1E; }
  .wrap { max-width:1500px; margin:0 auto; padding:20px; }
  .bh-banner{background:#fff;border-bottom:1px solid #E8E6E7;width:100%}
  .bh-banner-inner{max-width:1500px;margin:0 auto;padding:12px 20px 14px;display:flex;align-items:center;gap:18px}
  .bh-logo{height:54px;width:auto;flex:none}
  .bh-titles{line-height:1.2}
  .bh-title{color:#211E1E;font-size:22px;font-weight:800;letter-spacing:.02em;text-transform:uppercase}
  .bh-sub{color:#5b6472;font-size:12.5px;margin-top:3px}
  .bh-badge{margin-left:auto;border:1px solid #1a7f37;color:#1a7f37;background:#fff;padding:4px 12px;border-radius:6px;font-size:11px;font-weight:bold;letter-spacing:.05em;white-space:nowrap}
  .banner{background:#fff7e6;border:1px solid #f0d089;color:#7a5a12;padding:9px 13px;border-radius:8px;font-size:13px;margin-bottom:14px}
  .err{background:#FFC7CE;border-color:#e6a3a3;color:#9C0006}
  .notice{background:#eef3fb;border:1px solid #c3d4ee;color:#1F3864;padding:11px 14px;border-radius:9px;font-size:13px;margin-bottom:16px;line-height:1.55}
  .notice b{color:#1a4fb0}
  .controls{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
  .controls label{font-size:13px;color:#40485a;font-weight:bold}
  select,input[type=text]{padding:8px 12px;border:1px solid #c7cfdb;border-radius:8px;font-size:14px;background:#fff;font-family:inherit}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px}
  .card{background:#fff;border:1px solid #e3e8f0;border-radius:10px;padding:13px 15px}
  .card .n{font-size:25px;font-weight:bold}
  .card .l{font-size:11.5px;color:#5b6472;margin-top:2px;text-transform:uppercase;letter-spacing:.03em}
  .pacell{white-space:nowrap}
  .pabtn{font:inherit;font-size:11px;padding:2px 7px;border:1px solid #c9d3e0;background:#f4f7fb;color:#1F3864;border-radius:4px;cursor:pointer}
  .pabtn:hover{background:#e8eef7}
  tr.parow>td{background:#fbfcfe;border-top:0}
  .pawrap{padding:10px 4px 14px;display:grid;grid-template-columns:minmax(420px,1.2fr) minmax(300px,1fr);gap:18px;align-items:start}
  @media(max-width:1100px){.pawrap{grid-template-columns:1fr}}
  .patab{width:100%;border-collapse:collapse;font-size:12px}
  .patab th,.patab td{border-bottom:1px solid #e7ecf3;padding:4px 6px;text-align:left;vertical-align:top}
  .patab th{font-weight:600;color:#54607a;font-size:11px;text-transform:uppercase;letter-spacing:.03em}
  .patab td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  .pahd{font-weight:700;color:#1F3864;margin:0 0 6px}
  .pain{width:120px;font:inherit;font-size:12px;padding:3px 5px;border:1px solid #c9d3e0;border-radius:4px;text-align:right}
  .padelta{font-size:11px;white-space:nowrap}
  .paok{color:#1a7f37}.pabad{color:#b3261e;font-weight:600}
  .panote{font-size:11px;color:#6b7482;line-height:1.6;margin-top:8px}
  .total .n{color:#7F1B29}.ok .n{color:#1a7f37}.soon .n{color:#9a6a00}.bad .n{color:#b3261e}.gap .n{color:#1a4fb0}
  .section-title{font-size:15px;font-weight:bold;color:#7F1B29;margin:22px 0 10px}
  .tablescroll{overflow-x:auto;border-radius:10px}
  table{width:100%;border-collapse:collapse;background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.04);font-size:12px}
  th,td{padding:7px 9px;text-align:center;border-bottom:1px solid #eef1f6;white-space:nowrap}
  th{background:#484B4D;color:#fff;font-size:11px;position:sticky;top:0;cursor:pointer;user-select:none}
  th:hover{background:#5a5e61}
  td.l,th.l{text-align:left}
  /* A second line inside a cell keeps the figure and its qualifier together
     without spending a column on it. */
  .sub{font-size:10.5px;color:#7a828f;line-height:1.5;margin-top:1px;font-weight:normal}
  .sub.co{color:#1a4fb0}
  .warn{color:#9a6a00;font-weight:bold}
  td.wrap{white-space:normal;max-width:210px}
  /* NOT .r - that is the red pill class. A numeric column called .r painted
     every Contract/Paid/% cell red. */
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
  tbody tr:hover{background:#f7f9fc}
  tbody tr.noncompliant td:first-child{box-shadow:inset 4px 0 0 #b3261e}
  tbody tr.noncompliant{background:#fff8f8}
  tbody tr.nobilly td:first-child{box-shadow:inset 4px 0 0 #c7cfdb}
  .pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:bold}
  .g{background:#C6EFCE;color:#006100}.y{background:#FFEB9C;color:#9C6500}.r{background:#FFC7CE;color:#9C0006}
  .b{background:#DDEBF7;color:#1F3864}.muted{color:#9aa2b1}
  .code{font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;font-size:11px;color:#40485a}
  .legend{background:#fff;border:1px solid #e3e8f0;border-radius:10px;padding:11px 14px;margin-bottom:16px;font-size:12.5px;line-height:2;color:#40485a}
  .legend b{color:#7F1B29}
  .legend .grp{display:inline-block;margin-right:18px}
  .empty{color:#5b6472;font-style:italic;padding:14px 0}
  .loading{padding:40px;text-align:center;color:#5b6472}
  a{color:#1a4fb0;text-decoration:none}a:hover{text-decoration:underline}
  footer{margin-top:26px;padding-top:14px;border-top:1px solid #e3e8f0;color:#7a828f;font-size:11.5px;line-height:1.7}
  .stub{background:#fff;border:1px dashed #c7cfdb;border-radius:10px;padding:18px 20px;color:#5b6472;font-size:13px;line-height:1.6}
  .stub h3{margin:0 0 6px;font-size:14px;color:#211E1E}
</style>
</head>

<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@3/lib/msal-browser.min.js"></script>
<script>
/* ==== Sign-in and data source ====
   Same app registration, scopes and site as the Precon and Prequal desks, so a
   PM signs in once for all of them. Sites.Selected is granted per site, and the
   grant that matters here is on /sites/Dashboard - NOT the compliance
   dashboard's app, which reads sites/Resources with Files.Read.All.
   The redirect URI must be registered on this app as .../ap/ (with the trailing
   slash) exactly as /precon/ and /prequal/ are. */
const CLIENT_ID = '1825a1c0-1ce3-4078-aeb7-a4714562c422';
const TENANT_ID = '848aa890-7982-4028-befa-3323d82583ce';
const SCOPES    = ['User.Read','GroupMember.Read.All','Sites.Selected'];
const SP_HOST   = 'baileyharris.sharepoint.com';
const SP_PATH   = '/sites/Dashboard';
const LIBRARY   = 'APData';
const DATA_FILE = 'ap_commitments.json';
/* Billed-to-date comes from ComputerEase, published by ap_payapp_expected.js.
   The page must still work if that file has never been written, so its absence
   is tolerated and every billing cell falls back to "no data" rather than 0. */
const EXPECTED_FILE = 'ap_payapp_expected.json';
const CONTACT   = 'itadmin@baileyharris.com';

const msalApp = new msal.PublicClientApplication({
  auth: { clientId: CLIENT_ID, authority: 'https://login.microsoftonline.com/' + TENANT_ID,
          redirectUri: location.origin + '/ap/' },
  cache: { cacheLocation: 'sessionStorage' }
});

async function token(){
  await msalApp.initialize();
  const redir = await msalApp.handleRedirectPromise();
  let account = (redir && redir.account) || msalApp.getAllAccounts()[0];
  if (!account) { await msalApp.loginRedirect({ scopes: SCOPES }); return null; }
  msalApp.setActiveAccount(account);
  try { const t = await msalApp.acquireTokenSilent({ scopes: SCOPES, account }); return t.accessToken; }
  catch (e) { await msalApp.acquireTokenRedirect({ scopes: SCOPES }); return null; }
}

const GRAPH = 'https://graph.microsoft.com/v1.0';
async function g(tok, path){
  const r = await fetch(GRAPH + path, { headers: { Authorization: 'Bearer ' + tok } });
  let body = null; try { body = await r.json(); } catch(_) {}
  return { ok: r.ok, status: r.status, body };
}

/* Resolve site -> library -> file, the same way the Precon desk does. A 403 here
   is an access problem, not a missing file, and says so. */
async function loadData(tok){
  const site = await g(tok, '/sites/' + SP_HOST + ':' + SP_PATH);
  if (!site.ok || !site.body || !site.body.id)
    throw new Error('Could not reach ' + SP_PATH + ' (HTTP ' + site.status + ').');
  const dr = await g(tok, '/sites/' + site.body.id + '/drives?$select=id,name');
  const drive = ((dr.body && dr.body.value) || []).find(d => d.name === LIBRARY);
  if (!drive) throw new Error('No document library called ' + LIBRARY + ' on ' + SP_PATH + '.');
  const r = await fetch(GRAPH + '/drives/' + drive.id + '/root:/' + encodeURI(DATA_FILE) + ':/content',
                        { headers: { Authorization: 'Bearer ' + tok } });
  if (r.status === 403)
    throw new Error('Your account is not permitted to read ' + LIBRARY + '. Ask ' + CONTACT + ' for access.');
  if (r.status === 404)
    throw new Error(DATA_FILE + ' is not in ' + LIBRARY + ' yet - has the AP commitments pull run?');
  if (!r.ok) throw new Error(DATA_FILE + ': HTTP ' + r.status);
  const commitments = await r.json();

  /* Second file, optional. A 404 here is not an error - it means the CE billing
     pull has not run yet, and the page says so instead of showing zeros. */
  let expected = null;
  try {
    const e = await fetch(GRAPH + '/drives/' + drive.id + '/root:/' + encodeURI(EXPECTED_FILE) + ':/content',
                          { headers: { Authorization: 'Bearer ' + tok } });
    if (e.ok) expected = await e.json();
  } catch (_) { /* leave expected null */ }
  return { commitments, expected };
}

/* ==== helpers ==== */
// Same normalisation compliance_pull.js uses, so the join keys agree.
const normName = n => String(n||'').toUpperCase().replace(/&/g,' AND ').replace(/[.,'"]/g,' ')
  .replace(/\b(LLC|L L C|INC|INCORPORATED|CO|COMPANY|CORP|CORPORATION|LP|LLP|PC|PLLC)\b/g,' ')
  .replace(/[^A-Z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
const money = v => (v === null || v === undefined || v === '') ? '' :
  '$' + Math.round(Number(v)).toLocaleString();
const pct = v => (v === null || v === undefined || v === '') ? '' : Number(v).toFixed(0) + '%';
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* Retainage is two fields. The percent alone cannot say whether it stops at 50%
   completion - which is exactly how the GL Pack shortage happened. Show both,
   and flag the commitments where the term is missing rather than assuming. */
function retainageCell(r){
  const p = r.retainage_percent, d = (r.retainage_duration||'').trim();
  if (p === null && !d) return '<span class="muted">—</span>';
  if (p === 0) return '<span class="pill b" title="This contract withholds no retainage">0% &middot; no retainage</span>';
  const dur = d && d.toLowerCase() !== 'n/a' ? d : '<span class="pill y">term not set</span>';
  return '<b>' + pct(p) + '</b> ' + dur;
}

let STATE = { commitments: [], sort: { col: 'project', dir: 1 }, billing: {}, billingMeta: null };

/* Joined on commitment number, which the probe work established equals the CE
   subcontract code exactly (40325AU002 in both systems). Vendor name is NOT a
   safe key - 25AU002 carries Turner Fence on two separate commitments. */
const billingFor = r => STATE.billing[String(r.number || '').trim()] || null;

const FLAG_TEXT = {
  over_billed:            ['r','over-billed','Billed more than the commitment. Either a change order went into billings but not onto the subcontract, or the sub over-billed.'],
  contract_mismatch:      ['y','contract differs','Procore and ComputerEase disagree on the contract value - a change order is likely in one system and not the other.'],
  sov_gap:                ['y','SOV gap','Billed plus remaining does not reconcile to the schedule of values.'],
  shared_cost_code:       ['y','shared cost code','Another subcontract posts to the same phase/category/cost type, so some dollars cannot be attributed to this one.'],
  no_job_totals:          ['b','no CE data','This job does not publish to the ComputerEase API, so no billing figure is available.'],
  no_ce_subcontract:      ['b','no CE match','No ComputerEase subcontract carries this commitment number.'],
  retainage_stop_reached: ['b','past 50%','Billings have passed half the revised contract - on a "thru 50%" term, withholding should have stopped.'],
};

/* Billed to date, with what is left and any exception beneath it. Keeping the
   qualifier in the same cell avoids spending two more columns on a table that
   is already wide. */
function billedCell(r){
  const b = billingFor(r);
  if (!b) return '<span class="muted" title="No row in ' + EXPECTED_FILE + ' for this commitment">—</span>';
  if (b.ce_billed === null || b.ce_billed === undefined) {
    const why = (b.flags||[]).includes('no_job_totals') ? 'no CE data' : 'not matched';
    return '<span class="pill b" title="' + esc(b.billed_source||'') + '">' + why + '</span>';
  }
  const flags = (b.flags||[]).filter(f => FLAG_TEXT[f]);
  const pills = flags.map(f => {
    const [cls,label,tip] = FLAG_TEXT[f];
    return '<span class="pill ' + cls + '" title="' + esc(tip) + '">' + label + '</span>';
  }).join(' ');
  return money(b.ce_billed)
    + '<div class="sub">' + (b.pct_billed != null ? Number(b.pct_billed).toFixed(0) + '%' : '')
    + (b.ce_balance ? ' &middot; ' + (b.ce_balance < 0
         ? money(Math.abs(b.ce_balance)) + ' over'    // a negative balance is an over-bill, not "-$5,100 left"
         : money(b.ce_balance) + ' left') : '') + '</div>'
    + (pills ? '<div class="sub">' + pills + '</div>' : '');
}

/* ---- Expected pay app -------------------------------------------------------
   Every quantity on a sub's cover sheet is derivable from the commitment and
   CE's billed-to-date, whatever form the sub uses. The reviewer types the four
   figures off their cover sheet and the deltas fall out. This exists because
   two reviews in one morning each took an hour and each turned on a single
   number: a $6,776 change order missing from one app, $2,160 missing from
   another. Both were visible from the contract alone.

   committed_billed is GROSS of retainage. Confirmed 1 Oct 2026 against H.C.
   Blake's G702 on 2506-00400: the desk read $310,186 and the application showed
   $310,186.31 billed with $300,646.75 paid. Previously inferred, now measured. */
function payappExpected(r){
  const b = billingFor(r);
  const contract = num0(r.revised_contract) || num0(r.contract_value);
  const pctR = (r.retainage_percent === null || r.retainage_percent === undefined)
    ? null : Number(r.retainage_percent);
  const dur  = String(r.retainage_duration || '');
  /* "thru 50%" caps total retainage at half the contract's worth of withholding.
     Anything else (throughout, or unset) withholds on every dollar. A missing
     term is NOT assumed to be thru-50 - that assumption is what let the GL Pack
     shortage through. */
  const thru50 = /50/.test(dur) && /thru|through/i.test(dur);
  const billed = b && b.ce_billed != null ? Number(b.ce_billed) : null;
  const rate = pctR == null ? null : pctR/100;
  const retAt = v => {            // retainage held once v has been billed
    if (rate == null || v == null) return null;
    if (!thru50) return v * rate;
    return Math.min(v, contract/2) * rate;
  };
  const retNow  = retAt(billed);
  const retFull = retAt(contract);
  const prevPaid = (billed != null && retNow != null) ? billed - retNow : null;
  const maxDue = (retFull != null && prevPaid != null) ? (contract - retFull) - prevPaid : null;
  return { contract, original:num0(r.contract_value), cos:num0(r.approved_change_orders),
           pctR, dur, thru50, billed, retNow, retFull, prevPaid, maxDue,
           past50: b ? !!b.past_50_pct : null,
           ceSov: b && b.ce_sov != null ? Number(b.ce_sov) : null,
           gap: b && b.pc_vs_ce_contract_gap != null ? Number(b.pc_vs_ce_contract_gap) : null,
           flags: (b && b.flags) || [], hasBilling: !!b && b.ce_billed != null };
}
const num0 = v => (v === null || v === undefined || v === '') ? 0 : Number(v);
const money2 = v => (v === null || v === undefined || isNaN(v)) ? '—'
  : '$' + Number(v).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});

/* Line names on both forms BH actually receives. The quantities are identical;
   only the labels move, so one panel serves an AIA G702/G703 and BH's own
   Attachment G without the reviewer translating. */
const PA_LINES = [
  ['original','Original contract','Amount of Original Contract','Line 1'],
  ['cos','Approved change orders','Approved Change Order(s)','Line 2'],
  ['contract','Adjusted contract','Adjusted Contract Amount','Line 3'],
  ['billed','Completed &amp; stored to date','Total Completed Work &amp; Stored Materials','Line 4 / G703 col G'],
  ['retNow','Retainage held','Less Retainage','Line 5'],
  ['prevPaid','Less previous payments','Less Previous Payments','Line 7'],
  ['maxDue','Most they can ask for','Balance Due This Payment Estimate','Line 8'],
];

function payappPanel(r){
  const e = payappExpected(r);
  if (!e.hasBilling) {
    return '<div class="pawrap"><div><div class="pahd">Expected pay app</div>'
      + '<div class="panote">No billed-to-date figure for this commitment, so the expected '
      + 'application cannot be built. The contract side still applies: adjusted contract '
      + '<b>' + money2(e.contract) + '</b>.</div></div></div>';
  }
  const rows = PA_LINES.map(([k,what,ag,aia]) =>
    '<tr><td>' + what + '</td><td class="muted">' + ag + '</td><td class="muted">' + aia
    + '</td><td class="n">' + money2(e[k]) + '</td></tr>').join('');

  const retBasis = e.pctR == null ? 'no retainage percent on the commitment'
    : (e.thru50
        ? (e.pctR + '% thru 50% &rarr; caps at ' + money2(e.retFull) + (e.past50 ? ' (already past 50%, withholding should have stopped)' : ''))
        : (e.pctR + '% ' + (e.dur ? esc(e.dur) : '<span class="warn">term not set &mdash; treated as withheld on every dollar</span>')));

  /* The cheapest catch of all. Past 50% on a thru-50 term, the retainage a sub
     shows IS 2.5% of whatever contract they are billing against, so dividing it
     back out recovers their contract without reading their schedule of values. */
  const reverse = (e.thru50 && e.pctR)
    ? '<div class="panote"><b>Shortcut:</b> their retainage &divide; ' + (e.pctR/2) + '% = the contract they are billing against. '
      + 'Compare to ' + money2(e.contract) + '.</div>' : '';

  const warn = [];
  if (e.gap) warn.push('Procore and CE disagree on the contract by <b>' + money2(Math.abs(e.gap))
    + '</b> (Procore ' + money2(e.contract) + ', CE ' + money2(e.ceSov) + '). A change order is in one system and not the other &mdash; '
    + 'settle which before deciding whether the sub has over-billed.');
  if (e.flags.includes('sov_gap')) warn.push('Billed plus remaining does not reconcile to the schedule of values.');
  if (e.pctR && !e.dur) warn.push('No retainage duration on the commitment, so the expected retainage above assumes withholding on every dollar.');

  const id = 'pa-' + String(r.number||'').replace(/[^A-Za-z0-9]/g,'');
  return '<div class="pawrap">'
   + '<div><div class="pahd">Expected pay app</div>'
   +   '<table class="patab"><thead><tr><th>Quantity</th><th>BH Attachment G</th><th>AIA G702</th><th class="n">Expected</th></tr></thead>'
   +   '<tbody>' + rows + '</tbody></table>'
   +   '<div class="panote">Retainage basis: ' + retBasis + '.</div>'
   +   reverse
   +   (warn.length ? '<div class="panote">' + warn.map(w=>'&#9888; '+w).join('<br>') + '</div>' : '')
   + '</div>'
   + '<div><div class="pahd">Check their cover sheet</div>'
   +   '<table class="patab" data-pa="' + id + '"><tbody>'
   +   ['contract','billed','retNow','prevPaid'].map(k => {
         const label = PA_LINES.find(x=>x[0]===k)[1];
         return '<tr><td>' + label + '</td>'
          + '<td class="n"><input class="pain" type="text" inputmode="decimal" data-k="' + k + '" placeholder="from their app"></td>'
          + '<td class="padelta" data-d="' + k + '"></td></tr>';
       }).join('')
   +   '</tbody></table>'
   +   '<div class="panote">Enter what their cover sheet says. Anything that does not match is '
   +   'either a change order they have missed, one they have added that we have not approved, '
   +   'or a change order still awaiting our own signature &mdash; those three need different answers.</div>'
   + '</div></div>';
}

/* Deltas recompute as the reviewer types; nothing is stored or sent anywhere. */
function payappBind(tr, r){
  const e = payappExpected(r);
  const tab = tr.querySelector('table[data-pa]'); if (!tab) return;
  const upd = () => tab.querySelectorAll('input[data-k]').forEach(inp => {
    const k = inp.dataset.k;
    const cell = tab.querySelector('[data-d="' + k + '"]');
    const raw = inp.value.replace(/[$,\s]/g,'');
    if (!raw) { cell.textContent = ''; cell.className = 'padelta'; return; }
    const v = Number(raw);
    if (isNaN(v) || e[k] == null) { cell.textContent = ''; return; }
    const d = v - e[k];
    const ok = Math.abs(d) < 0.005;
    cell.className = 'padelta ' + (ok ? 'paok' : 'pabad');
    cell.textContent = ok ? 'matches' : ((d>0?'+':'') + money2(d));
  });
  tab.querySelectorAll('input[data-k]').forEach(inp => inp.addEventListener('input', upd));
}

/* Compliance is folded into each row by the pull, so there is no join here and
   no second SharePoint site to reach. */
const complianceFor = r => r.compliance || null;

function compCell(r){
  const c = complianceFor(r);
  if (!c) return '<span class="pill" style="background:#eef1f6;color:#7a828f">not in Billy</span>';
  if (c.billy_is_compliant === 'Yes') return '<span class="pill g">compliant</span>';
  const t = c.notes ? ' title="' + esc(c.notes).replace(/"/g,'&quot;') + '"' : '';
  return '<span class="pill r"' + t + '>non-compliant</span>';
}

function render(){
  const proj = document.getElementById('f-proj').value;
  const pm   = document.getElementById('f-pm').value;
  const comp = document.getElementById('f-comp').value;
  const q    = document.getElementById('f-q').value.trim().toUpperCase();

  let rows = STATE.commitments.filter(r => {
    if (proj !== 'all' && r.project !== proj) return false;
    if (pm   !== 'all' && (r.project_manager||'') !== pm) return false;
    if (q && !(String(r.vendor).toUpperCase().includes(q) || String(r.number).toUpperCase().includes(q))) return false;
    if (comp !== 'all') {
      const c = complianceFor(r);
      const state = !c ? 'missing' : (c.billy_is_compliant === 'Yes' ? 'ok' : 'nc');
      if (comp !== state) return false;
    }
    return true;
  });

  const { col, dir } = STATE.sort;
  rows.sort((a,b) => {
    let x, y;
    if (col === 'ce_billed') { const ba=billingFor(a), bb=billingFor(b); x=(ba&&ba.ce_billed)||0; y=(bb&&bb.ce_billed)||0; }
    else { x = a[col]; y = b[col]; }
    if (typeof x === 'number' || typeof y === 'number') return ((x||0)-(y||0))*dir;
    return String(x||'').localeCompare(String(y||''))*dir;
  });

  const value = rows.reduce((s,r)=>s+(r.contract_value||0),0);
  const billed= rows.reduce((s,r)=>{ const b=billingFor(r); return s + ((b && b.ce_billed) || 0); },0);
  const left  = rows.reduce((s,r)=>{ const b=billingFor(r); return s + ((b && b.ce_balance) || 0); },0);
  const exc   = rows.filter(r=>{ const b=billingFor(r);
                  return b && (b.flags||[]).some(f=>['over_billed','contract_mismatch','sov_gap'].includes(f)); }).length;
  const cos   = rows.reduce((s,r)=>s+(r.approved_change_orders||0),0);
  const nc    = rows.filter(r => { const c = complianceFor(r); return c && c.billy_is_compliant !== 'Yes'; }).length;
  const noTerm= rows.filter(r => r.retainage_percent > 0 && !(r.retainage_duration||'').trim().match(/throughout|thru/i)).length;
  const noCe  = rows.filter(r => !r.ce_code).length;

  document.getElementById('cards').innerHTML = `
    <div class="card total"><div class="n">${rows.length}</div><div class="l">Commitments</div></div>
    <div class="card"><div class="n">${money(value)}</div><div class="l">Contract value</div></div>
    <div class="card gap"><div class="n">${money(cos)}</div><div class="l">Approved change orders</div></div>
    <div class="card ok"><div class="n">${money(billed)}</div><div class="l">Billed to date (CE)</div></div>
    <div class="card gap"><div class="n">${money(left)}</div><div class="l">Left to bill</div></div>
    <div class="card bad"><div class="n">${exc}</div><div class="l">Billing exceptions</div></div>
    <div class="card bad"><div class="n">${nc}</div><div class="l">Non-compliant</div></div>
    <div class="card soon"><div class="n">${noTerm}</div><div class="l">Retainage term not set</div></div>
    <div class="card gap"><div class="n">${noCe}</div><div class="l">No CE code</div></div>`;

  const cols = [
    ['project','Project','l'], ['number','Commitment','l'], ['vendor','Subcontractor','l'],
    ['compliance','Compliance',''],
    ['revised_contract','Contract','num'], ['ce_billed','Billed to date','num'],
    ['retainage_percent','Retainage',''], ['project_manager','PM','l'], ['status','Status','']
  ];
  const head = cols.map(([k,label,cls]) =>
    `<th class="${cls}" data-col="${k}">${label}${STATE.sort.col===k ? (STATE.sort.dir>0?' ▲':' ▼') : ''}</th>`).join('');

  const body = rows.length ? rows.map(r => `<tr class="${(() => {
      const c = complianceFor(r);
      return !c ? 'nobilly' : (c.billy_is_compliant === 'Yes' ? '' : 'noncompliant');
    })()}">
      <td class="l wrap">${esc(r.project)}</td>
      <td class="l"><a href="${esc(r.procore_url)}" target="_blank" rel="noopener">${esc(r.number||'—')}</a>
        ${r.billing_day ? `<div class="sub">bills ${esc(r.billing_day)}</div>` : ''}
        <div class="sub pacell"><button type="button" class="pabtn" data-pa-for="${esc(r.number||'')}"
          title="Expected pay app: what their cover sheet should say, and the most they can ask for">pay app check</button></div></td>
      <td class="l wrap">${esc(r.vendor)}
        <div class="sub code">${r.ce_code ? esc(r.ce_code)
          : '<span class="warn" title="No Abbreviated Name in Procore - Accounting has nothing to key the entry on">no CE code</span>'}</div></td>
      <td>${compCell(r)}</td>
      <td class="num">${money(r.revised_contract || r.contract_value)}
        ${r.approved_change_orders ? `<div class="sub co" title="Approved change orders included above">+${money(r.approved_change_orders)} CO</div>` : ''}</td>
      <td class="num">${billedCell(r)}</td>
      <td>${retainageCell(r)}</td>
      <td class="l">${esc(r.project_manager)||'<span class="muted">—</span>'}</td>
      <td>${esc(r.status)}${r.executed==='Yes'?'':(r.executed==='No'?' <span class="pill y">unexecuted</span>':'')}</td>
    </tr>`).join('') : `<tr><td colspan="9" class="empty">No commitments match these filters.</td></tr>`;

  document.getElementById('table').innerHTML =
    `<div class="tablescroll"><table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>`;

  /* One expandable panel per commitment rather than more columns - the table is
     already nine wide and the check is something you open for one sub at a time. */
  document.querySelectorAll('button[data-pa-for]').forEach(btn => btn.onclick = () => {
    const tr = btn.closest('tr');
    if (tr.nextElementSibling && tr.nextElementSibling.classList.contains('parow')) {
      tr.nextElementSibling.remove(); return;
    }
    const num = btn.dataset.paFor;
    const r = STATE.commitments.find(x => String(x.number||'').trim() === num);
    if (!r) return;
    const det = document.createElement('tr');
    det.className = 'parow';
    det.innerHTML = '<td colspan="9">' + payappPanel(r) + '</td>';
    tr.insertAdjacentElement('afterend', det);
    payappBind(det, r);
  });

  document.querySelectorAll('th[data-col]').forEach(th => th.onclick = () => {
    const c = th.dataset.col;
    STATE.sort = { col: c, dir: STATE.sort.col === c ? -STATE.sort.dir : 1 };
    render();
  });
}

(async () => {
  try {
    const tok = await token();
    if (!tok) return;

    const loaded = await loadData(tok);
    const ap = loaded.commitments;
    STATE.commitments = ap.commitments || [];
    if (loaded.expected) {
      STATE.billingMeta = loaded.expected;
      for (const row of (loaded.expected.rows || [])) STATE.billing[String(row.commitment||'').trim()] = row;
    }

    const when = new Date(ap.generated_at);
    document.getElementById('asof').textContent = 'commitments as of ' + when.toLocaleString()
      + (STATE.billingMeta ? ' · billings ' + new Date(STATE.billingMeta.generated_at).toLocaleDateString() : ' · billings not loaded');

    const projects = [...new Set(STATE.commitments.map(r => r.project))].sort();
    const pms = [...new Set(STATE.commitments.map(r => r.project_manager).filter(Boolean))].sort();

    document.getElementById('content').innerHTML = `
      <div class="notice">
        <b>Contract</b> is the revised contract from Procore, approved change orders included;
        where there are any, the amount is shown beneath it. <b>Billed to date</b> is
        ComputerEase's <span class="code">committed_billed</span> — what the subcontractor has
        actually billed against the commitment, with what is left to bill beneath it. Procore's
        own payment figure is not shown: it reads $0 on every commitment because billing happens
        in CE, not Procore.
        <br><br>
        <b>Billed is gross of retainage</b> — the amount earned, before withholding. That is
        inferred from subcontracts on a 5% term reaching exactly 100% of their schedule of
        values, which is impossible if the figure were net. It has not yet been checked against
        a signed G702, so treat the last few percent of any commitment with care.
        <br><br>
        <b>What this page shows today:</b> every active subcontract commitment in Procore, with its
        retainage term, contract value, project manager, compliance status from Billy and its
        ComputerEase vendor code. Bailey-Harris self-perform commitments are excluded.
        <br><b>What it does not show yet:</b> the pay application queue. Matching incoming draws
        from payables@ to these commitments is the next build — nothing on this page is an approval.
      </div>
      <div class="controls">
        <label>Project:</label>
        <select id="f-proj"><option value="all">All projects (${projects.length})</option>
          ${projects.map(p=>`<option>${esc(p)}</option>`).join('')}</select>
        <label>PM:</label>
        <select id="f-pm"><option value="all">All PMs</option>
          ${pms.map(p=>`<option>${esc(p)}</option>`).join('')}</select>
        <label>Compliance:</label>
        <select id="f-comp">
          <option value="all">Any</option><option value="ok">Compliant</option>
          <option value="nc">Non-compliant</option><option value="missing">Not in Billy</option></select>
        <label>Search:</label>
        <input id="f-q" type="text" placeholder="subcontractor or commitment #" style="min-width:230px">
      </div>
      <div class="legend">
        <span class="grp"><b>Retainage</b> is two things: the percentage withheld, and
          whether it runs <b>Throughout</b> or only <b>Thru 50%</b> completion. Both come from
          the commitment. <span class="pill b">0% &middot; no retainage</span> means none is
          withheld at all; <span class="pill y">term not set</span> means a percentage is
          withheld but nobody recorded when it stops.</span>
        <br>
        <span class="grp"><b>Billing exceptions</b> appear under the billed figure.
          <span class="pill r">over-billed</span> means more has been billed than the commitment
          allows. <span class="pill y">contract differs</span> means Procore and ComputerEase
          disagree on the contract value — usually a change order that reached one system and not
          the other. <span class="pill y">SOV gap</span> means billed plus remaining does not
          reconcile to the schedule of values. <span class="pill b">no CE data</span> means that
          job does not publish to the ComputerEase API at all, so there is no figure to show —
          not that nothing has been billed. Hover any of them for the detail.</span>
        <br>
        <span class="grp"><b>Compliance</b> is from Billy.
          <span class="pill r">non-compliant</span> means the subcontractor
          <b>cannot be paid</b> until their insurance or licence is current — hover it for the
          reason. <span class="pill" style="background:#eef1f6;color:#7a828f">not in Billy</span>
          means they hold a commitment with no compliance record at all.</span>
      </div>
      <div class="cards" id="cards"></div>
      <div class="section-title">Commitments</div>
      <div id="table"></div>
      <div class="section-title">Pay application queue</div>
      <div class="stub">
        <h3>Not connected yet</h3>
        The mail probe reads payables@ and identifies roughly <b>20 subcontractor draws a week</b>.
        The contract position each of those should be checked against is now on this page —
        contract including changes, billed to date, and what is left. What is missing is the
        incoming pay app itself: matching a draw from payables@ to its commitment, so a PM can
        compare the claimed amount against the figures above, code it and approve it.
        Nothing on this page is an approval.
      </div>`;

    document.getElementById('foot').innerHTML =
      `Commitments: Procore work-order contracts, ${STATE.commitments.length} rows across
       ${ap.projects_in_scope} projects (${ap.self_perform_skipped} self-perform excluded).
       Compliance: Billy, joined by the pull (${ap.compliance_matched} matched,
       ${ap.compliance_unmatched} with no Billy row).
       Retainage shown as percent plus duration — both are needed; the percent alone cannot
       distinguish "5% throughout" from "5% thru 50%".` +
      (STATE.billingMeta
        ? ` Billings: ComputerEase committed_billed, ${Object.keys(STATE.billing).length} commitments matched` +
          ((STATE.billingMeta.jobs_without_job_totals || []).length
            ? `; no CE billing data for ${STATE.billingMeta.jobs_without_job_totals.length} job(s) (${esc(STATE.billingMeta.jobs_without_job_totals.join(', '))}) — those rows show "no CE data", not zero.`
            : '.')
        : ` Billings not loaded — ${EXPECTED_FILE} is not in ${LIBRARY} yet, so the Billed column is empty.`);

    ['f-proj','f-pm','f-comp'].forEach(id => document.getElementById(id).onchange = render);
    document.getElementById('f-q').oninput = render;
    render();

  } catch (e) {
    document.getElementById('content').innerHTML = '';
    const b = document.getElementById('banner');
    b.className = 'banner err'; b.style.display = '';
    b.textContent = 'Could not load: ' + e.message;
    console.error(e);
  }
})();
</script>
