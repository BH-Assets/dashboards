  await saveRow(i, { Revision: rev, OriginalTitle: groupKey(base.f), Status: 'received' },
    { s: 'received', note: 'Linked as revision ' + rev + ' of ' + base.number + '; fresh intake and PM approval required.' });
}
function editFigures(){
  const i = item(); if (!isAcctSeat()) return;
  const fld = (id, label, v) => '<div class="field"><label for="' + id + '">' + label + '</label><input id="' + id + '" type="number" step="0.01" value="' + (v == null ? '' : v) + '"></div>';
  modal('<h2>Key figures from the PDF</h2><p class="muted">Type them exactly as the subcontractor submitted them, even if they are wrong.</p>'
    + '<div class="field"><label for="kReq">Pay request / invoice number</label><input id="kReq" value="' + esc(i.f.PayRequest || '') + '"></div>'
    + '<div class="grid2">' + fld('kCon', 'Adjusted contract', i.f.AdjustedContract) + fld('kEarn', 'Completed & stored to date', i.f.CompletedToDate)
    + fld('kRet', 'Retainage held', i.f.RetainageHeld) + fld('kPrev', 'Previous payments', i.f.PreviousPayments) + '</div>'
    + fld('kDue', i.type === 'Invoice' ? 'Invoice amount' : 'Current payment due', i.f.BalanceDue)
    + '<div class="field"><label for="kCost">Cost code / GL account</label><input id="kCost" value="' + esc(i.f.CostCode || '') + '" placeholder="25AU018.01.402 or GL account"></div>'
    + '<div class="field"><label for="kType">Document type</label><select id="kType"><option value="pay app" ' + (i.type === 'Pay application' ? 'selected' : '') + '>Pay application</option><option value="invoice" ' + (i.type === 'Invoice' ? 'selected' : '') + '>Invoice</option></select></div>'
    + '<div class="actions"><button class="primary" onclick="saveFigures()">Save figures</button><button onclick="closeModal()">Cancel</button></div>');
}
async function saveFigures(){
  const i = item(); const v = id => { const s = document.getElementById(id).value.trim(); return s === '' ? null : Number(s); };
  const fields = { PayRequest: document.getElementById('kReq').value.trim(), AdjustedContract: v('kCon'), CompletedToDate: v('kEarn'),
    RetainageHeld: v('kRet'), PreviousPayments: v('kPrev'), BalanceDue: v('kDue'), DocType: document.getElementById('kType').value,
    CostCode: document.getElementById('kCost').value.trim() };
  closeModal();
  await saveRow(i, fields, { note: 'Figures keyed from the PDF by accounting.' });
}

/* ---- state transitions, persisted ------------------------------------------- */
async function routePM(){
  const i = item();
  if (!isAcctSeat() || i.status !== 'Intake' || !i.checks.previous || !canRoute(i) || intakeBlockingIssues(i).length) return;
  if (!i.pmEmail) { toast('Choose the PM reviewer first.'); return; }
  const issues = reconIssues(i);
  await saveRow(i, { Status: 'with PM', Subcontract: i.commitment || '', JobNumber: i.jobNumber || '', AssignedApprover: i.pmEmail,
                     DocType: i.type === 'Invoice' ? 'invoice' : 'pay app', BlockingIssues: JSON.stringify(issues),
                     PrevBillingBasis: i.ledgerPrevious != null ? 'CE prior certified (Sub Detail payable), as of ' + i.ledger.asOf : '' },
    { s: 'with PM', note: 'Intake verified; routed to ' + i.pm + (issues.length ? ' with flags: ' + issues.join(' ') : '') + ' No CE entry created.' });
}
async function archiveDuplicate(){ const i = item(); if (!isAcctSeat() || i.status !== 'Intake' || !duplicate(i)) return;
  modal('<h2>Archive duplicate?</h2><p>This exact resend leaves the original active. A corrected submission should be linked as a revision instead.</p><div class="actions"><button class="danger" onclick="confirmArchive()">Archive this duplicate</button><button onclick="closeModal()">Cancel</button></div>'); }
async function confirmArchive(){ const i = item(); closeModal();
  if (await saveRow(i, { Status: 'duplicate archived' }, { s: 'duplicate archived', note: 'Archived exact resend; no accounting entry created.' })) { closeDetail(); draw(); } }
async function addComment(){ const t = document.getElementById('comment').value.trim(); if (!t) return;
  await saveRow(item(), {}, null, { kind: 'comment', text: t }); tab = 'notes'; renderDetail(); }
async function saveMarkup(page, target){
  const i = item(); if (!isPmSeat(i) || i.status !== 'PM review') return;
  const text = document.getElementById('markupText').value.trim(); if (!text) { toast('Enter a markup note.'); return; }
  closeModal(); i.checks.progress = false; i.checks.retain = false;
  await saveRow(i, {}, { note: 'Markup on ' + target + ': ' + text }, { kind: 'markup', page, target, text, rev: i.revision });
}
async function removeMarkup(id){ const i = item(); if (!isPmSeat(i) || i.status !== 'PM review') return;
  await saveRow(i, {}, { note: 'Removed a mistaken markup.' }, { kind: 'unmark', ref: id }); }
async function saveCorrection(){
  { const i0 = item(); if (!((isAcctSeat() && i0.status === 'Intake') || (isPmSeat(i0) && i0.status === 'PM review'))) return; }
  const text = document.getElementById('reason').value.trim(); if (!text) { toast('Enter the correction instructions.'); return; }
  const i = item(); const k = document.getElementById('correctionKind').value; closeModal();
  await saveRow(i, { Status: 'revise and resubmit' }, { s: 'revise and resubmit', k, note: text }, { kind: 'correction', text });
}
async function resolveSystemIssue(){
  const i = item(); if (i.status !== 'Correction needed' || !['system', 'contract'].includes(i.correctionKind)) return;
  const ok = i.correctionKind === 'contract' ? isPmSeat(i) : isAcctSeat(); if (!ok) return;
  await saveRow(i, { Status: 'received' }, { s: 'received', note: (i.correctionKind === 'contract' ? 'Contract discrepancy' : 'Accounting record') + ' resolved; returned to intake.' });
}
function asOfs(){ return { commitments: LIVE.cMeta && LIVE.cMeta.generated_at, expected: LIVE.expected && LIVE.expected.generated_at, ce: LIVE.ceInv && LIVE.ceInv.as_of }; }
function snapshot(i){ return { ceAmount: i.ceAmount ?? null, procoreAmount: i.procoreAmount ?? null, ledgerPrevious: i.ledgerPrevious ?? null,
                               commitment: i.commitment, amount: i.amount }; }
function entryChanged(i){
  if (!i.entrySnapshot) return true;
  const s = snapshot(i);
  return Object.keys(s).some(k => s[k] !== i.entrySnapshot[k]) || reconIssues(i).length > 0;
}
/* The recheck refuses when the reference data is older than the approval -
   otherwise it compares the approval against itself and always passes. */
function staleRefs(i){
  const at = i.f.ApprovedAt ? Date.parse(i.f.ApprovedAt) : null; if (!at) return [];
  const a = asOfs(), out = [];
  if (a.commitments && Date.parse(a.commitments) < at) out.push('Procore commitments (' + fmtTime(a.commitments) + ')');
  if (a.expected && Date.parse(a.expected) < at) out.push('CE SOV (' + fmtTime(a.expected) + ')');
  if (i.type === 'Pay application' && a.ce && a.ce < String(i.f.ApprovedAt).slice(0, 10)) out.push('CE invoice ledger (' + a.ce + ')');
  return out;
}
async function approve(){
  const i = item();
  if (!isPmSeat(i) || i.status !== 'PM review' || reconIssues(i).length || i.markups.length || !['valid', 'contract', 'progress', 'retain'].every(k => i.checks[k])) return;
  const now = new Date().toISOString();
  await saveRow(i, { Status: 'ready for entry', ApprovedSnapshot: JSON.stringify(Object.assign(snapshot(i), { asOf: asOfs() })),
                     ApprovedBy: LIVE.me.email, ApprovedAt: now },
    { s: 'ready for entry', note: 'Approved ' + money(i.amount) + '; reference snapshot retained. Awaiting CE entry.' });
}
async function recheckEntry(){
  const i = item(); if (!isAcctSeat() || i.status !== 'Ready for entry') return;
  await reloadLive();
  const j = item(); const stale = staleRefs(j);
  j.entryRechecked = !entryChanged(j) && !stale.length;
  if (j.entryRechecked) await saveRow(j, { EntryRecheckedAt: new Date().toISOString() }, { note: 'Final system-reference recheck passed.' });
  const k = item(); if (k) { k.entryRechecked = j.entryRechecked; renderDetail(); }
  toast(j.entryRechecked ? 'References match approval' : stale.length ? 'Reference data is older than the approval: ' + stale.join(', ') : 'References changed; return for review');
}
async function markEntered(){
  const i = item(); if (!isAcctSeat() || i.status !== 'Ready for entry' || !i.entryRechecked || entryChanged(i)) return;
  const ref = document.getElementById('ceRef').value.trim(); if (!ref) { toast('Enter the CE entry reference.'); return; }
  await saveRow(i, { Status: 'approved and entered', CEReference: ref, EnteredAt: new Date().toISOString(), EnteredBy: LIVE.me.email },
    { s: 'approved and entered', note: 'Recorded CE entry ' + ref + '. Payment remains managed in CE.' });
}
async function returnToIntake(){
  const i = item(); if (!isAcctSeat() || i.status !== 'Ready for entry') return;
  await saveRow(i, { Status: 'received', ApprovedSnapshot: '' }, { s: 'received', note: 'Returned to intake for reference discrepancy; prior approval invalidated.' });
}

/* ---- page chrome ------------------------------------------------------------ */
function liveBanner(){
  const a = asOfs(), q = LIVE.queue || {};
  return '<span><strong>Live</strong> · Signed in as ' + esc((LIVE.me || {}).name || '') + '. Procore ' + esc(fmtTime(a.commitments))
    + ' · CE SOV ' + esc(fmtTime(a.expected)) + ' · CE invoices ' + esc(a.ce || 'not published') + (ledgerFull() ? '' : ' (partial; previous certified unavailable)')

}

  document.getElementById('app').innerHTML = '<main style="padding:40px"><p class="muted">Signing in and loading live data…</p></main>';

  }
}
