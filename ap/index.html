        + esc(x.number || 'this number') + '</b>, so there is nothing to check these figures against.</div>';
    /* Correcting a row by hand. The pull cannot read a scan, and roughly 142 of
       252 rows arrived with no figures and often no number - so the queue is
       only workable if a person can finish the identification here. The write
       goes through this page's MSAL session, so SharePoint records WHO changed
       it in the item's version history. That is the audit trail; nothing extra
       is built for it. */
    const F = (key, label, value, type) =>
      '<label>' + label + '<input data-f="' + key + '" type="' + (type||'text') + '"'
      + ' value="' + esc(value == null ? '' : String(value)) + '"'
      + (value ? '' : ' class="miss"') + '></label>';
    const editor = !x.itemId ? '' :
      '<div class="rqedit" data-edit="' + esc(x.id) + '">'
      + '<h4>Identify this application</h4>'
      + '<div class="hint">Amber fields came back empty from the PDF. Filling the subcontract number matches it to a commitment and shows it to that job&rsquo;s PMs.</div>'
      + '<div class="fields">'
      +   F('Subcontract', 'Subcontract #', x.f.Subcontract)
      +   F('JobNumber',   'Job',           x.f.JobNumber)
      +   F('PayRequest',  'Pay request #', x.f.PayRequest)
      +   F('PeriodEnding','Period ending', (x.f.PeriodEnding||'').slice(0,10), 'date')
      +   '<button data-save="' + esc(x.id) + '">Save</button>'
      +   '<span class="msg"></span>'
      + '</div></div>';

    return head
      + '<tr class="rqdetail" data-rqd="' + esc(x.id) + '"><td colspan="7">'
      + editor + note + panel
      + (links ? '<div style="margin-top:10px">' + links + '</div>' : '')
      + '</td></tr>';
  }).join('');

  el.innerHTML = '<div class="rqwrap">'
    + '<div class="rqbar"><span class="rqcount">' + rows.length + ' pay application'
    +   (rows.length === 1 ? '' : 's') + '</span>'
    +   '<span>' + (withFig
          ? money(sum) + ' requested' + (withFig < rows.length
              ? ' &middot; ' + (rows.length - withFig) + ' not yet keyed' : '')
          : 'no figures keyed yet') + '</span>'
    +   '<span>&middot;</span><span>' + scopeNote + '</span>'
    +   '<span style="margin-left:auto">oldest first</span></div>'
    + '<table class="rqtab"><thead><tr>'
    +   '<th>Subcontractor</th><th>Job</th><th>Pay req</th>'
    +   '<th class="n" title="Balance due this application - what the subcontractor is asking to be paid now. Blank means the figure was not read off the PDF, usually because it is a scan.">Requested</th>'
    +   '<th class="n" title="Days since the application arrived in payables@.">Age</th>'
    +   '<th title="Whether this application can be checked against the contract, and whether it ties. &#10;&#10;contract ties - their adjusted contract agrees with Procore to the cent&#10;a figure - their adjusted contract differs from Procore by that amount&#10;matched by name - no subcontract number on the document; matched from the vendor and project in the subject&#10;needs keying - no figures came off the PDF, so there is nothing to compare&#10;unidentified - no subcontract number anywhere, so there is nothing to compare it to&#10;no commitment - the number read does not match any commitment in Procore">Contract check</th>'
    +   '<th>Status</th>'
    + '</tr></thead><tbody>' + body + '</tbody></table></div>';

  el.querySelectorAll('tr.rqrow').forEach(tr => {
    tr.onclick = () => {
      const id = tr.dataset.rq;
      if (RQ_OPEN.has(id)) { RQ_OPEN.delete(id); RQ_MSG.delete(id); } else RQ_OPEN.add(id);
      renderReceived();
    };
  });

  /* The detail row sits inside the table; without this a click on an input
     bubbles to the row handler and collapses the thing being typed into. */
  el.querySelectorAll('tr.rqdetail').forEach(tr => tr.onclick = e => e.stopPropagation());

  paintSaveNotes(el);

  el.querySelectorAll('.rqedit button[data-save]').forEach(btn => {
    btn.onclick = async () => {
      const box = btn.closest('.rqedit');
      const msgEl = box.querySelector('.msg');
      const row = rows.find(r => r.id === btn.dataset.save);
      if (!row) return;
      const patch = {};
      box.querySelectorAll('input[data-f]').forEach(i => {
        const k = i.dataset.f;
        let v = i.value.trim();
        if (k === 'Subcontract') v = v.toUpperCase();
        if (k === 'PeriodEnding' && v) v = new Date(v + 'T00:00:00Z').toISOString();
        const was = row.f[k] == null ? '' : String(k === 'PeriodEnding' ? String(row.f[k]).slice(0,10) : row.f[k]);
        const now = k === 'PeriodEnding' ? v.slice(0,10) : v;
        if (now !== was) patch[k] = v || null;
      });
      if (!Object.keys(patch).length) { msgEl.className = 'msg'; msgEl.textContent = 'Nothing changed.'; return; }
      btn.disabled = true; msgEl.className = 'msg'; msgEl.textContent = 'Saving\u2026';
      const res = await saveQueueItem(row.itemId, patch);
      btn.disabled = false;
      if (res && typeof res === 'object') {
        /* Take what SharePoint actually holds, not what we hoped it took. */
        Object.assign(row.f, res.stored || patch);
        RQ_MSG.set(row.id, { cls: 'ok', text: res.warn || 'Saved.' });
        setTimeout(renderReceived, 400);
      } else {
        RQ_MSG.set(row.id, { cls: 'bad', text: 'Not saved \u2014 ' + res });
      }
      paintSaveNotes(el);
    };
  });
  /* Bind the deltas on whichever rows are expanded, so the pre-filled "theirs"
     figures are reconciled the moment the row opens rather than on first keypress. */
  rows.forEach(x => {
    if (!RQ_OPEN.has(x.id) || !x.c) return;
    const d = el.querySelector('tr[data-rqd="' + CSS.escape(x.id) + '"]');
    if (d) payappBind(d, x.c);
  });
}

/* PATCH one list item as the SIGNED-IN USER, not as an app. SharePoint then
   records the name against the change in the item's version history, which is
   the whole reason queue state lives in a list rather than in a JSON file. */
/* The editor is rebuilt by renderReceived, so anything written straight into
   the .msg span is lost on the next pass. Repaint from RQ_MSG instead. */
function paintSaveNotes(el){
  RQ_MSG.forEach((m, id) => {
    const box = el.querySelector('.rqedit[data-edit="' + CSS.escape(id) + '"] .msg');
    if (box) { box.className = 'msg ' + m.cls; box.textContent = m.text; }
  });
}

/* A field survived the round trip. Dates come back as full ISO whatever was
   sent, so they are compared on the day only. */
function sameFieldValue(got, sent){
  const s = x => String(x == null ? '' : x).trim();
  if (sent == null) return s(got) === '';
  if (/^\d{4}-\d{2}-\d{2}T/.test(s(sent)) || /^\d{4}-\d{2}-\d{2}T/.test(s(got)))
    return s(got).slice(0,10) === s(sent).slice(0,10);
  return s(got) === s(sent);
}

async function saveQueueItem(itemId, fields){
  const q = STATE.queue;
  if (!q || !q.siteId || !q.listId) return 'the queue list is not loaded';
  if (!itemId) return 'this row has no list item behind it';
  const url = GRAPH + '/sites/' + q.siteId + '/lists/' + q.listId
            + '/items/' + encodeURIComponent(itemId) + '/fields';
  try {
    const tok = await token();
    if (!tok) return 'not signed in';
    const r = await fetch(url,
      { method: 'PATCH',
        headers: { Authorization: 'Bearer ' + tok, 'Content-Type': 'application/json' },
        body: JSON.stringify(fields) });
    if (!r.ok) {
      let why = 'HTTP ' + r.status;
      try { const b = await r.json(); if (b && b.error && b.error.message) why += ' - ' + b.error.message; } catch (_) {}
      if (r.status === 403) why += ' (you need Contribute on the site, not just read)';
      return why;
    }
    /* A 200 is NOT proof the value landed. Graph writes columns by their
       INTERNAL name; a name that does not match one is accepted and dropped
       without complaint. Read the item back and say which fields did not
       stick, rather than printing "Saved." over a write that did nothing. */
    const v = await fetch(url, { headers: { Authorization: 'Bearer ' + tok } });
    if (!v.ok)
      return { warn: 'Saved, but it could not be read back to confirm (HTTP ' + v.status + ').' };
    const got = await v.json();
    const dropped = Object.keys(fields).filter(k => !sameFieldValue(got[k], fields[k]));
    if (dropped.length)
      return 'SharePoint accepted the request but stored nothing for '
           + dropped.join(', ') + ' \u2014 those column names do not match the list';
    return { stored: got };
  } catch (e) { return e.message || 'request failed'; }
}

/* Keep the top scrollbar the same width as the table and in step with the real
   one. Re-measured on every render and on resize, because the column widths
   change with the data. */
function syncTableScrollbars(){
  const wrap = document.getElementById('table');
  if (!wrap) return;
  const top = wrap.querySelector('.tablescroll-top');
  const bot = wrap.querySelector('.tablescroll');
  const spacer = top && top.firstElementChild;
  const tbl = bot && bot.querySelector('table');
  if (!top || !bot || !spacer || !tbl) return;
  spacer.style.width = tbl.scrollWidth + 'px';
  top.style.display = tbl.scrollWidth > bot.clientWidth + 1 ? '' : 'none';
  /* A scroll handler that writes to the other element fires its scroll event in
     turn; without the latch they ping-pong and the bar stutters under the
     pointer. */
  let latch = false;
  top.onscroll = () => { if (latch) return; latch = true; bot.scrollLeft = top.scrollLeft; latch = false; };
  bot.onscroll = () => { if (latch) return; latch = true; top.scrollLeft = bot.scrollLeft; latch = false; };
}
/* Attached once, not per render - re-adding it on every render leaks a listener
   for every filter change. */
window.addEventListener('resize', syncTableScrollbars);

function render(){
  const proj = document.getElementById('f-proj').value;
  const pm   = document.getElementById('f-pm').value;
  /* Either entry point opens the desk: one project, or one PM across every job
     they run. Only the two together being unset is the blank state. */
  /* The received queue is an INBOX: it is not gated on picking a project, because a
     PM opening the desk wants to see what has arrived for them across every job. */
  renderReceived();
  if (!proj && pm === 'all') {
    document.getElementById('cards').innerHTML = '';
    { const q = document.getElementById('queue'); if (q) q.innerHTML = ''; }
    document.getElementById('table').innerHTML =
      '<div class="empty" style="padding:38px 20px;line-height:1.7">'
      + '<b>Select a project</b> to see its AP status and pay app comparison'
      + '<div class="sub" style="margin-top:6px">&mdash; or pick a <b>PM</b> to see every job they run. '
      + 'Either gives you commitments, compliance, billed to date and the expected pay app '
      + 'for each subcontractor.</div></div>';
    return;
  }
  const comp = document.getElementById('f-comp').value;
  const q    = document.getElementById('f-q').value.trim().toUpperCase();

  let rows = STATE.commitments.filter(r => {
    if (proj && proj !== 'all' && r.project !== proj) return false;
    if (pm   !== 'all' && !((r.pm_team_names||[]).includes(pm))) return false;
    if (q && !(String(r.vendor).toUpperCase().includes(q) || String(r.number).toUpperCase().includes(q))) return false;
    if (comp !== 'all') {
      const c = complianceFor(r);
      const state = !c ? 'missing' : (c.billy_is_compliant === 'Yes' ? 'ok' : 'nc');
      if (comp !== state) return false;
    }
    return true;
  });

  const { col, dir } = STATE.sort;
  rows.sort((a,b) => {
    let x, y;
    if (col === 'ce_billed') { const ba=billingFor(a), bb=billingFor(b); x=(ba&&ba.ce_billed)||0; y=(bb&&bb.ce_billed)||0; }
    else if (col === 'ce_sov') { const ba=billingFor(a), bb=billingFor(b); x=(ba&&ba.ce_sov)||0; y=(bb&&bb.ce_sov)||0; }
    else if (col === 'pm_team') { x=(a.pm_team_names||[]).join(', '); y=(b.pm_team_names||[]).join(', '); }
    else { x = a[col]; y = b[col]; }
    if (typeof x === 'number' || typeof y === 'number') return ((x||0)-(y||0))*dir;
    return String(x||'').localeCompare(String(y||''))*dir;
  });

  const value = rows.reduce((s,r)=>s+(r.contract_value||0),0);
  const billed= rows.reduce((s,r)=>{ const b=billingFor(r); return s + ((b && b.ce_billed) || 0); },0);
  const left  = rows.reduce((s,r)=>{ const b=billingFor(r); return s + ((b && b.ce_balance) || 0); },0);
  const exc   = rows.filter(r=>{ const b=billingFor(r);
                  return b && (b.flags||[]).some(f=>['over_billed','contract_mismatch','sov_gap'].includes(f)); }).length;
  const cos   = rows.reduce((s,r)=>s+(r.approved_change_orders||0),0);
  /* Pending is summed from BOTH systems and shown as the larger, because a
     CO sitting in one and not the other is the thing worth noticing. */
  const pendPc= rows.reduce((s,r)=>s+(r.pending_change_orders||0),0);
  const pendCe= rows.reduce((s,r)=>{ const b=billingFor(r); return s+((b&&b.ce_pending_sov)||0); },0);
  const nc    = rows.filter(r => { const c = complianceFor(r); return c && c.billy_is_compliant !== 'Yes'; }).length;
  const noTerm= rows.filter(r => r.retainage_percent > 0 && !(r.retainage_duration||'').trim().match(/throughout|thru/i)).length;
  const noCe  = rows.filter(r => !r.ce_code).length;

  /* Contract, billed and left deliberately do NOT sum: billed and balance come
     from CE's SOV, contract value from Procore's revised, and the two disagree on
     20 commitments. Showing them as a progression would imply arithmetic that is
     not true, so they stay three separate figures. */
  const pctBilled = value ? Math.round(100 * billed / value) : null;
  const chip = (n, label, cls) => n
    ? `<span class="exchip ${cls}"><b>${n}</b> ${label}</span>` : '';
  const chips = chip(exc, 'billing exceptions', 'r') + chip(nc, 'non-compliant', 'r')
              + chip(noTerm, 'retainage term not set', 'y') + chip(noCe, 'no CE code', 'b');

  document.getElementById('cards').innerHTML = `
    <div class="cardcap">${rows.length} commitment${rows.length===1?'':'s'}</div>
    <div class="cardrow">
      <div class="card"><div class="n">${money(value)}</div><div class="l">Contract value</div>
        ${cos ? `<div class="s">includes ${money(cos)} in change orders</div>` : ''}</div>
      <div class="card ok"><div class="n">${money(billed)}</div><div class="l">Billed to date (CE)</div>
        ${pctBilled != null ? `<div class="s">${pctBilled}% of contract value</div>` : ''}</div>
      <div class="card gap"><div class="n">${money(left)}</div><div class="l">Left to bill</div>
        <div class="s">per ComputerEase schedules of values</div></div>
      <div class="card${pendPc || pendCe ? ' soon' : ''}"><div class="n">${money(Math.max(pendPc, pendCe))}</div>
        <div class="l">Pending change orders</div>
        <div class="s">${pendPc === pendCe
            ? 'raised but not approved &mdash; in none of the figures left of this'
            : 'Procore ' + money(pendPc) + ' &middot; CE ' + money(pendCe) + ' &mdash; the two disagree'}</div></div>
    </div>
    <div class="exrow">${chips || '<span class="exclear">&#10003; No exceptions on these commitments</span>'}</div>`;

  const cols = [
    ['project','Project','l'], ['number','Commitment','l'], ['vendor','Subcontractor','l'],
    ['compliance','Compliance',''],
    ['revised_contract','Rev contract &middot; Procore','num'], ['ce_sov','Rev contract &middot; CE','num'],
    ['ce_billed','Billed to date','num'],
    ['retainage_percent','Retainage',''], ['pm_team','PM','l']
  ];
  const head = cols.map(([k,label,cls]) =>
    `<th class="${cls}" data-col="${k}">${label}${STATE.sort.col===k ? (STATE.sort.dir>0?' ▲':' ▼') : ''}</th>`).join('');

  const body = rows.length ? rows.map(r => `<tr class="${(() => {
      const c = complianceFor(r);
      return !c ? 'nobilly' : (c.billy_is_compliant === 'Yes' ? '' : 'noncompliant');
    })()}">
      <td class="l wrap"><span title="${esc(r.project)}">${esc(shortProject(r.project))}</span>${r.project_number ? `<div class="sub">${esc(r.project_number)}</div>` : ''}</td>
      <td class="l"><a href="${esc(r.procore_url)}" target="_blank" rel="noopener">${esc(r.number||'—')}</a>
        ${(r.status || r.executed === 'No') ? `<div class="sub">${esc(r.status||'')}${
            r.executed === 'No' ? ' <span class="pill y" title="Not executed in Procore - the commitment has not been signed by both parties, so the contract value shown is not yet binding.">unexecuted</span>' : ''
          }</div>` : ''}
        ${(r.contract_value !== null && r.contract_value !== undefined && r.contract_value !== '')
            ? `<div class="sub" title="The subcontract as originally executed, before any change order. The revised figure is in the Rev contract &middot; Procore column; the difference is what has been added since signing.">orig ${money(r.contract_value)}</div>` : ''}
        ${r.billing_day ? `<div class="sub">bills ${esc(r.billing_day)}</div>` : ''}
        <div class="sub pacell"><button type="button" class="pabtn" aria-expanded="false" data-pa-for="${esc(r.number||'')}"
          title="Expected pay app: what their cover sheet should say, and the most they can ask for">pay app check</button></div></td>
      <td class="l wrap">${esc(r.vendor)}
        <div class="sub code">${r.ce_code ? esc(r.ce_code)
          : '<span class="warn" title="No Abbreviated Name in Procore - Accounting has nothing to key the entry on">no CE code</span>'}</div></td>
      <td>${compCell(r)}</td>
      <td class="num">${pcContractCell(r)}</td>
      <td class="num">${ceContractCell(r)}</td>
      <td class="num">${billedCell(r)}</td>
      <td>${retainageCell(r)}</td>
      <td class="l">${pmCell(r)}</td>
    </tr>`).join('') : `<tr><td colspan="9" class="empty">No commitments match these filters.</td></tr>`;

  document.getElementById('table').innerHTML =
    `<div class="tablescroll-top"><div></div></div>`
  + `<div class="tablescroll"><table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>`;
  syncTableScrollbars();

  renderQueue(rows);

  /* One expandable panel per commitment rather than more columns - the table is
     already nine wide and the check is something you open for one sub at a time. */
  document.querySelectorAll('button[data-pa-for]').forEach(btn => btn.onclick = () => {
    const tr = btn.closest('tr');
    if (tr.nextElementSibling && tr.nextElementSibling.classList.contains('parow')) {
      tr.nextElementSibling.remove(); btn.setAttribute('aria-expanded','false'); return;
    }
    const num = btn.dataset.paFor;
    const r = STATE.commitments.find(x => String(x.number||'').trim() === num);
    if (!r) return;
    const det = document.createElement('tr');
    det.className = 'parow';
    det.innerHTML = '<td colspan="10">' + payappPanel(r) + '</td>';
    tr.insertAdjacentElement('afterend', det);
    btn.setAttribute('aria-expanded','true');
    payappBind(det, r);
  });

  document.querySelectorAll('th[data-col]').forEach(th => th.onclick = () => {
    const c = th.dataset.col;
    STATE.sort = { col: c, dir: STATE.sort.col === c ? -STATE.sort.dir : 1 };
    render();
  });
}

        <select id="f-proj"><option value="">Select a project&hellip;</option>
          ${projects.map(p=>`<option value="${esc(p.name)}">${esc(p.label)}</option>`).join('')}
          <option value="all">All projects (${projects.length})</option></select>
        <label>PM:</label>
        <select id="f-pm"><option value="all">All PMs</option>
          ${pms.map(p=>`<option>${esc(p)}</option>`).join('')}</select>
        <label>Compliance:</label>
        <select id="f-comp">
          <option value="all">Any</option><option value="ok">Compliant</option>
          <option value="nc">Non-compliant</option><option value="missing">Not in Billy</option></select>
        <label>Search:</label>
        <input id="f-q" type="text" placeholder="subcontractor or commitment #" style="min-width:230px">
      </div>
      <div class="cards" id="cards"></div>
      <!-- Three tabs, not two. "Received" and "Expected to bill" are different
           objects and handoff section 0 warns that merging them is how this goes
           in circles: expected is derived from commitments, received is what
           actually arrived in payables@. -->
      <div class="tabs" id="tabs">
        <button class="tab" data-tab="received">Pay applications received<span class="tabn zero" id="tabn-received"></span></button>
        <button class="tab" data-tab="expected">Expected to bill</button>
        <button class="tab" data-tab="commitments">Commitments</button>
      </div>
      <div class="tabpane" data-pane="received"><div id="received"></div></div>
      <div class="tabpane" data-pane="expected">
        <div id="queue"></div>
        <div class="stub">
          <h3>How &ldquo;not billed this cycle&rdquo; is worked out</h3>
          <b>Left to bill</b> is the contract less what ComputerEase says has been billed &mdash;
          a position, with no date on it. <b>Billed this cycle</b> comes from the
          <b>Pay applications received</b> tab: a commitment counts as billed when an application
          for it has arrived in payables@ whose period ends this month, or which arrived in the
          last 35 days if the form carried no period.<br><br>
          So a row reading <b>not billed yet</b> means no application has reached payables@, not
          that none was sent &mdash; a scan we could not identify, or one sent to someone's
          personal inbox, looks the same from here. If the received queue has not loaded, the
          column reads &mdash; rather than claiming nobody has billed.<br><br>
          Nothing on either tab is an approval.
        </div>
      </div>
      <div class="tabpane" data-pane="commitments"><div id="table"></div></div>`;

    document.getElementById('foot').innerHTML =
      `Commitments: Procore work-order contracts, ${STATE.commitments.length} rows across
       ${ap.projects_in_scope} projects (${ap.self_perform_skipped} self-perform excluded).
       Compliance: Billy, joined by the pull (${ap.compliance_matched} matched,
       ${ap.compliance_unmatched} with no Billy row).
       Retainage shown as percent plus duration — both are needed; the percent alone cannot
       distinguish "5% throughout" from "5% thru 50%".` +
      (STATE.billingMeta
        ? ` Billings: ComputerEase committed_billed, ${Object.keys(STATE.billing).length} commitments matched` +
          ((STATE.billingMeta.jobs_without_job_totals || []).length
            ? `; no CE billing data for ${STATE.billingMeta.jobs_without_job_totals.length} job(s) (${esc(STATE.billingMeta.jobs_without_job_totals.join(', '))}) — those rows show "no CE data", not zero.`
            : '.')
        : ` Billings not loaded — ${EXPECTED_FILE} is not in ${LIBRARY} yet, so the Billed column is empty.`);

    document.querySelectorAll('.tab').forEach(t => t.onclick = () => setTab(t.dataset.tab));
    setTab(TAB);

    ['f-proj','f-pm','f-comp'].forEach(id => document.getElementById(id).onchange = render);
    document.getElementById('f-q').oninput = render;
    render();

  } catch (e) {
    document.getElementById('content').innerHTML = '';
    const b = document.getElementById('banner');
    b.className = 'banner err'; b.style.display = '';
    b.textContent = 'Could not load: ' + e.message;
    console.error(e);
  }
})();
</script>
</body>
</html>
